name: Voice lab staged delivery
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish a public image after offline validation (no Azure deployment)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix experiments/gpt-live --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - run: npm run test:gpt-live && npm run check:gpt-live && npm run check:public
      - run: npm run evidence
      - name: Build container without pushing
        run: |
          docker build --target runtime --tag voice-lab:check .
          docker build --target controller --tag voice-lab-controller:check .
          if docker run --rm voice-lab-controller:check > controller-smoke.log 2>&1; then
            echo 'Controller unexpectedly succeeded without configuration'
            exit 1
          else
            code=$?
          fi
          test "$code" -eq 1
          grep -Fx '{"event":"operating_controller_failed","code":"DEACTIVATION_UNCONFIRMED"}' controller-smoke.log
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image
    needs: offline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/turbo998/voice-agent-lab:${{ github.sha }}
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Deployment image (verify anonymous pull before using): `ghcr.io/turbo998/voice-agent-lab@%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - id: controller
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: controller
          push: true
          tags: ghcr.io/turbo998/voice-agent-lab:controller-${{ github.sha }}
      - name: Record immutable controller image reference
        env:
          DIGEST: ${{ steps.controller.outputs.digest }}
        run: |
          printf 'Controller image (verify anonymous pull before using): `ghcr.io/turbo998/voice-agent-lab@%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
