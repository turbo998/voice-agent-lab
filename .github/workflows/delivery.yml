name: Voice lab staged delivery
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish a public image after offline validation (no Azure deployment)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix experiments/gpt-live --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - run: npm run test:gpt-live && npm run check:gpt-live && npm run check:public
      - run: npm run evidence
      - name: Build container without pushing
        run: docker build --tag voice-lab:check .
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image
    needs: offline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/turbo998/voice-agent-lab:${{ github.sha }}
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Deployment image (verify anonymous pull before using): `ghcr.io/turbo998/voice-agent-lab@%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
