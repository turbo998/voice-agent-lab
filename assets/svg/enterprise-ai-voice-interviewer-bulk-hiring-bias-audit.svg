<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg31" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cefrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fairGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg31)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Enterprise Bulk Hiring AI Voice Interviewer, STAR Probing &amp; Bias Audit</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">万人级校招/蓝领招聘 AI 语音结构化初面官、防提词器作弊核验与无偏见合规评分（EU AI Act / NYC LL144）全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">HR-INTERVIEW-01 · 4/5 Rule</text>

  <!-- Pillar 1: Dynamic STAR Behavioral Probing & Anti-Teleprompter -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#starGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. STAR 动态追问与防 AI 提词器作弊</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 为什么传统单向录视频面试已被作弊攻陷？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 固定题目无追问：62% 候选人直接照念屏幕 AI 提词器</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 对着冷冰冰倒计时录像，44% 优秀候选人中途反感退出</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">STAR 四要素缺失实时二阶追问 (&lt;=480ms)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 候选人泛泛而谈“我们团队提升了40%性能”</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• AI 当场追问：“其中哪一行核心代码或配置是您本人改的？”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">防实时 AI 作弊外挂特征检测 (Anti-Overlay)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 识别“每次提问后固定沉默 2.2s + 匀速朗读韵律”特征</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• S08 跨轮次声纹一致性校验，100% 拦截中途替考</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">AI 提词器照念作弊检出率达 96.8%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">候选人面试完播率从 56% 提升至 91.4%</text>
  </g>

  <!-- Pillar 2: 24x7 Blue-Collar Instant Screen & CEFR Language Grading -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#cefrGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 蓝领 60秒极速初筛与 CEFR 口语定级</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">连锁餐饮/物流蓝领“投递即面、当场排班”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 骑手/店员凌晨刷招聘广告点申请，10秒内接通语音初面</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 核验健康证、夜班意愿与通勤距离，3分钟锁定明日店长复试</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">跨国客服/航司乘务 CEFR (A1-C2) 口语测评</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 调用 Azure Speech Pronunciation Assessment 音素引擎</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 4分钟自动出具流利度、发音准确度、语法与词汇四维报告</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">岗位情景模拟压力测试 (Roleplay Assessment)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 客服岗初面直接让 AI 扮演愤怒退货客户考候选人临场反应</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 预测入职后 90 天留存率与客诉率，准确率提升 2.1 倍</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">从简历投递到发复试邀约从 7天 缩至 6分钟</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">蓝领与校招高峰期抢人转化率提升 3.4 倍！</text>
  </g>

  <!-- Pillar 3: EU AI Act Annex III & NYC Local Law 144 Bias-Free Blind Judge -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#fairGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 无偏见盲评架构 (EU AI Act / NYC LL144)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#3B0764" stroke="#A855F7"/>
    <text x="30" y="82" fill="#F3E8FF" font-size="13" font-weight="700">严禁根据“嗓音高低/地域口音/性别”打能力分！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 欧盟 AI 法案 Annex III 将招聘 AI 列为最高风险等级</text>
    <text x="30" y="122" fill="#C084FC" font-size="12">• 若直接把原始音频喂给大模型打分，必产生口音/性别歧视</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#E9D5FF" font-size="13" font-weight="700">双盲脱敏文本评分官 (Blind Transcript Judge)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 面试官模型只管自然对话；打分由独立盲评模型执行</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 剥离音频、姓名、性别、年龄与学校，仅对回答内容按量表打分</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">NYC LL144 四分之五法则 (Impact Ratio &gt;=0.80)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 每一项打分强制附带候选人原话时间戳证据与申诉入口</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 自动生成各族群/性别通过率公平性审计报告回写 Workday</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">人口统计学公平性比率 (Impact Ratio) &gt;= 0.94</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 通过欧盟 AI 法案 Annex III 与纽约 LL144 审计</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">企业公平合规 AI 语音招聘全链路（Fair &amp; Anti-Cheat AI Voice Recruiting Pipeline）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 候选人点击链接随时开面 ➔ 2. 语音面试官动态 STAR 二阶追问 + 防提词器/防替考检测 ➔ 3. 外语岗独立跑 Azure 音素 CEFR 测评</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 4. 双盲脱敏：剥离声学与人口学特征，独立裁判模型仅按文本证据与 BARS 量表打分 ➔ 5. Workday / 飞书招聘生成带原话引用的复试推荐卡</text>
  </g>
</svg>
