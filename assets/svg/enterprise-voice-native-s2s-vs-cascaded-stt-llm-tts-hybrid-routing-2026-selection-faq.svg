  <rect width="1200" height="680" fill="url(#bgGrad429)" rx="16"/>
  <rect x="24" y="20" width="1152" height="74" rx="12" fill="url(#headerGrad429)"/>
  <text x="44" y="50" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Native Speech-to-Speech (S2S) vs. Cascaded (STT+LLM+TTS) vs. Hybrid Dual-Track (2026 Selection)</text>
  <text x="44" y="76" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="13">Architecture Blueprint · Policy: VOICE-S2S-CASCADED-HYBRID-2026-01 · 320ms Native S2S Empathy · 100% Verbatim Regulatory Control · $0.044/min Blended</text>

  <!-- Column 1: Native S2S -->
  <rect x="28" y="112" width="364" height="440" rx="12" fill="url(#cardIndigo429)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="44" y="128" width="332" height="36" rx="8" fill="#4338ca"/>
  <text x="60" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Native Speech-to-Speech (S2S Paradigm)</text>

  <rect x="44" y="180" width="332" height="108" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="203" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Representative Models &amp; Latency</text>
  <text x="58" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Azure OpenAI GPT-Realtime / Voice Live</text>
  <text x="58" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Google Gemini 2.0 Flash Live / AWS Nova Sonic</text>
  <text x="58" y="268" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ P50 First-Audio Latency: 290ms – 380ms</text>

  <rect x="44" y="302" width="332" height="114" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="325" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">When Native S2S Excels (Core Strengths)</text>
  <text x="58" y="346" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hears caller sighs, hesitation, laughter &amp; frustration</text>
  <text x="58" y="366" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Ultra-natural backchanneling &amp; instant barge-in</text>
  <text x="58" y="386" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Best for: Sales sparring, language tutor, VIP concierge</text>

  <rect x="44" y="430" width="332" height="104" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="58" y="453" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Enterprise Boundaries (Why Not 100% S2S?)</text>
  <text x="58" y="474" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• No pre-speech text gate to block hallucinated numbers</text>
  <text x="58" y="494" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Unpruned multi-turn audio tokens inflate to $0.18+/min</text>
  <text x="58" y="514" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✕ Unsafe alone for statutory finance/medical disclosures</text>

  <!-- Column 2: Controlled Cascaded Pipeline -->
  <rect x="418" y="112" width="364" height="440" rx="12" fill="url(#cardSky429)" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="434" y="128" width="332" height="36" rx="8" fill="#0369a1"/>
  <text x="450" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. Controlled Cascaded (STT → LLM → TTS)</text>

  <rect x="434" y="180" width="332" height="108" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="448" y="203" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Representative Stack &amp; Latency</text>
  <text x="448" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• STT: Azure AI Speech Custom / Deepgram Nova-3</text>
  <text x="448" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• LLM + TTS: GPT-4.1 / Mini + Azure HD TTS / ElevenLabs</text>
  <text x="448" y="268" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• P50 First-Audio Latency: 650ms – 920ms (Streaming)</text>

  <rect x="434" y="302" width="332" height="122" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="448" y="325" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">When Cascaded Is Mandatory (100% Control)</text>
  <text x="448" y="346" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 100% deterministic text inspection BEFORE audio plays</text>
  <text x="448" y="366" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Custom acoustic phrase list for 10,000+ SKUs / drug names</text>
  <text x="448" y="386" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Locked SSML &lt;phoneme&gt; &amp; &lt;say-as&gt; for exact APR/dosage</text>
  <text x="448" y="406" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Linear $0.032–$0.048/min even on 20-minute calls</text>

  <rect x="434" y="438" width="332" height="96" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="448" y="461" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Cascaded Trade-Offs</text>
  <text x="448" y="482" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• STT strips acoustic emotion unless paired with prosody tags</text>
  <text x="448" y="502" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Requires explicit semantic turn-detection (EOU) tuning</text>

  <!-- Column 3: Hybrid Dual-Track Router -->
  <rect x="808" y="112" width="364" height="440" rx="12" fill="url(#cardEmerald429)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="824" y="128" width="332" height="36" rx="8" fill="#047857"/>
  <text x="840" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Hybrid Dual-Track Router (Enterprise ★)</text>

  <rect x="824" y="180" width="332" height="114" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="838" y="203" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Per-Turn Dynamic Track Switching (&lt;15ms)</text>
  <text x="838" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Track A (30% Turns — S2S): Empathy, greeting, de-escalation</text>
  <text x="838" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Track B (70% Turns — Cascade): Quotes, APR, Rx, DB writes</text>
  <text x="838" y="268" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Unified Brand Voice across both tracks (0 persona shift)</text>

  <rect x="824" y="308" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="838" y="331" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Pre-Emission Regex &amp; SSML Compliance Gate</text>
  <text x="838" y="352" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Intercepts every currency, rate, dosage &amp; date before TTS</text>
  <text x="838" y="372" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Verifies exact match against backend ERP/Core-Banking JSON</text>
  <text x="838" y="394" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ 0.0% financial or clinical numeric hallucination</text>

  <rect x="824" y="432" width="332" height="102" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="838" y="455" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3-Turn Audio Compaction FinOps Engine</text>
  <text x="838" y="476" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Keeps raw audio only for last 3 turns; compacts older to text</text>
  <text x="838" y="496" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blended TCO: $0.044/min (-63% vs. unpruned pure S2S)</text>

  <!-- Bottom Summary Bar -->
  <rect x="28" y="568" width="1144" height="88" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="48" y="596" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Architect Golden Selection Rule (Native S2S vs. Cascaded vs. Hybrid Dual-Track):</text>
  <text x="48" y="620" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pure S2S: Roleplay coaching, language practice, emotional companion · Pure Cascade: High-volume standardized IVR, strict legal disclosures</text>
  <text x="48" y="642" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">• Hybrid Dual-Track (★ Production Standard): Combines 320ms S2S empathy with 100% pre-verified Cascaded/SSML precision in the same phone call</text>
</svg>
