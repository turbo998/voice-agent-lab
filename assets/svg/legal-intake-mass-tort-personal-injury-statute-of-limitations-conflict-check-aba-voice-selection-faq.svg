  <text x="60" y="500" class="node-sub">• 车祸/工伤受害者 39% 在急诊室或夜间致电，7x24 秒级温和接待</text>
  <text x="60" y="518" class="node-sub">• 支持英/西双语创伤关怀语调，零催促耐性倾听</text>

