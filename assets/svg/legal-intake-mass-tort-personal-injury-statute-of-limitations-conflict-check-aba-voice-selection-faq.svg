  <text x="849" y="320" class="node-sub">• 符合 Tier-1/Tier-2 标准案件当场推送短信 DocuSign/PandaDoc</text>
  <text x="849" y="338" class="node-sub">• AI 保持在线逐段朗读风险代理条款陪同签字，签约率从 31% 升至 74.8%</text>

