  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① ABA Rule 1.18 利益冲突前置防火墙与零 UPL</text>

  <rect x="46" y="158" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">倾听案情前必过“相对方利益冲突核查”</text>
  <text x="60" y="200" class="node-sub">• 痛点: 若先听取原告机密案情才发现被告是律所现有大客户</text>
  <text x="60" y="218" class="node-sub">• 按 ABA Rule 1.18 整家律所将被取消代理资格 (污染现有客户)</text>
  <text x="60" y="236" class="node-sub">• Phase 1 仅问姓名+对方当事人，&lt;100ms 查 Clio/Intapp 无冲突才放行</text>

  <rect x="46" y="262" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="284" class="node-title">严禁非法执业 (Zero UPL) 与赔偿金额承诺</text>
  <text x="60" y="304" class="node-sub">• 严禁 AI 评估胜诉率、提供法律意见或承诺“肯定能赔 50 万”</text>
  <text x="60" y="322" class="node-sub">• 开场明确披露:“我是事实信息采集助手，正式委托关系以签署为准”</text>
  <text x="60" y="340" class="node-sub">• 100% 符合全美各州律师协会 (State Bar) 道德审查</text>

  <rect x="46" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="386" class="node-title">律师-当事人特权加密归档 (Attorney-Client Privilege)</text>
  <text x="60" y="406" class="node-sub">• 进件录音与转写全程租户级密钥加密且开启模型零留存 (ZDR)</text>
  <text x="60" y="424" class="node-sub">• 防止对方律师在证据开示 (Discovery) 阶段调取第三方云日志</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
