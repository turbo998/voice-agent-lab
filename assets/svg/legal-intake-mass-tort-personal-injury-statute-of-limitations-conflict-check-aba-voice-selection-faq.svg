  <text x="849" y="406" class="node-sub">• 签完委托合同顺手一键签署医院病历调取授权书</text>
  <text x="849" y="424" class="node-sub">• 立案调档启动时间提前 11 天</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (LEGAL-INTAKE-ABA-SOL-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截未查冲突先听机密、AI 承诺赔偿额、漏算政府 6 个月时效</text>
  <text x="849" y="518" class="node-sub">• 命中利益冲突 0ms 物理隔离阻断并转交合规外部转介</text>

