  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② 州诉讼时效 (SOL) 确定性计算与案源价值分级</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">50 州诉讼时效 (SOL) 与政府索赔 6 个月硬计算</text>
  <text x="435" y="200" class="node-sub">• 严禁大模型估算时效！由确定性法规表按“事发州+案由+事发日”精算</text>
  <text x="435" y="218" class="node-sub">• 识别市政公交/警车事故自动切换为 180 天政府索赔通知期 (Tort Claim)</text>
  <text x="435" y="236" class="node-sub">• 距时效届满 &lt;90 天的临期案件 0ms 强制唤醒值班合伙人紧急立案</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">确定性撤案与婉拒防失职锁 (Non-Engagement Gate)</text>
  <text x="435" y="306" class="node-sub">• 若已过诉讼时效或不符合接案标准，严禁含糊挂机留隐患</text>
  <text x="435" y="324" class="node-sub">• 自动触发法务审定的标准《不予代理告知书》(Non-Engagement Letter)</text>
  <text x="435" y="342" class="node-sub">• 明确建议立即咨询其他律师，100% 免除律所执业失职索赔 (Malpractice)</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">人身伤害与集体诉讼 (Mass Tort) 结构化分级</text>
  <text x="435" y="412" class="node-sub">• 核查四要素: 1.责任清晰度 2.商业保单额度 3.急诊/手术记录 4.无其他代理</text>
  <text x="435" y="430" class="node-sub">• 重伤商用卡车追尾 (Tier-1) 秒级直通金牌出庭律师</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">严禁挖角已有代理律师案件 (Anti-Poaching Gate)</text>
  <text x="435" y="510" class="node-sub">• 确认原告已签其他律所时立即礼貌终止，严守 ABA Rule 4.2</text>

