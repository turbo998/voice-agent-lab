  <text x="385" y="342" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strictly blocks calling a stunt/pyro/firearm scene &quot;Hot / Ready to Roll&quot;</text>
  <text x="385" y="362" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">  unless Licensed Armorer + 1st AD safety briefing AND on-set Medic/Fire</text>
  <text x="385" y="382" fill="#fef08a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  Marshal presence are verified (Industry Wide Labor-Management Bulletins)</text>

  <rect x="365" y="430" width="440" height="128" rx="8" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="385" y="457" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate C: SAG-AFTRA AI Digital Replica &amp; Spoiler NDA Hard Lock</text>
  <text x="385" y="480" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks booking or triggering AI voice cloning / 3D facial scanning unless</text>
  <text x="385" y="500" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">  a separate, specific SAG-AFTRA Digital Replica Informed Consent rider is</text>
  <text x="385" y="520" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  signed; never reads plot spoilers over unverified phone lines</text>

