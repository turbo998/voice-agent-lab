  <text x="365" y="138" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. Deterministic Union &amp; Set-Safety Engine (FILM-TV-PRODUCTION-SAG-STUNT-01)</text>

