  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Never sizes crane/telehandler by max rating</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  alone; computes Load Weight × Horizontal</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  Radius × Boom Height + 28 mph wind cutoff</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">• Zero boom tip-over or under-sized dry runs</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
