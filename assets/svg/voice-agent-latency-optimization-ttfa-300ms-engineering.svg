<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgLat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#0F1F38"/>
      <stop offset="100%" stop-color="#081120"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="optGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgLat)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="22" font-weight="700">Voice Agent Latency Engineering: Cutting P50 TTFA from 1,400ms to 320ms</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">企业实时语音全链路延迟拆解与极限优化：语义判停、流式推测工具预取、首4词微切块TTS与边缘接入全景图</text>
  <rect x="896" y="42" width="256" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1024" y="64" fill="#6EE7B7" font-size="13" font-weight="600" text-anchor="middle">LATENCY-BUDGET-01 · 320ms</text>

  <!-- Pillar 1: Why Naive Cascaded Bots Hit 1,400ms+ -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#badGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 为什么未经优化的语音链路高达 1,450ms？</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">人类对话黄金阈值：300ms–500ms（超 800ms 即显迟钝）</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 超过 1.2秒沉默，客户就会对着听筒喊：“喂？还在吗？”</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 刚喊出“喂”的同时 AI 终于开口 -> 发生灾难性双讲碰撞！</text>

    <rect x="18" y="152" width="320" height="168" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">传统串行级联 (1,450ms) 六大延迟黑洞拆解：</text>
    <text x="30" y="196" fill="#FCA5A5" font-size="12">① 跨洋公网 RTP 绕行 (US-East 单点): +140ms</text>
    <text x="30" y="216" fill="#FCA5A5" font-size="12">② 死板固定静音 VAD (等满 700ms 才判停): +700ms</text>
    <text x="30" y="236" fill="#FCA5A5" font-size="12">③ 非流式 ASR Final 确认等待: +120ms</text>
    <text x="30" y="256" fill="#FCA5A5" font-size="12">④ 8,000-Token 臃肿 Prompt 无 KV 缓存 TTFT: +240ms</text>
    <text x="30" y="276" fill="#FCA5A5" font-size="12">⑤ 等整句标点（句号）出来才送 TTS 合成: +160ms</text>
    <text x="30" y="296" fill="#FCA5A5" font-size="12">⑥ HTTP REST 每次新建 TLS 握手调 TTS: +90ms</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">总计 P50 首字出声 (TTFA) = 1,450ms</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">客户抢话碰撞率高达 38%，前 15秒挂机率飙升</text>
  </g>

  <!-- Pillar 2: The 5 Architectural Levers to Hit 320ms -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#optGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 砍掉 1,130ms 的五大架构手术刀 (320ms)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#059669"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">手术刀 1 &amp; 2：边缘 PoP 接入 + 语义终结器 (EOU)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 就近边缘 WebRTC PoP + 同可用区部署 ASR/LLM/TTS: 省 115ms</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 语义+声学韵律 EOU（句意完结仅需 180ms 即触发）: 省 520ms！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">手术刀 3：ASR Partial 流式推测预热 (Speculative)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 不等用户说完最后 1个字！在 ASR Partial 稳定度 &gt;=88% 时</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 提前发起只读 RAG/CRM 预取与 Prompt KV Cache 预热: 省 190ms</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">手术刀 4 &amp; 5：首 4 词微切块 + 持久 WebSocket TTS</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 首子句无需等句号，满 4个词/顿号即推入双向长连接 TTS</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 20ms RTP 音频帧直推网卡，砍掉整句缓冲与握手: 省 305ms</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">优化后 P50 首字出声 (TTFA) = 320ms！</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">达到人类母语者面对面交谈的自然响应速率</text>
  </g>

  <!-- Pillar 3: Speculative Execution Safety & Anti-Jitter Guard -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#specGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 推测执行安全红线与首包防卡顿护栏</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁在 ASR Partial 阶段推测执行写操作 (POST)！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 用户说：“帮我退掉周三的机票……哦不对，别退！”</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 铁律：推测预跑仅限只读查询 (GET)；写操作必须等 EOU+复诵！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="174" fill="#7DD3FC" font-size="13" font-weight="700">Partial 翻转即时作废锁 (Speculative Cache Eviction)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 若用户最后半秒改口导致 Final 文本与 Partial 语义偏移</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 0ms 丢弃预生成的首句音频缓存，按 Final 文本重新合成</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">防止“首词太急导致第 2 词断流卡顿” (Underrun Guard)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 若切块只有 1个字且 LLM 生成速度 &lt; TTS 播放速度会卡壳</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 动态双水位缓冲：首包 &gt;=4词/6汉字 + 60ms Jitter 水位锁</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">音频中途断流卡壳率 (Buffer Underrun) = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">推测写操作误触发率 = 0.0%，兼顾 320ms 极速与绝对安全</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#10B981" font-size="14" font-weight="700">架构师核心选型法则 (LATENCY-BUDGET-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 优化语音延迟最大的胜负手不在换小模型，而在“砍掉 700ms 死板静音 VAD（改用 180ms 语义 EOU）”与“利用 ASR Partial 提前预跑只读 RAG”；</text>
  <text x="68" y="606" fill="#7DD3FC" font-size="13">2. 严禁对写操作 API（扣款/退订/改签）开启 Partial 推测执行，且首包 TTS 切块必须满足 >=4 词（或 >=6 汉字）以防播放中途断流卡壳。</text>
</svg>
