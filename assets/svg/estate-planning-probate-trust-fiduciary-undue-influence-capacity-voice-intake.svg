  <rect width="1200" height="680" fill="url(#bg249)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Estate Planning, Family Trust &amp; Probate Fiduciary Voice Intake Architecture</text>
  <text x="600" y="66" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Alone-in-Room Anti-Undue-Influence Diarization Lock · UPL &amp; Testamentary Capacity Gate · 0ms Elder Financial Abuse &amp; Deathbed Counsel Bridge (ESTATE-TRUST-UNDUE-INFLUENCE-01)</text>

  <!-- Left Column: Grantor Intake, Trust Beneficiary & Probate -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card249)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="166" y="122" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Grantor &amp; Fiduciary Channels</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Grantor Asset &amp; Heir Intake</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Revocable Living Trust &amp; Will inventory</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Per stirpes vs per capita tree</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Healthcare Proxy &amp; Living Will</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Trust Officer Distribution Desk</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• HEMS (Health, Education, Maint) check</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Crummey notice &amp; GST tax tracking</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Estate date-of-death valuation</text>

