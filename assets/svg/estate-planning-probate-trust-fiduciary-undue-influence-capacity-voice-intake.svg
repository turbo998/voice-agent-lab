  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card249)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic Fiduciary &amp; Capacity Engine (ESTATE-TRUST-UNDUE-INFLUENCE-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: Alone-in-Room Anti-Undue-Influence Diarization Hard Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Multi-speaker diarization verifies Grantor is 100% alone during dispositive intake</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 0ms suspends session if a 2nd voice prompts ("Tell it to leave the house to me")</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Protects Attorney-Client Privilege (3rd-party presence waives privilege!)</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Logs bank-grade Testamentary Capacity orientation markers (Nature of bounty &amp; heirs)</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: UPL Prohibition &amp; Statutory Execution Formalities Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Collects structured facts for attorney review—never practices law autonomously (UPL)</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Warns that beneficiary designations (401k/IRA/TOD) override Will provisions</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Enforces 2 Disinterested Witnesses + Notary requirement for valid execution</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Blocks Trust Officer from approving non-HEMS principal invasion without co-trustee sign-off</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Elder Financial Exploitation &amp; Deathbed Will Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects sudden late-life caregiver amendment, cognitive confusion, or ICU urgency</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Places FINRA Rule 2165 / Senior Safe Act temporary hold on suspicious trust wires</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Bridges ACTEC Estate Partner Attorney &amp; Fiduciary Risk Officer in 0ms</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full Uniform Probate Code (UPC), Uniform Trust Code (UTC) &amp; Privilege WORM log</text>

  <!-- Right Column: Wealth Drafting Engine, Trust Accounting & Counsel -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card249)" stroke="#22c55e" stroke-width="1.5"/>
