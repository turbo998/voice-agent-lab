<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg74" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent74" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg74)"/>
  <rect x="24" y="20" width="1232" height="720" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="38" width="356" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="222" y="57" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STAGE 430 🎉 · TOPIC 70 🎉 · P853 / P854 · SVG 74</text>
  <text x="414" y="57" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">WebRTC RFC 2198 RED Nesting Bomb, RFC 5109 ULPFEC Overread &amp; RFC 3389 CN Acoustic-Shock Guard</text>
  <text x="44" y="88" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">WebRTC RFC 2198 RED 套娃防递归（[1,2]块）、RFC 5109 ULPFEC 保护长度闭合与 RFC 3389 CN [-65,-38]dBFS 防爆震门禁（🎉 Stage 430 与第 70 大专题双里程碑）</text>
  <line x1="44" y1="102" x2="1236" y2="102" stroke="url(#accent74)" stroke-width="2"/>

  <!-- Left Column: RFC 2198 RED Nesting & Overread Gate (P853) -->
  <rect x="44" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="146" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. RFC 2198 RED Nesting Bomb &amp; Overread Gate (P853)</text>
  <text x="64" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：内层 block_pt 再次指向 RED (PT=63 套 PT=63) 触发递归解包栈溢出崩溃</text>
  <text x="64" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 越界风险：多个 F=1 块的 10-bit block_length 总和超出 RTP 包长导致堆内存越界读</text>
  <rect x="64" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ RED-in-RED Bomb: PT=63 -&gt; block_pt=63 | sum(block_len)=900B &gt; pkt=60B</text>
  <text x="80" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P853 Gate: Base-Codec Allowlist + Blocks in [1, 2] + Exact Byte Sum</text>
  <text x="80" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: drop_recursive_or_overread_rfc2198_red_and_clamp_blocks</text>
  <text x="64" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P853）：</text>
  <text x="64" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedRecursiveOrOverreadRedPackets = 0（100% 阻断套娃递归与块长度越界读）</text>
  <text x="64" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxRedundantAudioBlocksPerPacket ∈ [1, 2]（偏移锁死 &lt;= 4,800 ticks）</text>

  <!-- Right Column: ULPFEC Overread & CN Acoustic-Shock Gate (P854) -->
  <rect x="652" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
  <text x="672" y="146" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. RFC 5109 ULPFEC &amp; RFC 3389 CN Shock Gate (P854)</text>
  <text x="672" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：24B ULPFEC 包谎称 prot_len=65535 将 64KB 堆内存异或进恢复语音帧</text>
  <text x="672" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 爆震风险：RFC 3389 CN 首字节填 0 代表 0 dBov 满量程白噪音，震伤坐席并致盲 VAD</text>
  <rect x="672" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="688" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ ULPFEC Overread: prot_len=8000 &gt; 24B | CN Level=2 (-2 dBov Blast)</text>
  <text x="688" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P854 Gate: hdr + prot_len &lt;= pkt_len &amp; CN Clamped in [-65, -38] dBFS</text>
  <text x="688" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: drop_overread_ulpfec_and_clamp_rfc3389_cn_level</text>
  <text x="672" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P854 · 🎉 Stage 430 与第 70 大专题双里程碑）：</text>
  <text x="672" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedOverreadFecOrAcousticShockCnPackets = 0（0 异或泄密 · 0 白噪音爆震）</text>
  <text x="672" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxRfc3389ComfortNoiseLevelDbfs ∈ [-65, -38]（保护坐席耳麦与 VAD 底噪）</text>

  <!-- Bottom Full-Width Pipeline & Quantitative Matrix -->
  <rect x="44" y="410" width="1192" height="248" rx="12" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
  <text x="64" y="438" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Deterministic Auxiliary RTP Sanitization Pipeline (Stage 430 🎉 · Topic 70 🎉 · 433 Dims · 863 Guardrails · 872 Probes · 872 Tests)</text>

  <rect x="64" y="454" width="265" height="92" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="196" y="478" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 1: No RED-in-RED</text>
  <text x="196" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Base-Codec Inner PT Allowlist</text>
  <text x="196" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[1, 2] Redundant Blocks Cap</text>

  <rect x="355" y="454" width="275" height="92" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
  <text x="492" y="478" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 2: RED Byte Closure</text>
  <text x="492" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">sum(hdrs + block_len) &lt;= pkt_len</text>
  <text x="492" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">ts_offset &lt;= 4,800 Ticks (100ms)</text>

  <rect x="656" y="454" width="275" height="92" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="793" y="478" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 3: ULPFEC Bounds</text>
  <text x="793" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">10 + (L?8:4) + prot_len &lt;= pkt_len</text>
  <text x="793" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">0 Out-of-Bounds XOR Heap Leaks</text>

  <rect x="957" y="454" width="259" height="92" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="1086" y="478" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 4: CN [-65,-38] dBFS</text>
  <text x="1086" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Blocks 0 dBov White-Noise Blast</text>
  <text x="1086" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">872 Automated Unit Tests Green</text>

  <text x="64" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">定量收敛结论：100% 阻断 RED 套娃栈溢出与 ULPFEC 异或越界读，100% 免疫 RFC 3389 CN 0 dBov 白噪音爆震。</text>
  <text x="64" y="604" fill="#94A3B8" font-family="Consolas, monospace" font-size="11.5">Docs: docs/voice-webrtc-rtp-rfc2198-red-nesting-bomb-rfc5109-ulpfec-mask-overread-cn-shock-faq.md (.en.md) · Guardrails: P853 &amp; P854</text>
  <text x="64" y="630" fill="#38BDF8" font-family="Consolas, monospace" font-size="11.5">Timer Resolution &amp; Provenance: 0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

  <!-- Footer -->
  <text x="640" y="718" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Voice Agent Architecture Lab · SVG 74 · Stage 430 🎉 · Topic 70 🎉 · 433 Dims · 863 Guardrails · 872 Tests</text>
</svg>
