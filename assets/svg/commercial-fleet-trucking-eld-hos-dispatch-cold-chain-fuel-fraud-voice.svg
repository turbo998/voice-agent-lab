<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgFleet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#11223E"/>
      <stop offset="100%" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="hosGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="fuelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="dockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgFleet)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Commercial Trucking Fleet &amp; Logistics Dispatch Voice AI: ELD/HOS Lock &amp; Fuel Anti-Fraud</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">干线物流车队与冷链重卡智能语音调度架构：疲劳驾驶工时 (ELD/HOS) 派单硬互锁、油卡 GPS 距離 &lt;=300m 解封与月台压车索赔</text>
  <rect x="836" y="42" width="316" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="994" y="64" fill="#7DD3FC" font-size="13" font-weight="600" text-anchor="middle">COMMERCIAL-FLEET-DISPATCH-ELD-01</text>

  <!-- Pillar 1: ELD / HOS Legal Driving Hours Hard Interlock -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#hosGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 疲劳驾驶工时 (ELD/HOS) 派单硬互锁</text>

    <rect x="18" y="60" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 重大交通刑责：AI 催促已连续开满工时的疲劳司机“再赶 2小时夜路”！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 交管法规 (GB 7258 连续 4h 休 20m / 北美 FMCSA 11h HOS) 严禁疲劳驾驶</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 若语音调度系统不看车载 ELD 剩余合法工时就强派加急单，将引发群死群伤重卡事故！</text>

    <rect x="18" y="156" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="178" fill="#F8FAFC" font-size="13" font-weight="700">Samsara / 微信小程序北斗 ELD 剩余工时硬门禁</text>
    <text x="30" y="198" fill="#94A3B8" font-size="12">• 每次派发顺路回程单或催促 ETA 前，0ms 校验：`Remaining_HOS_Min &gt;= Route_Min + 30m`</text>
    <text x="30" y="218" fill="#EF4444" font-size="12">• 若工时不足，100% 物理阻断派单，并自动为司机语音导航至前方最近重卡服务区休息！</text>

    <rect x="18" y="252" width="320" height="68" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="274" fill="#F8FAFC" font-size="13" font-weight="700">高速行驶中免看屏幕纯语音报平安 (Eyes-Free Check)</text>
    <text x="30" y="294" fill="#94A3B8" font-size="12">• 严禁重卡司机在 90km/h 行驶时低头在手机 TMS App 里打字填报延误原因</text>
    <text x="30" y="310" fill="#34D399" font-size="12">• 驾驶室蓝牙耳机一句话：“京沪高速大雾封道，预计晚到 90分钟” ➔ 自动改约收货仓</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">超时疲劳违规派单率：0.00% · 在途事故降 46%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 满足交管北斗动态监控与北美 DOT FMCSA 审计要求</text>
  </g>

  <!-- Pillar 2: GPS-Matched Fuel Card Unlock (Anti-Skimming & Fuel Theft) -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#fuelGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 车队油卡 GPS &lt;=300m 地理围栏语音解封</text>

    <rect x="18" y="60" width="320" height="82" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="30" y="82" fill="#7DD3FC" font-size="13" font-weight="700">⛽ 痛点：重卡单次加柴油 $600，司机半夜在油站刷不出卡，或油卡被克隆盗刷！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 物流车队油费占总成本 35%，常遭遇加油站磁条侧录盗刷 (Fuel Skimming) 或私抽卖油</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 锁卡太严导致司机凌晨 2 点在高速油站排队打电话找车队长解卡，一等 20 分钟</text>

    <rect x="18" y="156" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="178" fill="#F8FAFC" font-size="13" font-weight="700">三重物理交叉校验：车辆 GPS + 油箱液位 + 油站坐标</text>
    <text x="30" y="198" fill="#94A3B8" font-size="12">• 司机来电：“我在济南服务区 4号枪加油，帮我解锁油卡额度” ➔ AI 50ms 核验：</text>
    <text x="30" y="218" fill="#34D399" font-size="12">• ① 货车车载北斗/GPS 距该油站 `&lt;=300米`；② 当前油箱余量 `&lt;60%` 确需补能！</text>

    <rect x="18" y="252" width="320" height="68" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="274" fill="#F8FAFC" font-size="13" font-weight="700">15 分钟临时授信窗口 (Just-in-Time Fuel Pin)</text>
    <text x="30" y="294" fill="#94A3B8" font-size="12">• 核验通过后仅开放 15 分钟单次加油额度；加完油比对油机升数与油箱传感器增量</text>
    <text x="30" y="310" fill="#38BDF8" font-size="12">• 若货车在广州而油卡在河北请求刷卡，0ms 拦截盗刷并告警风控！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">油站解卡耗时：18 分钟 ➔ 8 秒 · 盗刷偷油降 96%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">直连中石化/中石油车队卡与北美 WEX / Comdata 接口</text>
  </g>

  <!-- Pillar 3: Warehouse Dock Detention, Lumper Fee & Reefer Alert -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#dockGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 收货月台压车费 (Detention) 与卸货费秒批</text>

    <rect x="18" y="60" width="320" height="82" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">痛点：司机在商超大仓门口苦等 4小时没人卸货，且临时卸货费 (Lumper) 报销难</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 到达收货仓后超过 2 小时未卸完货，车队有权向货主索赔压车延误费 ($75/小时)</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 传统靠纸质签字经常因缺少准点到达证据被货主赖账</text>

    <rect x="18" y="156" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="178" fill="#F8FAFC" font-size="13" font-weight="700">地理围栏自动计时 + 语音一键发起压车预警</text>
    <text x="30" y="198" fill="#94A3B8" font-size="12">• 司机语音报备：“我已到 8号冷链月台交单，仓库说前面还有 5辆车在排”</text>
    <text x="30" y="218" fill="#38BDF8" font-size="12">• 满 90 分钟自动向货主外呼/发函预警；满 120 分钟自动锁定带 GPS 戳的压车费账单</text>

    <rect x="18" y="252" width="320" height="68" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="274" fill="#F8FAFC" font-size="13" font-weight="700">卸货工收据拍照 + 语音 10秒发放电子付款码</text>
    <text x="30" y="294" fill="#94A3B8" font-size="12">• 司机拍下仓库卸货费报价单 (&lt;=$200 合同额度内)，语音助手 10秒生成付款码放行出园</text>
    <text x="30" y="310" fill="#34D399" font-size="12">• 冷链车厢温度偏离设定值 &gt;2°C 时 0ms 强呼司机排查冷机故障</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">单名调度员管车规模：35 辆 ➔ 180 辆 (+5倍)</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">压车费成功追偿率从 38% 提升至 91%，车辆周转率 +18%</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">干线物流与重卡车队智能语音调度官三大铁律 (COMMERCIAL-FLEET-DISPATCH-ELD-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 疲劳工时硬互锁：派单或调整路线前强制核对 ELD/北斗剩余合法驾驶时长，工时不足时 100% 物理拦截派单并导航就近休整；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 油卡定位核验与免提交互：解锁加油卡必须核实货车 GPS 距目标油站 &lt;=300m；行驶中全流程纯语音免看屏交互保障行车安全。</text>
</svg>
