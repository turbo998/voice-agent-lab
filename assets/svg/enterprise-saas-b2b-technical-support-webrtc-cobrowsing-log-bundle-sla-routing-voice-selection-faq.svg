  <text x="849" y="320" class="node-sub">• 确认 Enterprise 客户遭遇 P1 故障后跳过常规排查问答</text>
  <text x="849" y="338" class="node-sub">• &lt;15s 自动触发 PagerDuty 呼叫值班 SRE 并拉起 Slack/Teams 桥</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">零幻觉 Jira / Linear 复现工单自动生成</text>
  <text x="849" y="406" class="node-sub">• 转交研发时自动附带：脱敏 HAR、错误 Request-ID、复现步骤</text>
  <text x="849" y="424" class="node-sub">• 研发接单即刻定位代码行，无需二次联系客户要日志</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (SAAS-B2B-COBROWSING-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截未遮罩 Secret 截图上传、AI 越权代点与跨租户日志查询</text>
  <text x="849" y="518" class="node-sub">• P1 故障强制执行 &lt;15s PagerDuty 升级防 SLA 违约罚金</text>

