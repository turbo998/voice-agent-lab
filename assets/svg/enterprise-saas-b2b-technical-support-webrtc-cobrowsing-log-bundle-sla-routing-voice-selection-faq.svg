  <text x="48" y="74" class="subtitle">Enterprise B2B SaaS Support: In-App WebRTC Voice + Co-Browsing · Client-Side Secret Masking · HAR Telemetry Sideband · &lt;15s Sev-1 PagerDuty Bridge</text>
