  <rect x="28" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <rect x="28" y="106" width="355" height="36" rx="12" fill="url(#accentBlue551)" />
  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① WebRTC 语音+屏幕同屏与 HAR 日志旁路</text>

  <rect x="46" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">告别电话口述拼写 UUID 与报错码 (Zero Spelling)</text>
  <text x="60" y="200" class="node-sub">• 传统电话口述 SAML/Webhook 报错耗时 18 分钟且错漏 31%</text>
  <text x="60" y="218" class="node-sub">• 控制台内一键开启 WebRTC 48kHz 语音 + 实时标签页同屏</text>
  <text x="60" y="236" class="node-sub">• DataChannel &lt;100ms 自动上传脱敏 HAR 网络抓包与错误栈</text>

  <rect x="46" y="260" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="282" class="node-title">视觉激光笔引导 + 只读零越权点击 (Visual Spotlight)</text>
  <text x="60" y="302" class="node-sub">• 多模态模型识别配置错误并在客户屏幕绘制高亮引导框</text>
  <text x="60" y="320" class="node-sub">• 语音同步提示:“请点击右上角蓝框高亮的重新签发证书”</text>
  <text x="60" y="338" class="node-sub">• 严禁 AI 自动代点生产删除/变更按钮，保留管理员主权</text>

  <rect x="46" y="362" width="319" height="82" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="384" class="node-title">事件驱动抽帧降本 84% (DOM-Mutation Sampling)</text>
  <text x="60" y="404" class="node-sub">• 仅在路由跳转/点击/报错弹窗时截取 1 帧高清快照</text>
  <text x="60" y="422" class="node-sub">• 避免 30fps 全程视频流高额 Token 消耗 ($0.046/min)</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">一线自助解决率从 28% 跃升至 74%</text>
  <text x="60" y="500" class="node-sub">• 故障定位 MTTR 从 4.2 小时工单往返压缩至 11 分钟</text>
  <text x="60" y="518" class="node-sub">• 省去 L3 研发工程师 68% 的重复抓包问询负担</text>

  <!-- Plane 2: Client-Side DOM/Secret Masking & Zero-Leak Security -->
  <rect x="403" y="106" width="394" height="450" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="403" y="106" width="394" height="36" rx="12" fill="url(#accentPurple551)" />
  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② 客户端 DOM 密钥硬遮罩与零凭据外泄</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">浏览器端预渲染涂黑 (Client-Side Pre-Capture Mask)</text>
  <text x="435" y="200" class="node-sub">• 截图离开浏览器前自动模糊 `input[type=password]` 与密钥框</text>
  <text x="435" y="218" class="node-sub">• 正则扫描拦截 `sk-...`、`Bearer`、`AKIA...` 与私钥字符串</text>
  <text x="435" y="236" class="node-sub">• 确保云端视觉大模型与录屏归档 0.00% 接触明文凭据</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">HAR 抓包与日志头自动脱敏 (Header Sanitizer)</text>
  <text x="435" y="306" class="node-sub">• DataChannel 上传的网络请求自动剥离 `Authorization` 与 `Cookie`</text>
  <text x="435" y="324" class="node-sub">• 仅保留 HTTP 状态码、错误枚举码、耗时与请求 Request-ID</text>
  <text x="435" y="342" class="node-sub">• 后端凭 Request-ID 在内部安全日志库关联完整堆栈</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">租户边界强隔离 (Strict Tenant-ID Pinning)</text>
  <text x="435" y="412" class="node-sub">• 工具调用强制绑定当前登录会话 JWT 中的 `org_id / tenant_id`</text>
  <text x="435" y="430" class="node-sub">• 100% 阻断通过语音报他人租户号越权查询跨企日志</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">通过 SOC2 Type II 与 ISO 27001 审计</text>
  <text x="435" y="510" class="node-sub">• 客户可随时一键暂停屏幕共享，仅保留纯语音通道</text>

