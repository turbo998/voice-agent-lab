<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg65" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="50%" stop-color="#10213a"/>
      <stop offset="100%" stop-color="#081526"/>
    </linearGradient>
    <linearGradient id="card65" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162c4c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b182b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg65)" rx="16"/>
  <text x="600" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">In-Cabin Automotive Cockpit Edge-NPU + Cloud Multimodal Voice Assistant Architecture</text>
  <text x="600" y="66" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">4-Zone Seat-Isolation &amp; Speed Interlock (ISO 26262) · 0ms Tunnel Edge-NPU Fallback · Gaze + Pointing Vision Fusion (AUTOMOTIVE-COCKPIT-EDGE-CLOUD-01)</text>

  <!-- Left Column -->
  <rect x="30" y="92" width="290" height="548" rx="12" fill="url(#card65)" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="175" y="122" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. In-Cabin Acoustic &amp; Vision Inputs</text>

  <rect x="48" y="142" width="254" height="105" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="175" y="166" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4/6-Zone Beamforming Mic Array</text>
  <text x="175" y="188" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Driver (Zone 1) vs Front-Pass (Zone 2)</text>
  <text x="175" y="206" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Rear Left/Right Kids (Zones 3 &amp; 4)</text>
  <text x="175" y="224" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 120 km/h Wind + Tire + Music AEC</text>

  <rect x="48" y="264" width="254" height="105" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="175" y="288" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OMS / DMS + Exterior ADAS Cameras</text>
  <text x="175" y="310" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• "What is that building over there?"</text>
  <text x="175" y="328" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Gaze-Vector + Finger-Pointing Fusion</text>
  <text x="175" y="346" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Lip-Movement Visual VAD (Wake-Word-Free)</text>

  <rect x="48" y="386" width="254" height="105" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="175" y="410" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cockpit Safety &amp; Network Hazards</text>
  <text x="175" y="432" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Rear Child Yells "Open Trunk / Frunk!"</text>
  <text x="175" y="450" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Podcast Ad Triggers Wake-Word Command</text>
  <text x="175" y="468" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 5G Loss in Mountain Tunnel Mid-Command</text>

  <rect x="48" y="508" width="254" height="112" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="175" y="532" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Edge + Cloud Compute Split</text>
  <text x="175" y="554" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Edge: Snapdragon 8295/8797 NPU (60 TOPS)</text>
  <text x="175" y="572" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cloud: GPT-Realtime / Gemini 2.5 Live</text>
  <text x="175" y="590" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• AUTOSAR SOME/IP Vehicle Bus Gateway</text>

  <!-- Center Column -->
  <rect x="350" y="92" width="500" height="548" rx="12" fill="url(#card65)" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Deterministic Cockpit Gate (AUTOMOTIVE-COCKPIT-EDGE-CLOUD-01)</text>

  <rect x="372" y="142" width="456" height="136" rx="10" fill="#2a1215" stroke="#ef4444" stroke-width="1.8"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE A: Driver-Zone Acoustic Seat Lock &amp; Vehicle Speed Interlock</text>
  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: driverZoneAndParkGearInterlockVerified === true</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks trunk/frunk/charge-port/sunroof/ADAS commands from rear seats</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  or media playback (loopback AEC filter), or when vehicle speed &gt; 0 km/h</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Enforces ISO 26262 ASIL-B physical CAN/SOME-IP command firewall</text>

  <rect x="372" y="294" width="456" height="145" rx="10" fill="#172554" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="600" y="318" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE B: ISO 15007 Cognitive Distraction &amp; Screen-Video Lock</text>
  <text x="600" y="340" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: driverEyesOnRoadAndConciseVoiceModeVerified === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• While vehicle is in Drive (D), blocks rendering dense text tables or video</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  on the center console and caps spoken answers to &lt; 12 seconds (2 sentences)</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Routes video/games exclusively to rear entertainment or passenger screen</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: 0ms Tunnel / Cellular Dead-Zone Edge-NPU Fallback</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: cellularRttAbove400msOrOfflineTunnel === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets edgeNpuOfflineControlFallbackTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Executes 100% of HVAC, window, seat, wiper &amp; local nav commands on</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  Snapdragon 8295 INT4 3B Edge SLM in 190ms with zero cloud dependency</text>
  <text x="600" y="582" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Offloads 78% of daily car commands to $0.00 Edge NPU compute</text>

  <!-- Right Column -->
  <rect x="880" y="92" width="290" height="548" rx="12" fill="url(#card65)" stroke="#10b981" stroke-width="1.5"/>
  <text x="1025" y="122" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Vehicle OS &amp; Cloud Ecosystem</text>

  <rect x="898" y="142" width="254" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="1025" y="166" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">On-Device Edge NPU (190ms)</text>
  <text x="1025" y="188" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• QNX / Android Automotive OS (AAOS)</text>
  <text x="1025" y="206" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Quantized 3B Function-Calling SLM</text>
  <text x="1025" y="224" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 600+ Vehicle Control APIs (Offline)</text>

  <rect x="898" y="268" width="254" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="1025" y="292" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cloud Multimodal Brain (650ms)</text>
  <text x="1025" y="314" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Exterior Camera Landmark Visual Q&amp;A</text>
  <text x="1025" y="332" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• EV Route + Live Supercharger Booking</text>
  <text x="1025" y="350" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Dashboard Warning-Light Visual Diag</text>

  <rect x="898" y="394" width="254" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="1025" y="418" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">UN R155 Cybersecurity &amp; Privacy</text>
  <text x="1025" y="440" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cabin Camera Frame Blur Before Upload</text>
  <text x="1025" y="458" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hardware Mic/Camera Mute Indicator</text>
  <text x="1025" y="476" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Loopback Media Reference Cancellation</text>

  <rect x="898" y="520" width="254" height="100" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
  <text x="1025" y="544" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Sealed Cockpit Metrics</text>
  <text x="1025" y="566" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Rear-Seat / Media False Commands: 0.00%</text>
  <text x="1025" y="584" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Tunnel Offline Availability: 100.0%</text>
  <text x="1025" y="602" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Cloud API Cost per Vehicle/Yr: $1.85</text>
</svg>
