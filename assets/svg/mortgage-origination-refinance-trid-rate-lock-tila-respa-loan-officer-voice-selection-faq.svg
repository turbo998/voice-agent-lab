  <text x="48" y="51" class="title">住房按揭贷款与再融资（Mortgage）：TRID 六要素计时锁、SAFE 持牌边界与核保材料视觉架构 (#559)</text>
  <text x="48" y="74" class="subtitle">Mortgage Origination &amp; Refinance AI: &lt;15s Speed-to-Lead · SAFE Act NMLS Boundary &amp; Rate+APR Pair · TRID 6-Piece LE Clock · 2.1s W-2/Paystub Vision</text>
  <rect x="945" y="36" width="205" height="36" rx="18" fill="url(#accentBlue559)" />
  <text x="1047" y="59" text-anchor="middle" class="badge">MORTGAGE-TRID-2026</text>

  <!-- Plane 1: <15s Speed-to-Lead & SAFE Act / Reg Z APR Guard -->
  <rect x="28" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <rect x="28" y="106" width="355" height="36" rx="12" fill="url(#accentBlue559)" />
  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① &lt;15s 降息抢单与 SAFE 法案持牌边界锁</text>

  <rect x="46" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">&lt;15 秒极速响应降息再融资洪峰 (Speed-to-Lead)</text>
  <text x="60" y="200" class="node-sub">• 美联储/LPR 降息日线索暴涨 12 倍，人工回拨慢 30m 流失 78%</text>
  <text x="60" y="218" class="node-sub">• 提交网页线索后 &lt;15s 自动外呼并计算月供节省额 (Breakeven)</text>
  <text x="60" y="236" class="node-sub">• 线索接通转化率较传统次日回拨提升 3.9 倍</text>

  <rect x="46" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="282" class="node-title">SAFE 法案持牌信贷员 (NMLS MLO) 执业红线</text>
  <text x="60" y="302" class="node-sub">• 严禁无证 AI 协商个性化利率点数或建议选 30年固定 vs 浮动</text>
  <text x="60" y="320" class="node-sub">• Reg Z 铁律: 播报牌价利率 (Rate) 时必须同句播报年化率 (APR)</text>
  <text x="60" y="338" class="node-sub">• 触发锁价 (Rate Lock) 或方案咨询时 &lt;500ms 温转该州持牌 MLO</text>

  <rect x="46" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="386" class="node-title">ECOA (Reg B) 公平信贷零歧视过滤</text>
  <text x="60" y="406" class="node-sub">• 严禁询问婚姻生育计划、年龄、种族或公共救助收入来源性质</text>
  <text x="60" y="424" class="node-sub">• 100% 遵循 CFPB 公平借贷审计标准</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">按房产所在州自动匹配 NMLS 持证专员</text>
  <text x="60" y="500" class="node-sub">• 实时校验目标 MLO 在该房产所属州的 NMLS 执照有效性</text>
  <text x="60" y="518" class="node-sub">• 杜绝跨州无证展业引发的百万美元监管罚单</text>

  <!-- Plane 2: CFPB TRID 6-Piece Application Clock & Encompass Sync -->
  <rect x="403" y="106" width="394" height="450" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="403" y="106" width="394" height="36" rx="12" fill="url(#accentPurple559)" />
  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② CFPB TRID 六要素倒计时锁与 Encompass 同步</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">破解 TRID“无意收齐 6 要素触发 3 天违法倒计时”</text>
  <text x="435" y="200" class="node-sub">• 法规: 一旦收齐 1.姓名 2.收入 3.SSN 4.房产地址 5.估值 6.贷款额</text>
  <text x="435" y="218" class="node-sub">• 即刻触发法定 3 个工作日必须寄出 Loan Estimate (LE) 强制义务</text>
  <text x="435" y="236" class="node-sub">• 初步询盘阶段状态机严格锁定 `5/6 预审上限` (不收 SSN)</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">带外加密收集 SSN 与 Encompass LE 自动触发</text>
  <text x="435" y="306" class="node-sub">• 当借款人确认正式进件时，通过加密 H5 表单安全录入 SSN</text>
  <text x="435" y="324" class="node-sub">• 严禁在明文通话录音与转写日志中留存 9 位社会安全号</text>
  <text x="435" y="342" class="node-sub">• 集齐第 6 项瞬间 0ms 写入 ICE Encompass 并启动 3 日 LE SLA 监控</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">DTI 负债收入比与 LTV 贷款成数确定性测算</text>
  <text x="435" y="412" class="node-sub">• 对接 Fannie Mae DU / Freddie Mac LPA 预审参数引擎</text>
  <text x="435" y="430" class="node-sub">• 0.00% 大模型月供利息计算幻觉</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">TRID 披露超期违例率降至 0.00%</text>
  <text x="435" y="510" class="node-sub">• 消除每单 $3,200 的延迟披露差额强行买单 (Cure Cost)</text>

  <!-- Plane 3: Underwriting Condition Chasing & 2.1s Document Vision -->
  <rect x="817" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
  <rect x="817" y="106" width="355" height="36" rx="12" fill="url(#accentGreen559)" />
  <text x="994" y="129" text-anchor="middle" class="sec-hdr">③ 核保补件 (Stips) 语音催办与 2.1s 证照视觉</text>

  <rect x="835" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="180" class="node-title">终结“借款人漏拍银行流水第 2 页”来回折腾</text>
  <text x="849" y="200" class="node-sub">• 核保员开出补件清单 (Underwriting Stips) 后 AI 主动致电辅导</text>
  <text x="849" y="218" class="node-sub">• 通话中实时发送短信拍照链接，2.1s 校验 W-2/税单/流水完整性</text>
  <text x="849" y="236" class="node-sub">• 当场发现缺“第 3 页 of 4”或模糊反光，语音即时指导重拍</text>

  <rect x="835" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="282" class="node-title">大额异常入账说明函 (LOE) 语音口述生成</text>
  <text x="849" y="302" class="node-sub">• 针对流水中的大额赠与或转款，AI 语音询问资金来源并生成标准 LOE</text>
  <text x="849" y="320" class="node-sub">• 推送手机端 DocuSign 一键电子签名回传 Encompass 文件夹</text>
  <text x="849" y="338" class="node-sub">• 放款结案周期 (Click-to-Close) 从 42 天缩短至 34.5 天</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">产权过户电汇防诈骗核验 (Anti-Wire-Fraud)</text>
  <text x="849" y="406" class="node-sub">• 严禁在邮件/非加密语音中变更首付款收款托管账号 (Escrow)</text>
  <text x="849" y="424" class="node-sub">• 强制多因子核验产权公司官方路由号防 BEC 电汇劫持</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (MORTGAGE-TRID-SAFE-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截无 APR 单报利率、无证议价、未触发 LE 收集齐 6 要素</text>
  <text x="849" y="518" class="node-sub">• 缺页/模糊税单流水 100% 在上传端拦截重拍</text>

