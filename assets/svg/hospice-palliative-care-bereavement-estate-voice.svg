<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgHosp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="50%" stop-color="#141F33"/>
      <stop offset="100%" stop-color="#0B111E"/>
    </linearGradient>
    <linearGradient id="palGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ftcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="oneStopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgHosp)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="22" font-weight="700">Hospice &amp; Palliative Care Triage, FTC Funeral Rule Ethics &amp; Bereavement Voice AI</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">居家安宁疗护 24×7 爆发痛分诊、生命礼仪 FTC 明码标价与零推销伦理锁、及政务“身后一件事”联办全景图</text>
  <rect x="896" y="42" width="256" height="34" rx="17" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
  <text x="1024" y="64" fill="#C7D2FE" font-size="13" font-weight="600" text-anchor="middle">HOSPICE-CARE-01 · Ethics</text>

  <!-- Pillar 1: 24x7 Home Hospice Symptom & Breakthrough Pain Triage -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#palGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 居家安宁疗护 24×7 症状分诊与护士调度</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="82" fill="#7DD3FC" font-size="13" font-weight="700">守护居家临终患者夜间黄金 15分钟舒适防线</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 凌晨 3点家属惊慌来电：“父亲突然爆发性剧痛 / 呼吸困难喉鸣”</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 若电话占线，惊恐家属会打 120 送急诊插管，违背生前预嘱 (DNR)！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="174" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 生前预嘱 (DNR/POLST) 核验与零擅改止痛剂量锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 严禁 AI 擅自指导家属增加吗啡/芬太尼贴剂剂量！</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 0ms 桥接安宁疗护值班注册护士 (RN) 指导开启居家应急舒适药盒</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">0.88x 沉稳低频韵律与 2,000ms 哭泣停顿宽容</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 彻底禁用欢快上扬语调与“祝您今天愉快”等机械套话</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 同步派发最近片区出诊护士 45分钟内上门床旁安抚</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">非意愿急诊入院率 (Unwanted ER Visits) 下降 72%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">夜间爆发痛与呼吸窘迫来电 100% 在 15秒内直通值班护士</text>
  </g>

  <!-- Pillar 2: Bereavement Concierge & FTC Funeral Rule Ethics Lock -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#ftcGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 生命礼仪 FTC 透明报价与零加售伦理锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁利用丧亲悲痛期做高价套餐捆绑或升级推销！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 物理屏蔽一切 Upsell / Cross-sell 话术（如诱导升级高价骨灰盒）</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 严格遵守美国 FTC Funeral Rule (16 CFR Part 453) 与民政惠民殡葬规定</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E1B4B" stroke="#6366F1"/>
    <text x="30" y="174" fill="#C7D2FE" font-size="13" font-weight="700">电话询价 0门槛分项透明播报 (GPL Itemized Disclosure)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 家属电话询问收费标准时：依法必须无条件如实播报分项价目表 (GPL)</text>
    <text x="30" y="214" fill="#A5B4FC" font-size="12">• 严禁要求家属“必须先来现场才报价”或强制捆绑非必需防腐项目</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">遗体接运灵车 (First Call) 24×7 零等待调度</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 核实医院/居所地址、开具《居民死亡医学证明（推断）书》状态</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 60秒内锁定礼仪师与专用接运车辆并发出实时行程卡片</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#1E1B4B" stroke="#818CF8"/>
    <text x="178" y="356" fill="#C7D2FE" font-size="13" font-weight="700" text-anchor="middle">悲伤期商业推销与捆绑投诉率 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合 FTC Funeral Rule 与民政部门阳光惠民标准</text>
  </g>

  <!-- Pillar 3: One-Stop Bereavement Admin & Estate Settlement -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#oneStopGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 政务“身后一件事”与金融遗产免折腾联办</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#059669"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">告别“拿着死亡证明跑 8个部门重复哭诉 8遍”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 过去家属要分别打社保、医保、公积金、银行、车管所、电信销户电话</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 每次被客服机械追问“请让本人接电话”都是在伤口上撒盐！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">“逝者家属绿色通道”0ms 豁免本人声纹/活体核身锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 银行/运营商/航司热线一旦识别“亲人去世办理销户/退票/继承”</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 0ms 屏蔽“请账户本人接听”死板话术，直通遗产关怀专席！</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">抚恤金申领、医保个人账户结清与小额存款一键清单</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 自动生成《公民身后一件事联办材料清单》推送到家属手机</text>
    <text x="30" y="308" fill="#A7F3D0" font-size="12">• 永久静默逝者名下一切营销外呼与续费催缴通知</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">政务与银行身后事项办理跑动次数减少 85%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">杜绝“要求已故持卡人本人接听电话”的极端服务事故</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#818CF8" font-size="14" font-weight="700">架构师核心选型法则 (HOSPICE-CARE-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 居家安宁疗护热线严禁 AI 擅自调整阿片类止痛药剂量，检出爆发痛或呼吸窘迫必须 0ms 核验 DNR 生前预嘱并直连值班注册护士 (RN)；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 殡仪与企业丧亲服务必须 100% 物理剥离任何商业加售 (Upsell) 话术、依法透明播报分项价目表 (FTC GPL)，并豁免“请逝者本人接听”的僵化核身规则。</text>
</svg>
