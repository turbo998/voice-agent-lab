  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks mixing Sulfur Black (Na2S) with Acetic/Formic Acid (lethal H2S) &amp; wet Hydrosulfite</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Requires dry spark-free scoop for Sodium Hydrosulfite (Class 4.2 spontaneous combustion)</text>

