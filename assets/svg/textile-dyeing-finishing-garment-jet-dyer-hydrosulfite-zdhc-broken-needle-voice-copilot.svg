  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% blocks unlocking HTHP dyeing vessel port if bath temp ≥80°C or pressure &gt;0.00 MPa</text>
