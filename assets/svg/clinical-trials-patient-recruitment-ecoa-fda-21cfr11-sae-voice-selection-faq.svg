  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">• Starts mandatory 24-hour Sponsor PV clock</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">0ms Principal Investigator (PI) &amp; ER Bridge</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Bridges On-Call Principal Investigator / Medical</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Monitor in 0ms; auto-drafts MedDRA E2B(R3) XML</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Emergency IRT Unblinding gated strictly to PI/ER</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">Zero Unapproved Dose Modification</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Blocks AI from telling subject to skip, halve,</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">  or double study IMP dose without PI order</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">• 100% FDA GCP / ICH E6(R3) inspection ready</text>

