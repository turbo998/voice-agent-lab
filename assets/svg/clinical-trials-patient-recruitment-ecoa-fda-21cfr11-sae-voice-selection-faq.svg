  </text>

  <!-- Column 1: IRB-Compliant Recruitment & I/E Pre-Screening -->
  <rect x="44" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="44" y="128" width="356" height="40" rx="12" fill="url(#cyan464)"/>
  <text x="222" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. IRB-Approved Recruitment &amp; I/E Pre-Screen
  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Zero Coercion &amp; Therapeutic Misconception</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Enforces IRB-approved script (21 CFR Part 50)</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Blocks claiming investigational drug is "proven,</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  safe, or guaranteed to cure" or leading with</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  coercive cash stipend headlines</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Inclusion / Exclusion (I/E) Washout Logic</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Screens HbA1c, eGFR, prior biologic washout</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  windows (e.g., &gt;90 days) &amp; concomitant meds</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Never hides exclusion criteria so caller can</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">  "game" answers to qualify for stipend</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="76" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">Veeva Vault CTMS / Medidata Site Booking</text>
  <text x="76" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Books qualified subjects directly onto Clinical</text>
  <text x="76" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">  Research Coordinator (CRC) Visit-1 calendar</text>
  <text x="76" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#7dd3fc">• Cuts screen-failure rate at site by -48.6%</text>

  <!-- Column 2: FDA 21 CFR Part 11 Validated eCOA / ePRO Diary -->
  <rect x="422" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#059669" stroke-width="1.5"/>
