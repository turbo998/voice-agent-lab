    2. FDA 21 CFR Part 11 Validated eCOA / ePRO
  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399">Verbatim Validated Psychometric Scale Lock</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Reads copyright-validated ePRO instruments</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  (PHQ-9, WOMAC, EQ-5D, NRS Pain) word-for-word</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">• Zero LLM paraphrasing (which invalidates FDA</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  psychometric equivalence &amp; primary endpoint!)</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">21 CFR Part 11 ALCOA+ Immutable Audit Trail</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Cryptographically binds Subject PIN + Voice</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Audio Hash + UTC Timestamp to CDISC ODM record</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Enforces diary window (no back-filling expired</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  days to prevent "parking-lot compliance")</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Double-Blind Study Integrity Firewall</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Zero access to IRT/RTSM randomization arm</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Blocks speculating whether side effect means</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#6ee7b7">  subject is on Active Drug vs Placebo</text>

