<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Native Speech-to-Speech (S2S) &amp; Multimodal Voice Models Selection Guide: Azure GPT-Live-1 / GPT-Realtime / Phi4-mm vs Gemini Live vs AWS Nova Sonic vs Qwen-Omni / Moshi">
  <defs>
    <linearGradient id="bgS2s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b16"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>
    <linearGradient id="barS2s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardS2s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112240" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadowS2s" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgS2s)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#barS2s)"/>

  <!-- Header -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="560" height="28" rx="14" fill="#0c2d48" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="18" fill="#7dd3fc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">
      NATIVE SPEECH-TO-SPEECH (S2S) &amp; MULTIMODAL AUDIO MODELS BENCHMARK
    </text>
    <text x="0" y="56" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="23.5" font-weight="800">
      原生端到端语音大模型横评：Azure GPT-Live-1 vs Gemini Live vs Nova Sonic vs 开源
    </text>
    <text x="0" y="80" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">
      Azure Voice Live (GPT-Live-1 / gpt-realtime-1.5 / Phi4-mm) · Google Gemini Live · AWS Nova Sonic · Hume EVI · Qwen2.5-Omni / Moshi
    </text>
  </g>

  <!-- Top KPI Pills -->
  <g transform="translate(838, 22)" filter="url(#shadowS2s)">
    <rect x="0" y="0" width="162" height="64" rx="10" fill="#0b2e27" stroke="#10b981" stroke-width="1.2"/>
    <text x="81" y="24" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">GPT-Live-1 声学抗扰率</text>
    <text x="81" y="49" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800">95.2% (20/21探针)</text>

    <rect x="172" y="0" width="158" height="64" rx="10" fill="#0d2847" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="251" y="24" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Phi4-mm 混合语义成本</text>
    <text x="251" y="49" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800">$0.048 / 分钟</text>
  </g>

  <!-- Row 1: 4 Major S2S Model Families -->
  <g transform="translate(32, 114)" filter="url(#shadowS2s)">
    <!-- Card 1: Azure Voice Live Family -->
    <rect x="0" y="0" width="286" height="242" rx="12" fill="url(#cardS2s)" stroke="#10b981" stroke-width="2"/>
    <rect x="14" y="14" width="206" height="22" rx="6" fill="#064e3b"/>
    <text x="24" y="29" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">阵营 A · Azure Voice Live 三剑客 🏆</text>
    <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">GPT-Live-1 / Realtime / Phi4-mm</text>
    <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.2">唯一提供全双工+S2S+混合VAD+HD级联四车道</text>
    <line x1="14" y1="86" x2="272" y2="86" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="106" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心制胜长板：</text>
    <text x="14" y="125" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• GPT-Live-1 原生边听边说，区分“嗯哼”与真打断</text>
    <text x="14" y="144" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• 可直接挂载 140+ 语种 DragonHD / CNV 定制音色</text>
    <text x="14" y="163" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• 80% 提示词缓存折扣 + Phi4-mm 降本 68%</text>
    <text x="14" y="182" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11">🛡️ VNet Private Link + Entra ID 免密钥 + 抵扣 MACC</text>
    <rect x="14" y="195" width="258" height="34" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="216" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11" font-weight="700">P50: 310~540ms | $480~$760/万分钟</text>

    <!-- Card 2: Google Gemini Live -->
    <g transform="translate(299, 0)">
      <rect x="0" y="0" width="274" height="242" rx="12" fill="url(#cardS2s)" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="14" y="14" width="182" height="22" rx="6" fill="#0c4a6e"/>
      <text x="24" y="29" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">阵营 B · Google 多模态原生音频</text>
      <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">Gemini 2.5 Flash Native Audio</text>
      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.2">主打长上下文视频+音频流理解与 Google 搜索</text>
      <line x1="14" y1="86" x2="260" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="106" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心长板与边界：</text>
      <text x="14" y="125" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• 视频流+音频流长窗口上下文记忆能力强</text>
      <text x="14" y="144" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• 30+ 语言情感对话自然，适合安卓生态伴侣</text>
      <text x="14" y="163" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11">⚠️ 缺乏原生 PSTN/SBC Direct Routing 电话网闭环</text>
      <text x="14" y="182" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11">⚠️ 无本地断网语音容器，企业内网电话落地较重</text>
      <rect x="14" y="195" width="246" height="34" rx="8" fill="#091526" stroke="#0284c7" stroke-width="1"/>
      <text x="20" y="216" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11" font-weight="700">P50: 360~580ms | ~$550~$850/万分钟</text>
    </g>

    <!-- Card 3: AWS Nova Sonic & Hume EVI -->
    <g transform="translate(586, 0)">
      <rect x="0" y="0" width="268" height="242" rx="12" fill="url(#cardS2s)" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="14" y="14" width="182" height="22" rx="6" fill="#4c1d95"/>
      <text x="24" y="29" fill="#d8b4fe" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">阵营 C · AWS Nova Sonic / Hume</text>
      <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">Nova Sonic &amp; Hume EVI 2</text>
      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.2">Bedrock 语音集成 vs 心理共情声学专家</text>
      <line x1="14" y1="86" x2="254" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="106" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心长板与边界：</text>
      <text x="14" y="125" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• Nova Sonic 与 Amazon Connect / Bedrock 集成</text>
      <text x="14" y="144" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• Hume EVI 2 专精 48 维声学情绪指标实时打分</text>
      <text x="14" y="163" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11">❌ Nova Sonic 亚太小语种、中文方言与克隆音色弱</text>
      <text x="14" y="182" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11">❌ Hume 偏重情绪聊天，复杂企业 ERP 工具编排弱</text>
      <rect x="14" y="195" width="240" height="34" rx="8" fill="#180d2c" stroke="#7e22ce" stroke-width="1"/>
      <text x="20" y="216" fill="#e9d5ff" font-family="Consolas, monospace" font-size="11" font-weight="700">P50: 420~690ms | ~$620~$1,100/万分钟</text>
    </g>

    <!-- Card 4: Open-Weight S2S (Qwen-Omni / Moshi) -->
    <g transform="translate(867, 0)">
      <rect x="0" y="0" width="269" height="242" rx="12" fill="url(#cardS2s)" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="14" y="14" width="188" height="22" rx="6" fill="#78350f"/>
      <text x="24" y="29" fill="#fcd34d" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">阵营 D · 开源端到端语音权重</text>
      <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">Qwen2.5-Omni / Kyutai Moshi</text>
      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.2">7B 端到端全双工音频权重自托管</text>
      <line x1="14" y1="86" x2="255" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="106" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 适用边界与工程挑战：</text>
      <text x="14" y="125" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">• Moshi 双流架构开创开源全双工；Qwen-Omni 强于中文</text>
      <text x="14" y="144" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11">❌ 7B 参数量限制导致复杂多步 Function Calling 易错</text>
      <text x="14" y="163" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11">❌ 单张 A100/H100 仅能跑极少数并发全双工流</text>
      <text x="14" y="182" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11">❌ 缺乏内置逐字合规锁与电信级回声/打断护栏</text>
      <rect x="14" y="195" width="241" height="34" rx="8" fill="#2a1608" stroke="#d97706" stroke-width="1"/>
      <text x="18" y="216" fill="#fcd34d" font-family="Consolas, monospace" font-size="10.8" font-weight="700">P50: 280~520ms | GPU自建 ~$890/万分钟</text>
    </g>
  </g>

  <!-- Row 2: Why GPT-Live-1 Beats Standard S2S on Acoustic Turn-Taking & Custom Voices -->
  <g transform="translate(32, 372)" filter="url(#shadowS2s)">
    <!-- Left Box: Full-Duplex Backchannel vs True Interruption -->
    <rect x="0" y="0" width="575" height="275" rx="12" fill="url(#cardS2s)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">
      🔬 核心差异解构：为什么普通 S2S 模型一听见客户说“嗯哼/好的”就尴尬闭嘴？
    </text>
    <text x="20" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">
      本仓 21 项声学抗扰实测 (`benchmark-cards.html`) 揭示了“外挂 VAD 的伪全双工”与“原生边听边说”的代差：
    </text>

    <rect x="20" y="64" width="535" height="88" rx="8" fill="#1f121b" stroke="#ef4444" stroke-width="1"/>
    <text x="32" y="84" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">
      ❌ 早期端到端语音 API 的三大声学痛点：
    </text>
    <text x="32" y="105" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      1. **附和声误打断 (Backchannel Cutoff)**：AI 正在念地址，客户礼貌附和一句“嗯、对”，AI 立刻刹车闭嘴问“您说什么？”；
    </text>
    <text x="32" y="124" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      2. **音色锁死在 6~8 个固定美式公版声音**：无法使用企业自己的品牌克隆音色 (CNV) 或各地方言音色；
    </text>
    <text x="32" y="143" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11">
      3. **音频 Token 随轮次 $O(N^2)$ 滚雪球暴涨**：聊到第 10 分钟，每一句话都要重传前 9 分钟的历史音频 Token！
    </text>

    <rect x="20" y="164" width="535" height="92" rx="8" fill="#07261f" stroke="#10b981" stroke-width="1.2"/>
    <text x="32" y="184" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">
      ✅ Azure Voice Live (`GPT-Live-1` + 四通道统一网关) 的三大工程突破：
    </text>
    <text x="32" y="205" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      1. **原生全双工声学判停 (20/21 = 95.2% 通过)**：原生区分“咳嗽/敲键盘/嗯哼附和”与“等一下”真打断；
    </text>
    <text x="32" y="224" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      2. **开放音色解耦**：既可用原生 S2S 声线，也可一键绑定 **Azure 140+ 语种 DragonHD (4.34 MOS) 与专属 CNV 克隆音色**；
    </text>
    <text x="32" y="244" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">
      3. **内置 80% 提示词缓存 + 4轮音频滑窗裁剪 (``)**：长通话成本直降 74%，彻底拉平 S2S 生产账单！
    </text>

    <!-- Right Box: 3-Model Enterprise Routing Matrix -->
    <g transform="translate(595, 0)">
      <rect x="0" y="0" width="541" height="275" rx="12" fill="url(#cardS2s)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="30" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">
        🧭 架构师实战拍板：如何在一个项目里组合使用这几款语音大模型？
      </text>
      <text x="20" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">
        不要用一个模型硬扛所有流量！按对话难易度与合规等级实施“多模型星座路由 (Constellation)”：
      </text>

      <rect x="20" y="64" width="501" height="46" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
      <text x="30" y="84" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
        ① VIP 情绪安抚 / 销售高压对练 / 车载副驾 ➔ <tspan fill="#f8fafc">Azure GPT-Live-1 (全双工 310ms)</tspan>
      </text>
      <text x="30" y="101" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.8">
        看中：95.2% 抗咳嗽/附和误断、原生边听边说、高情商韵律与视觉多模态理解
      </text>

      <rect x="20" y="118" width="501" height="46" rx="6" fill="#091526" stroke="#38bdf8" stroke-width="1"/>
      <text x="30" y="138" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
        ② 高并发餐饮点餐 / 物流改约 / 12345 分诊 ➔ <tspan fill="#f8fafc">Phi4-mm-realtime ($0.048/min)</tspan>
      </text>
      <text x="30" y="155" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.8">
        看中：多模态小模型语义判停 + 结构化 JSON 工具输出，Token 成本比全尺寸 S2S 省 68%
      </text>

      <rect x="20" y="172" width="501" height="46" rx="6" fill="#181236" stroke="#a855f7" stroke-width="1"/>
      <text x="30" y="192" fill="#d8b4fe" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
        ③ 金融双录条款 / 医疗剂量复诵 / 品牌音色 ➔ <tspan fill="#f8fafc">级联 STT + LLM + DragonHD / CNV</tspan>
      </text>
      <text x="30" y="209" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.8">
        看中：100% 文本层 DLP 脱敏、法定免责条款一字不差锁定、4.34 MOS 专属克隆音色
      </text>

      <rect x="20" y="226" width="501" height="34" rx="6" fill="#2a1608" stroke="#f59e0b" stroke-width="1"/>
      <text x="30" y="247" fill="#fcd34d" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">
        ④ 端侧离线车控 / 地下车库无网逃生 ➔ <tspan fill="#f8fafc">端侧 NPU Phi-4-mini INT4 + Speech 本地容器</tspan>
      </text>
    </g>
  </g>
</svg>
