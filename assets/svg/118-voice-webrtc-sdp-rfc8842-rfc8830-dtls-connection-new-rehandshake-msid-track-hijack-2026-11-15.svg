  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">STAGE 474 · TOPIC 114 · P941–P942 🎉 · 951 GUARDS, 960 PROBES &amp; 770 LIVE POC MILESTONE · 477 DIMS · 916 TESTS</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">WebRTC RFC 8842 &amp; RFC 8830: DTLS connection:new Re-Handshake &amp; a=msid Track Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 WebRTC RFC 8842/8830 重协商：严防容灾换节点漏标 connection:new 致 SRTP 密钥失步静音与 a=msid 跨流串音劫持 (P941–P942 🎉)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="298" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (Stale connection:existing &amp; msid Hijack)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 换节点证书变更却标 existing 致 SRTP 失步静音</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">New Pod Cert + a=connection:existing -&gt; 0 DTLS Handshake</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 客户端沿用旧 Pod A 的 SRTP 密钥，新 Pod B 100% 解密失败死寂！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 放行 a=fingerprint:sha-1 (160b) 弱哈希遭受碰撞伪造中间人劫持！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. RFC 8830 a=msid 跨流复用 track-id 串音泄密</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">a=msid:whisper-stream caller-track-01 (512B Overflow)</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 重协商将新音轨绑定至已有主叫 track-id，劫持声纹核身与耳语通道！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 注入 512 字节非 token-char 畸形 msid 撑爆终端 SDP 解析器！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：14 条热切通话 SRTP 失步静音 + 9 条 a=msid 跨流串音劫持</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">容灾切换瞬间全线通话无声掉线，且旁听耳语与主叫声道错位混音</text>

