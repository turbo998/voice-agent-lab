  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="340" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P941 + P942 🎉 · 951 Guards &amp; 960 Probes)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P941 🎉 · RFC 8842 connection:new 与 [256, 512]b 指纹锁</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Cert Change -&gt; connection:new + actpass · Hash ∈ [256, 512]b</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 检出 fingerprint/ICE 变更自动注入 connection:new + setup:actpass</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 拦截 sha-1/md5，强制 SHA-256/384/512 ([256, 512]b · 0 失步静音)</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P942 🎉 · RFC 8830 a=msid 唯一轨迹锁与 [1, 64]B 边界</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Immutable (mid, stream-id, track-id) · Token ∈ [1, 64] Chars</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 终生锁定 mid 与 track-id/媒体类型唯一映射，0ms 阻断跨流嫁接</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 校验 RFC 8830 token-char 语法并将标识符长度钳制在 [1, 64] 字符</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 SRTP 密钥失步静音 · 0 msid 跨流劫持 · 256b / 64B 封顶</text>
  <text x="652" y="500" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

