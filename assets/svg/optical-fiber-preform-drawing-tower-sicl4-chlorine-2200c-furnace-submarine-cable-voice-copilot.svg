  <text x="60" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">SiCl4 / GeCl4 / Cl2 Bubbler PLC</text>
  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Carrier gas dew-point (&le;-70°C) lock</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• NaOH wet scrubber pH (&ge;10.5) &amp; ΔP</text>

