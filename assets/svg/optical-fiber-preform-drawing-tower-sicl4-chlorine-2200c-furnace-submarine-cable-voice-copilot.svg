  <text x="60" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 25m vertical intercom &amp; burner DSP</text>
  <text x="60" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Clip-on Cl2 / HCl electrochemical badge</text>

