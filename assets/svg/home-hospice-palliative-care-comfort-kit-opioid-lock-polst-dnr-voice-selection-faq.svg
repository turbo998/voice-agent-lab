  <text x="456" y="164" class="card-sub">Zero mL-vs-mg Overdose · Zero Unwanted 911 · 0ms RN Bridge</text>

  <rect x="456" y="182" width="368" height="136" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="472" y="204" class="card-title">Gate A: Roxanol 20mg/mL mL-vs-mg &amp; Interval Lock</text>
  <text x="472" y="224" class="body">• Blocks AI from ever altering physician PRN standing dose</text>
  <text x="472" y="242" class="body">• Enforces exact syringe line readback ("0.25 mL mark = 5 mg")</text>
  <text x="472" y="260" class="body">• Hard-locks repeat dosing before minimum PRN interval</text>
  <text x="472" y="280" class="mono">Concentrated_Morphine_Unit_Error = 0.0% (Hard Locked)</text>
  <text x="472" y="298" class="mono">Unauthorized_AI_Dose_Titration = 0.0%</text>

  <rect x="456" y="332" width="368" height="136" rx="8" fill="#1E293B" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="472" y="354" class="card-title">Gate B: POLST/DNR Goal-of-Care Routing Gate</text>
  <text x="472" y="374" class="body">• Checks signed DNR/POLST before emergency escalation</text>
  <text x="472" y="392" class="body">• Routes Cheyne-Stokes / rattle calls to Hospice Triage RN</text>
  <text x="472" y="410" class="body">  instead of generic 911 EMS intubation dispatch</text>
  <text x="472" y="430" class="mono">Unwanted_911_ED_Revocation_Drop = -89% Reduction</text>
  <text x="472" y="448" class="mono">Hospice_RN_Connect_Time = 6.8s (vs 18m Hold Queue)</text>

  <rect x="456" y="482" width="368" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="472" y="504" class="card-title">Gate C: 0ms Refractory Crisis &amp; Home Death RN Bridge</text>
  <text x="472" y="524" class="body">• Detects refractory pain/delirium after PRN dose, acute</text>
  <text x="472" y="542" class="body">  bleeding/seizure, caregiver collapse or expected passing</text>
  <text x="472" y="560" class="body">• Preempts AI in 0ms; dispatches On-Call Field RN to home</text>
  <text x="472" y="578" class="body">  &amp; keeps warm human nurse on line with grieving family</text>
  <text x="472" y="600" class="mono">if (refractoryCrisisOrExpectedPassing) -&gt; 0ms Triage_RN</text>
  <text x="472" y="618" class="mono">P99_Gate_Latency = 31ms | RN_Warm_Handoff = 0ms</text>

  <!-- Right Column: Hospice RN Care & KPIs -->
  <rect x="872" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
