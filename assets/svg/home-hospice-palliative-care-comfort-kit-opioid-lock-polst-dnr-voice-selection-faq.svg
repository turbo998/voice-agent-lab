  <!-- Left Column: 02:00 AM Family Caregiver & Hospice EHR Bus -->
  <rect x="28" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="144" class="card-title">1. 24/7 Family Caregiver &amp; Hospice EHR Bus</text>
  <text x="48" y="164" class="card-sub">WellSky / Netsmart / MatrixCare · Comfort Kit · POLST</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#14B8A6" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">2:00 AM Distressed Caregiver Voice Line</text>
  <text x="64" y="224" class="body">• Crying/trembling caregiver acoustic stabilization</text>
  <text x="64" y="242" class="body">• Smartphone camera check of oral syringe barrel line</text>
  <text x="64" y="260" class="mono">Prosody_Pacing = 135 WPM Warm Calming Cadence</text>

  <rect x="48" y="298" width="340" height="108" rx="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
  <text x="64" y="320" class="card-title">Hospice Comfort-Kit Standing Orders (MAR)</text>
  <text x="64" y="340" class="body">• Liquid Morphine Sulfate 20mg/mL (0.25mL = 5mg order)</text>
  <text x="64" y="358" class="body">• Lorazepam intensol, Haloperidol &amp; Atropine drops</text>
  <text x="64" y="376" class="mono">Last_Dose_Timestamp = T-45m (Min Interval = 60m)</text>

  <rect x="48" y="420" width="340" height="108" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="64" y="442" class="card-title">Signed POLST / DNR / MOLST Registry</text>
  <text x="64" y="462" class="body">• Verified Do-Not-Resuscitate &amp; Comfort-Measures-Only</text>
  <text x="64" y="480" class="body">• Prevents unwanted 911 EMS intubation &amp; ICU transfer</text>
  <text x="64" y="498" class="mono">Advance_Directive = DNR_Comfort_Measures_Active</text>

  <rect x="48" y="542" width="340" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="64" y="564" class="card-title">CMS Hospice Conditions of Participation</text>
  <text x="64" y="584" class="body">• 42 CFR 418 Continuous Home Care (CHC) eligibility log</text>
  <text x="64" y="602" class="body">• Post-mortem controlled substance witness &amp; waste log</text>
  <text x="64" y="620" class="mono">Compliance = CMS_42CFR418_And_HIPAA_BAA</text>

  <!-- Center Column: 3-Layer Deterministic Hospice Safety Gate -->
  <rect x="436" y="114" width="408" height="536" rx="12" fill="#0F172A" stroke="#14B8A6" stroke-width="2"/>
