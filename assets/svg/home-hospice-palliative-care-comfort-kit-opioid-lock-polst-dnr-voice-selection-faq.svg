  <text x="892" y="164" class="card-sub">Bedside RN Dispatch · Continuous Care · Chaplain Sync</text>

  <rect x="892" y="182" width="340" height="126" rx="8" fill="#0F172A" stroke="#14B8A6" stroke-width="1.2"/>
  <text x="908" y="204" class="card-title">Verified Caregiver Comfort-Kit Administration</text>
  <text x="908" y="224" class="body">• Logs caregiver PRN dose timestamp + syringe photo in EHR</text>
  <text x="908" y="242" class="body">• Schedules automated 30-minute comfort reassessment callback</text>
  <text x="908" y="260" class="body">• Updates remaining bottle volume in narcotic tracker</text>
  <text x="908" y="282" class="mono">30m_Followup_Assessment_Rate = 100.0%</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
