  <text x="908" y="366" class="body">• Comforts family gently: "There is no rush; you are not alone"</text>
  <text x="908" y="384" class="body">• Dispatches mobile Hospice RN for pronouncement &amp; care</text>
  <text x="908" y="402" class="body">• Coordinates funeral home &amp; bereavement social worker</text>
  <text x="908" y="424" class="mono">CAHPS_Hospice_Family_Rating = 97.4% Top-Box</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="908" y="498" class="card-title">Benchmark &amp; TCO Summary (10k Night Calls)</text>
  <text x="908" y="520" class="body">• Cascaded EHR+POLST Gate: $790 / 10k calls (100% safe)</text>
  <text x="908" y="538" class="body">• Hybrid Empathetic+Gate: $1,240 / 10k calls (Recommended)</text>
  <text x="908" y="556" class="body">• Unfiltered E2E Voice: $2,180 + mL/mg &amp; 911 DNR breach risk</text>
  <text x="908" y="578" class="mono">Unwanted_ED_Transfer_Savings = $14,200 / Avoided Trip</text>
  <text x="908" y="596" class="mono">Morphine_Unit_Errors = 0 | RN_Connect = 6.8s</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateHomeHospicePalliativeComfortKitVoiceGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
