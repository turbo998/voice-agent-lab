  <rect width="1200" height="680" fill="url(#bg270)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Woodworking, Custom Furniture &amp; MDF Hot-Press NFPA 664 &amp; CARB/ENF Voice Copilot</text>
  <text x="600" y="66" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">NFPA 664 Wood-Dust Extraction (≥20 m/s) &amp; Zero Paint-Duct Mix Lock · Rip-Saw Anti-Kickback &amp; TSCA/ENF Gate · 0ms GreCon Spark &amp; Hot-Press Deluge (WOODWORKING-FURNITURE-NFPA664-CARB-01)</text>

  <!-- Left Column: CNC/Sanding Cell, MDF Hot Press & Finishing -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card270)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="166" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. CNC, Sander &amp; Hot Press</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#fbbf24"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Homag / Biesse CNC &amp; Sander</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 96dB wood-dustproof headset</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Dust duct velocity ≥20 m/s lock</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Anti-kickback fingers &amp; riving</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dieffenbacher MDF Hot Press</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Ultrasonic mat blister detection</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• TSCA Title VI / CARB2 / ENF</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• pMDI vs UF resin grade lock</text>

