  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card270)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic NFPA 664 &amp; CARB Engine (WOODWORKING-FURNITURE-NFPA664-CARB-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: NFPA 664 Dust-Duct Velocity (≥20 m/s) &amp; Zero Paint/Dust Mix Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks starting wide-belt sanders or CNC routers if dust duct airspeed &lt;20 m/s (4,000 fpm)</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% forbids cross-connecting solvent spray-booth exhaust into dry wood-dust baghouses</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Prevents settled wood-flour duct fires &amp; hybrid nitrocellulose-sawdust explosions</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Requires armed GreCon IR spark water-pressure ≥7 bar before sander feed belt starts</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: Rip-Saw Anti-Kickback / SawStop &amp; TSCA Title VI / ENF Board Gate</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Locks gang rip-saw feed unless anti-kickback fingers, riving knife &amp; chain curtain are down</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces 10-min spindle coast-down mechanical brake LOTO before CNC/moulder cutter swap</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Verifies EPA TSCA Title VI / CARB Phase 2 / ENF (≤0.025 mg/m³) formaldehyde chamber pass</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Blocks cutting non-ENF E1/E2 raw boards on nursery/export furniture work orders</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms GreCon Spark 300ms Water-Mist, Abort Gate &amp; Hot-Press Deluge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Fires high-speed water mist in &lt;300ms &amp; slams high-speed abort gate before baghouse</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Stops return-air damper into plant floor to prevent smoke/flame back-injection</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Triggers MDF continuous hot-press water-mist deluge on thermal-oil / mat fire</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full NFPA 664 Wood Processing, OSHA 1910.213 Woodworking, EPA 40 CFR 770 &amp; WORM audit</text>

  <!-- Right Column: Homag tapio, GreCon PLC & Chamber Lab -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card270)" stroke="#22c55e" stroke-width="1.5"/>
