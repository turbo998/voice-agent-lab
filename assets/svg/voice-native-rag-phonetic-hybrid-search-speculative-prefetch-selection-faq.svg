  </text>

  <!-- Column 1: T-300ms Speculative Partial-ASR Pre-Fetch -->
  <rect x="44" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="44" y="128" width="356" height="40" rx="12" fill="url(#cyan497r)"/>
  <text x="222" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. T-300ms Speculative Partial-ASR Pre-Fetch
  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Hiding RAG Latency Inside User Speech</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Text RAG waits until EoT + runs LLM rewrite</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  + vector search + rerank (+1,850ms dead air!)</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Speculatively queries Azure AI Search / Qdrant</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">  on partial ASR 300ms BEFORE caller finishes!</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">85ms Median Added Latency at End-of-Turn</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• When caller finishes speaking, 91% of top-3</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  chunks are already warm in local worker RAM</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Verifies final EoT token delta in &lt;15ms</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#38bdf8">• Cuts P50 voice RAG response from 2.2s to 395ms</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="76" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">Ingestion-Time 35-Word Spoken Summary Cards</text>
  <text x="76" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Pre-compiles 2,000-word PDFs at index time</text>
  <text x="76" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">  into 35-word spoken cards (-88.4% LLM tokens)</text>
  <text x="76" y="512" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7dd3fc">• Zero Markdown tables or raw URLs in RAG context</text>

  <!-- Column 2: Phonetic Homophone Hybrid Search -->
  <rect x="422" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="422" y="128" width="356" height="40" rx="12" fill="url(#rose497r)"/>
  <text x="600" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. Phonetic Homophone Hybrid Search
  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">Solving ASR Homophone Zero-Recall Failures</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Telephony ASR transcribes "VoxCPM" as "Fox</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  CPM" or "泰康鑫享" as "太康新享"</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Pure BM25 + text embeddings miss 34% of</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">  homophone-corrupted spoken product queries!</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">3-Way RRF: Dense + BM25 + Phonetic N-Gram</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Indexes Pinyin / Double Metaphone / IPA</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  phonetic trigrams alongside dense vectors</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Reciprocal Rank Fusion (RRF) recovers exact</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">  SKU/policy match (98.2% top-3 spoken recall!)</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">Spoken Acronym &amp; Part-Number Normalization</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Maps spoken "triple A dash forty two" to</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" fill="#ffe4e6">  canonical "AAA-42" before index lookup</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">• Eliminates alphanumeric search misses</text>

  <!-- Column 3: Bitemporal Policy Filter & Abstention Lock -->
