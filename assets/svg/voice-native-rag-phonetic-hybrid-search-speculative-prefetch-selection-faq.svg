  </text>

  <rect x="818" y="184" width="320" height="114" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399">Bitemporal Effective-Date &amp; Jurisdiction Lock</text>
  <text x="832" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Filters vector search by mandatory metadata:</text>
  <text x="832" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  effective_from &lt;= NOW &lt; effective_to AND</text>
  <text x="832" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  caller_region == policy_jurisdiction</text>
  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• 0% quoting expired 2024/2025 fee schedules!</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">&lt;0.78 Score Deterministic Abstention Gate</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• If reranker confidence &lt;0.78: 100% forbids</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  LLM from guessing policy terms; triggers</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  clarification or specialist callback</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Document-Level RBAC &amp; Tenant Isolation</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" fill="#d1fae5">• Enforces caller entitlement tags inside</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" fill="#d1fae5">  vector query filter before retrieval</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#6ee7b7">• Saves $282,000 per 10,000 knowledge-heavy hrs</text>

  <!-- Bottom Telemetry Bar -->
