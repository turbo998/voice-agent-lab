<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Enterprise Voice Agent Evaluation, OpenTelemetry Audio Waterfall Observability &amp; Canary Red-Teaming Selection Guide">
  <defs>
    <linearGradient id="bgEval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b16"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>
    <linearGradient id="barEval" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardEval" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112240" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadowEval" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgEval)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#barEval)"/>

  <!-- Header -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="560" height="28" rx="14" fill="#0c2d48" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="18" fill="#7dd3fc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">
      VOICE AGENT EVALUATION · OPENTELEMETRY WATERFALL · CANARY RED-TEAMING
    </text>
    <text x="0" y="56" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="23.5" font-weight="800">
      企业语音智能体自动化评测、全链路可观测性与灰度红队：选型指南
    </text>
    <text x="0" y="80" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">
      合成对抗客户拨测 (Azure Foundry vs Hamming/Coval) · OpenTelemetry 6段语音延迟瀑布图 · P12 影子流量 Dry-Run 灰度
    </text>
  </g>

  <!-- Top KPI Pills -->
  <g transform="translate(838, 22)" filter="url(#shadowEval)">
    <rect x="0" y="0" width="162" height="64" rx="10" fill="#0b2e27" stroke="#10b981" stroke-width="1.2"/>
    <text x="81" y="24" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">发版前自动回归通话</text>
    <text x="81" y="49" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800">500通 / 8分钟</text>

    <rect x="172" y="0" width="158" height="64" rx="10" fill="#0d2847" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="251" y="24" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">金丝雀异常自动回滚</text>
    <text x="251" y="49" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800">&lt;= 500ms (零事故)</text>
  </g>

  <!-- Row 1: 3 Pillars of Voice Quality Assurance & MLOps -->
  <g transform="translate(32, 114)" filter="url(#shadowEval)">
    <!-- Pillar 1: Pre-Launch Automated Voice Simulation & Red-Teaming -->
    <rect x="0" y="0" width="366" height="242" rx="12" fill="url(#cardEval)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="14" y="14" width="212" height="22" rx="6" fill="#0c4a6e"/>
    <text x="24" y="29" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">阶段 1 · 上线前合成语音红队拨测 🏆</text>
    <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="16.5" font-weight="800">Voice-to-Voice CI/CD Simulator</text>
    <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">痛点：只测纯文本 Prompt 满分，一上真电话就抢话崩溃</text>
    <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="107" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心评测架构：</text>
    <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 叠加真实环境噪底（地铁/免提回声/8kHz压缩/咳嗽声）</text>
    <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 对抗模拟器扮演 20 种刁钻人格（暴怒/口吃/提示词越狱）</text>
    <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 8 分钟并发跑完 500 通回归测试，生成 7-Card 基准报告</text>
    <rect x="14" y="186" width="338" height="40" rx="8" fill="#091526" stroke="#0284c7" stroke-width="1"/>
    <text x="22" y="210" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11" font-weight="700">工具: Azure Foundry Eval / Hamming / Coval</text>

    <!-- Pillar 2: OpenTelemetry 6-Segment Voice Waterfall -->
    <g transform="translate(385, 0)">
      <rect x="0" y="0" width="366" height="242" rx="12" fill="url(#cardEval)" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="14" y="14" width="212" height="22" rx="6" fill="#4c1d95"/>
      <text x="24" y="29" fill="#d8b4fe" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">阶段 2 · 毫秒级 6 段延迟瀑布追踪</text>
      <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="16.5" font-weight="800">OpenTelemetry Voice Waterfall</text>
      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">痛点：客户投诉“机器人反应慢”，研发与网络互相甩锅</text>
      <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="107" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心追踪指标 (Per-Turn Span)：</text>
      <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 精确拆解每一轮对话的 6 段耗时：`RTP Jitter` ➔ `VAD/EOU`</text>
      <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">  ➔ `STT Final` ➔ `RAG/Tool` ➔ `LLM TTFT` ➔ `TTS 1st Byte`</text>
      <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 一键定位是“VAD 多等了 800ms”还是“ERP 接口慢了 2s”</text>
      <rect x="14" y="186" width="338" height="40" rx="8" fill="#180d2c" stroke="#7e22ce" stroke-width="1"/>
      <text x="22" y="210" fill="#e9d5ff" font-family="Consolas, monospace" font-size="11" font-weight="700">工具: Azure App Insights OTel / Langfuse</text>
    </g>

    <!-- Pillar 3: Canary Shadow Rollout & Auto-Rollback -->
    <g transform="translate(770, 0)">
      <rect x="0" y="0" width="366" height="242" rx="12" fill="url(#cardEval)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="14" y="14" width="212" height="22" rx="6" fill="#064e3b"/>
      <text x="24" y="29" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">阶段 3 · 影子流量双跑与金丝雀回滚</text>
      <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="16.5" font-weight="800">P12 Shadow Dry-Run &amp; Canary</text>
      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">痛点：改了一句 Prompt 直接全量上线，导致万通电话挂死</text>
      <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="107" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心发布机制 (`P12 / `)：</text>
      <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 影子模式 (Shadow Fork)：新模型旁路静默听真实电话并生成</text>
      <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">  Dry-Run 工具调用（静音不发声、不改库），与主模型比对</text>
      <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 5% 金丝雀放量：若 P95 延迟漂移 &gt;150ms 则 500ms 自动回滚</text>
      <rect x="14" y="186" width="338" height="40" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1"/>
      <text x="22" y="210" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11" font-weight="700">线上发版故障率: 0.0% | 记忆防投毒: P20</text>
    </g>
  </g>

  <!-- Row 2: The 6-Segment Latency Waterfall & Evaluation Platform Comparison -->
  <g transform="translate(32, 372)" filter="url(#shadowEval)">
    <!-- Left Box: Anatomy of the 6-Segment Voice Latency Waterfall -->
    <rect x="0" y="0" width="575" height="275" rx="12" fill="url(#cardEval)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">
      ⏱️ 语音可观测性核心：一张图看懂“客户说完尾字到听见首声 (TTFA)”的 6 段拆解
    </text>
    <text x="20" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">
      很多团队只看 LLM TTFT (200ms) 就以为很快，殊不知 VAD 判停和网络缓冲偷偷吃掉了 900ms：
    </text>

    <rect x="20" y="64" width="535" height="96" rx="8" fill="#091526" stroke="#38bdf8" stroke-width="1"/>
    <text x="32" y="84" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">
      标准生产级级联/混合轮次延迟瀑布预算（目标总和 P50 &lt;= 580ms）：
    </text>
    <!-- Waterfall Visual Bars -->
    <rect x="32" y="96" width="45" height="18" rx="3" fill="#64748b"/>
    <rect x="80" y="96" width="95" height="18" rx="3" fill="#f59e0b"/>
    <rect x="178" y="96" width="60" height="18" rx="3" fill="#38bdf8"/>
    <rect x="241" y="96" width="40" height="18" rx="3" fill="#a855f7"/>
    <rect x="284" y="96" width="110" height="18" rx="3" fill="#10b981"/>
    <rect x="397" y="96" width="85" height="18" rx="3" fill="#ec4899"/>
    <text x="32" y="131" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10.5">
      [①网传35ms] + [②Semantic EOU 180ms] + [③STT尾字40ms] + [④投机RAG 10ms] + [⑤LLM首词160ms] + [⑥TTS首包155ms]
    </text>
    <text x="32" y="149" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">
      💡 诊断口诀：若 ②&gt;600ms 查 VAD 阈值；若 ④&gt;300ms 查是否漏开 300ms 安抚垫话；若 ⑥&gt;350ms 查是否漏做首逗号切块！
    </text>

    <rect x="20" y="170" width="535" height="86" rx="8" fill="#07261f" stroke="#10b981" stroke-width="1.2"/>
    <text x="32" y="190" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">
      五大维度 544+ 实时 POC 探针评分卡 (`docs/voice-agent-evaluation-rubric.md`)
    </text>
    <text x="32" y="211" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      • `A类 (声学抗扰 25分)` · `L类 (延迟与节奏 20分)` · `T类 (工具幂等与取消 25分)` · `S类 (安全与合规 30分)`；
    </text>
    <text x="32" y="230" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      • 任何 S 类安全红线（如 PCI 泄密、保本承诺、急症漏转）出现 1 次违例，整次发版直接一票否决 (`Score = 0`)！
    </text>

    <!-- Right Box: Voice Eval & Observability Platform Comparison -->
    <g transform="translate(595, 0)">
      <rect x="0" y="0" width="541" height="275" rx="12" fill="url(#cardEval)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="30" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">
        ⚖️ 语音评测与可观测平台选型：垂直 SaaS vs Azure 原生全栈
      </text>
      <text x="20" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">
        对比硅谷新兴语音拨测 SaaS (Hamming / Coval / Roark)、开源追踪器 (Langfuse / Phoenix) 与 Azure Foundry：
      </text>

      <rect x="20" y="64" width="501" height="58" rx="6" fill="#091526" stroke="#38bdf8" stroke-width="1"/>
      <text x="30" y="84" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
        1. 垂直语音拨测 SaaS (Hamming AI / Coval / Roark)
      </text>
      <text x="30" y="102" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.8">
        优势：开箱自带模拟背景噪音拨打外线电话；短板：按拨测分钟收费贵 ($0.15+/min)，且录音出境难过银行内网审计。
      </text>

      <rect x="20" y="130" width="501" height="58" rx="6" fill="#181236" stroke="#a855f7" stroke-width="1"/>
      <text x="30" y="150" fill="#d8b4fe" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
        2. 开源 LLM 可观测平台 (Langfuse / Arize Phoenix 自托管)
      </text>
      <text x="30" y="168" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.8">
        优势：文本 Trace 与 Prompt 版本管理极佳；短板：原生缺乏 WebRTC 音频抖动、VAD 截断与双声道波形对齐视图。
      </text>

      <rect x="20" y="196" width="501" height="62" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.2"/>
      <text x="30" y="216" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
        3. Azure AI Foundry Evaluation + App Insights OTel + 本仓 7-Card 套件 🏆
      </text>
      <text x="30" y="234" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="10.8">
        优势：100% 私网 VNet 闭环，统一追踪 ACS 网络抖动 + Voice Live 6段延迟 + 100分全量质检，直抵 MACC！
      </text>
    </g>
  </g>
</svg>
