    </linearGradient>
    <linearGradient id="card285" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg285)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1224" height="78" rx="14" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
  <text x="48" y="54" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">
    PCB SMT Assembly, Nitrogen Reflow &amp; Wave Soldering Voice Copilot (PCB-SMT-ASSEMBLY-REFLOW-JSTD033-01)
  </text>
  <text x="48" y="81" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">
    IPC J-STD-033 MSL Floor-Life &quot;Popcorning&quot; Lock · N2 Reflow Hood O2 &amp; Wave Flux LEL (&le;25%) Gate · 0ms Flux-Fire &amp; X-Ray HV Bridge
  </text>

  <!-- Left Column: SMT Line Endpoints -->
  <rect x="28" y="118" width="290" height="465" rx="12" fill="url(#card285)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="148" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    1. SMT Line &amp; Reflow Endpoints
  </text>

  <rect x="46" y="166" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">SMT Line Operator ESD Headset</text>
  <text x="60" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 88 dBA high-speed placement DSP</text>
  <text x="60" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• ESD smock/heel-strap &amp; reel scanner</text>

  <rect x="46" y="266" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">12-Zone N2 Reflow &amp; Wave PLC</text>
  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tunnel O2 ppm &amp; hood breathing O2</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Alcohol flux LEL (&le;25%) &amp; UV flame</text>

  <rect x="46" y="366" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="390" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">3D SPI, AOI &amp; 160kV AXI X-Ray</text>
  <text x="60" y="411" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Koh Young solder paste volume SPI</text>
  <text x="60" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Lead-cabinet X-ray 0kV door interlock</text>

  <rect x="46" y="466" width="254" height="98" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="490" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">IPC-A-610 Class 3 &amp; J-STD-033</text>
  <text x="60" y="511" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• MSL 3/4/5a dry-cabinet floor clock</text>
  <text x="60" y="530" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• SAC305 paste 4h warm-up &amp; 8h stencil</text>
  <text x="60" y="549" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Dual-track cascade (&lt;500ms P95)</text>

  <!-- Center Column: 3 Deterministic Safety Gates -->
  <rect x="338" y="118" width="584" height="465" rx="12" fill="url(#card285)" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="148" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    2. Deterministic SMT Assembly &amp; Reflow Safety Engine
  </text>

  <!-- Gate 1 -->
  <rect x="358" y="166" width="544" height="122" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="376" y="191" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate A · IPC J-STD-033 MSL Floor-Life &amp; SAC305 Solder Paste Lock
  </text>
  <text x="376" y="214" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Hard Rule: Never mount expired MSL 3-5a BGA/SiP reels without 125°C bakeout reset!
  </text>
  <text x="376" y="235" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Blocks feeder splice if MSL_Remaining_Hours &lt; Line_Completion_Hours (prevents 250°C popcorning)
  </text>
  <text x="376" y="256" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Requires Solder_Paste_Warmup &ge; 4.0h, Stencil_Life &le; 8.0h, &amp; Operator_ESD &lt; 35 M&Omega;
  </text>
  <text x="376" y="275" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Eliminates BGA package steam delamination &amp; cold-paste solder balling
  </text>

  <!-- Gate 2 -->
  <rect x="358" y="302" width="544" height="122" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="376" y="327" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate B · N2 Reflow Hood O2 (&ge;19.5%), Wave Flux LEL (&le;25%) &amp; AXI X-Ray Lock
  </text>
  <text x="376" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Blocks reflow clamshell hood raise unless N2_Supply == OFF &amp; Hood_Zone_O2 &ge; 19.5%
  </text>
  <text x="376" y="371" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Blocks wave-solder preheater/wave start if Alcohol_Flux_LEL &gt; 25% or Exhaust_Airflow == LOW
  </text>
  <text x="376" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Blocks 3D AXI X-ray service door unlock unless Tube_HV_kV == 0.0 kV &amp; Survey_Dose &lt; 0.5 &mu;Sv/h
  </text>
  <text x="376" y="411" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Prevents reflow N2 hood asphyxiation, IPA flux flash fire &amp; 160kV X-ray exposure
  </text>

  <!-- Gate 3 -->
  <rect x="358" y="438" width="544" height="126" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="376" y="463" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate C · 0ms Wave-Flux Fire CO2 Quench &amp; Reflow Board-Jam Cooling Bridge
  </text>
  <text x="376" y="486" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Triggers on Wave_Flux_UV_Flame, Reflow_Conveyor_Board_Jam_At_260C, or AXI_Interlock_Breach
  </text>
  <text x="376" y="507" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • 0ms PLC hardware trip: Drop solder wave pot &amp; shut IPA flux pump -&gt; Discharge local CO2 quench
  </text>
  <text x="376" y="528" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Reflow board jam: Trip zone heaters OFF, max N2 inert cooling, &amp; prevent FR-4 epoxy charring fire
  </text>
  <text x="376" y="549" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Zero LLM latency in the wave-solder flux fire &amp; jammed-PCB thermal runaway loop
  </text>

  <!-- Right Column: SMT Factory Bus -->
  <rect x="942" y="118" width="310" height="465" rx="12" fill="url(#card285)" stroke="#10b981" stroke-width="1.5"/>
