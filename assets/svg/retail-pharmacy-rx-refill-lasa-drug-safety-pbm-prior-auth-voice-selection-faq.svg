    Retail &amp; Specialty Pharmacy Rx Refill, ISMP LASA Drug Safety &amp; PBM Prior Auth Voice Architecture (2026)
  </text>
  <text x="68" y="94" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94a3b8">
    ISMP Tall-Man LASA + Rx# + Strength Dual Lock • DEA Schedule II &amp; OBRA-90 Pharmacist Mandate • NCPDP Telecom D.0 Reject 75 PBM Prior Auth
  </text>
  <rect x="920" y="52" width="216" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1028" y="75" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">
    PHARMACY-RX-PBM-2026-01
  </text>

  <!-- Column 1: ISMP LASA Drug Disambiguation & Rx Refill -->
  <rect x="44" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="44" y="128" width="356" height="40" rx="12" fill="url(#cyan449)"/>
  <text x="222" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. ISMP LASA Disambiguation &amp; Rx Refill Lock
  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Look-Alike Sound-Alike (LASA) Guard</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Blocks single-word drug refill ("hydralazine" vs</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  "hydroxyzine", "glipizide" vs "glyburide")</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• Requires active profile match + mg strength +</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">  therapeutic indication or last-4 Rx# check</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">SSML Phonetic &amp; Tall-Man Readback</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Custom RxNorm / SNOMED lexicon (50,000+ NDCs)</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Syllabic emphasis on Tall-Man syllables</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Bottle photo OCR fallback via SMS WebRTC link</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#38bdf8">• Eliminates 100% of phonetic LASA wrong-fills</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="76" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">DEA Schedule II &amp; Refill-Too-Soon Rules</text>
  <text x="76" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• C-II opioids/stimulants: zero auto-refill allowed</text>
  <text x="76" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Checks state PDMP &amp; 28/30-day earliest fill date</text>
  <text x="76" y="512" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7dd3fc">• Requests fresh e-Rx via NCPDP SCRIPT v2017071</text>

  <!-- Column 2: NCPDP D.0 PBM Prior Auth & Copay Recovery -->
  <rect x="422" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#059669" stroke-width="1.5"/>
  <rect x="422" y="128" width="356" height="40" rx="12" fill="url(#emerald449)"/>
  <text x="600" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. NCPDP D.0 PBM Rejects, Prior Auth &amp; Cold-Chain
  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399">160ms NCPDP Telecom D.0 Claim Parsing</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Reject 75 (Prior Auth Required): auto-triggers</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  CoverMyMeds / Surescripts ePA to prescriber</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#38bdf8">• Reject 79 (Refill Too Soon): reads exact date</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• Reject 70 (NDC Not Covered): flags formulary alt</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">GLP-1 Inventory &amp; Specialty Cold-Chain</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Real-time store + 15-mile sister-store stock</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  check for GLP-1 / ADHD shortage medications</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• 2°C–8°C biologics: mandates patient in-person</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">  delivery window confirmation before shipping</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Bench Pharmacist Interrupt Elimination</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Deflects 81.4% of "Is my prescription ready?"</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">  &amp; "Why did my copay go up?" phone interrupts</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#6ee7b7">• Reclaims 3.4 hours/day per retail pharmacy</text>

  <!-- Column 3: OBRA-90 RPh Clinical Boundary & Overdose Preemption -->
  <rect x="800" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="800" y="128" width="356" height="40" rx="12" fill="url(#rose449)"/>
  <text x="978" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    3. OBRA-90 RPh Counseling &amp; Overdose Preemption
  </text>

  <rect x="818" y="184" width="320" height="114" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="832" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">OBRA-90 Licensed Pharmacist (RPh) Gate</text>
  <text x="832" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Blocks AI from clinical drug-drug interaction</text>
  <text x="832" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  (DDI) clearance or pediatric weight dosing</text>
  <text x="832" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Enforces mandatory RPh offer to counsel on</text>
  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#fb7185">  new prescriptions, dose changes &amp; pregnancy</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">0ms Anaphylaxis &amp; Overdose Preemption</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Detects tongue swelling, hives, difficulty</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  breathing, or accidental double/pediatric dose</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• 0ms bridge to 911 / Poison Control (1-800-222-1222)</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">HIPAA Minimum-Necessary Pickup Privacy</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Requires DOB + ZIP + Last-4 Phone before status</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Masks HIV/Psych/Oncology drug names until</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#fda4af">  patient identity is 100% verified (Zero Leak)</text>

  <!-- Bottom Telemetry Bar -->
