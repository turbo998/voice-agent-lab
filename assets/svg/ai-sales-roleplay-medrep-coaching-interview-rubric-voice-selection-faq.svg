  <rect width="1280" height="760" fill="url(#bgGrad394)"/>
  <rect x="28" y="22" width="1224" height="74" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="22" width="8" height="74" rx="4" fill="url(#accentGrad394)"/>
  <text x="52" y="52" class="title">AI Sales Roleplay, Pharma MedRep Detailing &amp; Structured Interview Coaching Voice Architecture</text>
  <text x="52" y="76" class="subtitle">Anti-Sycophancy Buyer Persona Lock · FDA OPDP Off-Label &amp; Compliance Red-Flag Gate · EEOC / EU AI Act Bias-Free BARS Rubric</text>
  <rect x="984" y="38" width="248" height="32" rx="16" fill="#10B981"/>
  <text x="1000" y="59" class="badge">AI-SALES-MEDREP-ROLEPLAY-COACH-01</text>

  <!-- Left Column: Roleplay Scenarios & Persona State Machine -->
  <rect x="28" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="144" class="card-title">1. Multi-Persona Roleplay &amp; Detailing Deck</text>
  <text x="48" y="164" class="card-sub">B2B SaaS CFO · Skeptical Oncologist HCP · Hiring Panel</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">B2B Enterprise Sales (MEDDIC / Challenger)</text>
  <text x="64" y="224" class="body">• Simulates skeptical CFO, CISO or Procurement VP</text>
  <text x="64" y="242" class="body">• Injects dynamic price-cut pressure &amp; competitor FUD</text>
  <text x="64" y="260" class="mono">Persona_Resistance = High_Until_ROI_Quantified</text>

  <rect x="48" y="298" width="340" height="108" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="64" y="320" class="card-title">Pharma MedRep HCP e-Detailing (Veeva Vault)</text>
  <text x="64" y="340" class="body">• Busy physician with 3-minute hallway window</text>
  <text x="64" y="358" class="body">• Baits rep with off-label indication &amp; adverse-event traps</text>
  <text x="64" y="376" class="mono">Approved_Label = "FDA_PI_2026_Rev4_On_Label_Only"</text>

  <rect x="48" y="420" width="340" height="108" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="64" y="442" class="card-title">Structured Interview &amp; Language Coaching</text>
  <text x="64" y="462" class="body">• Behavioral STAR probing &amp; live case-study follow-ups</text>
  <text x="64" y="480" class="body">• CEFR C1/C2 grammar, pronunciation &amp; fluency feedback</text>
  <text x="64" y="498" class="mono">Evaluation_Standard = BARS_Evidence_Anchored</text>

  <rect x="48" y="542" width="340" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="64" y="564" class="card-title">LMS &amp; CRM Readiness Integration</text>
  <text x="64" y="584" class="body">• Mindtickle / Highspot / Workday Learning / Veeva CRM</text>
  <text x="64" y="602" class="body">• Blocks field territory launch until certification passed</text>
  <text x="64" y="620" class="mono">Field_Readiness_Gate = Score &gt;= 85% &amp; 0_Red_Flags</text>

  <!-- Center Column: 3-Layer Deterministic Coaching Gate -->
  <rect x="436" y="114" width="408" height="536" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <text x="456" y="144" class="card-title">2. Deterministic Persona, Off-Label &amp; Bias Gate</text>
  <text x="456" y="164" class="card-sub">Zero Sycophancy · 100% Off-Label Catch · EEOC Bias-Free</text>

  <rect x="456" y="182" width="368" height="136" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="472" y="204" class="card-title">Gate A: FDA OPDP Off-Label &amp; Compliance Hard Lock</text>
  <text x="472" y="224" class="body">• Detects off-label efficacy claims, unapproved dosing,</text>
  <text x="472" y="242" class="body">  missing Fair Balance risk disclosure or kickback hints</text>
  <text x="472" y="260" class="body">• Auto-fails certification on any regulatory red-line breach</text>
  <text x="472" y="280" class="mono">Off_Label_Promotion_Pass_Through = 0.0% (Hard Failed)</text>
  <text x="472" y="298" class="mono">Fair_Balance_ISI_Omission_Catch = 100.0%</text>

  <rect x="456" y="332" width="368" height="136" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="472" y="354" class="card-title">Gate B: Anti-Sycophancy Objection State Machine</text>
  <text x="472" y="374" class="body">• Prevents LLM from agreeing prematurely ("Great pitch!")</text>
  <text x="472" y="392" class="body">• Unlocks buyer agreement only after rep satisfies hidden</text>
  <text x="472" y="410" class="body">  objection checklist (Pain + Metric + Security + Champion)</text>
  <text x="472" y="430" class="mono">Premature_Buyer_Capitulation_Rate = 0.0%</text>
  <text x="472" y="448" class="mono">Persona_Jailbreak_Resistance = 100.0%</text>

  <rect x="456" y="482" width="368" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="472" y="504" class="card-title">Gate C: EEOC / EU AI Act Bias-Free Rubric Gate</text>
  <text x="472" y="524" class="body">• Strips regional accent, gender, age &amp; vocal pitch bias</text>
  <text x="472" y="542" class="body">  from competency scoring (NYC Local Law 144 / EU Annex III)</text>
  <text x="472" y="560" class="body">• Requires exact transcript timestamp quote for every</text>
  <text x="472" y="578" class="body">  rubric point; routes disputed scores to human enablement</text>
  <text x="472" y="600" class="mono">if (complianceBreachOrScoreDispute) -&gt; Enablement_Lead</text>
  <text x="472" y="618" class="mono">Inter_Rater_Reliability_Kappa = 0.94 (vs 0.61 Human)</text>

  <!-- Right Column: Dual-Model Coaching Architecture & ROI -->
  <rect x="872" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="892" y="144" class="card-title">3. Dual-Loop Actor/Critic &amp; Enablement ROI</text>
  <text x="892" y="164" class="card-sub">Fast Realtime Actor · Deep Rubric Critic · Ramp Speed</text>

  <rect x="892" y="182" width="340" height="126" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="908" y="204" class="card-title">Actor-Critic Dual-Model Split Architecture</text>
  <text x="908" y="224" class="body">• Actor (Realtime Voice): &lt;380ms emotional buyer persona</text>
  <text x="908" y="242" class="body">• Critic (Async Reasoning): Evaluates MEDDIC state &amp;</text>
  <text x="908" y="260" class="body">  injects next objection directive into Actor's system state</text>
  <text x="908" y="282" class="mono">Actor_Turn_Latency = 370ms | Critic_Rubric_Depth = 100%</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="908" y="346" class="card-title">Timestamped Coaching Scorecard &amp; Drill-Down</text>
  <text x="908" y="366" class="body">• Talk-to-listen ratio, filler-word frequency &amp; question depth</text>
  <text x="908" y="384" class="body">• Side-by-side "What You Said" vs "Gold-Standard Rewrite"</text>
  <text x="908" y="402" class="body">• Instant 30-second micro-drill retry on missed objection</text>
  <text x="908" y="424" class="mono">New_Rep_Quota_Ramp_Time = -41% Faster</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="908" y="498" class="card-title">Benchmark &amp; TCO Summary (10k 10-Min Drills)</text>
  <text x="908" y="520" class="body">• Manager 1-on-1 Roleplay: $450,000 / 10k sessions</text>
  <text x="908" y="538" class="body">• Actor-Critic Hybrid (Rec): $4,200 / 10k sessions ($0.42/ea)</text>
  <text x="908" y="556" class="body">• Full E2E Audio LLM: $11,500 + sycophancy drift risk</text>
  <text x="908" y="578" class="mono">Coaching_Cost_Reduction = -99% vs Human Manager Time</text>
  <text x="908" y="596" class="mono">Off_Label_Catch = 100% | Rubric_Kappa = 0.94</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateAiSalesMedrepRoleplayCoachingVoiceGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="696" class="card-title">Cloud &amp; AI Solution Architect Takeaway — AI Sales Roleplay, MedRep Detailing &amp; Interview Coaching</text>
  <text x="52" y="718" class="body">Decouple the fast emotional Buyer Actor from the deterministic Rubric Critic so the AI never caves in early or misses FDA Off-Label violations.</text>
</svg>
