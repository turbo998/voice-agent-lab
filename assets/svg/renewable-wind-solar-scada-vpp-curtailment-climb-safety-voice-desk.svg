  <rect width="1200" height="620" fill="url(#bg)" rx="16"/>
  <text x="40" y="48" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Renewable Wind/Solar SCADA, Virtual Power Plant (VPP) &amp; Climb Safety 24x7 Voice Desk (NERC CIP)</text>
