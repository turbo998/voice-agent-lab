  <rect x="340" y="105" width="490" height="475" rx="12" fill="url(#card)" stroke="#10b981" stroke-width="2"/>
  <text x="365" y="138" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. Deterministic GWO &amp; Grid Safety Engine (RENEWABLE-WIND-SOLAR-SCADA-VPP-01)</text>

