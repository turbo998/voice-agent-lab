<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg226" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card226" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg226)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Precision Oncology NGS, Molecular Pathology &amp; Genetic Counseling Voice Architecture</text>
  <text x="600" y="66" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">ACMG/AMP VUS Non-Actionable Hard Lock · CLIA/CAP Pathologist Sign-Off Gate · 0ms BRCA/Lynch Counselor Bridge (GENOMIC-PATHOLOGY-ACMG-VUS-01)</text>

  <!-- Left Column: Clinical & Patient Voice Touchpoints -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card226)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="166" y="122" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Genomics Voice Touchpoints</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Molecular Tumor Board (MTB)</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Somatic NGS panel (EGFR / ALK / KRAS)</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• HGVS cDNA/protein nomenclature STT</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• OncoKB / NCCN Level 1A lookup</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Patient Genetic Portal Voice</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Carrier screening &amp; pharmacogenomics</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pre-test informed consent walkthrough</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Specimen tracking &amp; turnaround ETA</text>

  <rect x="56" y="394" width="220" height="222" rx="8" fill="#31102f" stroke="#f43f5e"/>
  <text x="166" y="420" fill="#fda4af" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">High-Risk Germline Findings</text>
  <text x="166" y="444" fill="#ffe4e6" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• BRCA1/2, TP53 (Li-Fraumeni), MLH1</text>
  <text x="166" y="464" fill="#ffe4e6" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ACMG Secondary Findings (SF v3.2)</text>
  <text x="166" y="484" fill="#ffe4e6" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Variant of Uncertain Significance (VUS)</text>
  <text x="166" y="504" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Zero autonomous surgical advice</text>
  <text x="166" y="532" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Certified Genetic Counselor (CGC)</text>

  <!-- Center Column: GENOMIC-PATHOLOGY-ACMG-VUS-01 Guardrail Engine -->
  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card226)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic ACMG &amp; CLIA Safety Engine (GENOMIC-PATHOLOGY-ACMG-VUS-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: ACMG/AMP VUS (Class 3) Non-Actionability Hard Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces strict 5-tier ACMG classification (Pathogenic to Benign)</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks LLM from treating Class 3 VUS as a positive disease diagnosis</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Prohibits recommending prophylactic surgery or off-label therapy on VUS</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Mandates ACMG guideline statement: "A VUS should not be used in clinical decision-making"</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: CLIA/CAP Board-Certified Pathologist Sign-Off Gate</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Verifies HL7 FHIR Genomics DiagnosticReport status == "final"</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks spoken disclosure of preliminary BAM/VCF pipeline calls</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Pins HGVS variant syntax (e.g., EGFR c.2573T&gt;G p.Leu858Arg) 1:1</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents codon/exon swap hallucinations during Molecular Tumor Board readouts</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Pathogenic Germline &amp; Patient Distress Escalation</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects Class 4/5 Pathogenic germline findings (BRCA1/2, Lynch, TP53)</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks cold automated voice delivery of hereditary cancer syndrome results</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Bridges in 0ms to Board-Certified Genetic Counselor (ABGC) with pedigree</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full GINA (Genetic Information Nondiscrimination Act) &amp; HIPAA WORM audit trail</text>

  <!-- Right Column: Genomics Systems & Knowledge Bases -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card226)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1034" y="122" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. LIMS &amp; Genomic Databases</text>

  <rect x="924" y="142" width="220" height="145" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="1034" y="166" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EHR &amp; Molecular LIMS</text>
  <text x="1034" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Epic Beaker Genomics / Cerner</text>
  <text x="1034" y="210" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• HL7 FHIR Genomics Reporting</text>
  <text x="1034" y="230" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• CLIA / CAP digital signature</text>
  <text x="1034" y="250" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Specimen chain-of-custody</text>

  <rect x="924" y="302" width="220" height="150" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="1034" y="326" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Curated Variant Evidence</text>
  <text x="1034" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ClinVar / ClinGen Expert Panels</text>
  <text x="1034" y="370" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• OncoKB / CIViC Somatic Tiers</text>
  <text x="1034" y="390" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• CPIC Pharmacogenomics (PGx)</text>
  <text x="1034" y="410" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Zero unverified preprint RAG</text>

  <rect x="924" y="468" width="220" height="148" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="1034" y="492" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Genetic Counseling Desk</text>
  <text x="1034" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ABGC Certified Counselors</text>
  <text x="1034" y="536" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 3-generation family pedigree</text>
  <text x="1034" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cascade testing coordination</text>
  <text x="1034" y="576" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">• 100% CLIA &amp; ACMG Compliance</text>
</svg>
