  <text x="435" y="180" class="node-title">联邦刑法 26 U.S.C. § 7216 零外泄与零交叉营销</text>
  <text x="435" y="200" class="node-sub">• 法规: 违规将报税数据用于大模型训练或推销理财/房贷属刑事犯罪!</text>
  <text x="435" y="218" class="node-sub">• 100% 锁定境内主权节点 + 零数据留存 (ZDR) + 严禁跨业务读取</text>
  <text x="435" y="236" class="node-sub">• 未签署独立法定格式《§7216 披露同意书》前 0% 权限转介财富顾问</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">IRS Publication 4557 &amp; FTC Safeguards (WISP)</text>
  <text x="435" y="306" class="node-sub">• 查退税额或 AGI 前强制多因子认证 (MFA + 上年度 AGI 校验)</text>
  <text x="435" y="324" class="node-sub">• 拦截黑客假冒客户骗取含全套 SSN 的往年 1040 税表 PDF</text>
  <text x="435" y="342" class="node-sub">• 通话录音与转写自动打码 SSN / EIN / 银行路由号</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">离岸处理强制书面告知锁 (Offshore Disclosure)</text>
  <text x="435" y="412" class="node-sub">• 严格限制语音与 OCR 推理全链路位于本国主权机房区域内</text>
  <text x="435" y="430" class="node-sub">• 规避跨国节点路由触发的 §301.7216-3 违规风险</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">夫妻联合报税 (MFJ) 双人独立签名核验</text>
  <text x="435" y="510" class="node-sub">• 严禁配偶一方代签另一方的 Form 8879 电子报税授权</text>

