  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① 税季洪峰进度自查与 1.9s 税表缺件视觉核验</text>

  <rect x="46" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">解放 $350/h 注册会计师 32% 的催资料时间</text>
  <text x="60" y="200" class="node-sub">• 4月15日/10月15日税季前夕来电暴涨 10 倍查进度与问缺件</text>
  <text x="60" y="218" class="node-sub">• 实时对接 CCH Axcess / UltraTax / Canopy 播报报税卡点</text>
  <text x="60" y="236" class="node-sub">• 精准提示:“您的报税单目前仅差摩根士丹利 1099-B 与合伙企业 K-1”</text>

  <rect x="46" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="282" class="node-title">1.9 秒税表年份、页数与草稿水印视觉拦截</text>
  <text x="60" y="302" class="node-sub">• 痛点: 客户经常把 2024 年旧 W-2 当成 2025 年传上来，或漏传 K-1 附表</text>
  <text x="60" y="320" class="node-sub">• 通话中发送加密拍照链接，1.9s 校验税表年份、EIN 与全部页码</text>
  <text x="60" y="338" class="node-sub">• 发现误传旧年份或券商月度预览草稿 (Draft) 当场语音提醒重传</text>

  <rect x="46" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="386" class="node-title">报税截止前 48 小时 Form 8879 陪签冲刺</text>
  <text x="60" y="406" class="node-sub">• 报税表编妥后若客户迟迟未签电子授权书 (`IRS Form 8879`)</text>
  <text x="60" y="424" class="node-sub">• 主动致电陪同完成 KBA 知识问答认证与夫妻双方电子签名</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">自动申请 6 个月延期报税 (Form 4868 / 7004)</text>
