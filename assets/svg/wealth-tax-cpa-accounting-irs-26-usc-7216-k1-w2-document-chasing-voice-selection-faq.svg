  <text x="849" y="302" class="node-sub">• 客户惊慌收到税务局信件来电时，短信拍照识别右上角通知代码</text>
  <text x="849" y="320" class="node-sub">• 区分常规地址核对信 vs `CP2000 少报收入补税` vs `CP504 资产扣押`</text>
  <text x="849" y="338" class="node-sub">• 自动提取法定 30 天答复截止日，高危稽查信秒级直通税务争议合伙人</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">季度预缴税 (1040-ES) 与企业发薪日自动提醒</text>
  <text x="849" y="406" class="node-sub">• 4/6/9/1 月四个季度预缴税节点主动外呼个体户与高管缴纳</text>
  <text x="849" y="424" class="node-sub">• 帮客户免除 IRS 少缴预估税罚息 (Underpayment Penalty)</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (CPA-TAX-IRS-7216-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截无 §7216 签字跨业推销、错误年份税表入库与违规避税承诺</text>
  <text x="849" y="518" class="node-sub">• CP504/LT11 强制执行扣押信 0ms 直通持证 CPA / EA</text>

