<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg305" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card305" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg305)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1224" height="78" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="48" y="54" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">
    Full-Duplex Barge-In, Semantic EoT &amp; Slow-API Async Filler Architecture (DUPLEX-BARGEIN-SEMANTIC-EOT-ASYNC-FILLER-01)
  </text>
  <text x="48" y="81" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">
    Silero VAD + 18ms Semantic EoT Model · 700ms Non-Promissory Filler Metronome · Turn-Epoch Stale-Callback Write Fence
  </text>

  <!-- Left Column: Audio Duplex & Turn-Taking Signals -->
  <rect x="28" y="118" width="290" height="465" rx="12" fill="url(#card305)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="148" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    1. Duplex Audio &amp; VAD Signals
  </text>

  <rect x="46" y="166" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Acoustic VAD (Silero / WebRTC)</text>
  <text x="60" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 20ms frame speech probability</text>
  <text x="60" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• AEC reference echo subtraction</text>

  <rect x="46" y="266" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">18ms Semantic EoT Classifier</text>
  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Smart-Turn / LiveKit EoT transformer</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Dynamic patience: 220ms vs 1,400ms</text>

  <rect x="46" y="366" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="390" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Slow ERP / RAG Tool Bridge</text>
  <text x="60" y="411" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Legacy SAP / Mainframe (3s–8s RTT)</text>
  <text x="60" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 700ms filler + 3.5s progress heartbeat</text>

  <rect x="46" y="466" width="254" height="98" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="490" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Duplex Quality Metrics</text>
  <text x="60" y="511" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• False Cut-In on Digit Readout: &lt;1.1%</text>
  <text x="60" y="530" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Barge-In Audio Stop: &le;160ms P95</text>
  <text x="60" y="549" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Stale Tool Write Leaks: 0.00%</text>

  <!-- Center Column: 3 Deterministic Duplex & Async Orchestration Gates -->
  <rect x="338" y="118" width="584" height="465" rx="12" fill="url(#card305)" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="148" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    2. Deterministic Turn-Taking &amp; Async Tool State Machine
  </text>

  <!-- Gate 1 -->
  <rect x="358" y="166" width="544" height="122" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="376" y="191" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate A · Syntactic Clause-Complete EoT &amp; Backchannel Filter Lock
  </text>
  <text x="376" y="214" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Hard Rule: Never interrupt a caller pausing mid-clause ("My order number is... uh...")!
  </text>
  <text x="376" y="235" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Extends VAD silence window to 1,400ms on trailing conjunctions or partial digit strings
  </text>
  <text x="376" y="256" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Filters &lt;350ms backchannels ("uh-huh", "right", "嗯") so AI continues speaking smoothly
  </text>
  <text x="376" y="275" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Eliminates premature AI cut-ins during number readouts &amp; awkward stops on "uh-huh"
  </text>

  <!-- Gate 2 -->
  <rect x="358" y="302" width="544" height="122" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="376" y="327" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate B · 700ms Non-Promissory Async Filler &amp; Turn-Epoch Write Fence
  </text>
  <text x="376" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • At 700ms tool wait: Plays neutral filler ("Let me pull up your order...")—zero outcome promise!
  </text>
  <text x="376" y="371" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Increments turnEpoch++ on every valid user barge-in (&ge;2 words or stop command)
  </text>
  <text x="376" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Drops or Saga-rolls-back any slow ERP response where requestEpoch !== currentTurnEpoch
  </text>
  <text x="376" y="411" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Eliminates 5-second dead air ("Hello? Are you still there?") &amp; zombie tool overwrites
  </text>

  <!-- Gate 3 -->
  <rect x="358" y="438" width="544" height="126" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="376" y="463" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate C · 0ms Acoustic Self-Echo Breaker &amp; &gt;8s Async SMS Fallback
  </text>
  <text x="376" y="486" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Triggers on TTS-to-ASR n-gram acoustic echo match OR legacy API timeout &gt; 8.0 seconds
  </text>
  <text x="376" y="507" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • 0ms Echo Breaker: Suppresses self-interruption when caller uses mobile speakerphone
  </text>
  <text x="376" y="528" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • &gt;8s ERP Timeout: Pivots to async background worker + instant SMS/WhatsApp result push
  </text>
  <text x="376" y="549" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Prevents speakerphone self-barge-in loops &amp; keeps call moving when mainframes lag
  </text>

  <!-- Right Column: Orchestration Runtime & Backend -->
  <rect x="942" y="118" width="310" height="465" rx="12" fill="url(#card305)" stroke="#10b981" stroke-width="1.5"/>
  <text x="962" y="148" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    3. Duplex Runtime &amp; ERP Bus
  </text>

  <rect x="962" y="168" width="270" height="92" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="978" y="193" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">LiveKit / Pipecat Turn Detector</text>
  <text x="978" y="214" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• ONNX CPU inference (&lt;18ms)</text>
  <text x="978" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Acoustic + lexical end-of-turn score</text>

  <rect x="962" y="276" width="270" height="92" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="978" y="301" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Async Filler Metronome</text>
  <text x="978" y="322" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• T+700ms: Pre-cached filler audio</text>
  <text x="978" y="342" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• T+3500ms: Soft keyboard/progress chime</text>

  <rect x="962" y="384" width="270" height="92" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="978" y="409" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Turn-Epoch Saga Coordinator</text>
  <text x="978" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Monotonic epoch counter per session</text>
  <text x="978" y="450" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Idempotency key + compensating undo</text>

  <rect x="962" y="492" width="270" height="72" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="978" y="517" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">OpenTelemetry Waterfall Trace</text>
  <text x="978" y="538" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• VAD -&gt; EoT -&gt; Tool -&gt; First-Audio spans</text>

  <!-- Bottom Sequence Strip -->
  <rect x="28" y="600" width="1224" height="136" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="628" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    End-to-End Duplex Turn-Taking &amp; Slow-API Async Sequence (160ms Barge-In Stop / 700ms Zero-Dead-Air Filler)
  </text>

  <rect x="48" y="644" width="275" height="74" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="62" y="666" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">1. Semantic EoT Patience</text>
  <text x="62" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Caller pauses 950ms mid-card-number</text>
  <text x="62" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Holds turn open up to 1,400ms (0 cut-in)</text>

  <rect x="343" y="644" width="285" height="74" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="357" y="666" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">2. 700ms Non-Promissory Filler</text>
  <text x="357" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">SAP ERP query takes 4.2 seconds</text>
  <text x="357" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Plays "Checking your order now..." at 700ms</text>

  <rect x="648" y="644" width="285" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="662" y="666" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">3. Barge-In Epoch Fence</text>
  <text x="662" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Caller says "Wait, cancel that!" at 2.1s</text>
  <text x="662" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Bumps epoch=5 &amp; drops stale epoch=4 result</text>

  <rect x="953" y="644" width="279" height="74" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="967" y="666" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">4. Duplex UX &amp; Cost Efficiency</text>
  <text x="967" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">160ms stop · 0 dead air · $520/10k min</text>
  <text x="967" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Cuts false barge-ins by -89% across PSTN</text>
</svg>
