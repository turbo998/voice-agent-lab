  <rect width="1200" height="680" fill="url(#bg233)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Biopharma Grade A/B Cleanroom, CAR-T &amp; GMP eBR Voice Execution Architecture</text>
  <text x="600" y="66" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">FDA 21 CFR Part 11 ALCOA+ Lock · Four-Eyes Second-Verifier Gate · 0ms Sterility Breach &amp; CAPA Hold (BIOPHARMA-CLEANROOM-EBR-GMP-01)</text>

  <!-- Left Column: Grade A/B Isolator & Bioreactor Suite -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card233)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="166" y="122" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Cleanroom Hands-Free</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Grade A/B Aseptic Isolator</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hands inside sterile glove ports</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Autoclaved VHP-safe bone-conduction</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Zero touchscreen shedding risk</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CAR-T Vein-to-Vein &amp; Media</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Autologous Chain of Identity (COI)</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Mettler Toledo scale tare &amp; net weight</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Viable cell density &amp; pH logging</text>

  <rect x="56" y="394" width="220" height="222" rx="8" fill="#450a0a" stroke="#ef4444"/>
