<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgTax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0A1222"/>
    </linearGradient>
    <linearGradient id="payrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="fsscGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cpaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgTax)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="22" font-weight="700">Enterprise Payroll, Financial Shared Services (FSSC) &amp; CPA Tax Advisory Voice AI</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">全球薪酬发薪 (Payroll)、财务共享报销审单 (FSSC) 与财税事务所 (CPA) 实时语音助手选型与合规架构全景图</text>
  <rect x="912" y="42" width="240" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1032" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">FIN-TAX-CPA-01 · Zero-Fraud</text>

  <!-- Pillar 1: Global Payroll Inquiry & Direct-Deposit Anti-Fraud Lock -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#payrollGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 发薪日工资条解释与防工资卡篡改铁锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="82" fill="#7DD3FC" font-size="13" font-weight="700">每月发薪日 (Payday) 10倍话务洪峰秒级消化</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 员工问：“为什么这个月实发工资比上个月少了 680 块？”</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 确定性对比两期工资条 JSON：精准解释累计个税跳档/社保调基</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="174" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁纯口头修改工资卡号 (Direct-Deposit Fraud)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 黑客高频冒充员工/高管来电：“我换银行卡了，下月工资打新卡”</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 硬锁：电话内 100% 物理阻断改工资卡，强制走 Workday/ADP FIDO2</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">蓝领/灵活用工周薪结算与电子工资单推送</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 支持多语种/方言核对工时卡 (Timesheet) 与加班倍率</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 严禁大模型心算个税，100% 调用薪资引擎精算 API</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">发薪日 HR/薪酬专线排队时长从 22分 降至 0秒</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">社工盗改工资卡资金损失率锁死在 0.0%</text>
  </g>

  <!-- Pillar 2: FSSC Expense Audit, E-Invoice Tax ID & Vendor AP -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#fsscGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 财务共享中心 (FSSC) 报销审单与应付对账</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">18位统一社会信用代码 (GB 32100) 校验锁</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 自动禁用易混字母 `I/O/Z/S/V` + Mod-31 校验位核验</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 语音询问开票信息后，0秒向微信/短信同步下发一键复制开票卡</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">报销单退回原因秒级解释 (SAP Concur / 费控)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 员工问：“为什么我的差旅报销单被财务退回了？”</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• AI 直读审单引擎：“第3张酒店水单非数电发票，且超一线城市标准 80元”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">供应商应付账款 (AP) 催款查询与三单匹配</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 供应商来电查货款：自动比对 PO 采购单 + GR 入库单 + 发票</text>
    <text x="30" y="308" fill="#A7F3D0" font-size="12">• 清晰播报预计付款批次日期，释放财务会计 74% 接电话时间</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">发票税号开错退票率从 11.4% 降至 0.1%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">财务共享中心单张单据沟通成本降低 81%</text>
  </g>

  <!-- Pillar 3: CPA Tax Season Triage & Circular 230 Compliance -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#cpaGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 财税事务所 (CPA) 报税季接待与合规围栏</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#2E1065" stroke="#7C3AED"/>
    <text x="30" y="82" fill="#E9D5FF" font-size="13" font-weight="700">报税季 (Tax Season) 资料收集与缺件追缴</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 自动外呼/接听核对 W-2 / 1099 / 个税专项附加扣除凭证</text>
    <text x="30" y="122" fill="#C084FC" font-size="12">• 通话中向客户手机推送加密上传链接收集银行对账单</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="174" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁无保留承诺“包退税金额/避税方案”</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 遵守 IRS Circular 230 与涉税专业服务监管红线</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 仅播报确定性税法条款，复杂跨境避税强制转持证注册会计师</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">税法年度版本硬绑定 (Tax-Year Version Lock)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• RAG 检索强制校验 `tax_year == 2026` 与管辖税局地区</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 杜绝拿 2023 年过期起征点或抵扣限额回答今年报税问题！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#2E1065" stroke="#A855F7"/>
    <text x="178" y="356" fill="#E9D5FF" font-size="13" font-weight="700" text-anchor="middle">注册会计师 (CPA) 报税季有效工时释放 +38%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合 IRS section 7216 纳税人数据授权规范</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#34D399" font-size="14" font-weight="700">架构师核心选型法则 (FIN-TAX-CPA-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 薪资与报销查询严禁让大模型心算加减法（100% 调用 Workday/ADP/SAP Concur 确定性工资条与三单匹配对比 API）；</text>
  <text x="68" y="606" fill="#38BDF8" font-size="13">2. 电话通道 100% 物理封死“修改工资卡号/供应商收款账户”（防社工电诈），且税法 RAG 必须强制锁定当前报税年度与管辖地。</text>
</svg>
