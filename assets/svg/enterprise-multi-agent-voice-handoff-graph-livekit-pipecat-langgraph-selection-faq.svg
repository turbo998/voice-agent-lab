  </text>
  <text x="545" y="592" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#34d399">
    Tool Accuracy: 61% → 97.6% • Handoff Latency: 42ms • Prompt TCO: -58.4% (-$268k/10k)
  </text>
  <text x="68" y="618" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#94a3b8">
    Guardrail ID: evaluateMultiAgentVoiceSwarmOrchestration2026Guard • Policy: MULTI-AGENT-VOICE-SWARM-ORCHESTRATION-2026-01
