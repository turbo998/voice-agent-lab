  <rect width="1200" height="680" fill="url(#bg496m)"/>
  <rect x="24" y="20" width="1152" height="640" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="44" y="38" width="1112" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="68" font-family="Segoe UI, Inter, sans-serif" font-size="19.5" font-weight="700" fill="#f8fafc">
    Enterprise Multi-Agent Voice Swarm &amp; Sub-Agent Handoff Graph (LiveKit / Pipecat / LangGraph)
  </text>
  <text x="68" y="94" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94a3b8">
    &lt;=6 Tools per Specialist (97.6% Tool Accuracy) • 42ms Silent Single-Persona Swap • Prerequisite Auth Lock &amp; Anti-Ping-Pong Breaker
  </text>
  <rect x="896" y="52" width="240" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1016" y="75" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">
    MULTI-AGENT-SWARM-2026-01
  </text>

  <!-- Column 1: Breaking the Monolithic 80-Tool Prompt -->
  <rect x="44" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="44" y="128" width="356" height="40" rx="12" fill="url(#cyan496m)"/>
  <text x="222" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. Scoped Specialist Graph (&lt;=6 Tools/Node)
  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Eliminating 80-Tool Megaprompt Collapse</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Stuffing 80 tools &amp; 12,000 prompt tokens into</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  one voice LLM degrades tool accuracy to 61%</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Decomposes into Triage, Billing, Tech &amp; Save</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">  specialists (&lt;=6 tools/node -> 97.6% accuracy!)</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">42ms Silent Single-Persona Handoff</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Swaps active system prompt &amp; toolset in RAM</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  in 42ms while keeping the SAME WebRTC/SIP</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  socket &amp; identical TTS brand voice persona</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#38bdf8">• Zero fake hold music or "transferring you to..."</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="76" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">-58.4% Per-Turn Prompt Token Burn</text>
  <text x="76" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Each turn sends only 800 scoped tokens instead</text>
  <text x="76" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">  of a 12,000-token enterprise megaprompt</text>
  <text x="76" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#7dd3fc">• Shaves 210ms off LLM Time-To-First-Token</text>

  <!-- Column 2: Prerequisite Auth Contract & Anti-Ping-Pong Breaker -->
  <rect x="422" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="422" y="128" width="356" height="40" rx="12" fill="url(#rose496m)"/>
  <text x="600" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. Auth Contract &amp; Anti-Ping-Pong Breaker
  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">Prerequisite Auth Contract Gate</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• High-privilege nodes (Billing Refund / Retention</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Save / Card Lock) cannot be entered unless</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Triage Agent has set kyc_token_signed = true!</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">• 0% prompt-injected bypass to refund tools</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Anti-Ping-Pong Loop Breaker (&lt;=2 Hops)</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Tracks directed graph edge visits: if Billing</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Agent hands back to Tech Agent &amp; Tech hands</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  back to Billing (&gt;2 hops without tool commit)</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• 0ms breaks loop &amp; escalates to human specialist</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">Compound Multi-Intent Stack Execution</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Caller asks "Fix my Wi-Fi AND credit my bill"</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" fill="#ffe4e6">• Pushes [Tech_Node, Billing_Node] onto intent</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">  queue so second request is never forgotten!</text>

  <!-- Column 3: Framework Comparison (LiveKit Agents vs Pipecat Flows vs LangGraph) -->
  <rect x="800" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#059669" stroke-width="1.5"/>
  <rect x="800" y="128" width="356" height="40" rx="12" fill="url(#emerald496m)"/>
  <text x="978" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
