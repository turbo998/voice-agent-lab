<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg230" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07130d"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card230" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg230)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Veterinary Emergency Triage, Livestock Biosecurity &amp; FARAD Withdrawal Voice Architecture</text>
  <text x="600" y="66" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">FDA/FARAD Meat &amp; Milk Drug Withdrawal Lock · VCPR &amp; Species Toxicity Gate · 0ms WOAH Notifiable Disease Quarantine (VET-LIVESTOCK-BIOSECURITY-VCPR-01)</text>

  <!-- Left Column: Livestock Barn, Dairy Parlour & Pet ER -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card230)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="166" y="122" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Farm &amp; Clinic Channels</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#4ade80"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Swine / Dairy Barn Hands-Free</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Shower-in biosecurity zone intercom</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• RFID ear-tag &amp; treatment logging</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Milk tank dump / hold verification</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">24×7 Companion Animal ER Line</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Banfield / VCA / BluePearl triage</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Canine GDV bloat &amp; toxin ingestion</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Post-op recovery check-in calls</text>

  <rect x="56" y="394" width="220" height="222" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="166" y="420" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Biosecurity &amp; Toxin Red Lines</text>
  <text x="166" y="444" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ASF / FMD / HPAI H5N1 herd mortality</text>
  <text x="166" y="464" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Prohibited drugs (Chloramphenicol)</text>
  <text x="166" y="484" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Feline Acetaminophen / Permethrin</text>
  <text x="166" y="504" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Canine Xylitol &amp; caustic emesis ban</text>
  <text x="166" y="532" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0ms State Vet &amp; ER DVM Bridge</text>

  <!-- Center Column: VET-LIVESTOCK-BIOSECURITY-VCPR-01 Guardrail Engine -->
  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card230)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic FARAD, VCPR &amp; WOAH Engine (VET-LIVESTOCK-BIOSECURITY-VCPR-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: FDA/FARAD Meat &amp; Milk Drug Withdrawal Interval Hard Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Cross-checks RFID ear-tag treatment history before slaughter/milk release</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks shipment if active antibiotic/NSAID withdrawal window is unexpired</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• 100% blocks extra-label banned drugs in food animals (Fluoroquinolones, etc.)</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Automatically flags bulk milk tank divert valve when treated dairy cow enters parlor</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: VCPR Prescription &amp; Cross-Species Toxicity Hard Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Requires active Veterinarian-Client-Patient Relationship (VCPR) + DVM sign-off</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Hard-blocks human OTC painkillers (Acetaminophen/Ibuprofen) for cats &amp; dogs</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks home hydrogen-peroxide emesis in cats or after caustic/hydrocarbon ingestion</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Verifies exact species, body weight (kg), and Veterinary Feed Directive (VFD) validity</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms WOAH Class-A Epizootic Quarantine &amp; ER Vet Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects African Swine Fever (ASF), Foot-and-Mouth (FMD), HPAI H5N1, or Rabies</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Freezes livestock movement permits in 0ms &amp; locks barn biosecurity gates</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Bridges Chief Veterinary Officer (USDA APHIS / WOAH) or Emergency DVM</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full FDA CVM 21 CFR Part 530, VFD &amp; National Animal Health WORM audit log</text>

  <!-- Right Column: Herd ERP, FARAD DB & Veterinary Authorities -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card230)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1034" y="122" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. Herd ERP &amp; Vet Systems</text>

  <rect x="924" y="142" width="220" height="145" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="1034" y="166" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Herd &amp; Dairy Management</text>
  <text x="1034" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• DeLaval DelPro / DairyComp 305</text>
  <text x="1034" y="210" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ISO 11784/11785 RFID Ear-Tag</text>
  <text x="1034" y="230" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• FARAD Withdrawal Calculator</text>
  <text x="1034" y="250" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Slaughterhouse Cert Lock</text>

  <rect x="924" y="302" width="220" height="150" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="1034" y="326" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Veterinary PIMS &amp; Toxicology</text>
  <text x="1034" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• IDEXX Neo / Covetrus / ezyVet</text>
  <text x="1034" y="370" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ASPCA Animal Poison Control DB</text>
  <text x="1034" y="390" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Species-specific mg/kg matrix</text>
  <text x="1034" y="410" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Zero human-OTC crossover</text>

  <rect x="924" y="468" width="220" height="148" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="1034" y="492" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Epizootic &amp; ER Command</text>
  <text x="1034" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• WOAH / USDA APHIS / MARA</text>
  <text x="1034" y="536" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms Barn Movement Quarantine</text>
  <text x="1034" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 24x7 Emergency DVM On-Call</text>
  <text x="1034" y="576" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">• 100% Food-Safety &amp; VCPR Safe</text>
</svg>
