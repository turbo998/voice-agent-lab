<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg235" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card235" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg235)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Commercial Trucking FMCSA ELD Hours-of-Service, HazMat Tunnel &amp; In-Cab Voice Copilot</text>
  <text x="600" y="66" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">49 CFR Part 395 ELD HOS Anti-Tamper Lock · 13'6&quot; Bridge &amp; HazMat Tunnel Gate · 0ms Air-Brake &amp; CHEMTREC Bridge (TRUCKING-ELD-HOS-HAZMAT-01)</text>

  <!-- Left Column: Class-8 Tractor Cab & Driver Workflows -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card235)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="166" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Class-8 In-Cab Touchpoints</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#fbbf24"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hands-Free ELD &amp; DVIR Voice</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Samsara / Motive / Geotab ELD</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Walk-around pre-trip DVIR voice</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• J1939 CAN bus speed &gt;5 mph lock</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Commercial Truck Routing</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 13'6&quot; (4.15m) low-bridge clearance</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 80,000 lb GVW axle weight limits</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Overnight truck-stop parking reserve</text>

  <rect x="56" y="394" width="220" height="222" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="166" y="420" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Highway &amp; HazMat Emergencies</text>
  <text x="166" y="444" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Air brake pressure &lt;60 PSI / runaway</text>
  <text x="166" y="464" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Trailer wheel-end thermal fire</text>
  <text x="166" y="484" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• UN HazMat tanker leak / rollover</text>
  <text x="166" y="504" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Jackknife / cargo shift alarm</text>
  <text x="166" y="532" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0ms Runaway Ramp &amp; CHEMTREC</text>

  <!-- Center Column: TRUCKING-ELD-HOS-HAZMAT-01 Guardrail Engine -->
  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card235)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic FMCSA ELD &amp; HazMat Engine (TRUCKING-ELD-HOS-HAZMAT-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: FMCSA 49 CFR Part 395 ELD Hours-of-Service Hard Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces 11-hr driving limit, 14-hr duty window, and 30-min rest break</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% blocks voice requests to edit engine-recorded driving time ("Line 3")</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks dispatcher coercion to abuse "Personal Conveyance" for loaded freight</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Auto-routes driver to nearest verified truck stop 45 minutes before HOS clock expires</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: Bridge Clearance (13'6&quot;) &amp; ADR/DOT HazMat Tunnel Hard Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Never uses consumer car navigation (Google/Apple car mode) for Class-8 rigs</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Verifies trailer height, bridge weight limits &amp; HazMat placard class (UN #)</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks routing flammable/toxic tankers into restricted tunnels or watersheds</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Holds out-of-service vehicle if Pre-Trip DVIR flags steering, tire, or brake defect</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Air-Brake Loss, Runaway Grade &amp; CHEMTREC Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects J1939 primary/secondary air pressure &lt;60 PSI, brake fade, or spill</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Speaks 0ms distance/bearing to nearest Runaway Truck Ramp on mountain grades</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Bridges 911 &amp; CHEMTREC with UN four-digit HazMat ID and ERG guide number</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full FMCSA 49 CFR Parts 392/395/396, ADR &amp; DOT PHMSA WORM audit log</text>

  <!-- Right Column: J1939 Telematics, Commercial GIS & Safety Desk -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card235)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1034" y="122" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. ELD, GIS &amp; HazMat Desk</text>

  <rect x="924" y="142" width="220" height="145" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="1034" y="166" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SAE J1939 / ELD Gateway</text>
  <text x="1034" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Samsara / Motive / Omnitracs</text>
  <text x="1034" y="210" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hardware-locked Engine Hours</text>
  <text x="1034" y="230" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 49 CFR § 392.82 Hands-Free UI</text>
  <text x="1034" y="250" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Roadside DOT inspection transfer</text>

  <rect x="924" y="302" width="220" height="150" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="1034" y="326" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PC*MILER / Trimble Truck GIS</text>
  <text x="1034" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Verified bridge clearance DB</text>
  <text x="1034" y="370" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• National HazMat Route Registry</text>
  <text x="1034" y="390" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Mountain grade &amp; runaway ramps</text>
  <text x="1034" y="410" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Weigh-station PrePass bypass</text>

  <rect x="924" y="468" width="220" height="148" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="1034" y="492" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CHEMTREC &amp; Fleet Safety</text>
  <text x="1034" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ERG 2024 Isolation Zone Calc</text>
  <text x="1034" y="536" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Anti-coercion whistleblower log</text>
  <text x="1034" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Reefer cold-chain temp alarm</text>
  <text x="1034" y="576" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">• Zero Low-Bridge &amp; HOS Violations</text>
</svg>
