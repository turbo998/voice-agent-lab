  <text x="357" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Tech in main gear bay or 1 socket out</text>
  <text x="357" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Blocks 5,000 psi cart &amp; panel closeout</text>

  <rect x="648" y="644" width="285" height="74" rx="8" fill="#10b981" stroke="#10b981" stroke-width="1.2" fill-opacity="0.15"/>
  <text x="662" y="666" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">3. 0ms LiDAR Breach / Jack Skew</text>
