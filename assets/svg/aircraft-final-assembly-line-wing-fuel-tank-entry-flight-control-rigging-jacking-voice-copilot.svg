  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Jet-A1/MEK LEL (&le;10%) &amp; O2 probe</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Airframe earth (&lt;1.0 &Omega;) &amp; Venturi horn</text>

