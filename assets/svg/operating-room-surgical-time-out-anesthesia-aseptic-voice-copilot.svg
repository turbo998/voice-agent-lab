  <text x="600" y="340" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: rfidSpongeAndSharpsCountReconciled === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks final wound-closure sign-out if spoken sponge/needle/instrument</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  counts or Stryker SurgiCount RFID wand totals have any discrepancy!</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Automatically orders intraoperative portable C-arm X-ray on count mismatch</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: 0ms MTP Hemorrhage &amp; Malignant Hyperthermia Crisis Bridge</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: intraoperativeHemorrhageMtpOrMalignantHyperthermia === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets emergencyBloodBankMtpAndCodeCartTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Alerts Blood Bank for 6:6:1 RBC/FFP/Platelets MTP cooler in 0ms and</text>
