  <rect x="835" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="282" class="node-title">海事救生紧急代码 (Code Alpha / Oscar) 0ms 直通</text>
  <text x="849" y="302" class="node-sub">• 识别到落水 (Man Overboard)、舱房烟雾或胸痛晕厥呼叫</text>
  <text x="849" y="320" class="node-sub">• 0ms 强插驾驶台 (Bridge) 与船医中心并自动定位分机客舱号</text>
  <text x="849" y="338" class="node-sub">• 急性肠胃炎 (诺如病毒 Norovirus) 自动触发隔离送餐与感控上报</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">同舱室多住客分账与未成年人挂账锁 (Folio Lock)</text>
  <text x="849" y="406" class="node-sub">• 拦截熊孩子在舱内用语音乱订 $400 龙虾香槟或付费岸上游</text>
  <text x="849" y="424" class="node-sub">• 校验主卡持有人语音 PIN 码与单日消费限额，下船零账单争吵</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (CRUISE-THEMEPARK-EDGE-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截晚于开船前60m的岸上游预订、未成年越权挂账与走失延误</text>
  <text x="849" y="518" class="node-sub">• 卫星断网自动 0ms 无感运行船端边缘大模型集群</text>

