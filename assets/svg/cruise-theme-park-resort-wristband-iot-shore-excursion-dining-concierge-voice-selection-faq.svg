  <text x="435" y="306" class="node-sub">• 户外过山车因雷暴临时停运时，数万游客同时涌入改签</text>
  <text x="435" y="324" class="node-sub">• 自动发放全园通用闪电通道代用券 (Multi-Experience Pass)</text>
  <text x="435" y="342" class="node-sub">• 结合全园热力图智能引导分流至室内剧场与冷门游乐区</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">特色牛排馆/主厨餐桌 120s 原子锁位增收</text>
  <text x="435" y="412" class="node-sub">• Redis 120 秒分布式库存锁防止高并发抢座超卖</text>
  <text x="435" y="430" class="node-sub">• 自动关联全家同行手环 (Linked Party) 与食物过敏档案</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
