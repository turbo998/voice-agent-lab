  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① 远洋船端边缘自治与卫星雨衰 100% 不断服</text>

  <rect x="46" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">破解公海卫星 650ms 抖动与峡湾断网盲区</text>
  <text x="60" y="200" class="node-sub">• 6,000 人邮轮过热带暴雨或挪威峡湾时卫星带宽骤降甚至中断</text>
  <text x="60" y="218" class="node-sub">• 船端机房部署 2x L40S 边缘集群，客舱电话走船内千兆局域网</text>
  <text x="60" y="236" class="node-sub">• 端到端语音延迟死死锁定 &lt;180ms，公海断网 100% 正常订餐报修</text>

  <rect x="46" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="282" class="node-title">消除宾客服务台 (Purser's Desk) 45 分钟排长队</text>
  <text x="60" y="302" class="node-sub">• 登船首日与下船前夜，总台被查账单/连不上 Wi-Fi 游客挤爆</text>
  <text x="60" y="320" class="node-sub">• 客舱座机与船内免流量 App 语音 24h 秒接 (支持 16 语种)</text>
  <text x="60" y="338" class="node-sub">• 直连 Oracle Fidelio Cruise / Otalio 实时处理客房送餐与空调调节</text>

  <rect x="46" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="386" class="node-title">省下 88% 昂贵的远洋卫星上行音频带宽</text>
  <text x="60" y="406" class="node-sub">• 音频流 100% 在船端机房本地消化，绝不占用 Mbps 级卫星带宽</text>
  <text x="60" y="424" class="node-sub">• 把宝贵的 Starlink 海洋卫星带宽留给付费高速上网游客</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">船员多语种无线电翻译桥 (Crew Radio Bridge)</text>
  <text x="60" y="500" class="node-sub">• 客房/工程部 40 国籍船员母语报修工单秒级转译下发</text>
  <text x="60" y="518" class="node-sub">• 客舱报修响应速度从 55 分钟缩短至 11 分钟</text>

