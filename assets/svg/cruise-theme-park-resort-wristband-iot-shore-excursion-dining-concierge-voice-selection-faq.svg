  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② 岸上观光“最晚登船锁”与乐园排队/餐厅抢座</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">岸上观光 (ShoreEx) 60 分钟返船安全死线锁</text>
  <text x="435" y="200" class="node-sub">• 痛点: 游客改签靠港行程若晚于拔锚开船时间将被遗弃在异国码头!</text>
  <text x="435" y="218" class="node-sub">• 硬校验 `Excursion_Return_Time &lt;= Ship_All_Aboard_Time - 60m`</text>
  <text x="435" y="236" class="node-sub">• 天气取消水上项目时 3 分钟内自动语音改签全船 800 名受影响游客</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
