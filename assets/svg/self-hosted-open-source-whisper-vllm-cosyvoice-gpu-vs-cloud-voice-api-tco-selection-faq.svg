  <rect width="1280" height="760" fill="url(#bg317)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1224" height="78" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="48" y="54" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">
    Self-Hosted Open-Source Voice Stack (Whisper/SenseVoice + vLLM + CosyVoice 2) vs. Cloud API TCO (SELF-HOSTED-OPENSOURCE-GPU-VS-CLOUD-TCO-01)
  </text>
  <text x="48" y="81" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">
    1.2M Min/Mo TCO Breakeven · Whisper Silence-Hallucination VAD Gate · GPU KV-Cache &le;80% SLA · 0ms Cloud API Burst Spillover
  </text>

  <!-- Left Column: Open-Source GPU Voice Stack -->
  <rect x="28" y="118" width="290" height="465" rx="12" fill="url(#card317)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="148" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    1. Open-Source GPU Components
  </text>

  <rect x="46" y="166" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">STT: Faster-Whisper / SenseVoice</text>
  <text x="60" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• CTranslate2 / TensorRT INT8 ASR</text>
  <text x="60" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• ~45 concurrent streams per L40S GPU</text>

  <rect x="46" y="266" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">LLM: vLLM / SGLang (Qwen/Llama)</text>
  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Automatic prefix caching (APC)</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• FP8 quantized &lt;160ms TTFT</text>

  <rect x="46" y="366" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="390" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">TTS: CosyVoice 2 / Kokoro-82M</text>
  <text x="60" y="411" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 150ms streaming chunk synthesis</text>
  <text x="60" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Apache 2.0 commercial-safe weights</text>

  <rect x="46" y="466" width="254" height="98" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="490" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">1.2M Min/Mo TCO Crossover</text>
  <text x="60" y="511" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• &lt;400k min/mo: Cloud API wins (-48%)</text>
  <text x="60" y="530" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• &gt;1.2M min/mo: Hybrid GPU+Cloud wins</text>
  <text x="60" y="549" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hybrid TCO at 2M m: $310 / 10k min</text>

  <!-- Center Column: 3 Deterministic Self-Hosted GPU & Spillover Gates -->
  <rect x="338" y="118" width="584" height="465" rx="12" fill="url(#card317)" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="148" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    2. Deterministic Open-Source GPU Quality &amp; Cloud-Burst Engine
  </text>

  <!-- Gate 1 -->
  <rect x="358" y="166" width="544" height="122" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="376" y="191" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate A · Whisper Silence-Hallucination VAD Gate &amp; License Lock
  </text>
  <text x="376" y="214" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Hard Rule: Never feed un-gated silence into Whisper (hallucinates YouTube outros)!
  </text>
  <text x="376" y="235" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Strips non-speech frames via Silero VAD + `no_speech_prob &lt; 0.6` filter
  </text>
  <text x="376" y="256" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Blocks non-commercial weights (`CC-BY-NC` Fish/XTTS) in commercial CI/CD builds
  </text>
  <text x="376" y="275" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Eliminates phantom "Thank you for watching" transcripts &amp; open-source IP lawsuits
  </text>

  <!-- Gate 2 -->
  <rect x="358" y="302" width="544" height="122" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="376" y="327" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate B · GPU KV-Cache (&le;80%) &amp; Continuous Batching SLA Gate
  </text>
  <text x="376" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Monitors vLLM / Triton GPU KV-cache utilization &amp; active audio stream count
  </text>
  <text x="376" y="371" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Enforces Prefix Caching so 90% of system prompt KV blocks stay pinned in HBM
  </text>
  <text x="376" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Caps per-GPU concurrent TTS streams to prevent chunk underrun audio clicks
  </text>
  <text x="376" y="411" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Prevents tail-latency explosion (P99 &gt; 2,500ms) when GPU memory saturates
  </text>

  <!-- Gate 3 -->
  <rect x="358" y="438" width="544" height="126" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="376" y="463" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
