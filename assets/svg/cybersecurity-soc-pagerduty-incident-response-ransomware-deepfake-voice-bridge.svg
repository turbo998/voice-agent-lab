  <text x="385" y="208" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Never trusts voice biometrics or verbal SSN/employee ID alone (vulnerable</text>
  <text x="385" y="228" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  to 3-second AI voice cloning &amp; Scattered Spider helpdesk social engineering)</text>
