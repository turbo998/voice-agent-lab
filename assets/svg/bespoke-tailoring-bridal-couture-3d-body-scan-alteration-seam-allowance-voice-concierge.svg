  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces ≥14-day local alteration &amp; pressing buffer after mill delivery</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks promising custom-woven couture gown delivery when lead time is &lt;6 weeks</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Automatically pivots rush brides to in-stockatelier sample + express master-tailor fitting</text>

