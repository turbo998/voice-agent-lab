  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects champagne/wine spill on silk, steam-scorch risk, or blown zipper</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 0ms warns: "NEVER rub silk with hot water, club soda salt, or bleach!"</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Dispatches mobile Master Tailor / Bridal Emergency Kit to hotel suite in 0ms</text>
