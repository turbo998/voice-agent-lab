  <text x="74" y="592" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="13">① 信用卡 PAN/CVV/PIN 必选边缘 RFC 4733 带外按键旁路 (P725, SAQ-A)；② 口述身份证/住址/病史必选 SIPREC &gt;=600ms RAM 环形缓冲 + ±150ms 护城河实时消音 (P726)。</text>
  <text x="74" y="616" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">③ 口径边界：本地离线内存策略状态机拦截耗时 &lt;1ms (1ms 计时分辨率下记 0ms, synthetic)；真实生产 SBC/HSM 金库往返与 WORM 写入延迟标为 not_measured；行业参考标为 anonymized_reported。</text>
