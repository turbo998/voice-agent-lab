  <text x="626" y="180" fill="#f0fdf4" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">• 上行语音暂停锁：进入付款节点立即暂停发往 ASR/LLM 的上行音频流 (Paused)</text>
  <text x="626" y="206" fill="#f0fdf4" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">• 带外剥离 + 陷波：边缘 SBC 剥离 RFC 4733 (PT=101) 并压制带内按键音 &lt;= -65 dBFS</text>
  <text x="626" y="232" fill="#f0fdf4" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">• 金库单向 Token 化：直连 PCI Vault 换取 tok_visa_4242，LLM 暴露卡号位数强制 = 0</text>
  <text x="626" y="258" fill="#f0fdf4" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">• 合规降维收益：AI 推理集群与录音系统 100% 脱离持卡人数据环境 (保持轻量 SAQ-A)</text>
  <rect x="626" y="278" width="522" height="74" rx="10" fill="#031c0d" stroke="#22c55e" stroke-width="1"/>
  <text x="642" y="304" fill="#86efac" font-family="Consolas, monospace" font-size="13" font-weight="700">P725 Gate (&lt;1ms synthetic policy check | live Vault RTT: not_measured):</text>
  <text x="642" y="328" fill="#bbf7d0" font-family="Consolas, monospace" font-size="12.5">clampedInbandDtmfToneBleedDb &lt;= -65 dBFS | rawPanDigitsExposedToLlm = 0</text>

