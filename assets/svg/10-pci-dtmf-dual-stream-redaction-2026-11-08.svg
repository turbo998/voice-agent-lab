  <text x="54" y="84" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="800">PCI-DSS v4.0 语音支付带外 DTMF 旁路 (P725) 与 SIPREC 双流延迟环形缓冲实时消音 (P726)</text>

