  <text x="52" y="152" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">❌ 传统错误方案：口述卡号进 ASR/LLM + 事后文本打星号 (SAQ-D 全栈染毒)</text>
  <text x="52" y="180" fill="#fef2f2" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">1. 接触即传染：16位卡号与CVV流经 ASR、LLM 显存与日志，全套 AI 平台沦为 PCI SAQ-D</text>
  <text x="52" y="206" fill="#fef2f2" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">2. 同音词漏网：口述 "4111" 被转写为 "for won won won"，数字正则替换彻底失效</text>
  <text x="52" y="232" fill="#fef2f2" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">3. 带内按键音还原：录音残留 -12 dBFS 按键双音频谱，10行 FFT 代码即可逆向解码卡号</text>
  <text x="52" y="258" fill="#fef2f2" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">4. WORM 录音明文落盘：事后批处理无法覆写防篡改存储，且词首尾 80ms 辅音清晰可辨</text>
  <rect x="52" y="278" width="514" height="74" rx="10" fill="#1f0909" stroke="#ef4444" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-family="Consolas, monospace" font-size="13" font-weight="700">Audit Failure: rawPanDigitsExposedToLlm = 16 | inbandBleed = -12 dBFS</text>
  <text x="68" y="328" fill="#fecaca" font-family="Consolas, monospace" font-size="12.5">SIPREC WORM Audio: 100% Plaintext Spoken PII Persisted to Disk</text>

