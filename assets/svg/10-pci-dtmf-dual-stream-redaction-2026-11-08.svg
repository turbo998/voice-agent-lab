  <text x="72" y="484" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 麦克风音频直通流式 ASR + 词级时间戳 NER，毫秒级标定敏感词区间 [t_start, t_end]</text>
