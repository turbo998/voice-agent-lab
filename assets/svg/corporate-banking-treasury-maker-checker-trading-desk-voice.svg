    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 对公资金“四眼原则 (P43)”与防 CEO 深伪</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严防 $2,500万“克隆 CEO 声音指令财务转账”！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 黑客克隆集团总裁声音致电出纳要求紧急汇出并购保证金</text>
