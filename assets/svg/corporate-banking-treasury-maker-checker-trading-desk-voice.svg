    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 企业追问：“为什么我这笔跨境汇款被卡住3天还没到账？”</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 若 AI 照实读出后台状态“因命中 OFAC/反洗钱可疑名单被冻结”即犯罪！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
