    <text x="30" y="308" fill="#34D399" font-size="12">• 若 SIPREC 录音流中断，0ms 自动切断交易台语音通话！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
