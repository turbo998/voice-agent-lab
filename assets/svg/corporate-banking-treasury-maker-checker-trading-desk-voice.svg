    <text x="30" y="214" fill="#38BDF8" font-size="12">• 统一替换为中性合规话术：“该笔汇款正处于常规银行间合规复核”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">信用证 (L/C) 单证不符点与 SWIFT GPI 实时播报</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 正常汇款：毫秒级查询 SWIFT UETR 追踪资金停在哪家中转行</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 自动播报国际信用证提单不符点明细并引导上传修改函</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">100% 阻断 AML/OFAC 敏感状态口头泄露</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">符合 FATF / FinCEN / 中国人民银行反洗钱保密规定</text>
