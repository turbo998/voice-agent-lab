    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">对公银行财资与机构金融交易台零风险语音闭环（Corporate Treasury &amp; Trading Turret Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 经办拟单：出纳语音生成 ISO 20022 汇款草稿 (严禁直接划款) ➔ 2. 四眼复核 (P43)：独立呼叫 CFO 完成 FIDO2/U盾联签</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 交易台 (P60)：SIPREC 双录专线解析外汇/债券切口生成 FIX 预填单 ➔ 4. 跨境查账 (P35)：SWIFT 正常追踪 vs AML 冻结状态强制脱敏</text>
