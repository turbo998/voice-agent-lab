  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic RCRA &amp; Fire-Safety Engine (WASTE-MRF-LITHIUM-HOTLOAD-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: Lithium-Ion Battery &amp; Pressurized Cylinder Compactor Ban</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% blocks telling residents to toss Li-ion batteries, e-bikes, or vapes in carts</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks propane tanks, marine flares, and pool chlorine in curbside compactors</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Prevents hydraulic packer blade from puncturing Li-ion cells (causes 68% of MRF fires)</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Routes caller to Call2Recycle / Household Hazardous Waste (HHW) drop-off depot</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: Friable Asbestos, Red-Bag Biohazard &amp; Freon CFC Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks scheduling standard bulk pickup for friable asbestos or medical sharps</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Requires EPA Section 608 refrigerant recovery tag for refrigerators/AC units</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Enforces OSHA 1910.147 Lockout/Tagout (LOTO) before clearing jammed MRF baler</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents toxic asbestos dust aerosolization or needle-stick injuries on sorting belts</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Smoking "Hot Load" Dump-Zone &amp; Baler Entrapment Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects smoke in refuse truck body, MRF infrared fire cannon trigger, or rad alarm</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Commands driver: "Stop compaction! Route to cleared asphalt Hot-Load Dump Zone"</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Never dump burning refuse under power lines, near gas stations, or inside MRF pit!</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full EPA RCRA Subtitle C/D, NFPA 855 &amp; ANSI Z245.1 Refuse Safety WORM audit log</text>

