<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg28)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Offshore Energy, Underground Mining &amp; Maritime Satellite Edge-Cloud Voice AI</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">能源矿山、远洋航运（Starlink/VSAT）、轨交航空与断网/弱网环境“端云协同实时语音智能体”架构选型全景图</text>
  <rect x="926" y="42" width="226" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1039" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">EDGE-HYBRID-01 · &lt;=220ms</text>

  <!-- Pillar 1: 0 bps Underground/Air-Gapped Ruggedized Edge Box -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#edgeGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 零外网 (0 bps) 矿井/海工防爆边缘一体机</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">本地闭环推理 (&lt;=220ms 零公网依赖)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 部署防爆边缘盒 (Jetson Orin AGX / Azure Stack Edge)</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 地下 800米矿井或光缆切断时 100% 正常语音交互</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">离线语音容器 + 本地多模态小模型 (SLM)</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• Disconnected Azure Speech Containers (离线授权)</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• Phi-4-multimodal / Qwen2.5-Omni-7B-AWQ 本地量化</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">本地设备手册向量库与 PLC 寄存器直读</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 内置 Qdrant/SQLite 存储 5万页设备维修 SOP 手册</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 本地 Modbus/OPC-UA 实时读取油压、瓦斯浓度与温度</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">断网环境语音响应 P50 &lt;= 220ms · 100% 可用</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">彻底攻克井下、隧道、远海平台与涉密军工断网难题</text>
  </g>

  <!-- Pillar 2: Satellite (Starlink/VSAT) 12kbps Opus FEC & Edge-Cloud Split -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#satGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 卫星弱网 (Starlink/VSAT) 96% 窄带压缩</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 为什么远洋船/戈壁风电跑不动云端 WebSocket？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 卫星切换 RTT 抖动达 680ms + 暴雨衰减丢包率 15%</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 裸传 384kbps PCM 音频流瞬间塞爆昂贵海事卫星带宽</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">方案 A：端侧 STT/TTS + 卫星仅传 1.5KB JSON</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 船载边缘盒在本地完成语音转写与首句 180ms 垫话</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 仅将压缩文本意图经卫星发往陆地总部云端大模型</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">方案 B：Opus 12kbps + 带内 FEC 前向纠错</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 需传原声时启用 Opus DTX + 30% FEC 冗余与 PLC 补包</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 抗 18% 随机丢包不卡顿，卫星流量费直降 96.8%！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">海事卫星流量成本从 $4.20/分 降至 $0.06/分</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">在 650ms 卫星高延迟下依然保持 <=200ms 本地首声反馈</text>
  </g>

  <!-- Pillar 3: Store-and-Forward Eventual Consistency Sync to SAP/Maximo -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#syncGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 断网本地事务暂存与上井最终一致性同步</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="30" y="82" fill="#FDE68A" font-size="13" font-weight="700">SQLite WAL 本地加密事务发件箱 (Outbox)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 巡检员在井下语音报修：“3号掘进机液压泵异响需换密封圈”</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 本地立即生成带时间戳与声纹签名的结构化工单入库</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FCD34D" font-size="13" font-weight="700">网络恢复瞬时增量同步 (SAP PM / Maximo)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 升井回到地面 Wi-Fi 或卫星恢复时，按优先级队列同步</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 安全告警 -> 备件申领 -> 常规巡检日志 -> 压缩录音归档</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">离岸夜间自动拉取最新知识库与模型补丁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 利用卫星夜间闲时带宽增量同步最新 SOP 微切片</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 总部统一管控全球 200 艘船/矿区的边缘语音容器版本</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">断网 72 小时巡检工单与录音 100% 零丢失</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">无缝对接 SAP PM / IBM Maximo / Dynamics 365</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">极端弱网/断网环境端云协同语音黄金架构（Edge-Cloud Hybrid Voice Resilience Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 网络探针实时分级：光纤正常 (直连云端) / 卫星弱网 (本地 STT+TTS，卫星仅传 1.5KB JSON) / 完全断网 (100% 切入本地边缘盒)</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 2. 本地 Azure Speech 容器 + 量化 SLM (&lt;=220ms) 响应 SOP 与 SCADA 读数 ➔ 3. 写操作暂存本地 Outbox，联网后自动幂等同步 SAP/Maximo</text>
  </g>
</svg>
