  <text x="64" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">定量收敛结论：100% 消除 E=1 重传三连发与连号 88 误吞，100% 阻断带内 #9 双轨走私与扬声器 TTS 回环按键注入。</text>
