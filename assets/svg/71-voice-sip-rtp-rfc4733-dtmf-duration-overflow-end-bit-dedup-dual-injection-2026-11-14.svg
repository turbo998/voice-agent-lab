  <text x="672" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：带外发 Event=1 骗过防火墙，同时带内 G.711 混入 #9 雙音触发下游 PBX 盗打</text>
  <text x="672" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 回环风险：免提外放将 Agent TTS 播报音频经麦克风回环注入带内 Goertzel 检音器</text>
