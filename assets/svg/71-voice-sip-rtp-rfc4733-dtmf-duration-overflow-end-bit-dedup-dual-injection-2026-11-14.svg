  <text x="390" y="57" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Enterprise SIP/RTP RFC 4733 DTMF StartTs Dedup, Duration Cap &amp; Dual-Stream Anti-Smuggling Guard</text>
