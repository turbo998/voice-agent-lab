  <text x="64" y="146" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. RFC 4733 E=1 StartTs Dedup &amp; Duration Wedge Gate (P847)</text>
  <text x="64" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：标准 3 次 E=1 重传未按 StartTs 去重致密码 123 变 111222333，粗糙冷却又吞连号 88</text>
  <text x="64" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 卡死风险：缺失 E=1 结束位且 duration=65535 (8.19s) 锁死 IVR 采集状态机</text>
  <rect x="64" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Naive E=1 Trigger: 3x Retransmit -&gt; '555' | Event=24 Reserved | 8000ms Wedge</text>
  <text x="80" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P847 Gate: Idempotent (SSRC, Event[0..15], StartTs) + Duration in [40, 2000]ms</text>
  <text x="80" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: dedup_rfc4733_end_bit_and_clamp_dtmf_duration (0 Duplicates)</text>
  <text x="64" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P847）：</text>
  <text x="64" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedDuplicateOrReservedDtmfEvents = 0（0 重传翻倍，100% 保留快速连按 88）</text>
  <text x="64" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxDtmfEventDurationMs ∈ [40, 2000]（杜绝 8.19s 长音卡死）</text>

  <!-- Right Column: Dual-DTMF Smuggling & In-Band Notch Gate (P848) -->
  <rect x="652" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
