  <text x="688" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Dual-Stream Smuggling: Out-of-Band Event=1 vs. In-Band Audio '#9'</text>
  <text x="688" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P848 Gate: Dual-Stream Parity + TTS Echo Lock + [45, 80] dB Notch Strip</text>
  <text x="688" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: block_dual_dtmf_smuggling_and_strip_inband_tones</text>
  <text x="672" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P848 · 🎉 430 大评测维度历史性里程碑）：</text>
  <text x="672" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedSmuggledOrLoopbackDtmfDigits = 0（100% 阻断双轨走私与 TTS 回环按键）</text>
  <text x="672" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMinGoertzelInbandNotchAttenuationDb ∈ [45, 80]（深度擦除带内双音）</text>

