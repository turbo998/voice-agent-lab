  <text x="892" y="164" class="card-sub">PCI SAQ-A Eligibility · CISO Governance</text>

  <rect x="892" y="182" width="340" height="126" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="908" y="204" class="card-title">Descoping LLM &amp; Cloud Storage from PCI-DSS QSA</text>
  <text x="908" y="224" class="body">• Letting callers speak credit cards into an LLM puts</text>
  <text x="908" y="242" class="body">  the entire AI stack into PCI Level-1 audit scope</text>
  <text x="908" y="260" class="body">• SBC edge clamping keeps AI stack 100% PCI-out-of-scope</text>
  <text x="908" y="282" class="mono">Annual_PCI_QSA_Compliance_Savings = -$240,000 / Year</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="908" y="346" class="card-title">Defeating 3-Second Zero-Shot Voice Clones</text>
  <text x="908" y="366" class="body">• Legacy enrollment voiceprints fail against modern</text>
  <text x="908" y="384" class="body">  diffusion/flow-matching TTS clones (`31%` bypass)</text>
  <text x="908" y="402" class="body">• Multi-factor PAD + cryptographic binding = `0.0%` bypass</text>
  <text x="908" y="424" class="mono">Equal_Error_Rate_EER_On_Deepfakes = 0.28%</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.2"/>
  <text x="908" y="498" class="card-title">Benchmark &amp; TCO Summary (10k Payment/Auth Calls)</text>
  <text x="908" y="520" class="body">• Unclamped Voice Payment + Fraud: $185,000 / 10k</text>
  <text x="908" y="538" class="body">• PAD + Edge-PCI + OWASP Guarded: $1,150 / 10k (Rec)</text>
  <text x="908" y="556" class="body">• Legacy KBA + Post-Call Redaction: $42,000 + PCI scope</text>
  <text x="908" y="578" class="mono">Prevented_Deepfake_And_PCI_Liability = -$410,000 / 10k</text>
  <text x="908" y="596" class="mono">PAN_Leaks = 0 | IDOR_Injections = 0</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateEnterpriseVoiceSecurityDeepfakePciGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="696" class="card-title">Cloud &amp; AI Solution Architect Takeaway — Enterprise Voice AI Security &amp; PCI-DSS v4.0</text>
  <text x="52" y="718" class="body">Clamp payment digits at the SBC edge before ASR/LLM, pair voice biometrics with ISO 30107-3 PAD liveness, and strip IDs from LLM tool schemas.</text>
