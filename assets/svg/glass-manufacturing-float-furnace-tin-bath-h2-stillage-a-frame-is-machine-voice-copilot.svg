  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• On 1,600°C furnace block breach: evacuates basement pit &amp; activates water-freeze lances</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• On tin-bath pressure drop / H2 leak: cuts H2 supply &amp; floods bath with 100% N2 in 0ms</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Directs tourniquet/hemostatic control &amp; bridges Trauma EMS on glass laceration</text>
