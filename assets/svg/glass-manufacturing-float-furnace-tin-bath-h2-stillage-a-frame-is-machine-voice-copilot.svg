  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% forbids cutting shipping straps unless mechanical safety restraint bar is pinned</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Verifies A-frame 4°–6° lean angle, symmetric unloading &amp; zero humans in Fall Zone</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Locks overhead crane release if dual-circuit vacuum drops below -60 kPa</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Eliminates #1 cause of fatal glass-plant crushes and carotid lacerations</text>

