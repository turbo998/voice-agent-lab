  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks H2 forming-gas injection until N2 purge reduces bath O2 &lt;0.5% at +20–50 Pa</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces IS bottle-machine individual section stop + gob-interceptor before swabbing</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Verifies respirator / local exhaust when batching toxic Selenium / Arsenic / Lead</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents tin-bath hydrogen flashback explosions and 1,100°C molten gob burns</text>

