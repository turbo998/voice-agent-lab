    <text x="26" y="86" class="body-text">• Attackers use stolen SSNs to request eSIM swaps</text>
    <text x="26" y="102" class="body-text">  and hijack bank SMS 2FA codes within minutes</text>
    <text x="26" y="122" class="mono" fill="#fda4af">Knowledge KBA (SSN/DOB) Is NEVER Sufficient!</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
