    <text x="26" y="86" class="body-text">• Diffs current vs. prior month BSS invoice JSON</text>
    <text x="26" y="102" class="body-text">  (Amdocs / CSG / Netcracker) before speaking</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">Pinpoints Exact Roaming / One-Time Fee Delta</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Deterministic Retroactive Pass Math</text>
    <text x="26" y="188" class="body-text">• Never let the LLM invent arbitrary bill credits!</text>
    <text x="26" y="204" class="body-text">• BSS engine re-rates $240 roaming into $50 Travel</text>
    <text x="26" y="224" class="mono">Pass -> Exact $190 Credit + 89% Churn Save Rate</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">Delegated Credit Authority Ceiling</text>
    <text x="26" y="290" class="body-text">• Code-enforced per-tenure credit cap (e.g. &lt;=$75</text>
    <text x="26" y="306" class="body-text">  goodwill or verified retroactive bundle diff)</text>
    <text x="26" y="324" class="mono" fill="#fde68a">0.0% Unauthorized Revenue Leakage</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Two-Phase Verbal Contract Readback</text>
    <text x="26" y="386" class="body-text">Requires explicit caller "Yes" after reading monthly</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">rate &amp; term before committing BSS plan change</text>
  </g>

  <!-- Column 3: Zero-Trust Anti-SIM-Swap & Port-Out Guard -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#roseGrad501)"/>
