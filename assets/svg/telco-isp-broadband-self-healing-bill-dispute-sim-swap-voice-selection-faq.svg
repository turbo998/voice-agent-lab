  <text x="107" y="46" text-anchor="middle" class="badge">TELCO &amp; ISP · #501</text>
  <text x="190" y="44" class="title">Telco &amp; ISP Voice AI: Broadband Self-Healing, Bill Shock Resolution &amp; SIM-Swap Defense</text>
  <text x="190" y="65" class="subtitle">Pre-Answer CPE Telemetry Triage (-64% Truck Rolls) + Deterministic Roaming Re-Rating (Amdocs/CSG) + Zero-Trust Anti-SIM-Swap Lock (-$395k/10k Hrs)</text>

  <!-- Column 1: Broadband & Wi-Fi Remote Self-Healing -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad501)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. Broadband &amp; Wi-Fi Remote Self-Healing</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Pre-Answer ANI-to-CPE Telemetry Probe</text>
    <text x="26" y="86" class="body-text">• Queries fiber ONT status &amp; area outage map</text>
    <text x="26" y="102" class="body-text">  during ringback (&lt;150ms before greeting)</text>
    <text x="26" y="122" class="mono">Proactive Outage Deflection OR Targeted Reset</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Async Router Reboot &amp; Guided Pacing</text>
    <text x="26" y="186" class="body-text">• Remote CPE reboot takes 15-25s over TR-069/USP</text>
    <text x="26" y="202" class="body-text">• Streams 8s progress updates + SMS fallback link</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Cuts $180 Unnecessary Field Truck Rolls by 64.2%</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Multimodal Router LED Camera Triage</text>
    <text x="26" y="288" class="body-text">• If remote telemetry is unreachable, sends 1-tap</text>
    <text x="26" y="304" class="body-text">  WebRTC camera link to inspect LOS/PON red LEDs</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Distinguishes Unplugged Cord vs. Cut Fiber</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">78.4% First-Call Self-Healing Resolution</text>
    <text x="26" y="384" class="body-text">Resolves DNS, Wi-Fi channel congestion, and DHCP</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">leases without Tier-2 tech support escalation</text>
  </g>

