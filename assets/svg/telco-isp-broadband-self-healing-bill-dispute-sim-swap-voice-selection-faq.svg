    <text x="26" y="204" class="body-text">  gov-ID liveness selfie + 24h multi-channel hold</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">100% Blocks Voice-Channel SIM-Swap Hijacking</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Number Transfer PIN (NTP) Port-Out Lock</text>
    <text x="26" y="288" class="body-text">• Never reads out Port-Out PINs over voice audio</text>
    <text x="26" y="304" class="body-text">• Delivers NTP strictly into authenticated carrier</text>
    <text x="26" y="322" class="mono">app inbox after port-freeze verification</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#fb7185" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#fda4af">Guardrail: TELCO-ISP-VOICE-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateTelcoBroadbandSelfHealingSimSwapGuard</text>
    <text x="26" y="402" class="body-text">-64.2% Truck Rolls · -$395k/10k Hrs Total Savings</text>
  </g>

