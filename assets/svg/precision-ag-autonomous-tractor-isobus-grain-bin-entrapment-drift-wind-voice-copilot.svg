<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg250" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07130d"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card250" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg250)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Precision Agriculture ISOBUS Tractor, UAV Spray Drift &amp; Grain-Bin Safety Voice Copilot</text>
  <text x="600" y="66" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">EPA Wind-Drift (&lt;10 mph) &amp; Pollinator Lock · OSHA 1910.272 Grain-Bin Auger LOTO Gate · 0ms PTO/Rollover &amp; Organophosphate Bridge (PRECISION-AG-GRAIN-BIN-DRIFT-01)</text>

  <!-- Left Column: Tractor Cab, Spray UAV & Grain Elevator -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card250)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="166" y="122" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Field &amp; Silo Channels</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#4ade80"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Tractor Cab &amp; ISOBUS 11783</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• John Deere / Case IH / DJI Ag UAV</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• RTK 2cm AutoTrac AB-line voice</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Variable-rate seed/fertilizer prescription</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Sprayer &amp; Grain Elevator</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Boom height &amp; nozzle droplet size</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Restricted-Entrant Interval (REI)</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Silo moisture &amp; CO2 spoil sensors</text>

  <rect x="56" y="394" width="220" height="222" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="166" y="420" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lethal Farm &amp; Silo Hazards</text>
  <text x="166" y="444" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Flowing grain bin engulfment (4 sec!)</text>
  <text x="166" y="464" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Dicamba / 2,4-D wind drift &gt;10 mph</text>
  <text x="166" y="484" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Tractor rollover / PTO entanglement</text>
  <text x="166" y="504" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Anhydrous ammonia / Organophosphate</text>
  <text x="166" y="532" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0ms Auger Cutoff &amp; Rural EMS</text>

  <!-- Center Column: PRECISION-AG-GRAIN-BIN-DRIFT-01 Guardrail Engine -->
  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card250)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic EPA FIFRA &amp; OSHA 1910.272 Engine (PRECISION-AG-GRAIN-BIN-DRIFT-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: EPA FIFRA Spray Wind-Drift (&lt;10 mph), Inversion &amp; Bee Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks boom anemometer (3–10 mph window; blocks &lt;3 mph thermal inversion!)</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Verifies downwind buffer zone from sensitive crops, schools &amp; organic fields</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks spraying blooming crops during active daytime honeybee foraging</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Enforces Worker Protection Standard (WPS) Restricted-Entry Interval (REI) field lock</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: OSHA 1910.272 Grain-Bin Auger LOTO &amp; Lifeline Hard Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% prohibits entering a grain bin while unloading auger is energized</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Requires physical breaker LOTO + body harness lifeline + outside observer</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Warns against walking on crusted "bridged" grain (collapses into quicksand cone)</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Checks silo phosphine fumigant (&lt;0.3 ppm PH3) &amp; Nitrogen dioxide Silo-Filler's gas</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Auger/PTO E-Stop, Cofferdam Rescue &amp; Poison Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects grain entrapment, tractor IMU rollover, PTO snag, or pesticide exposure</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trips unloading auger breaker &amp; turns ON grain aeration fan in 0ms</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Dispatches Rural Fire Grain-Rescue Tube (Cofferdam) &amp; MedEvac GPS coordinates</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full EPA FIFRA / WPS, OSHA 29 CFR 1910.272 &amp; ISO 11783 ISOBUS WORM audit log</text>

  <!-- Right Column: John Deere Ops, Weather Mesonet & Rural Fire -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card250)" stroke="#22c55e" stroke-width="1.5"/>
