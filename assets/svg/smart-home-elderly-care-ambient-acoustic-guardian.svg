<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg35" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="hearGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="careGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg35)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Smart Elderly Care Acoustic Fall Guardian, Presbycusis EQ &amp; Matter Voice</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">智慧养老居家看护（卫浴跌倒非接触声学/毫米波守护）、适老化老年耳聋补偿与全屋 Matter 语音选型全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">ELDER-CARE-01 · 10s SOS</text>

  <!-- Pillar 1: Zero-Camera Bathroom Fall Acoustic + mmWave Radar Guardian -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F97316" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#fallGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 零摄像头卫浴跌倒声学+毫米波秒级守护</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 为什么手环与拉绳救不了 65% 的夜间卫浴跌倒？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 老人洗澡时必摘手环！摔倒骨折后根本够不到墙上拉绳</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 疼痛休克下喊不出“小爱同学/Siri”，只能在花洒声中呻吟</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FDBA74" font-size="13" font-weight="700">端侧非唤醒词声学检测 + 60GHz 毫米波雷达</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 零摄像头保护隐私！平时音频 100% 不上云</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 端侧 NPU 识别“闷响摔落+呻吟/救命”与雷达高度骤降</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">10秒无应答自动报警 + Matter 智能门锁救援授权</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• AI 主动大声呼喊确认 10秒无回答 ➔ 直拨子女与社区医护</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 自动关停燃气阀/热水器，并为 120 急救员签发临时开门码</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">卫浴跌倒检出率 98.6% · 黄金救援缩短至 3分钟</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">无需穿戴任何设备 · 零镜头隐私泄露</text>
  </g>

  <!-- Pillar 2: Presbycusis Acoustic Compensation & Dialect Understanding -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#hearGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 老年性耳聋声学补偿 (Presbycusis EQ)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="82" fill="#93C5FD" font-size="13" font-weight="700">为什么 75岁以上老人听不清普通智能音箱？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 老年性耳聋对 2kHz 以上高频辅音 (s/sh/f/t) 衰减达 40dB</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 尖细女声 + 1.0x 快语速在老人耳朵里全是糊成一团的嗡嗡声</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">适老化声学三件套：中低频暖音 + 辅音增强 + 0.85x</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 选用 160-200Hz 醇厚中频音色 + 1.5-3kHz 辅音增益 +6dB</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 语速锁定 0.85x 并拉长句间停顿，老人听清率从 58% 升至 97%</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">2.4s 超长倾听耐心窗 + 重度乡音免唤醒交互</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 支持粤/川/沪/闽/东北等 20+ 方言及无牙漏风发音识别</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 语义判停放宽至 2.4秒，绝不在老人喘气思考时抢话</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">高龄老人一次语音交互成功率达 96.8%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">支持克隆子女声音播报吃药与天气提醒，依从性翻倍</text>
  </g>

  <!-- Pillar 3: Dementia Companion, Medication Closed-Loop & Local Matter Hub -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#careGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 认知症温和陪伴、慢病服药与 Matter 中枢</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">阿尔茨海默症 (MCI) “问20遍也如初见”无限耐心</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 失智老人1小时内重复问15次“今天星期几？女儿啥时候来？”</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 严禁AI说“我刚告诉过您了”！每次均温和安抚并引导怀旧话题</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">智能药盒传感器 + 语音防重服/漏服双核验</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 老人忘记自己半小时前刚吃过降压药，伸手再拿药盒</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 药盒霍尔传感器触发语音强提醒：“爷爷您8点半吃过氨氯地平啦！”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">断网本地 Matter over Thread 全屋家电控制</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 本地 NPU 离线执行“关卧室灯、拉窗帘、把空调调到26度”</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 起夜离床自动点亮 15% 微光夜灯并开启卫生间防跌倒高敏监听</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">慢病漏服/重复服药事故率降低 91.5%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">1名康养社区护士可远程照护 120 户独居长者</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">智慧康养与适老化全屋语音守护闭环（Aging-in-Place Ambient Voice Guardian Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 日常交互：Presbycusis 辅音增强 + 0.85x 慢语速 + 20种方言 + 认知症无限耐心陪伴 ➔ 2. 慢病管理：智能药盒联动防重复吃药</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 夜间起夜：离床自动亮微光夜灯 + 激活卫浴端侧跌倒声学/毫米波守护 ➔ 4. 跌倒 10s 无应答：直通子女/120 并自动下发门锁急救授权</text>
  </g>
</svg>
