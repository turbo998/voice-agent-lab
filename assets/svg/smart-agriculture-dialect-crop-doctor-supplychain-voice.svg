<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg36" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cropGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="pestGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="tradeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg36)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Smart Agriculture Dialect Crop Doctor, Pesticide Gate &amp; Rural Supply-Chain Voice</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">智慧农业方言病虫害多模态问诊、禁限用农药零容忍安全门禁与大宗农产品语音撮合架构选型全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">AGRI-VOICE-01 · Zero-Ban</text>

  <!-- Pillar 1: Dialect Colloquial Mapping & 80KB Leaf Vision Diagnosis -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#cropGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 乡土方言土话映射 + 80KB 叶片视觉问诊</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">田间满手泥巴 + 强光看不清屏幕</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 农户不会打字输入“番茄晚疫病”，只会用方言土话说：</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• “老师傅你瞅瞅俺家西红柿烂屁股、叶子长黑毛咋整？”</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">3,000条农事土话本体映射 (Colloquial Ontology)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• “西红柿烂屁股” ➔ 番茄脐腐病 (缺钙/水分骤变)</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• “苞米钻心虫” ➔ 玉米螟；支持鲁/豫/川/东北等重度乡音</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">指代词触发 80KB 病叶关键帧 + 县域气象融合</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 结合正反面病斑图像 + 当地大棚温湿度/未来48h降雨预报</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• “明早有大雨，千万别今天露天打药，等后天晴天再喷！”</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">田间病虫害一次确诊率从 64% 提升至 95.8%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">田间弱网 2G/4G 下仅耗 80KB 流量即可完成看叶问诊</text>
  </g>

  <!-- Pillar 2: Zero-Tolerance Banned Pesticide & Pre-Harvest Interval Gate -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F97316" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#pestGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 禁限用农药零容忍锁与采收安全间隔期</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严防大模型幻觉乱开违禁农药或超标剂量！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 若在蔬菜/果树/茶树上误推毒死蜱、克百威等禁限用农药</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 将导致整棚农产品农残超标销毁，甚至触犯刑法生产销售有毒有害食品罪！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FDBA74" font-size="13" font-weight="700">农业农村部/EPA 农药登记库确定性硬校验</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 严禁 LLM 自由编造药方！必须查官方登记元组：</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• (作物种类, 防治对象, 有效成分, 亩用制剂克数, 稀释倍数)</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">采收安全间隔期 (PHI) 强制询问门禁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 开药前必问：“您这茬草莓/西红柿还有几天摘果上市？”</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 若距采摘 &lt;7天，自动屏蔽长效化学药，改推生物制剂/物理防治</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">违禁农药与超采收期误推率锁定为 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">药剂折算精确到“一桶 30斤水兑几瓶盖”，农户一听就懂</text>
  </g>

  <!-- Pillar 3: Livestock Biometric Insurance & Wholesale Voice Matchmaking -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#tradeGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 养殖险猪牛鼻纹查勘与产地行情语音撮合</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="82" fill="#93C5FD" font-size="13" font-weight="700">养殖险（生猪/肉牛）语音+耳标鼻纹 3分钟理赔</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 养殖户语音报案，AI 引导拍摄病死猪耳标与牛鼻纹特征</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 100% 拦截“拿同一头死猪换角度重复骗保”并核验无害化处理</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">全国批发市场实时价格播报与产销语音挂单</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 果农问：“今天北京新发地 80红富士苹果批发价多少？”</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 语音一句话挂牌：“我有 2万斤烟台红富士寻代办客商”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">县域普惠农贷与气象灾害预警外呼</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 倒春寒/冰雹前 12小时自动用当地乡音外呼全县种粮大户</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 指导大棚加固与熏烟防冻，将极端天气减产损失降低 38%</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">1名县级农技专家可辐射服务 50,000 户农户</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">农业保险查勘理赔成本降低 68% · 杜绝重复骗保</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">智慧农业与乡村振兴全链路实时语音架构（Smart AgriTech &amp; Rural Supply-Chain Voice Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 田间接入：重度方言土话转标准农学术语 + 80KB 病叶图像融合确诊 ➔ 2. 处方门禁：询问距采摘天数 (PHI) + 农业部农药登记库硬核验</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 俗语播报：自动换算为“一背负式喷雾器(30斤水)兑几毫升”并避开降雨天 ➔ 4. 产销与金融：养殖鼻纹核保 + 批发市场行情撮合</text>
  </g>
</svg>
