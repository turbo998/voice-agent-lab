  </text>
  <text x="550" y="592" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#34d399">
    Duplicate/Wrong CRM Writes: 0% • Bystander Cutoffs: -93.6% • Latency MTTR: 45s (-$294k/10k Hrs)
  </text>
  <text x="68" y="618" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#94a3b8">
    Guardrail ID: evaluateEndToEndEnterpriseVoiceReferenceArch2026Guard • Policy: END-TO-END-ENTERPRISE-VOICE-REFERENCE-ARCH-2026-01
  </text>
