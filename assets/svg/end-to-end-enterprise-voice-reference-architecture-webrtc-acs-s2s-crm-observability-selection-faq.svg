  </text>
  <rect x="896" y="52" width="240" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1016" y="75" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">
    E2E-VOICE-REF-ARCH-2026-01
  </text>

  <!-- Column 1: Omnichannel Ingress & Voice Stream Gateway -->
  <rect x="44" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="44" y="128" width="356" height="40" rx="12" fill="url(#cyan485e)"/>
  <text x="222" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. WebRTC / ACS Ingress &amp; Stream Gateway
  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Primary-Speaker Isolation (Bystander Shield)</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Suppresses background TV, café chatter &amp;</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  side-seat passengers using target-speaker</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  voiceprint lock + near-field SNR gate</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• Cuts bystander false barge-ins by 93.6%</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">15s Wi-Fi ↔ 5G ICE Session Continuity</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Holds server-side conversation state &amp; tool</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  locks for 15s during elevator/subterranean</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  network handoffs; auto-resumes via ICE restart</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#38bdf8">• 98.4% mobile session recovery without redial</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="76" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">Edge PCI-DSS DTMF &amp; PAN Audio Clamping</text>
  <text x="76" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Clamps card digits at edge gateway before</text>
  <text x="76" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">  audio reaches LLM/S2S or disk storage</text>
  <text x="76" y="512" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#7dd3fc">• 100% PCI-DSS v4.0 AI stack descoping</text>

  <!-- Column 2: S2S/Cascade Orchestration & Two-Phase CRM Tools -->
  <rect x="422" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="422" y="128" width="356" height="40" rx="12" fill="url(#rose485e)"/>
  <text x="600" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. Orchestration &amp; Two-Phase CRM Commit
  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">Two-Phase Prepare → Confirm Saga</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Phase 1: Dry-run prepare_action() validates</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  inventory/fees &amp; speaks explicit readback</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Phase 2: Commits only after caller affirmative</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#fb7185">  confirmation + idempotency key check (0 dupes)</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Zero-LLM-Identity Tool Binding (Anti-IDOR)</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Strips customer_id / tenant_id from LLM tool</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  JSON schemas; injects verified session JWT</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  server-side at the MCP gateway</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• 0% prompt-injection cross-account data leaks</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">Pre-TTS Anti-Markdown &amp; Homophone Sanitizer</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Strips **asterisks**, raw URLs &amp; JSON syntax</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">  in &lt;2ms before streaming to Neural TTS</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#fda4af">• 100% natural spoken formatting on numbers/IDs</text>

  <!-- Column 3: 7-Hop OpenTelemetry & 100% Automated Post-Call QA -->
  <rect x="800" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#059669" stroke-width="1.5"/>
  <rect x="800" y="128" width="356" height="40" rx="12" fill="url(#emerald485e)"/>
  <text x="978" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    3. 7-Hop OpenTelemetry &amp; Automated QA
  </text>

  <rect x="818" y="184" width="320" height="114" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399">7-Hop Audio-Aligned OTel Latency Waterfall</text>
  <text x="832" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Traces every turn across: (1) RTP Jitter →</text>
  <text x="832" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  (2) EOU → (3) STT → (4) RAG → (5) LLM TTFT →</text>
  <text x="832" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  (6) Tool API → (7) TTS First-Byte</text>
  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• Cuts P95 latency root-cause MTTR to 45 seconds</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">30s Spoken-Promise vs. CRM Ticket Reconciler</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Compares what the agent/AI promised verbally</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  ("I waived your $35 fee") vs actual CRM write</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34d399">• Catches 100% of unfulfilled spoken promises</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Canary Shadow Fork &amp; &lt;500ms Auto-Rollback</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Evaluates new prompts/models on muted shadow</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">  audio forks before exposing live callers</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#6ee7b7">• Saves $294,000 per 10,000 production hours</text>

  <!-- Bottom Telemetry Bar -->
