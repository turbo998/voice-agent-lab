<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg124" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent124" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg124)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="8" rx="4" fill="url(#accent124)"/>

  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">STAGE 480 🎉 · TOPIC 120 🎉 · P953–P954 · HISTORIC STAGE 480 &amp; TOPIC 120 DUAL MILESTONE · 483 DIMS · 922 TESTS</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">WebRTC SCTP RFC 4960 / RFC 8831: 32-Bit vtag, Heartbeat Cap &amp; PR-SCTP HoL Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 WebRTC SCTP 数据通道：防伪造 vtag ABORT 拆线、HEARTBEAT-INFO 反射放大与 ordered=true 字幕队头阻塞 (P953–P954)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="310" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (Blind ABORT &amp; 2s Ordered HoL Stall)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 伪造 vtag ABORT 拆线与 1200B 心跳反射放大</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">SCTP ABORT (vtag!=local) + HEARTBEAT-INFO (1,200B)</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 未核验 32-bit vtag 导致残余/伪造 ABORT 瞬间掐断字幕与控制通道！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 原样反射 1,200B 巨型 HEARTBEAT-ACK 挤占下行 TTS 语音带宽！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. ordered=true 完全可靠重传引发 2 秒队头阻塞</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">createDataChannel("viseme", { ordered: true }) // 3,000ms</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 5G 弱网丢 1 个 20ms 嘴型包，后续 35 帧被死锁在接收队列等待重传！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 数字人嘴型僵死 2 秒后突然快进吐字，且发送缓冲区积压暴涨！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：19 个非法拆线/放大控制块 + 27 条字幕/嘴型消息阻塞卡死</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">全双工数字人音画严重脱节，中途打断控制信令被堵在队尾失效</text>

  <!-- Right Card: Deterministic Guardrails P953-P954 -->
  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="350" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P953 + P954 · Stage 480 &amp; Topic 120 🎉)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P953 · RFC 4960 32-bit vtag 强验与 [16, 64]B 心跳封顶</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Strict 32-Bit vtag Match + HeartbeatInfo ∈ [16, 64]B</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 0ms 静默丢弃 vtag 失配的 ABORT/SHUTDOWN/HEARTBEAT 控制块</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 将 HEARTBEAT-INFO 载荷严格钳制在 [16, 64] 字节防反射放大</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P954 · RFC 8831 ordered:false + [80, 250]ms PR-SCTP</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">ordered: false + maxPacketLifeTime ∈ [80, 250]ms</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 流式字幕与数字人嘴型强制启用无序 PR-SCTP，新帧到达即刻渲染</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 超过 [80, 250]ms 自动发 FORWARD-TSN 跳过旧帧并清理积压队列</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 盲拆断连 · 0 心跳反射放大 · 64B / 250ms 无阻塞同步</text>
  <text x="652" y="500" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

  <!-- Footer Provenance -->
  <rect x="56" y="560" width="1088" height="68" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="76" y="586" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Benchmark &amp; Provenance (Stage 480 🎉 · Topic 120 🎉 · 963 Guardrails · 972 Probes · 782 Live POC Probes · 483 Dims · 922 Tests)</text>
  <text x="76" y="610" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Guardrails: evaluateWebrtcSctpRfc4960VerificationTagValidationAndHeartbeatInfoBoundsGate (P953) &amp; evaluateWebrtcSctpRfc8831UnorderedPartialReliabilityAndSendBufferQuotaGate (P954)</text>
