  <text x="64" y="666" class="metric-lbl">主驾波束降噪 + Menu DAG (单车省时 24 秒)</text>

  <rect x="328" y="614" width="262" height="68" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="344" y="642" class="metric-num">+$1.35 / 单客单价</text>
  <text x="344" y="666" class="metric-lbl">排队感知智能加购 (100% 一致率 vs 人工 21%)</text>

  <rect x="608" y="614" width="262" height="68" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="624" y="642" class="metric-num">&lt; 300ms 耳麦接管</text>
  <text x="624" y="666" class="metric-lbl">POS 购物车零丢失无缝切店员 (0 重复点单)</text>

  <rect x="888" y="614" width="264" height="68" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
  <text x="904" y="642" class="metric-num">增收节支 $39.2万</text>
  <text x="904" y="666" class="metric-lbl">每万单加购增收 + 错单报废减少 + 释放点餐人手</text>
