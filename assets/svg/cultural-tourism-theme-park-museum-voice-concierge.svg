<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg37" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="museumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="parkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="eventGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg37)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Cultural Tourism, Theme Park Queue Concierge &amp; Museum UWB Voice Docent</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">大型文旅景区、主题乐园排队动态调度、博物馆亚米级（UWB/BLE）多语种伴游与体育场馆语音架构全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">TOUR-VOICE-01 · Sub-0.5m</text>

  <!-- Pillar 1: Museum UWB/BLE Sub-Meter Gaze Docent & Age Persona -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#museumGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 博物馆亚米级定位与分龄互动讲解</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 为什么传统租借讲解器完播率不足 12%？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 按键输入编号听 3分钟死板百度百科录音，小孩2分钟就腻</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 密集展柜蓝牙串台：站在青铜剑前却播起了隔壁陶罐</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">UWB 0.3m 亚米级测距 + 80KB 展品视觉双锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• UWB/BLE AoA 到达角锁定当前驻足展柜 (零串台)</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 游客随手指问：“鼎腿上那个怪兽是什么？” ➔ 视觉秒答</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">千人千面人设切换 (8岁寻宝童话 vs 考古专家)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 亲子家庭：化身“穿越回商朝的小神兽”出趣味寻宝题</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 文博爱好者：深度拆解金文铭文拓片与出土断代史料</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">游客平均停留互动时长从 18分 升至 74分钟</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">文创衍生品语音顺势种草转化率提升 3.2 倍</text>
  </g>

  <!-- Pillar 2: Theme Park Dynamic Queue Load-Balancing & IP Character Voice -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#parkGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 主题乐园削峰填谷动态路线与 IP 伴游</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">全园 8万人排队动态削峰调度 (Queue Balancer)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 实时接入全园 45 个游乐项目排队热力图与天气停演预警</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 发现游客走向排队120分钟的过山车 ➔ 主动语音柔性感召分流</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">“赠饮折扣券 + 免排队预约卡”智能运筹激励</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• “前方飞跃地平线需排2小时，现在先去旁边剧场看演出，</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 我帮您锁好下午3点过山车优先通道，再送两杯半价黄油啤酒！”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">正版 IP 角色克隆音色全程陪伴 (CNV Pro)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 用乐园当家动画主角的专属声音陪孩子排队猜谜语</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 严守儿童角色安全围栏（零成人话题、零跳出人设破功）</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">热门项目峰值排队时长削减 28% · 二消增收 +$8.5/人</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">排队无聊差评率下降 66% · 餐饮错峰上座率拉满</text>
  </g>

  <!-- Pillar 3: Lost-Child Emergency, Stadium Wayfinding & 30-Lang Concierge -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#eventGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 景区走失寻人秒级联动与入境游 30语种</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#3B0764" stroke="#A855F7"/>
    <text x="30" y="82" fill="#F3E8FF" font-size="13" font-weight="700">儿童/老人走失 5秒全园网格锁定 (Lost-Child SOS)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 家长哭喊“孩子穿黄衣服在旋转木马走丢了” ➔ 0秒提取特征</text>
    <text x="30" y="122" fill="#C084FC" font-size="12">• 实时定位租借伴游耳麦 UWB 坐标 + 联动园区安保对讲网</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#E9D5FF" font-size="13" font-weight="700">万人体育场馆/演唱会散场无障碍导航</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 5万人同时散场基站拥塞：端侧离线包引导最近地铁口/网约车点</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 包厢 VIP 语音一键点单啤酒小食直达座位号</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">240小时免签入境游 30+ 小语种随身导游</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 外国游客扫码即获母语伴游（含阿语/俄语/西语/泰语等）</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 自动解答清真餐饮、退税柜台、无障碍坡道与母婴室位置</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">走失儿童平均找回时间从 42分钟 缩至 4.5分钟</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">彻底解决小语种金牌人工导游一票难求痛点</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">智慧文旅、博物馆与主题乐园全天候语音伴游闭环（Smart Tourism &amp; Theme Park Voice Concierge Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 入园绑定：选择专属伴游人设 (IP童话角色 / 考古学家 / 30国母语) ➔ 2. 展厅漫游：UWB 0.3m 精准锁定展柜 + 80KB 指物看图问答</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 园区调度：实时排队热力图触发错峰路线与餐饮优惠券推送 ➔ 4. 应急守护：走失寻人/中暑急救 0秒直通园区安保指挥网</text>
  </g>
</svg>
