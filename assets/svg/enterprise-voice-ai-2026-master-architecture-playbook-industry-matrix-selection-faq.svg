    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Professional &amp; Public: Health, Gov, B2B</text>
