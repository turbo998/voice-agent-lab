    <text x="26" y="86" class="body-text">• G1: Semantic EoU (Smart-Turn v2) + 3-word barge-in</text>
    <text x="26" y="102" class="body-text">• G2: Monotonic turnEpoch fence + 800ms filler</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">+ Two-Phase Prepare/Commit Saga (0% Dirty Writes)</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">G3-G4: FinOps PTU Sizing &amp; 99.99% HA</text>
    <text x="26" y="188" class="body-text">• G3: P65 PTU + 0ms APIM PAYGO spillover + 3-turn</text>
    <text x="26" y="204" class="body-text">  audio compaction ($0.145 → $0.039/min)</text>
    <text x="26" y="224" class="mono">• G4: Decoupled Edge SFU + 650ms Watchdog Failover</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">G5-G6: Zero-Trust Security &amp; PCI SAQ-A</text>
    <text x="26" y="290" class="body-text">• G5: ASVspoof-5 liveness + JWT-injected tool RBAC</text>
    <text x="26" y="306" class="body-text">  (customer_id stripped from LLM schema: 0% IDOR)</text>
    <text x="26" y="324" class="mono" fill="#fde68a">• G6: Edge SBC DTMF clamping + 11s Wallet Push</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">G7: 500-Call Acoustic CI/CD &amp; 7-Hop OTel</text>
    <text x="26" y="386" class="body-text">Catches 96.8% of regressions in &lt;4m pre-release</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">&amp; grades 100% of production calls at $0.004/call</text>
