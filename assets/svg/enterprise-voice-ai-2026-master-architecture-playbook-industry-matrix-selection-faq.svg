  <text x="111" y="46" text-anchor="middle" class="badge">MASTER PLAYBOOK · #522</text>
  <text x="198" y="44" class="title">2026 Enterprise Voice AI Master Playbook: 4 Paradigms, 7 Guardrails &amp; 12 Verticals</text>
  <text x="198" y="65" class="subtitle">The Solution Architect's End-to-End Decision Compass for Production Real-Time Voice &amp; Multimodal Agent Systems</text>

  <!-- Column 1: The 4 Core Voice Architecture Paradigms -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad522)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. Four Core Voice Architecture Paradigms</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">P1: Native S2S vs. P2: S2S + Supervisor</text>
    <text x="26" y="86" class="body-text">• P1 (Pure S2S ~290ms): Roleplay &amp; emotional chat</text>
    <text x="26" y="102" class="body-text">• P2 (S2S + Code Supervisor ~360ms): Enterprise</text>
    <text x="26" y="122" class="mono">CRM/ERP transactional voice with 100% tool lock</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">P3: Streaming Cascade (STT + LLM + TTS)</text>
    <text x="26" y="186" class="body-text">• ~460ms TTFA at $0.028/min (65% lower token cost)</text>
    <text x="26" y="202" class="body-text">• 100% verbatim compliance scripts (BFSI Dual-Rec)</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">&amp; custom brand voice cloning (Azure CNV / VoxCPM2)</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">P4: Sovereign On-Prem Disaggregated GPU</text>
    <text x="26" y="288" class="body-text">• 2:4:2 TensorRT STT + vLLM FP8 + TensorRT TTS</text>
    <text x="26" y="304" class="body-text">• 160 streams per 8x L40S node at $0.011/min</text>
    <text x="26" y="322" class="mono" fill="#fde68a">100% Air-Gapped / FedRAMP High / Schrems II</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">30-Second Paradigm Selector Rule</text>
    <text x="26" y="384" class="body-text">Match latency budget, verbatim script compliance,</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">&amp; data residency before writing a line of code</text>
