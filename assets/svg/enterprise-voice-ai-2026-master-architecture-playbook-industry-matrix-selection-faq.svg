    <text x="26" y="366" class="card-title" fill="#c4b5fd">Guardrail: VOICE-MASTER-PLAYBOOK-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateEnterpriseVoiceAi2026MasterBlueprintGuard</text>
    <text x="26" y="402" class="body-text">522 Bilingual SA Guides · Production-Verified</text>
