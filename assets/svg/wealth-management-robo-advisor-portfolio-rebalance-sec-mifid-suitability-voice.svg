  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">财富管理与证券 AI 语音投顾三大合规铁律 (WEALTH-ROBO-ADVISOR-SUITABILITY-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 适当性硬拦截：当客户风险等级 `C_Tier &lt; 产品 R_Tier` 或风险测评已过期时，物理锁死高风险产品推荐与认购通道；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 零保本承诺与双因子交易锁：100% 拦截任何“保本/稳赚/必涨”预测词；语音仅生成调仓草稿，最终成交必须经 App 双因子确认。</text>
