  <rect width="1280" height="760" fill="url(#bgGrad405)"/>
  <rect x="28" y="22" width="1224" height="74" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="22" width="8" height="74" rx="4" fill="url(#accentGrad405)"/>
  <text x="52" y="52" class="title">Cross-Border E-Commerce Multilingual RMA Returns, Instant Refund &amp; Exchange Voice Architecture</text>
  <text x="52" y="76" class="subtitle">Original-Payment &amp; Net-Paid Refund Cap Lock (0% Over-Refund) · Return-to-Exchange (+36% Retained GMV) · 0ms Product-Safety Bridge</text>
  <rect x="980" y="38" width="252" height="32" rx="16" fill="#10B981"/>
  <text x="996" y="59" class="badge">ECOMMERCE-MULTILINGUAL-RMA-VOICE-01</text>

  <!-- Left Column: Global Shopper Voice & Commerce/OMS Bus -->
  <rect x="28" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="144" class="card-title">1. Global Shopper Ingress &amp; Commerce OMS</text>
  <text x="48" y="164" class="card-sub">Shopify Plus / Salesforce Commerce · Loop Returns · Stripe</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">28-Language Post-Purchase Voice Concierge</text>
  <text x="64" y="224" class="body">• EN / DE / FR / ES / JP / KR / AR native shopping support</text>
  <text x="64" y="242" class="body">• In-call WhatsApp/SMS defect photo &amp; barcode scan</text>
  <text x="64" y="260" class="mono">Order_Lookup_Latency = 180ms (Caller-ID Phone Match)</text>

  <rect x="48" y="298" width="340" height="108" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="64" y="320" class="card-title">Reverse-Logistics &amp; Tariff Economics Engine</text>
  <text x="64" y="340" class="body">• Compares Item COGS vs DHL/FedEx return label + duty</text>
  <text x="64" y="358" class="body">• Live local warehouse stock for instant size/color swap</text>
  <text x="64" y="376" class="mono">Return_Shipping = $16.50 &gt; Item_COGS = $9.20</text>

  <rect x="48" y="420" width="340" height="108" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="64" y="442" class="card-title">Payment Gateway &amp; Return-Abuse Risk Score</text>
  <text x="64" y="462" class="body">• Stripe / Adyen original payment token &amp; net paid cap</text>
  <text x="64" y="480" class="body">• Signifyd / Riskified serial wardrobing &amp; DNR fraud score</text>
  <text x="64" y="498" class="mono">Customer_LTV = $1,420 | Abuse_Score = 0.04 (Trusted)</text>

  <rect x="48" y="542" width="340" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="64" y="564" class="card-title">EU 14-Day Cooling-Off &amp; Consumer Law Vault</text>
  <text x="64" y="584" class="body">• EU Directive 2011/83/EU statutory 14-day withdrawal</text>
  <text x="64" y="602" class="body">• Final-sale / hygiene-sealed underwear &amp; cosmetics rules</text>
  <text x="64" y="620" class="mono">Statutory_Right = EU_14d_Withdrawal_Active</text>

  <!-- Center Column: 3-Layer Deterministic RMA & Refund Gate -->
  <rect x="436" y="114" width="408" height="536" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <text x="456" y="144" class="card-title">2. Deterministic Refund Cap &amp; Exchange Gate</text>
  <text x="456" y="164" class="card-sub">Zero Over-Refund · +36% Exchange Save · 0ms Safety Escalate</text>

  <rect x="456" y="182" width="368" height="136" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="472" y="204" class="card-title">Gate A: Net-Paid Cap &amp; Original-Tender Hard Lock</text>
  <text x="472" y="224" class="body">• Blocks prompt-injection attempts to refund &gt; net paid</text>
  <text x="472" y="242" class="body">  (`Refund &lt;= Net_Paid - Prior_Refunds`) or swap cards</text>
  <text x="472" y="260" class="body">• Enforces idempotency key on Stripe/Adyen refund API</text>
  <text x="472" y="280" class="mono">Over_Refund_Or_Duplicate_Payout = 0.0% (Hard Locked)</text>
  <text x="472" y="298" class="mono">Unverified_Alternate_Card_Refund = 0.0%</text>

  <rect x="456" y="332" width="368" height="136" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="472" y="354" class="card-title">Gate B: Smart Exchange &amp; Returnless Refund Gate</text>
  <text x="472" y="374" class="body">• Diagnoses fit issue via voice ("Too tight in shoulders")</text>
  <text x="472" y="392" class="body">  &amp; offers instant free size swap + $10 bonus credit</text>
  <text x="472" y="410" class="body">• Approves Keep-the-Item only if COGS &lt; Ship &amp; Low Risk</text>
  <text x="472" y="430" class="mono">Refund_To_Exchange_Conversion = 44.2% (+36% GMV Saved)</text>
  <text x="472" y="448" class="mono">Reverse_Logistics_Shipping_Savings = -29%</text>

  <rect x="456" y="482" width="368" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="472" y="504" class="card-title">Gate C: 0ms Product Safety &amp; High-Value Fraud Bridge</text>
  <text x="472" y="524" class="body">• Detects product safety hazard (battery overheating,</text>
  <text x="472" y="542" class="body">  allergic rash, choked part), order &gt; $500, or abuse</text>
  <text x="472" y="560" class="body">• Halts auto-RMA in 0ms; prohibits shipping swollen</text>
  <text x="472" y="578" class="body">  battery by air &amp; bridges Senior Product Safety / VIP Desk</text>
  <text x="472" y="600" class="mono">if (productSafetyHazardOrHighValueDispute) -&gt; 0ms VIP_Desk</text>
  <text x="472" y="618" class="mono">P99_Gate_Latency = 18ms | Hazmat_Return_Block = 100%</text>

  <!-- Right Column: OMS Execution & Retail KPIs -->
  <rect x="872" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="892" y="144" class="card-title">3. Instant Label, Exchange &amp; Margin ROI</text>
  <text x="892" y="164" class="card-sub">QR Drop-Off Label · Instant Exchange Ship · Chargeback Drop</text>

  <rect x="892" y="182" width="340" height="126" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="908" y="204" class="card-title">Zero-Printer QR Return &amp; Instant Exchange</text>
  <text x="908" y="224" class="body">• Sends printerless USPS/DHL/Hermes QR code via SMS</text>
  <text x="908" y="242" class="body">• Releases replacement size order immediately on carrier</text>
  <text x="908" y="260" class="body">  first-scan (In-Transit Exchange) for trusted shoppers</text>
  <text x="908" y="282" class="mono">RMA_Call_Resolution_Time = 72s (vs 7.5m Manual)</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="908" y="346" class="card-title">Chargeback Prevention &amp; WISMO Deflection</text>
  <text x="908" y="366" class="body">• Resolves "Where Is My Order (WISMO)" customs delays</text>
  <text x="908" y="384" class="body">• Issues proactive delay courtesy coupon before buyer</text>
  <text x="908" y="402" class="body">  files a $15 Stripe/Visa credit-card chargeback</text>
  <text x="908" y="424" class="mono">Friendly_Fraud_Chargeback_Rate = -54% Reduction</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="908" y="498" class="card-title">Benchmark &amp; TCO Summary (10k RMA/WISMO Calls)</text>
  <text x="908" y="520" class="body">• Multilingual BPO Agents: $72,000 / 10k calls ($7.20/ea)</text>
  <text x="908" y="538" class="body">• Hybrid RMA+Exchange Voice: $940 / 10k calls (Rec)</text>
  <text x="908" y="556" class="body">• Unguarded Refund Bot: $1,850 + prompt-injection loss</text>
  <text x="908" y="578" class="mono">Retained_Revenue_Per_10k_RMA_Calls = +$148,000 GMV</text>
  <text x="908" y="596" class="mono">Over_Refund_Exploits = 0 | Shopper_CSAT = 95.2%</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateCrossBorderEcommerceRmaRefundVoiceGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="696" class="card-title">Cloud &amp; AI Solution Architect Takeaway — Cross-Border E-Commerce Multilingual RMA &amp; Exchange Voice Copilot</text>
  <text x="52" y="718" class="body">Turn returns into retained exchanges via conversational fit diagnosis, hard-lock refunds to original payment net-paid caps, and gate returnless refunds on COGS math.</text>
