<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg312" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card312" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg312)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1224" height="78" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="48" y="54" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">
    Multi-Agent Voice Orchestration &amp; Specialist Handoff Graph (MULTI-AGENT-VOICE-SWARM-HANDOFF-01)
  </text>
  <text x="48" y="81" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">
    LiveKit Agents Handoff vs. Pipecat Flows vs. LangGraph · &le;6 Tools/Agent Sandbox · Silent Single-Persona Transition · Anti-Ping-Pong Breaker
  </text>

  <!-- Left Column: Multi-Agent Topology -->
  <rect x="28" y="118" width="290" height="465" rx="12" fill="url(#card312)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="148" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    1. Specialist Sub-Agent Graph
  </text>

  <rect x="46" y="166" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Front-Door Triage &amp; Auth Agent</text>
  <text x="60" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 350-token prompt + 3 KYC tools</text>
  <text x="60" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Classifies intent &amp; mints auth token</text>

  <rect x="46" y="266" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Billing &amp; Refund Specialist</text>
  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Scoped to 5 ledger/dispute tools</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Zero access to technical reboot APIs</text>

  <rect x="46" y="366" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="390" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Technical Triage Specialist</text>
  <text x="60" y="411" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Scoped to 5 diagnostic/RMA tools</text>
  <text x="60" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Shares unified brand TTS voice ID</text>

  <rect x="46" y="466" width="254" height="98" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="490" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Swarm vs Monolith Gains</text>
  <text x="60" y="511" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tool Accuracy: 74.2% -&gt; 99.1%</text>
  <text x="60" y="530" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prompt Token Cost: -68% per turn</text>
  <text x="60" y="549" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Swarm TCO: $550 / 10k min</text>

  <!-- Center Column: 3 Deterministic Multi-Agent Handoff Gates -->
  <rect x="338" y="118" width="584" height="465" rx="12" fill="url(#card312)" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="148" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    2. Deterministic Multi-Agent Handoff &amp; Loop-Prevention Engine
  </text>

  <!-- Gate 1 -->
  <rect x="358" y="166" width="544" height="122" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="376" y="191" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate A · Pre-Handoff Auth Contract &amp; &le;6-Tool Sandbox Lock
  </text>
  <text x="376" y="214" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Hard Rule: Never stuff 45 tools &amp; 8,000 prompt tokens into one monolithic voice agent!
  </text>
  <text x="376" y="235" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Blocks transition to Billing/Order Sub-Agent unless KYC_Verified_Token == PRESENT
  </text>
  <text x="376" y="256" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Restricts each specialist node to &le;6 domain tools &amp; &le;600-token focused prompt
  </text>
  <text x="376" y="275" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Eliminates cross-domain tool hallucinations &amp; cuts LLM TTFT from 580ms to 190ms
  </text>

  <!-- Gate 2 -->
  <rect x="358" y="302" width="544" height="122" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="376" y="327" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate B · Silent Single-Persona Handoff &amp; &lt;150-Token State Compaction
  </text>
  <text x="376" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Keeps identical WebRTC/SIP session &amp; TTS Voice_ID across sub-agent swaps (&lt;15ms)
  </text>
  <text x="376" y="371" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Never announces "Please hold while I transfer you to the Billing Bot" (zero fake hold)
  </text>
  <text x="376" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Passes a typed &le;150-token SessionState struct instead of raw multi-turn transcripts
  </text>
  <text x="376" y="411" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Caller experiences one seamless omni-capable concierge with zero handoff delay
  </text>

  <!-- Gate 3 -->
  <rect x="358" y="438" width="544" height="126" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="376" y="463" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate C · 0ms Anti-Ping-Pong Loop Breaker (&gt;2 Hops) &amp; Supervisor Bridge
  </text>
  <text x="376" y="486" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Triggers if sub-agent handoff graph detects a cycle (A -&gt; B -&gt; A) or Hops &gt; 2
  </text>
  <text x="376" y="507" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • 0ms circuit breaker: Freezes sub-agent routing &amp; invokes Supervisor Resolver / Human
  </text>
  <text x="376" y="528" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Supports compound multi-intent resolution ("Check my bill AND fix my router")
  </text>
  <text x="376" y="549" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Zero infinite agent-to-agent ping-pong loops on ambiguous cross-domain requests
  </text>

  <!-- Right Column: Orchestration Frameworks -->
  <rect x="942" y="118" width="310" height="465" rx="12" fill="url(#card312)" stroke="#10b981" stroke-width="1.5"/>
  <text x="962" y="148" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    3. Multi-Agent Frameworks
  </text>

  <rect x="962" y="168" width="270" height="92" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="978" y="193" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">LiveKit Agents 1.0 Handoff</text>
  <text x="978" y="214" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Native tool-return Agent instance swap</text>
  <text x="978" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Shared userdata typed context</text>

  <rect x="962" y="276" width="270" height="92" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="978" y="301" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Pipecat Flows (DAG State)</text>
  <text x="978" y="322" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Deterministic node-to-node schema</text>
  <text x="978" y="342" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hot-swaps prompt &amp; tool list in 5ms</text>

  <rect x="962" y="384" width="270" height="92" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="978" y="409" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">LangGraph / Semantic Kernel</text>
  <text x="978" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Async background workflow graphs</text>
  <text x="978" y="450" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Avoid serial multi-LLM hops in audio path</text>

  <rect x="962" y="492" width="270" height="72" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="978" y="517" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Typed SessionState Store</text>
  <text x="978" y="538" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Redis / In-Memory Handoff Ledger</text>

  <!-- Bottom Sequence Strip -->
  <rect x="28" y="600" width="1224" height="136" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="628" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    End-to-End Multi-Agent Voice Swarm Sequence (&lt;15ms Silent Node Swap / 99.1% Scoped Tool Accuracy)
  </text>

  <rect x="48" y="644" width="275" height="74" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="62" y="666" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">1. Triage &amp; Auth Gate</text>
  <text x="62" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Verifies caller OTP &amp; classifies intent</text>
  <text x="62" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Mints KYC token into SessionState</text>

  <rect x="343" y="644" width="285" height="74" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="357" y="666" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">2. &lt;15ms Silent Node Swap</text>
  <text x="357" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Swaps to Billing Agent (5 scoped tools)</text>
  <text x="357" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Same TTS voice answers in 360ms</text>

  <rect x="648" y="644" width="285" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="662" y="666" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">3. 0ms Anti-Ping-Pong Breaker</text>
  <text x="662" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Detects Billing &lt;-&gt; Tech cycle (Hop=3)</text>
  <text x="662" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Escalates to Supervisor / Human specialist</text>

  <rect x="953" y="644" width="279" height="74" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="967" y="666" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">4. Scoped Graph vs Monolith</text>
  <text x="967" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">360ms P95 · $550 vs $1,120 / 10k min</text>
  <text x="967" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">-50.9% TCO via compact 500-token prompts</text>
</svg>
