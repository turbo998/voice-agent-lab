  <text x="636" y="192" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">🛡️ 专题 3A (speculative-voice-rag-faq.md) · P719 只读投机预检索句尾二次核验</text>
  <text x="636" y="213" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 痛点：客户前半句说“查白金卡年费”(已触发预取)，句尾改口“…不对，查普通金卡”</text>
  <text x="636" y="233" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 机制：比对 Partial vs Final 相似度(&gt;=0.88)与否定极性；反转则策略状态机 &lt;1ms (synthetic) 废止旧缓存</text>
  <text x="636" y="253" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11">• 口径：只读幂等锁 + &lt;=120 Tokens 微切片；真实外部向量库重查(120~180ms)为 not_measured</text>

