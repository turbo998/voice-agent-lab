  <text x="636" y="300" fill="#E879F9" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">🔒 专题 3B (voice-tool-epoch-fence-faq.md) · P720 异步工具纪元写栅栏与 Saga</text>
  <text x="636" y="321" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 痛点：AI 正在跑 1.8s 退票接口(epoch=22)，客户在 900ms 喊“等等别退了！”(epoch=23)</text>
  <text x="636" y="341" fill="#F5D0FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 机制：检测到 invocationEpoch(22) !== activeTurnEpoch(23)，策略状态机 &lt;1ms (synthetic) 触发 Saga 冲正</text>
  <text x="636" y="361" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11">• 口径：前导话术禁提前承诺；真实外部 CRM/ERP 事务回滚网络 I/O 为 not_measured</text>

