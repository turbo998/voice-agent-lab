  <text x="440" y="514" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 架构：流式 ASR 60% 提前检索 + P719 句尾核验</text>
  <text x="440" y="536" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 实测收益：TTFA 1850ms → 320ms (提速 82.7%)</text>
  <text x="440" y="558" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 句尾改口错读率：19.6% → 0.0% (合成基准 P719)</text>
