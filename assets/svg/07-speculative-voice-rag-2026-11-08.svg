  <text x="810" y="492" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 适用：银行转账、航司退改签、ERP/CRM 写操作</text>
  <text x="810" y="514" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 架构：300ms 前导话术 + 1.5s 音效 + P720 写栅栏</text>
  <text x="810" y="536" fill="#F5D0FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 实测收益：“喂喂”冷场追问率 38.4% → &lt;0.6%</text>
  <text x="810" y="558" fill="#F5D0FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12">• 打断孤儿写入率：14.2% → 0.0% (合成基准 P720)</text>
