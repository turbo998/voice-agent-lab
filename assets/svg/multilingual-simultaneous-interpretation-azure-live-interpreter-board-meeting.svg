  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE A: SOV/SVO Negation-Polarity &amp; Numeric Scale Lock</text>
  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: clauseNegationPolarityAndNumericScaleVerified === true</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Holds Japanese/German verb-final clauses until predicate completion so</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  "We cannot approve (...承認できません)" is never translated prematurely as "Approve"</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Cross-checks 10^4 (万/亿) vs 10^6 (Million/Billion) unit conversions</text>

  <rect x="372" y="294" width="456" height="145" rx="10" fill="#172554" stroke="#38bdf8" stroke-width="1.8"/>
