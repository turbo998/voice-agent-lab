  <text x="64" y="358" class="body">• Barge-in count, dead-air gaps (&gt;1.2s) &amp; WER confidence</text>
  <text x="64" y="376" class="mono">Media_MOS_Score = 4.35 | Silence_Gap_Alerts = 0</text>

