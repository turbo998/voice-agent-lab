  <text x="48" y="164" class="card-sub">Langfuse / Arize Phoenix / Datadog · W3C TraceContext</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">Frame-Accurate Turn Latency Spans</text>
  <text x="64" y="224" class="body">• `vad.speech_end` -&gt; `stt.final_transcript` (85ms)</text>
  <text x="64" y="242" class="body">• `llm.ttft` (180ms) -&gt; `tts.ttfa` (110ms) -&gt; `rtp.out`</text>
  <text x="64" y="260" class="mono">Total_Turn_Voice_To_Voice_P50 = 415ms | P99 = 690ms</text>

