<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#121F3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="battleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="crmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg27)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Wealth Advisor, Insurance Agent &amp; Pharma MSL Field Voice Copilot</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">财富管理理财师、保险代理人与医药代表“线下/视频面谈实时语音合规陪访助手（Field Advisory Copilot）”全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">ADVISOR-COPILOT-01 · &lt;=1.2s</text>

  <!-- Pillar 1: Smart Badge / iPad Beamforming & Multi-Speaker Diarization -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#badgeGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 智能工牌/iPad 拾音与多人角色分离</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="82" fill="#93C5FD" font-size="13" font-weight="700">攻克 72dB 咖啡厅/贵宾室嘈杂面谈环境</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 双麦心形波束成形工牌 + iPad 桌面协同拾音</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 断网本地加密闪存环缓冲，恢复网络自动续传</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">理财师锚定 + 夫妻双客户实时分离 (Diarization)</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 预绑定顾问声学特征 (Speaker_0 = Advisor)</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 精准区分男主人（关注收益）与女主人（关注子女教育）</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#FBBF24" font-size="13" font-weight="700">面谈前首句录音双录授权锁 (Consent Gate)</text>
    <text x="30" y="290" fill="#E2E8F0" font-size="12">• 开启陪访前强制记录客户口头或 iPad 触屏授权</text>
    <text x="30" y="308" fill="#94A3B8" font-size="12">• 硬件物理指示灯常亮，100% 符合金融消保与医药合规</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">多人交叠谈话角色分离准确率达 96.4%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">彻底终结“45分钟线下拜访过程全黑盒”</text>
  </g>

  <!-- Pillar 2: <=1.2s Silent iPad Battlecard & Haptic Compliance Guard -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#battleGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. &lt;=1.2s 静默话术弹卡与违规震动纠偏</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">静默视觉弹卡 (Silent Visual Battlecard)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 客户问：“第3年急用钱退保能拿回多少？怎么抵税？”</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 1.2s 内 iPad 静默弹出保单现金价值表与税优法条对比</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="174" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 实时禁用词与超适应症推广震动拦截</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 顾问一旦误说“稳赚保本”或医药代表提及未获批适应症</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 手表/手机立即震动 + 弹出标准免责纠偏话术让当场补救</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">送客前“必填合规披露项”完整性绿灯锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 实时勾选：风险等级匹配、犹豫期告知、费率扣除说明</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 漏讲任何 1 项禁止点击“完成面谈签单”，当场消灭废单</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">新人顾问首年高客单产品签单率提升 38%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">面谈销售误导与双录事后返工率压降至 &lt; 0.3%</text>
  </g>

  <!-- Pillar 3: 5s Post-Meeting CRM Sync (Salesforce / Veeva) & Proposal -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#crmGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 5秒生成家庭图谱、CRM 与定制建议书</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="30" y="82" fill="#FDE68A" font-size="13" font-weight="700">自动抽取 KYCC 家庭资产与健康图谱</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 从45分钟闲聊中精准提取：子女留学年份、房贷余额、</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 父母慢病史、到期存款时间窗，结构化写入 CRM</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FCD34D" font-size="13" font-weight="700">医药代表 (MSL/Rep) Veeva CRM 合规回写</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 自动归纳医生临床用药顾虑、学术文献需求与跟进任务</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 若谈话中医生提及患者不良反应，0秒自动触发 P89 PV 上报</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">走出咖啡厅前：一键发送企微定制方案卡片</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 5秒生成带客户专属测算数据的双语图文配置建议书</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 顾问确认签名后一键推送客户企微/邮箱，趁热打铁锁单</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">每天为每位顾问释放 90 分钟晚间填单时间</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">CRM 商机字段完整率从 34% 跃升至 98.5%</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">线下/视频顾问面谈实时语音赋能全链路（Field Advisory Voice Copilot Lifecycle）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 面谈开启：iPad/工牌双麦波束拾音 + 客户授权锁 ➔ 2. 谈话中：多人声纹角色分离 + &lt;=1.2s 静默推送保单/税法弹卡</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 合规护航：禁用词手表震动纠偏 + 送客前必讲条款绿灯核验 ➔ 4. 面谈结束 5s：Fast Transcription 抽取家庭图谱写入 Salesforce/Veeva</text>
  </g>
</svg>
