  <text x="435" y="218" class="node-sub">• 识别隐藏木糖醇代称 (`Birch Bark Extract / 桦树皮提取物`)</text>
  <text x="435" y="236" class="node-sub">• 精确区分牛奶巧克力 (2.4mg/g) vs 85% 黑巧 (14mg/g 可可碱)</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
