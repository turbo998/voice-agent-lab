  <text x="435" y="306" class="node-sub">• 调取 PIMS 档案最新体重 (如 8.2kg 法斗)，严禁大模型自由心算</text>
  <text x="435" y="324" class="node-sub">• 可可碱 &gt;=20mg/kg (呕吐) / &gt;=40mg/kg (心律失常) / &gt;=60mg/kg (抽搐)</text>
  <text x="435" y="342" class="node-sub">• 葡萄/百合花(对猫剧毒)/布洛芬实行“零安全阈值”100% 强制催吐送医</text>

