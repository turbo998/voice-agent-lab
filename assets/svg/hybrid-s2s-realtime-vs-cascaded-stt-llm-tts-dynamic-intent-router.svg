  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: turnRequiresRegulatedVerbatimOrDeterministicTool === false</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks Native S2S direct audio generation on financial/medical/legal turns</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  requiring 100% verbatim statutory disclosures or deterministic tool gates</text>
