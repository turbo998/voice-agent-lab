  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Prevents jarring "two different people on the phone" persona changes by</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  pinning both lanes to a single Custom Neural Voice (CNV) / vocoder profile</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Synchronizes rolling transcript &amp; slot state across S2S and Cascade</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: S2S Audio-Token Budget Cap &amp; Auto-Demotion Circuit Breaker</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: s2sAudioTokenCostExceedsCallBudgetCap === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets forceCascadeFallbackAndBudgetClampTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Demotes long-running calls (&gt; 180s S2S window) to $0.045/min Cascaded</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  lane at turn boundary, cutting blended enterprise TCO by 64%</text>
  <text x="600" y="582" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blended Cost: $0.072/min (Hybrid Router) vs $0.210/min (Pure S2S)</text>

