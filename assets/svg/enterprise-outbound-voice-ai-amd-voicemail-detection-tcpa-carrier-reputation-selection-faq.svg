<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg510" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad510" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad510" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad510" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="roseGrad510" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg510)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#emeraldGrad510)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">OUTBOUND AI · #510</text>
  <text x="194" y="44" class="title">Enterprise Outbound Voice AI: &lt;650ms Dual-Stage AMD, Branded ID &amp; TCPA Compliance</text>
  <text x="194" y="65" class="subtitle">&lt;650ms Human vs. Voicemail AMD (98.9% Accuracy) + STIR/SHAKEN A-Level Branded Caller ID (64.8% Answer Rate) + 0ms TCPA DNC Lock</text>

  <!-- Column 1: <650ms Dual-Stage AMD & Post-Beep Voicemail Drop -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad510)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. &lt;650ms Dual-Stage AMD &amp; Voicemail Drop</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Eliminates the "3.5s Dead-Air Hang-Up"</text>
    <text x="26" y="86" class="body-text">• Legacy carrier AMD waits 3.5s before connecting,</text>
    <text x="26" y="102" class="body-text">  causing 48% of live humans ("Hello?") to hang up!</text>
    <text x="26" y="122" class="mono">Stage-1 Acoustic Classifier Replies in &lt;650ms</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Mid-Greeting Voicemail Abort &amp; Beep Lock</text>
    <text x="26" y="186" class="body-text">• If callee keeps speaking past 1.8s ("Hi, you've</text>
    <text x="26" y="202" class="body-text">  reached Alex, leave a message..."), AI mutes</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">instantly &amp; waits for 800-1400Hz Voicemail Beep!</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Zero-LLM-Cost Cached Voicemail Drop</text>
    <text x="26" y="288" class="body-text">• Tears down expensive S2S session on VM detection</text>
    <text x="26" y="304" class="body-text">• Plays 15s pre-rendered callback voicemail after</text>
    <text x="26" y="322" class="mono" fill="#fde68a">beep + sends 1-tap SMS link (-74% VM Token Waste)</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">98.9% Human vs. Machine Precision</text>
    <text x="26" y="384" class="body-text">Handles iOS Live Voicemail transcripts &amp; carrier</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">screening assistants without truncated messages</text>
  </g>

  <!-- Column 2: STIR/SHAKEN Level-A & Branded Caller ID Reputation -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad510)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. Branded Caller ID &amp; Spam-Label Defense</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">STIR/SHAKEN "A" Attestation + Branded RCD</text>
    <text x="26" y="86" class="body-text">• Registers DIDs with Hiya / FirstOrion / TNS &amp;</text>
    <text x="26" y="102" class="body-text">  Apple Business Caller ID (Logo + Call Reason)</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">Lifts Outbound Answer Rate from 24.0% to 64.8%</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">DID Velocity &amp; Short-Call Ratio Guard</text>
    <text x="26" y="188" class="body-text">• Carriers flag numbers as "Spam Likely" if &gt;60</text>
    <text x="26" y="204" class="body-text">  calls/day/DID or &gt;25% calls last &lt;6 seconds</text>
    <text x="26" y="224" class="mono">Paces DID Pool &amp; Auto-Quarantines Flagged Numbers</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">Pre-Call Warm SMS Notification ("Heads-Up")</text>
    <text x="26" y="290" class="body-text">• Texts opted-in customer 60s before dialing:</text>
    <text x="26" y="306" class="body-text">  "Calling in 1 min regarding your Rx / loan app"</text>
    <text x="26" y="324" class="mono" fill="#fde68a">+31% Live Pickup &amp; Near-Zero Spam Reports</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Automated Daily Carrier Reputation Probe</text>
    <text x="26" y="386" class="body-text">Tests DIDs across AT&amp;T, T-Mobile &amp; Verizon</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">screens daily for 0% "Scam/Spam Likely" display</text>
  </g>

  <!-- Column 3: FCC / TCPA AI Voice Consent, Curfew & 0ms DNC Lock -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#roseGrad510)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. FCC / TCPA Consent, Curfew &amp; DNC Lock</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#fb7185">Pre-Dial TCPA 1:1 Consent &amp; Reassigned Check</text>
    <text x="26" y="86" class="body-text">• Verifies signed TCPA AI-voice consent receipt +</text>
    <text x="26" y="102" class="body-text">  queries FCC Reassigned Numbers Database (RND)</text>
    <text x="26" y="122" class="mono" fill="#fda4af">Blocks Dialing Recycled Numbers ($1,500/Call Fine!)</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#34d399">Strictest Time-Zone Intersection Curfew</text>
    <text x="26" y="188" class="body-text">• Intersects Area-Code TZ + Billing Zip-Code TZ</text>
    <text x="26" y="204" class="body-text">• Dials ONLY when BOTH fall inside 8 AM–8 PM</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">&amp; blocks state holiday / Sunday dialing curfews</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">0ms Natural-Language Opt-Out &amp; DNC Write</text>
    <text x="26" y="288" class="body-text">• If callee says "Stop calling / take me off list",</text>
    <text x="26" y="304" class="body-text">  forbids AI rebuttal! Commits Global DNC in 0ms</text>
    <text x="26" y="322" class="mono">&amp; hangs up politely within &lt;3 seconds</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#fb7185" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#fda4af">Guardrail: OUTBOUND-AMD-TCPA-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateEnterpriseOutboundVoiceAmdTcpaGuard</text>
    <text x="26" y="402" class="body-text">64.8% Answer Rate · -$405k/10k Hrs TCPA &amp; VM Saved</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Enterprise Outbound Voice AI, AMD &amp; TCPA Compliance Benchmarks (per 10,000 Dialing Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Human vs. Voicemail AMD</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">98.9% (&lt;650ms Human Reply)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Live Customer Answer Rate</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">24.0% → 64.8% (Branded ID)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">TCPA Curfew / DNC Violations</text>
    <text x="16" y="50" class="kpi-num" fill="#fb7185">0.00% ($1,500/Call Protected)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Net Savings &amp; Conversion Lift</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$405,000 / 10k Hours</text>
  </g>
</svg>
