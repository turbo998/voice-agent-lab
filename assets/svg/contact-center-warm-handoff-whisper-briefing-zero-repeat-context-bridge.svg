  <text x="600" y="340" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: targetSkillQueueStaffedAndWhisperAcked === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Never dumps caller into an unstaffed queue! Dials specialist leg first,</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  plays 6-sec whisper briefing to agent, and bridges caller only on agent ack</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Offers scheduled callback if queue wait exceeds 120 seconds</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: 0ms High-Risk Sentiment / Regulatory Escalation Bridge</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: callerSentimentCriticalOrRegulatedDispute === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets immediateSupervisorWarmHandoffTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Transitions AI from active speaker to silent real-time Agent Assist</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  Copilot (surfacing live KB cards &amp; post-call ACW disposition summary)</text>
  <text x="600" y="582" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cuts Human Agent Handle Time (AHT) by -41% (-98 seconds per transfer)</text>

