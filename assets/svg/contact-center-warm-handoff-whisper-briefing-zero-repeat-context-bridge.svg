  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: verifiedAuthTokenAndRedactedSlotsAttached === true</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks blind/cold call transfer! Requires attaching verified KYC/OTP badge,</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  structured slots, and PCI-redacted 3-bullet summary to CRM screen-pop</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Agent greets caller with: "Hi Ms. Li, I see your flight LH729 rebooking..."</text>

