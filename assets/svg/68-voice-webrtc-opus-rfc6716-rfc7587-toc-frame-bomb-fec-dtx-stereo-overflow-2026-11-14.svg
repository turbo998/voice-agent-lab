  <text x="793" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">OpusDecoder(channels=1) Fixed</text>
  <text x="793" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">0 Unnegotiated s=1 Buffer Overflows</text>

  <rect x="957" y="454" width="259" height="92" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="1086" y="478" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 4: LBRR/PLC [1, 3] Cap</text>
  <text x="1086" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Max 3 Extrapolated Frames</text>
  <text x="1086" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">866 Automated Unit Tests Green</text>

  <text x="64" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">定量收敛结论：100% 拦截 Code 3 多帧算力炸弹与 s=1 双声道 2x 堆缓冲区溢出，将連続丢包 PLC 钳制在 [1, 3] 帧消除金属尾音幻觉。</text>
  <text x="64" y="604" fill="#94A3B8" font-family="Consolas, monospace" font-size="11.5">Docs: docs/voice-webrtc-opus-rfc6716-rfc7587-toc-frame-bomb-fec-dtx-stereo-overflow-faq.md (.en.md) · Guardrails: P841 &amp; P842</text>
