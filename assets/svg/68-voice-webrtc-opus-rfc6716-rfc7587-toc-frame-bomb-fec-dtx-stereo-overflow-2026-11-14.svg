  <rect x="44" y="38" width="310" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="199" y="57" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STAGE 424 · TOPIC 64 · P841 / P842 · 860 PROBES 🎉</text>
  <text x="372" y="57" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">WebRTC RFC 6716 / RFC 7587 Opus TOC Code-3 Frame Bomb &amp; Stereo Downmix / LBRR PLC Guard</text>
  <text x="44" y="88" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">WebRTC Opus TOC Code 3 帧计数炸弹预检（[10,60]ms / &lt;=120ms）与非协商双声道 s=1 安全下混及 LBRR/PLC [1,3] 帧上限门禁（🎉 851 护栏 &amp; 860 探针 &amp; 670 POC 探针里程碑）</text>
  <line x1="44" y1="102" x2="1236" y2="102" stroke="url(#accent68)" stroke-width="2"/>

  <!-- Left Column: RFC 6716 TOC Code-3 Frame Bomb Gate (P841) -->
  <rect x="44" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="146" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. RFC 6716 Opus TOC Code-3 Frame-Count Bomb Gate (P841)</text>
  <text x="64" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：36B 短包谎报 Code 3 (M=54, 60ms) 触发 24x CPU 空转解码或 M=0 除零崩溃</text>
  <text x="64" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 越界手法：双字节 VBR 子帧声明长度 N1+N2 &gt; rtpPayloadBytes 触发堆越界读</text>
  <rect x="64" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Malformed Opus: TOC c=3, M=54 (3240ms &gt; 120ms) or M=0 Div-By-Zero</text>
  <text x="80" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P841 Gate: M &gt;= 1 &amp;&amp; M*frame_ms &lt;= 120ms &amp;&amp; sum(len_i) &lt;= payloadBytes</text>
  <text x="80" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: drop_code3_frame_bomb_and_clamp_opus_duration ([10, 60]ms)</text>
  <text x="64" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P841）：</text>
  <text x="64" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMalformedOrOver120msOpusPackets = 0（解码前 100% 丢弃畸形/超 120ms 包）</text>
  <text x="64" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxOpusPacketDurationMs ∈ [10, 60]（实时全双工推荐单包时长上限）</text>

  <!-- Right Column: RFC 7587 Stereo Downmix & LBRR/PLC Gate (P842) -->
  <rect x="652" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
  <text x="672" y="146" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. RFC 7587 Stereo Overflow &amp; LBRR FEC / PLC Gate (P842)</text>
  <text x="672" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：SDP 协商 stereo=0，但包内 TOC s=1 写出 2x 采样（3840B）写穿 1920B 缓冲区</text>
  <text x="672" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 幻觉风险：连丢 &gt;3 包时无限 PLC 外推产生机械金属颤音，诱导 ASR 幻觉</text>
  <rect x="672" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="688" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Stereo Spike: TOC s=1 -&gt; 1920 samples (3840B) into pcm_mono[960] (1920B)</text>
  <text x="688" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P842 Gate: Hard-lock OpusDecoder(channels=1) + LBRR/PLC in [1, 3] Frames</text>
  <text x="688" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: downmix_stereo_to_mono_and_bound_lbrr_plc_recovery</text>
  <text x="672" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P842 · 🎉 860 合成探针 &amp; 670 POC 探针里程碑）：</text>
  <text x="672" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedStereoBufferOverflowAttempts = 0（强制单声道下混，0 立体声越界写）</text>
  <text x="672" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxConsecutiveLbrrPlcFrames ∈ [1, 3]（超 3 帧切入零静音防 ASR 幻觉）</text>

  <!-- Bottom Full-Width Pipeline & Quantitative Matrix -->
  <rect x="44" y="410" width="1192" height="248" rx="12" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
  <text x="64" y="438" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Zero-Copy Opus Pre-Decode Pipeline &amp; Stage 424 Scorecard (427 Dims · 851 Guardrails · 860 Probes 🎉 · 670 POC Probes 🎉)</text>

  <rect x="64" y="454" width="265" height="92" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="196" y="478" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 1: TOC &amp; M Bounds</text>
  <text x="196" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">M &gt;= 1 &amp;&amp; M*frame_ms &lt;= 120ms</text>
  <text x="196" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Realtime Duration Clamped [10, 60]ms</text>

  <rect x="355" y="454" width="275" height="92" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
  <text x="492" y="478" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 2: VBR Byte Closure</text>
  <text x="492" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">sum(subframe_len) &lt;= payloadBytes</text>
  <text x="492" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">0 Heap Overreads · 0 24x CPU Spikes</text>

