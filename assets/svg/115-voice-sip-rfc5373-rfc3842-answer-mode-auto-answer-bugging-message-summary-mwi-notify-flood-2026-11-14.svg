  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 话机零振铃、零按键自动回 200 OK 并打开免提麦克风！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 高管办公室与坐席工位沦为全天候远程窃听器 (Bug My House)！</text>

