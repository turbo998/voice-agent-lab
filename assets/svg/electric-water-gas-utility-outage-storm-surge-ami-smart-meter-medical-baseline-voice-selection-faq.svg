  <rect x="28" y="106" width="355" height="36" rx="12" fill="url(#accentBlue566)" />
  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① 50 倍风暴停电洪峰与 AMI 智能电表实时探测</text>

  <rect x="46" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">振铃期 &lt;100ms 联查 OMS 停电图与电表遗言</text>
  <text x="60" y="200" class="node-sub">• 台风/暴雪致 25 万户停电，每小时涌入 80,000 通报修来电</text>
  <text x="60" y="218" class="node-sub">• 接通前按手机号匹配变压器拓扑与 AMI 电表 Last-Gasp 状态</text>
  <text x="60" y="236" class="node-sub">• 首句 18 秒直接播报馈线抢修进度与预计复电时间 (ETR)</text>

  <rect x="46" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="282" class="node-title">实时 Ping 电表拦截 26%“自家总闸跳闸”白跑</text>
  <text x="60" y="302" class="node-sub">• 住户报停电，但实时 Ping 智能电表返回 240V 供电正常!</text>
  <text x="60" y="320" class="node-sub">• 说明外网有电，系户内主空气开关跳闸 → 发短信相机看配电箱</text>
  <text x="60" y="338" class="node-sub">• 30 秒指导合闸复电，单次省下 $220 抢修工程车空跑费</text>

  <rect x="46" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="386" class="node-title">燃气臭鸡蛋味与落地高压线 0ms 紧急抢险锁</text>
  <text x="60" y="406" class="node-sub">• 识别到硫醇燃气味、嘶嘶漏气声或电线杆打火倒塌</text>
  <text x="60" y="424" class="node-sub">• 0ms 指令撤离室外禁碰开关并直通 24h 燃气/电网应急调度台</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">风暴洪峰自助分流率高达 91.4%</text>
  <text x="60" y="500" class="node-sub">• 10,000 路云端弹性并发消除忙音，复电自动触发短信/语音回告</text>
  <text x="60" y="518" class="node-sub">• 满足各州公用事业委员会 (PUC) 30 秒接通率监管考核</text>

  <!-- Plane 2: 15-Minute AMI Interval High-Bill Analysis & Leak Credit -->
  <rect x="403" y="106" width="394" height="450" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="403" y="106" width="394" height="36" rx="12" fill="url(#accentPurple566)" />
  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② 15 分钟级 AMI 负荷拆解与暗漏退费视觉审计</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">终结“盛夏电费翻倍怀疑电表走快了”争吵</text>
  <text x="435" y="200" class="node-sub">• 对接 Oracle Opower / Bidgely 15 分钟级智能电表负荷曲线</text>
  <text x="435" y="218" class="node-sub">• 确定性拆解: 酷暑降温日度增加 (+$82) + 晚峰 16–21 点充电桩 (+$54)</text>
  <text x="435" y="236" class="node-sub">• 当场测算切换“分时电价 (TOU 夜间谷电)”每年可省 $420 并一键改签</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">凌晨 3 点连续水流检测与水工收据拍照减免</text>
  <text x="435" y="306" class="node-sub">• 水费暴涨时调取智能水表夜间 2:00–4:00 AM 基底流量 (&gt;0.4 GPM)</text>
  <text x="435" y="324" class="node-sub">• 精准定位马桶止水皮碗老化暗漏或院子灌溉管渗水</text>
  <text x="435" y="342" class="node-sub">• 住户修好后短信拍水工收据，2.0s 核验通过自动核减 50% 漏水超额费</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">老旧机械表/燃气表盘 1.8s 拍照自报读数</text>
  <text x="435" y="412" class="node-sub">• 针对估算账单 (Estimated Bill) 过高争议，短信拍表盘指针/滚轮</text>
  <text x="435" y="430" class="node-sub">• 1.8s OCR 读取真实千瓦时/立方米数，当场重算精确账单免派抄表员</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">取消 68% 不必要的“校验电表/水表”上门工单</text>
  <text x="435" y="510" class="node-sub">• 用可视化 15 分钟负荷卡片让住户心服口服</text>

  <!-- Plane 3: Medical Baseline Life-Support & PUC Shutoff Moratorium Gate -->
  <rect x="817" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
  <rect x="817" y="106" width="355" height="36" rx="12" fill="url(#accentGreen566)" />
