  <rect x="835" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="180" class="node-title">呼吸机/制氧机/透析家庭 (Medical Baseline) 优先锁</text>
  <text x="849" y="200" class="node-sub">• 停电来电命中 `Life-Support Registry` 或口述家有呼吸机患者</text>
  <text x="849" y="218" class="node-sub">• 立即升级为 P1 生命保障工单，调派移动储能电源车或应急备用电池</text>
  <text x="849" y="236" class="node-sub">• 若停电预计超 4 小时，同步协助联系非紧急医疗转运</text>

  <rect x="835" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="282" class="node-title">极端高温/严寒与医疗证明绝对禁止欠费拉闸!</text>
  <text x="849" y="302" class="node-sub">• 遵守 CPUC / NYPSC / 各州公用事业法规: 气温 &gt;35°C 或 &lt;0°C 期间</text>
  <text x="849" y="320" class="node-sub">• 或住户提交医生开具的重病不能断电证明 (Medical Certificate)</text>
  <text x="849" y="338" class="node-sub">• 0ms 撤回远程智能电表拉闸指令 (Cancel Remote Disconnect) 并设 30 天保护</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">LIHEAP 政府能源补贴与 12 期平摊付款计划</text>
  <text x="849" y="406" class="node-sub">• 针对困难欠费家庭自动核查 LIHEAP 补助资格并办理预算平摊 (Budget Billing)</text>
  <text x="849" y="424" class="node-sub">• 首付 15% 即可在 3 分钟内自动远程合闸复电</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (UTILITY-OMS-AMI-MEDICAL-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截高温/严寒/生命维持户违规拉闸、AMI 在线却派外线抢修车</text>
  <text x="849" y="518" class="node-sub">• 燃气泄漏与落地电线 0ms 强制撤离直通应急抢险台</text>

