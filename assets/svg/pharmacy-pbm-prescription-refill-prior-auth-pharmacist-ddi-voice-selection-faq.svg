<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg521" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad521" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad521" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad521" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="roseGrad521" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg521)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#cyanGrad521)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">PHARMACY AI · #521</text>
  <text x="194" y="44" class="title">Pharmacy &amp; PBM Voice AI: RxNorm Phonetic Refill, Prior Auth &amp; OBRA '90 RPh Gate</text>
  <text x="194" y="65" class="subtitle">RxNorm Brand↔Generic Refill (49% → 91.6% Completion) + NCPDP Prior-Auth &amp; Sister-Store Stock Transfer + 0ms OBRA '90 Pharmacist Lock</text>

  <!-- Column 1: RxNorm Phonetic Refill & Sister-Store Stock Transfer -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad521)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. RxNorm Phonetic Refill &amp; Stock Transfer</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">No Pill Bottle? Spoken Brand↔Generic Match</text>
    <text x="26" y="86" class="body-text">• Patients say "Refill my Lipitor or blood pressure</text>
    <text x="26" y="102" class="body-text">  pill"; maps via RxNorm to Atorvastatin 20mg</text>
    <text x="26" y="122" class="mono">Lifts Self-Service Refill from 49.0% to 91.6%</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Look-Alike Sound-Alike (LASA) Tall-Man Lock</text>
    <text x="26" y="186" class="body-text">• Prevents ISMP LASA confusion (hydrALAZINE vs.</text>
    <text x="26" y="202" class="body-text">  hydrOXYzine) by reading back dosage + indication</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Requires Explicit Verbal Confirmation Before Fill</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Out-of-Stock Sister-Store Transfer (&lt;3 Mi)</text>
    <text x="26" y="288" class="body-text">• If local store NDC is backordered, checks sister</text>
    <text x="26" y="304" class="body-text">  pharmacies within 3 miles &amp; transfers non-CII Rx</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Eliminates 74.2% of Store-Counter Stock Escalations</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Cold-Chain Specialty Rx Delivery Window</text>
    <text x="26" y="384" class="body-text">Confirms refrigerated biologics signature window</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">before shipping $4,200 cold-chain packages</text>
  </g>

  <!-- Column 2: NCPDP Prior Authorization (PA) & Copay Transparency -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad521)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. NCPDP Prior-Auth (PA) &amp; Copay Triage</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">Translates NCPDP Reject 75/76 Into Plain Speech</text>
    <text x="26" y="86" class="body-text">• Explains exact insurance hold: "Your insurer</text>
    <text x="26" y="102" class="body-text">  requires Prior Authorization; we electronically</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">messaged Dr. Chen on Nov 23 (est. 48h review)"</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Zero-Refills-Remaining Prescriber e-Renewal</text>
    <text x="26" y="188" class="body-text">• When 0 refills remain on chronic maintenance Rx,</text>
    <text x="26" y="204" class="body-text">  fires Surescripts RxRenewal request to clinic</text>
    <text x="26" y="224" class="mono">&amp; checks eligibility for 72h maintenance bridge</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">Exact Copay &amp; Deductible Shock Prevention</text>
    <text x="26" y="290" class="body-text">• Reads adjudicated patient copay ($15 vs. $280</text>
    <text x="26" y="306" class="body-text">  deductible reset) + checks manufacturer copay</text>
    <text x="26" y="324" class="mono" fill="#fde68a">savings card before patient drives to the store!</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">90-Day Mail-Order Sync &amp; Auto-Refill Consent</text>
    <text x="26" y="386" class="body-text">Captures explicit CMS/Medicare Part D consent</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">before shipping any mail-order maintenance refill</text>
  </g>

  <!-- Column 3: OBRA '90 Pharmacist Counseling & DEA Schedule-II Lock -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#roseGrad521)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. OBRA '90 Pharmacist &amp; DEA C-II Lock</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#fb7185">0ms OBRA '90 Clinical / DDI Pharmacist Gate</text>
    <text x="26" y="86" class="body-text">• AI NEVER answers drug-interaction (DDI), dosing,</text>
    <text x="26" y="102" class="body-text">  pediatric weight, or adverse-reaction questions!</text>
    <text x="26" y="122" class="mono" fill="#fda4af">0ms Warm-Transfer to Licensed Pharmacist (RPh)!</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#34d399">DEA Schedule II (C-II) Controlled-Substance Gate</text>
    <text x="26" y="188" class="body-text">• Enforces statutory earliest-fill date math &amp;</text>
    <text x="26" y="204" class="body-text">  blocks store-to-store transfers where prohibited</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Never Discloses Store C-II Vault Stock to Unverified Callers</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">HIPAA Household Proxy &amp; Sensitive Rx Privacy</text>
    <text x="26" y="288" class="body-text">• Reveals only "1 prescription ready ($10)" until</text>
    <text x="26" y="304" class="body-text">  patient identity or authorized HIPAA proxy is</text>
    <text x="26" y="322" class="mono">verified (protects sensitive drug names on voicemail)</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#fb7185" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#fda4af">Guardrail: PHARMACY-PBM-VOICE-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluatePharmacyPbmRefillPriorAuthPharmacistGuard</text>
    <text x="26" y="402" class="body-text">0 Unlicensed DDI Advice · -$365k/10k Hrs RPh Time</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Pharmacy &amp; PBM Voice AI Operational &amp; Clinical Safety Benchmarks (per 10,000 Operating Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Automated Rx Refill Completion</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">49.0% → 91.6% (RxNorm Match)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Store Phone Queue Offload</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">-74.2% (PA &amp; Stock Triage)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Unlicensed AI DDI Counseling</text>
    <text x="16" y="50" class="kpi-num" fill="#fb7185">0.00% (OBRA '90 RPh Gate)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Pharmacist Time &amp; Risk Saved</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$365,000 / 10k Hours</text>
  </g>
</svg>
