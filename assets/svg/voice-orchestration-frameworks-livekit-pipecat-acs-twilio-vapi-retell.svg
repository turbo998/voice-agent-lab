<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg68" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081021"/>
      <stop offset="50%" stop-color="#111e3b"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="card68" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17284c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c162b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg68)" rx="16"/>
  <text x="600" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Voice Orchestration Framework Benchmark: LiveKit Agents vs Pipecat vs Azure ACS vs Vapi / Retell</text>
  <text x="600" y="66" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Open-Source Self-Hosted vs Cloud CPaaS vs Managed SaaS · 40k Min/Mo TCO Inflection · Stateful Worker Drain Gate (VOICE-ORCHESTRATION-FRAMEWORK-MATRIX-01)</text>

  <!-- Left Column -->
  <rect x="30" y="92" width="290" height="548" rx="12" fill="url(#card68)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="122" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. The 4 Orchestration Archetypes</text>

  <rect x="48" y="142" width="254" height="105" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="175" y="166" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. LiveKit Agents (Open-Source)</text>
  <text x="175" y="188" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Go WebRTC SFU + Python/Node Worker</text>
  <text x="175" y="206" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Native Web, Mobile &amp; SIP Trunking</text>
  <text x="175" y="224" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• All-In Cost: $0.046/min (&gt;40k min/mo)</text>

  <rect x="48" y="264" width="254" height="105" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="175" y="288" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Pipecat (Frame Pipeline OSS)</text>
  <text x="175" y="310" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Composable Frame-by-Frame DAG</text>
  <text x="175" y="328" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 50+ STT/LLM/TTS/Avatar Plugins</text>
  <text x="175" y="346" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Best for Custom DSP &amp; Vision Pipelines</text>

  <rect x="48" y="386" width="254" height="105" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="175" y="410" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Azure ACS Call Automation</text>
  <text x="175" y="432" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Enterprise PSTN Direct Routing &amp; Teams</text>
  <text x="175" y="450" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Native Azure Speech + OpenAI Bridge</text>
  <text x="175" y="468" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Best for M365 &amp; Sovereign Cloud</text>

  <rect x="48" y="508" width="254" height="112" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="175" y="532" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Vapi / Retell AI (Managed SaaS)</text>
  <text x="175" y="554" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 1-Day Setup, Hosted Dashboard &amp; QA</text>
  <text x="175" y="572" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• $0.05–$0.09/min Platform Wrapper Tax</text>
  <text x="175" y="590" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• All-In Cost: $0.14–$0.19/min</text>

  <!-- Center Column -->
  <rect x="350" y="92" width="500" height="548" rx="12" fill="url(#card68)" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Deterministic Framework Gate (VOICE-ORCHESTRATION-FRAMEWORK-MATRIX-01)</text>

  <rect x="372" y="142" width="456" height="136" rx="10" fill="#2a1215" stroke="#ef4444" stroke-width="1.8"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE A: Data Residency, VPC Private Link &amp; SaaS Egress Lock</text>
  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: requiresStrictVpcDataResidencyOrCustomMediaFrame === false</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks selecting multi-tenant public SaaS wrappers (Vapi/Retell) when</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  banking/healthcare/gov rules mandate 100% private VPC audio termination</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Routes sovereign workloads to Self-Hosted LiveKit/Pipecat or Azure ACS</text>

  <rect x="372" y="294" width="456" height="145" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="600" y="318" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE B: 40,000 Min/Mo TCO Inflection &amp; Wrapper Tax Breaker</text>
  <text x="600" y="340" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: monthlyCallMinutesExceeds40kInflection === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Below 40k min/mo: Managed SaaS wins by saving DevOps engineering time</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Above 40k min/mo: SaaS $0.07/min wrapper markup exceeds K8s hosting;</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  flags mandatory migration path to LiveKit Agents / Pipecat (-68% TCO)</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: K8s Graceful Call-Drain &amp; SIGTERM Protection Lock</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: gracefulCallDrainAndPreStopHookVerified === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks deploying self-hosted voice workers on stateless HTTP HPA rules</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  that kill active 15-minute phone calls during rolling deployments!</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Enforces 3600s `terminationGracePeriodSeconds` &amp; zero-drop drain</text>
  <text x="600" y="582" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0.00% dropped calls during CI/CD releases &amp; autoscaling events</text>

  <!-- Right Column -->
  <rect x="880" y="92" width="290" height="548" rx="12" fill="url(#card68)" stroke="#10b981" stroke-width="1.5"/>
  <text x="1025" y="122" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Production Scaling Architecture</text>

  <rect x="898" y="142" width="254" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="1025" y="166" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">WebRTC + SIP Unified Ingress</text>
  <text x="1025" y="188" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Sub-50ms Edge UDP Media Relay</text>
  <text x="1025" y="206" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Silero / Semantic Turn-End Detector</text>
  <text x="1025" y="224" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hardware Noise Cancellation (Krisp/RNNoise)</text>

  <rect x="898" y="268" width="254" height="110" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="1025" y="292" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Stateful K8s Worker Pool</text>
  <text x="1025" y="314" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 25–40 Concurrent Calls per 8-vCPU Pod</text>
  <text x="1025" y="332" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• KEDA Scaling on Active Session Count</text>
  <text x="1025" y="350" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Drain-Before-Terminate PreStop Hook</text>

  <rect x="898" y="394" width="254" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="1025" y="418" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">BYO-Key Vendor Independence</text>
  <text x="1025" y="440" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hot-Swap Azure Speech ↔ Deepgram</text>
  <text x="1025" y="458" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hot-Swap GPT-4o ↔ Claude ↔ Local vLLM</text>
  <text x="1025" y="476" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Zero Per-Minute Wrapper Markup</text>

  <rect x="898" y="520" width="254" height="100" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
  <text x="1025" y="544" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Sealed Framework Metrics</text>
  <text x="1025" y="566" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 1M-Min Annual Savings: $102,000/mo</text>
  <text x="1025" y="584" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Rolling-Deploy Call Drops: 0.00%</text>
  <text x="1025" y="602" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Barge-In Cut-Off Latency: 118ms P50</text>
</svg>
