<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg513" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad513" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad513" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad513" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad513" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg513)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#cyanGrad513)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">OMNICHANNEL · #513</text>
  <text x="194" y="44" class="title">Enterprise Omnichannel Voice + Visual Co-Browsing &amp; Seamless SMS/WhatsApp Handoff</text>
  <text x="194" y="65" class="subtitle">9s Visual Slot Capture (31% → 0.2% Email/VIN Error) + &lt;200ms Bi-Directional Screen-Voice Sync + &lt;400ms Voice-to-WhatsApp Continuity</text>

  <!-- Column 1: Dual-Channel Visual Slot Capture (Eliminating Phonetic Spelling) -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad513)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. 9s Visual Slot Capture (Zero Spelling)</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Eliminates 95s NATO Phonetic Spelling</text>
    <text x="26" y="86" class="body-text">• Spelling 28-char emails or 17-char VINs over 8kHz</text>
    <text x="26" y="102" class="body-text">  phone audio suffers a 31% B/P/M/N/S/F error rate!</text>
    <text x="26" y="122" class="mono">Pushes 1-Tap Visual Input Sheet While on the Call</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">iOS/Android Keyboard Auto-Fill &amp; Barcode OCR</text>
    <text x="26" y="186" class="body-text">• Caller taps native OS email/address auto-fill</text>
    <text x="26" y="202" class="body-text">  or scans serial/VIN barcode with phone camera</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Cuts Alphanumeric Error from 31.0% to 0.2% in 9s</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Visual Comparison &amp; Seat/Slot Picker</text>
    <text x="26" y="288" class="body-text">• Instead of reading 6 flight/insurance options</text>
    <text x="26" y="304" class="body-text">  aloud for 45s, renders interactive visual cards</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Voice Guides Highlights While User Taps Selection</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Graceful Voice-Only Fallback (Hands-Free)</text>
    <text x="26" y="384" class="body-text">If caller is driving or on a landline, falls back</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">to chunked 4-char readback + SMS confirmation</text>
  </g>

  <!-- Column 2: <200ms Bi-Directional Voice-Visual Co-Browsing Sync -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad513)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. &lt;200ms Bi-Directional Co-Browsing Sync</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">Screen-Tap to Voice-Reaction (&lt;200ms)</text>
    <text x="26" y="86" class="body-text">• WebSocket UI events inject directly into active</text>
    <text x="26" y="102" class="body-text">  S2S/Cascade context: when user taps "Plan B",</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">AI immediately speaks: "Great choice on Plan B!"</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Voice-to-Screen Live Field Highlighting</text>
    <text x="26" y="188" class="body-text">• As the caller speaks ("Change deductible to $500"),</text>
    <text x="26" y="204" class="body-text">  the mobile webview animates &amp; updates the slider</text>
    <text x="26" y="224" class="mono">in real time for instant visual verification</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">DOM / PII Co-Browsing Masking Firewall</text>
    <text x="26" y="290" class="body-text">• Strips CSS selector fields marked data-pci-mask</text>
    <text x="26" y="306" class="body-text">  or data-pii-private from co-browse DOM snapshots</text>
    <text x="26" y="324" class="mono" fill="#fde68a">Zero Password / SSN Screen-Capture Leakage</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Optimistic State Version Lock (CAS)</text>
    <text x="26" y="386" class="body-text">Resolves simultaneous screen tap + spoken command</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">via monotonic state_version Compare-And-Swap</text>
  </g>

  <!-- Column 3: <400ms Voice-to-WhatsApp/SMS Modality Handoff & PKCE -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#purpleGrad513)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. &lt;400ms Modality Handoff &amp; PKCE Security</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#c4b5fd">"Entering a Meeting" Voice → WhatsApp Shift</text>
    <text x="26" y="86" class="body-text">• Caller says "I have to go into a meeting, text me"</text>
    <text x="26" y="102" class="body-text">• Shifts active Redis state graph to WhatsApp/SMS</text>
    <text x="26" y="122" class="mono" fill="#ddd6fe">in &lt;400ms with 100% of verified slots preserved!</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#34d399">Chat → 1-Tap WebRTC Voice Escalation</text>
    <text x="26" y="188" class="body-text">• When a text chat gets too complex, 1-tap "Switch</text>
    <text x="26" y="204" class="body-text">  to Voice" opens WebRTC with full chat history</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Zero Context Re-Explanation Across Modalities</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">180s Call-Bound PKCE Visual Token Lock</text>
    <text x="26" y="288" class="body-text">• Visual micro-webview links expire in 180s &amp; bind</text>
    <text x="26" y="304" class="body-text">  to active call_id + device challenge (blocks</text>
    <text x="26" y="322" class="mono">forwarded SMS link hijacking: 0.00% Takeover)</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#c4b5fd">Guardrail: OMNICHANNEL-VOICE-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateEnterpriseOmnichannelVoiceVisualGuard</text>
    <text x="26" y="402" class="body-text">0.2% Slot Error · -$315k/10k Hrs AHT &amp; Drop Saved</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Enterprise Omnichannel Voice + Visual Co-Browsing Benchmarks (per 10,000 Operating Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Email / VIN / Serial Capture Error</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">31.0% → 0.2% (Visual Sheet)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Alphanumeric Intake Duration</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">95s → 9s (Auto-Fill + OCR)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Voice↔WhatsApp Context Loss</text>
    <text x="16" y="50" class="kpi-num" fill="#a78bfa">0.0% (&lt;400ms Shared Bus)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">AHT &amp; Re-Work Cost Saved</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$315,000 / 10k Hours</text>
  </g>
</svg>
