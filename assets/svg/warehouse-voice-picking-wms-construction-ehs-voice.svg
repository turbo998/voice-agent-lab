<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg38" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="wmsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="coldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ehsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg38)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Warehouse Voice Picking (SAP EWM / WMS), -25°C Cold-Chain &amp; Construction EHS</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">智慧仓储免手语音拣选（替代传统 Vocollect）、-25°C 冷库叉车作业与建筑工地 EHS 隐患语音巡检全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">WMS-PICK-01 · 99.97%</text>

  <!-- Pillar 1: Modern AI Voice Picking vs Legacy $3,200 Vocollect Terminals -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#wmsGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 现代 AI 语音拣选 vs 传统专用拣选终端</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 为什么传统 $3,200 专用语音终端正在被淘汰？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 特定人声纹依赖：大促每个临时工需花 30分钟念词训练</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 仅懂 20个死命令：遇到破箱漏液只能跑 200米找班长</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">零注册上岗 (Zero-Enrollment) + &lt;=120ms 校验</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 戴上蓝牙耳麦 10秒直接开干（支持方言/西语/越南语）</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 库位校验码 (Check-Digit) 端侧 NPU 120ms 极速确认</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">破损/缺货自然语言秒级改派 (SAP EWM / Manhattan)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 拣货员说：“A12库位有两瓶洗发水漏了，还差3件不够”</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 1.2s 自动冻结残次库存、派保洁单并改派备用库位 B04</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">拣货准确率高达 99.97% · 硬件成本直降 78%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">大促千名临时工培训上岗时间从 4小时 缩至 5分钟</text>
  </g>

  <!-- Pillar 2: -25C Deep-Freeze Cold Storage & Forklift Hands-Free Safety -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#coldGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. -25°C 深冷库戴棉手套与叉车免手作业</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">攻克 -25°C 冷库 PDA 屏幕结霜与厚手套盲区</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 冷库工人戴 2cm 厚防寒棉手套根本无法点按 PDA 触摸屏</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 手机揣在贴身保暖内袋，全程靠防冻骨传导耳麦双手搬箱</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">冷风机 84dB 噪音抑制 + 指环扫码枪协同</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 针对冷库蒸发器强风噪定制声学滤波 + 戴面罩闷音增强</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 语音报数量 + 蓝牙指环扫 GS1-128 效期批次码双流融合</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">高位叉车行驶期“车载屏幕锁死 + 纯语音调度”</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 叉车速度 &gt;3km/h 自动黑屏防分心看单撞货架</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 12米金属货架 Wi-Fi 盲区本地离线缓存 50 条拣选任务</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">冷库与重件区每小时拣选箱数提升 +26.4%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">叉车分心看屏幕引发的碰撞货架事故下降 89%</text>
  </g>

  <!-- Pillar 3: Construction & Factory EHS Safety Walk (Voice + 80KB Photo) -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#ehsGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 建筑工地与工厂 EHS 隐患随手拍语音巡检</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="30" y="82" fill="#FDE68A" font-size="13" font-weight="700">爬脚手架 8秒完成隐患取证 (告别晚间填表)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 安全员拍一张照并口述：“3号楼5层东侧电梯井临边缺踢脚板”</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 80KB 图像 + 语音自动匹配《JGJ 80 / OSHA 1926.502》条文</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FCD34D" font-size="13" font-weight="700">自动定责分包班组与 4小时整改倒计时硬锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 根据楼层 BIM 网格自动派单给对应劳务木工班组长</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 整改上传复拍图后，视觉 AI 自动比对同一位置护栏已装好</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">高危作业许可 (PTW / 动火登高) 班前语音点名</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 动火作业前 AI 语音逐条核验灭火器、看火人与风速</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 支持跨国基建工地中/英/印地/阿语多语种安全交底</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">工地安全隐患从发现到整改闭环提速 6.4 倍</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 满足 ISO 45001 / OSHA / 住建部智慧工地审计</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">智慧仓储拣选与工地 EHS 现场语音架构（Hands-Free Warehouse WMS &amp; Construction EHS Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 零注册上岗：通用安卓/耳麦替代 $3,200 专用机 ➔ 2. 极速拣选：端侧 NPU &lt;=120ms 校验库位码 + 自由口语报破损缺货秒改派</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 极端环境：-25°C 冷库厚手套免触屏作业 + 货架盲区离线缓存 ➔ 4. 工地 EHS：语音+80KB拍图自动匹配安全规范条文并锁死整改</text>
  </g>
