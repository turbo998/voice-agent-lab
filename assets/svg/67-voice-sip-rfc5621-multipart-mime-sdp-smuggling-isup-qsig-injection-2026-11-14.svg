  <text x="672" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：公网干线夹带 application/isup IAM 二进制块，伪造 CPC=免费特权与 CEO 主叫</text>
  <text x="672" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 内存风险：Content-Length 虚报或缺失 --boundary-- 闭合符导致 C++ 堆越界读</text>
  <rect x="672" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="688" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Untrusted Trunk: Content-Type: application/isup (CPC=0x0B Free, CGPN=CEO)</text>
  <text x="688" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P840 🎉 Gate: Strip 100% Untrusted ISUP/QSIG + Exact Content-Length Parity</text>
  <text x="688" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: strip_untrusted_isup_qsig_and_enforce_content_length_parity</text>
  <text x="672" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P840 🎉 里程碑）：</text>
  <text x="672" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedInjectedIsupOrQsigBodies = 0（非授信干线 100% 剥离二进制信令块）</text>
  <text x="672" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxSipBodyPayloadBytes ∈ [256, 8192]（100% 字节长度与边界闭合）</text>

