  <text x="352" y="57" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Enterprise SIP RFC 5621 Multipart Shadow-SDP Smuggling &amp; RFC 3204 ISUP/QSIG Injection Guard</text>
  <text x="44" y="88" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">企业 SIP 复合包体影子 SDP 走私（0 重复 SDP / [1,3] 分块）与非授信干线 ISUP/QSIG 二进制信令注入剥离（0 注入 / [256,8192]B）确定性门禁</text>
