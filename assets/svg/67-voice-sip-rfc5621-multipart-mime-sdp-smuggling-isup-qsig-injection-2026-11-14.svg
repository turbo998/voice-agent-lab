  <!-- Left Column: RFC 5621 Shadow-SDP Smuggling (P839) -->
  <rect x="44" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="146" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. RFC 5621 Multipart Shadow-SDP Smuggling Gate (P839)</text>
  <text x="64" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：防火墙仅校验 Part 1 合法 SDP，后端 B2BUA 循环解析被 Part 2 影子 SDP 覆盖</text>
  <text x="64" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 走私手法：Content-Disposition: render; handling=optional 或嵌套 multipart/alternative</text>
  <rect x="64" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Smuggled INVITE: Part1=SDP(198.51.100.10) + Part2=SDP(203.0.113.99)</text>
  <text x="80" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P839 Gate: sdpPartCount == 1 &amp;&amp; nestedDepth == 0 &amp;&amp; parts in [1, 3]</text>
  <text x="80" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: reject_415_shadow_sdp_and_flatten_canonical_multipart (0 Shadow SDPs)</text>
  <text x="64" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P839）：</text>
  <text x="64" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedSmuggledOrDuplicateSdpParts = 0（100% 拒回双 SDP 与嵌套 multipart）</text>
  <text x="64" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxMultipartMimeBodyParts ∈ [1, 3]（仅放行白名单 1 SDP + 1 PIDF-LO）</text>

  <!-- Right Column: RFC 3204 ISUP/QSIG Injection & Content-Length Parity (P840 🎉) -->
  <rect x="652" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
