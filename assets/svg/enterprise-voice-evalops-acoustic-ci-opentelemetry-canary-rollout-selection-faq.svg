  <text x="849" y="180" class="node-title">Call-ID 会话级粘性金丝雀 (1% → 10% → 50%)</text>
  <text x="849" y="200" class="node-sub">• 入呼振铃期按 Call-ID 哈希锁定 Prompt/Model/TTS 版本</text>
  <text x="849" y="218" class="node-sub">• 严禁通话中途切换模型快照，确保单通音色与逻辑一致</text>
  <text x="849" y="234" class="node-sub">• 支持 Shadow Mode 旁路静音重放验证新模型 Tool 准确率</text>

  <rect x="835" y="258" width="319" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="280" class="node-title">三维声学异常自动熔断器 (Auto-Rollback Breaker)</text>
  <text x="849" y="300" class="node-sub">• 触发项 1: 用户重复口述率 (Repeat Rate) &gt; 12.0%</text>
  <text x="849" y="318" class="node-sub">• 触发项 2: 焦躁打断率 &gt; 28% 或 P95 延迟 &gt; 1,350ms</text>
  <text x="849" y="336" class="node-sub">• 触发项 3: 异常转人工率较基线暴涨 &gt; +4.0%</text>

  <rect x="835" y="364" width="319" height="82" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">&lt;15 秒切回 LKG 稳定快照 (Zero-Drop Drain)</text>
  <text x="849" y="406" class="node-sub">• 新进呼叫 0ms 切回 Last-Known-Good (LKG) 版本</text>
  <text x="849" y="424" class="node-sub">• 在途异常灰度通话平滑降级至级联保底或优先转人工</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (ENTERPRISE-VOICE-EVALOPS-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 未过 500 通声学 CI 或缺 7 跳 OTel 埋点律禁发版</text>
  <text x="849" y="518" class="node-sub">• 灰度指标越界自动触发 &lt;15s LKG 回滚与告警封存</text>

