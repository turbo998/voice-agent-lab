  <rect x="28" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <rect x="28" y="106" width="355" height="36" rx="12" fill="url(#accentBlue547)" />
  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① 上线前 500 通声学仿真 CI/CD (Acoustic Eval)</text>

  <rect x="46" y="158" width="319" height="84" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">500 路对抗性语音 Persona 并发压测 (4.2 min)</text>
  <text x="60" y="200" class="node-sub">• 8kHz G.711 窄带压缩 + 5dB SNR 地铁/咖啡厅底噪</text>
  <text x="60" y="218" class="node-sub">• 句中犹豫/改口 ("呃…不对改成50") + 强打断压测</text>
  <text x="60" y="234" class="node-sub">• 兼容 Coval / Cekura / Roark / Pipecat + Foundry Eval</text>

  <rect x="46" y="256" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="278" class="node-title">双轨确定性断言 (Audio + Transcript Judges)</text>
  <text x="60" y="298" class="node-sub">• 工具参数精确匹配: 金额/日期/订单号 AST 100% 一致</text>
  <text x="60" y="316" class="node-sub">• 声学指标门禁: 打断停播 &lt;=220ms · 零 800ms 抢话</text>
  <text x="60" y="334" class="node-sub">• 发现纯文本评测漏检的 23.4% 真实声学故障</text>

  <rect x="46" y="360" width="319" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="382" class="node-title">GitHub Actions PR 准入红线 (Release Gate)</text>
  <text x="60" y="402" class="node-sub">• 任务达成率 (TSR) &gt;=96.0% 且合规违例 = 0.00%</text>
  <text x="60" y="420" class="node-sub">• 端到端 P95 轮次延迟回归 &lt;= +50ms 方可合并</text>
  <text x="60" y="436" class="node-sub">• 单次 500 通回归成本仅 $18.50 (替代 $4,200 人工)</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">生产坏例自动回流 (Failure-to-Fixture Loop)</text>
  <text x="60" y="500" class="node-sub">• 线上转人工/用户挂断通话自动脱敏切片入库</text>
  <text x="60" y="518" class="node-sub">• 次日自动转化为 CI 必测回归音频集防二次复发</text>

  <!-- Plane 2: 7-Hop OpenTelemetry Per-Turn Flamegraph -->
  <rect x="403" y="106" width="394" height="450" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="403" y="106" width="394" height="36" rx="12" fill="url(#accentPurple547)" />
  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② 7 跳 OpenTelemetry 轮次延迟火焰图 (W3C Trace)</text>

  <rect x="421" y="158" width="358" height="106" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">统一 `voice.turn.id` 7 跳全链路分布式追踪</text>
  <text x="435" y="200" class="node-sub">• Hop 1: SBC/WebRTC Jitter (22ms) → Hop 2: VAD EoU (180ms)</text>
  <text x="435" y="218" class="node-sub">• Hop 3: STT Final (115ms) → Hop 4: RAG/MCP Tool (140ms)</text>
  <text x="435" y="236" class="node-sub">• Hop 5: LLM TTFT (245ms) → Hop 6: TTS First-Byte (95ms)</text>
  <text x="435" y="252" class="node-sub">• Hop 7: Downlink RTP (28ms) ⇒ Total P50 = 825ms</text>

  <rect x="421" y="278" width="358" height="86" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="300" class="node-title">用户感知延迟 (Perceived Latency) 精准刻度</text>
  <text x="435" y="320" class="node-sub">• 区分网络 TTFT 与真实首包可听帧 (Audio-to-Audio)</text>
  <text x="435" y="338" class="node-sub">• 自动扣除渐进安抚微话术已覆盖的外部 API 耗时</text>
  <text x="435" y="354" class="node-sub">• 实时输出 Azure Monitor / Arize Phoenix / Langfuse</text>

  <rect x="421" y="378" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="400" class="node-title">声学质量与情绪退化遥测 (Acoustic Telemetry)</text>
  <text x="435" y="420" class="node-sub">• 逐轮采集 STT 词置信度、背景 SNR 与能量暴涨比</text>
  <text x="435" y="438" class="node-sub">• 实时标记用户重复提问 ("我刚说了!") 与焦躁打断</text>

  <rect x="421" y="474" width="358" height="66" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="496" class="node-title">故障定界从 4.5 小时压缩至 90 秒 (MTTR -96.7%)</text>
  <text x="435" y="516" class="node-sub">• 单击慢通话即展开 7 跳火焰图与同步双轨录音切片</text>

