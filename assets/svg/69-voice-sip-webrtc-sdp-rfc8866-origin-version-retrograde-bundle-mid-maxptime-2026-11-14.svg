  <!-- Header -->
  <rect x="44" y="38" width="320" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="204" y="57" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STAGE 425 🎉 · TOPIC 65 🎉 · P843 / P844</text>
  <text x="380" y="57" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Enterprise SIP/WebRTC SDP RFC 8866 Origin Version Lock &amp; RFC 8843 BUNDLE MID / maxptime Guard</text>
  <text x="44" y="88" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">企业 SIP/WebRTC SDP o= 版本防倒退单调锁（[1,16] 步长）与悬空 BUNDLE MID 闭合及 maxptime [10,60]ms 防溢出门禁（🎉 Stage 425 &amp; Topic 65 双里程碑）</text>
  <line x1="44" y1="102" x2="1236" y2="102" stroke="url(#accent69)" stroke-width="2"/>

  <!-- Left Column: RFC 8866 Origin sess-id & sess-version Gate (P843) -->
  <rect x="44" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="146" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. RFC 8866 SDP o= Origin sess-id &amp; Version Gate (P843)</text>
  <text x="64" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：重放旧包或备机脑裂发来 sess-version 倒退，代理切端口而终端忽略致 100% 单通</text>
  <text x="64" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 违规手法：中途篡改 sess-id、修改媒体但未递增版本号、或超步长版本号翻转攻击</text>
  <rect x="64" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Retrograde Offer: o=- 987654 99 IN IP4 ... (99 &lt; committed 101)</text>
  <text x="80" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P843 Gate: sess_id == pinned &amp;&amp; delta_ver in [1, 16] on SDP change</text>
  <text x="80" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: reject_488_origin_mutation_or_retrograde_sess_version (0 Desync)</text>
  <text x="64" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P843）：</text>
  <text x="64" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedRetrogradeOrMutatedOriginOffers = 0（100% 拒回 488 保持原媒体状态）</text>
  <text x="64" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxSdpVersionIncrementPerReinvite ∈ [1, 16]（单次重协商版本增量上限）</text>

  <!-- Right Column: RFC 8843 BUNDLE MID & maxptime Gate (P844) -->
  <rect x="652" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
  <text x="672" y="146" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. RFC 8843 Dangling BUNDLE MID &amp; maxptime Gate (P844)</text>
  <text x="672" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：a=group:BUNDLE 含不存在的悬空 MID 触发 SFU 空指针崩溃，重复 MID 致双重混音</text>
  <text x="672" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 溢出风险：a=maxptime:480 (23,040 samples) 8x 写穿 60ms (2,880 samples) DSP 槽</text>
  <rect x="672" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="688" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Dangling/Overflow: a=group:BUNDLE audio0 ghost99 | a=maxptime:480</text>
  <text x="688" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P844 Gate: Bijective BUNDLE MID Closure + maxptime in [10, 60]ms</text>
  <text x="688" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: reject_dangling_bundle_mid_and_clamp_maxptime_buffer</text>
  <text x="672" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P844 · 🎉 Stage 425 &amp; Topic 65 双里程碑）：</text>
  <text x="672" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedDanglingOrDuplicateBundleMids = 0（100% 阻断悬空/重复 MID 崩溃）</text>
  <text x="672" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedNegotiatedMaxptimeMs ∈ [10, 60]（锁定安全帧长，0 DSP 帧槽写越界）</text>

  <!-- Bottom Full-Width Pipeline & Quantitative Matrix -->
  <rect x="44" y="410" width="1192" height="248" rx="12" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
  <text x="64" y="438" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Atomic SDP Renegotiation Pipeline &amp; Stage 425 🎉 Scorecard (428 Dims · 853 Guardrails · 862 Probes · 672 POC Probes)</text>

  <rect x="64" y="454" width="265" height="92" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="196" y="478" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 1: Origin sess-id Pin</text>
  <text x="196" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">sess-id 100% Immutable</text>
  <text x="196" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">sess-version Step in [1, 16]</text>

  <rect x="355" y="454" width="275" height="92" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
  <text x="492" y="478" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 2: BUNDLE MID Closure</text>
  <text x="492" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">0 Dangling / Duplicate MIDs</text>
  <text x="492" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Bijective Active m= Mapping</text>

  <rect x="656" y="454" width="275" height="92" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="793" y="478" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 3: maxptime [10, 60]ms</text>
  <text x="793" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Clamped to &lt;=60ms Frame Slot</text>
  <text x="793" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">0 8x PCM Ring-Buffer Overflows</text>

  <rect x="957" y="454" width="259" height="92" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="1086" y="478" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 4: Atomic Commit / 488</text>
  <text x="1086" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Zero Split-Brain One-Way Audio</text>
  <text x="1086" y="520" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">867 Automated Unit Tests Green</text>

  <text x="64" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">定量收敛结论：100% 拦截重协商 sess-version 倒退单通与悬空 BUNDLE MID 空指针崩溃，将 maxptime 硬锁在 [10, 60]ms。</text>
