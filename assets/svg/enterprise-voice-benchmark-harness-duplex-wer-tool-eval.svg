<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#07101E"/>
    </linearGradient>
    <linearGradient id="werGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="dupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgBench)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Enterprise Voice AI Benchmark Harness: Beyond Static WER to Full-Duplex, Slot &amp; FinOps Eval</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">企业实时语音大模型选型基准评测工程：告别静态 WER 误区、全双工打断瀑布、高危槽位精确率与 7-Card PoC 评测全景图</text>
  <rect x="836" y="42" width="316" height="34" rx="17" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
  <text x="994" y="64" fill="#C7D2FE" font-size="13" font-weight="600" text-anchor="middle">VOICE-BENCHMARK-HARNESS-01</text>

  <!-- Pillar 1: Why Static WER Fails Enterprise POCs -> Critical Entity Slot Exact Match -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#werGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 破除“静态通用 WER”迷信：聚焦高危实体槽位</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 为什么通用 WER 仅 3% 的模型在生产环境彻底翻车？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 一句 30个字的客服对话：前 29个寒暄词全对，唯独把“不能退订”听成“能退订”</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 此时通用字错率 (WER) 高达 96.7% 优秀，但业务结果却是 100% 致命事故！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#4C0519" stroke="#E11D48"/>
    <text x="30" y="174" fill="#FDA4AF" font-size="13" font-weight="700">核心评测指标：高危槽位精确匹配率 (Entity Exact-Match &gt;=99.5%)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 单独剥离评测：17位车架号、航司6位PNR、药品名、金额、否定词极性</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 叠加 G.711 8kHz 窄带电话失真 + 78dB 地铁/餐厅真实背景噪音频谱回放</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">工具调用参数零幻觉率 (Tool Argument Precision == 100%)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 检验模型在槽位模糊时是否主动发起“反问澄清 (Clarification)”</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 严惩“没听清订单号后两位就自己瞎编 00 传给 ERP 接口”的模型</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">PoC 阶段提前揪出 94% 的生产业务槽位幻觉缺陷</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">高危实体槽位精确率门禁强制锁定 &gt;= 99.5%</text>
  </g>

  <!-- Pillar 2: Full-Duplex Turn-Taking, Barge-In Stop Latency & False-Interruption Matrix -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#dupGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 全双工打断瀑布 (&lt;=200ms) 与防抢话评测</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="82" fill="#7DD3FC" font-size="13" font-weight="700">四段式全双工交互声学探针 (Duplex Acoustic Probes)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• ① P50/P95 首字音频延迟 (TTFA)：用户尾音结束 -&gt; 第一帧有效语音包到达</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• ② 打断停音延迟 (Barge-In Stop)：用户插话 -&gt; AI 清空下行声卡缓冲 (&lt;=200ms)</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">“真打断召回率” vs “咳嗽/附和声误打断率”正交压测</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 正样本：AI 播报长段条款时，用户喊“不对，我说的是下周二” -&gt; 必须 &lt;200ms 停音改口</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 负样本：用户边听边说“嗯哼/好的”、清嗓子或旁人说话 -&gt; 严禁自断句子！</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">句中思考停顿 (Mid-Sentence Hesitation 1.2s) 抢话率</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 用户看银行卡念卡号：“我的卡号是 6222……呃等我找下老花镜……”</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 评测 Semantic EOU 能否识别未完结从句并自动展宽等待，而非 500ms 粗暴抢话</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">全双工自然对话 MOS 体感评分提升 1.4 分 (满5分)</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">打断后旧轮次异步工具调用泄露率强制要求 == 0.0%</text>
  </g>

  <!-- Pillar 3: Quadratic Long-Call Cost Curve & 7-Card Visual Report Standard -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#finGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 长通话二阶成本曲线测算与 7-Card 交付标准</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 警惕“前 2分钟很便宜、第 15分钟贵得破产”的 S2S 陷阱！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 原生 S2S 模型每轮对话若将历史全部原始音频 Token 重复带入下一轮输入</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 第 20轮对话的单轮成本是第 1轮的 20倍，15分钟通话成本飙至 $2.80+！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">滑动窗口“保留最近4轮音频 + 历史转文本摘要”裁剪验证</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 评测基准强制跑满 15分钟 (45轮) 长对话：实测未裁剪 vs 滑动窗口裁剪成本</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 强制要求 15分钟综合单分钟成本稳定在 &lt;=$0.08/min 且不丢失首轮关键槽位</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">7-Card (4:5) 客户 CXO 架构选型视觉交付报告规范</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 将枯燥的 CSV 转化为 7张直观卡片（总览、单例深潜、矩阵、契约、鲁棒性、延迟、建议）</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 帮助客户 CTO 与业务副总裁在 15分钟架构评审会上当场拍板定标</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">15分钟长对话 Token 成本降低 68% · 选型周期缩短 50%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">一套标准化评测脚手架横评 GPT-Realtime / Gemini / Nova / 级联架构</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">架构师核心选型法则 (VOICE-BENCHMARK-HARNESS-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 企业选型严禁只看安静录音室的静态通用 WER，必须以“8kHz 窄带噪音频谱下的高危实体槽位精确率 (&gt;=99.5%) + P95 TTFA (&lt;=750ms) + 打断停音 (&lt;=200ms)”为准绳；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 针对原生 S2S 模型必须实测 15分钟长通话的 Token 累加曲线，凡单通成本 &gt;$1.20 必须强制开启“最近4轮原声 + 早期轮次文本摘要”上下文裁剪。</text>
</svg>
