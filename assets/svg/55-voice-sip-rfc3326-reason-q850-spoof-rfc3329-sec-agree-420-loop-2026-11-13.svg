<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg55" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="blueGrad55" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad55" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg55)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="56" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">STAGE 411 · TOPIC 51 · SIP RFC 3326 REASON Q.850 SPOOF + FORK CANCEL &amp; RFC 3329 / SIP 420 LOOP FAQ (P815–P816)</text>
  <text x="56" y="84" fill="#F8FAFC" font-family="Segoe UI, system-ui, sans-serif" font-size="20.5" font-weight="700">SIP RFC 3326 Q.850 Scrub + Forking Cancel Gate &amp; RFC 3329 Sec-Agree / SIP 420 Loop Guard</text>
  <rect x="960" y="38" width="184" height="32" rx="16" fill="#065F46" stroke="#10B981" stroke-width="1.2"/>
  <text x="1052" y="59" text-anchor="middle" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Stage 411 · Topic 51 · 414D</text>

  <!-- Left Column: P815 SIP RFC 3326 Reason Q.850 Spoof & Forking Completed Elsewhere Gate -->
  <rect x="36" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="36" y="124" width="552" height="44" rx="12" fill="url(#blueGrad55)"/>
  <text x="56" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P815 · SIP RFC 3326 Reason Q.850 &amp; Forking Cancel Gate</text>

  <!-- Anti-pattern Box Left -->
  <rect x="56" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="72" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: Spoofed Q.850 Causes &amp; False Missed-Call Storms</text>
  <text x="72" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Untrusted peer injects Reason: Q.850;cause=16/1 to poison CDRs</text>
  <text x="72" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  and trick outbound AI dialers into blacklisting active numbers</text>
  <text x="72" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Bare CANCEL on AI-answered parallel fork logs 15k+ missed calls</text>
  <text x="72" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: CDR Billing Fraud · 8.5% Agent Callback Waste on Desk Phones</text>

  <!-- Best Practice Box Left -->
  <rect x="56" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="72" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ Edge Q.850 Reason Scrub &amp; `cause=200 / Q.850;cause=26` Stamp</text>
  <text x="72" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. Ingress Scrubbing: Strip 100% of untrusted external Reason: Q.850</text>
  <text x="72" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   headers at edge SBC (0 spoofed Q.850 release cause codes)</text>
  <text x="72" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. Completed Elsewhere: Stamp Reason: SIP;cause=200 &amp; Q.850;cause=26</text>
  <text x="72" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   on losing parallel-fork CANCEL branches (0 false missed calls)</text>
  <text x="72" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P815: spoofedQ850Headers = 0 · falseMissedCallAlerts = 0</text>
  <text x="72" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: Tamper-Proof CDR Attribution · Clean Agent Call Logs</text>

  <!-- Bottom KPI Pill Left -->
  <rect x="56" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="72" y="530" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateSipRfc3326ReasonHeaderQ850SpoofAndForkingCancelGate`)</text>
  <text x="72" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedSpoofedQ850ReasonHeaders = 0 | clampedFalseMissedCallForkAlerts = 0</text>
  <text x="72" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: scrub_spoofed_q850_reason_and_stamp_completed_elsewhere (0ms @ 1ms grid)</text>

  <!-- Right Column: P816 SIP RFC 3329 Sec-Agree Downgrade & SIP 420 Bad Extension Loop Guard -->
  <rect x="612" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="612" y="124" width="552" height="44" rx="12" fill="url(#emeraldGrad55)"/>
  <text x="632" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P816 · SIP RFC 3329 Sec-Agree &amp; SIP 420 Loop Guard</text>

  <!-- Anti-pattern Box Right -->
  <rect x="632" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="648" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: Sec-Agree Plaintext Downgrade &amp; 420 Retry Storm</text>
  <text x="648" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• MITM strips Security-Server TLS/IPsec options, downgrading SIP</text>
  <text x="648" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  signaling to unencrypted UDP without Security-Verify enforcement</text>
  <text x="648" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Legacy PBX returns 420 with empty Unsupported, looping INVITEs</text>
  <text x="648" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: Silent Signaling Wiretap · Sub-Millisecond 420 CPU Storm</text>

  <!-- Best Practice Box Right -->
  <rect x="632" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="648" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ RFC 3329 `494` Verify Lock &amp; `[1, 2]` SIP 420 Retry Ceiling</text>
  <text x="648" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. Security-Verify Mirror Check: Reject any mismatched or missing</text>
  <text x="648" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   RFC 3329 Security-Verify header with SIP 494 (0 downgrades)</text>
  <text x="648" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. SIP 420 Bad Extension Cap: Require strict Require-set reduction</text>
  <text x="648" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   and clamp strip-and-retry attempts to [1, 2] per transaction</text>
  <text x="648" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P816: secAgreeDowngrades = 0 · sip420RetryCount = [1, 2]</text>
  <text x="648" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: 0 Plaintext Trunk Downgrades · 0 Infinite 420 Loops</text>

  <!-- Bottom KPI Pill Right -->
  <rect x="632" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="648" y="530" fill="#34D399" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateSipRfc3329SecAgreeDowngradeAndSip420BadExtensionLoopGate`)</text>
  <text x="648" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedSecAgreeDowngradeAttempts = 0 | clampedSip420RetryCount = [1, 2]</text>
  <text x="648" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: reject_sec_agree_downgrade_494_and_cap_420_retries (0ms @ 1ms grid)</text>

