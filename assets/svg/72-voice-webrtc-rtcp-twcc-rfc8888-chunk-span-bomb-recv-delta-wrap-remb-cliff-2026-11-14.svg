  <text x="672" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P850 🎉 · 第 70 篇 FAQ 与 870 单测里程碑）：</text>
  <text x="672" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedSpoofedUnsentSeqOrRembCliffReports = 0（100% 剔除幽灵序号与恶意 REMB）</text>
  <text x="672" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMinProtectedAudioTwccFloorKbps ∈ [24, 64]（锁死不可击穿的语音保底码率）</text>

