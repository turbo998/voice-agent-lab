  <text x="672" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 断崖风险：GoogCC 误判 100% 拥塞在 10ms 内砍光码率，导致 Opus 语音断流变哑巴</text>
