  <!-- Left Column: TWCC Span Bomb & recv_delta Closure Gate (P849) -->
  <rect x="44" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="146" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. TWCC Chunk Span Bomb &amp; recv_delta Overread Gate (P849)</text>
  <text x="64" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：28B TWCC 包谎称 status_count=65535 + RunLength(S=10) 但尾部 0B delta</text>
  <text x="64" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 崩溃风险：未预检字节总和直接越界读取 131,070 字节堆内存或触发 65,535 次空转</text>
  <rect x="64" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Span Bomb: pkt=28B, status_count=65535 (S=10) -&gt; 131KB Heap Overread</text>
  <text x="80" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P849 Gate: status_count in [1, 256] &amp; sum(delta_bytes) &lt;= rem_bytes</text>
  <text x="80" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: drop_twcc_span_bomb_and_clamp_packet_status_count</text>
  <text x="64" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P849）：</text>
  <text x="64" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMalformedOrOverreadTwccFeedbackPackets = 0（100% 拦截越界与跨度炸弹）</text>
  <text x="64" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedMaxTwccPacketStatusCountPerReport ∈ [1, 256]（消除 65535x CPU 放大）</text>

