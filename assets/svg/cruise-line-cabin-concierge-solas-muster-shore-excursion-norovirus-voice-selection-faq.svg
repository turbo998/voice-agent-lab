  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399">Ship-Time vs Local Port-Time Pier Lock</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Explicitly states BOTH Ship Time &amp; Local</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Port Time for "All Aboard" &amp; Last Tender Boat</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">• Warns smartphone auto-timezone drift causes</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  pier-runners to miss ship departure by 1 hour</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Cruise-Line vs Third-Party Excursion Split</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Official Ship Excursion: guaranteed "Ship</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Will Wait" or paid forward transport if late</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• Independent Tour: never promises ship will</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  hold gangway; gives Port Agent emergency contact</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">PVSA / Jones Act &amp; Passport Visa Check</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Blocks unauthorized early disembarkation</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">  between two US ports without distant foreign</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#6ee7b7">  port call ($971/pax CBP PVSA penalty guard)</text>

