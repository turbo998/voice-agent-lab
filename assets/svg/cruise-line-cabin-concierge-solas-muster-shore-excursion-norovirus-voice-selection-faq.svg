  <text x="832" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Guest calls Room Service / Medical with</text>
  <text x="832" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  &gt;=3 loose stools or vomiting in 24h (Norovirus)</text>
  <text x="832" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• Coaches guest to stay in stateroom (never</text>
  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">  visit buffet/ clinic lobby) + logs CDC VSP surveillance</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">0ms Man Overboard (Code Oscar) &amp; Fire (Bravo)</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Detects "Someone fell overboard!", balcony</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  smoke/fire, or chest pain (Code Alpha)</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• 0ms bridge to Ship's Navigation Bridge &amp; Medical</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">Balcony Fire &amp; Rough-Seas Safety Guard</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Prohibits irons/candles/flames in cabins</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Announces outer promenade deck closures</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">  during Beaufort Scale &gt;=8 gale-force winds</text>

