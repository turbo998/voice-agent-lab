  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">On-Vessel Server Room Edge Inference</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• 6,000 stateroom phones run over local PBX</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Local L40S GPU cluster runs STT/LLM/TTS on</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  ship LAN (380ms latency even when Starlink</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  satellite drops in Norwegian fjords/storms)</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">SOLAS Chapter III Muster Drill Gate</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Checks Fidelio Cruise / Oracle SPMS status</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• On Embarkation Day: if guest has NOT scanned</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  Assembly Station (e.g., Muster B4), prompts</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">  completion before sail-away bar/wifi unlocks</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
