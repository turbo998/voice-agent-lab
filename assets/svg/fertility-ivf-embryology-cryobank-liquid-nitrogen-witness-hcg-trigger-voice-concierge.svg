  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks LLM from telling patient "It's fine to take your trigger shot 3 hours late"</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• If trigger shot is delayed &gt;15 min, notifies OR schedule to shift retrieval time</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Walks nervous patients step-by-step through Menopur/Pregnyl Q-Cap mixing at 11 PM</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Severe OHSS, Ovarian Torsion &amp; LN2 Cryo-Tank Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects post-retrieval rapid weight gain (&gt;1kg/day), dyspnea, or unilateral pelvic pain</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects Cryobank LN2 temperature rise (&gt;-180°C) or room O2 &lt;19.5%</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Bridges On-Call REI Physician or Embryology Lab Director in 0ms</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full CAP Reproductive Lab Checklist, FDA 21 CFR Part 1271 &amp; HIPAA WORM log</text>

