  <rect width="1200" height="680" fill="url(#bg245)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Fertility IVF Clinic, Embryology Witnessing &amp; Cryobank LN2 Voice Architecture</text>
  <text x="600" y="66" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">36-Hr Trigger-Shot Minute Lock · RI Witness RFID + Dual-Embryologist Gamete Gate · 0ms OHSS &amp; LN2 (-196°C) Alarm Bridge (FERTILITY-IVF-CRYOBANK-WITNESS-01)</text>

  <!-- Left Column: IVF Patient Nurse Line & Embryology Bench -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card245)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="166" y="122" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Patient &amp; Embryology Channels</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#c084fc"/>
