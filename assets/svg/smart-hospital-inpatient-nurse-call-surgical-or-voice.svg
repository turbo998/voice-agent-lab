<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="orGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg42)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Smart Hospital Inpatient Bedside Nurse Call, Sterile OR &amp; WHO Timeout Voice</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">三甲智慧医院住院病房“智能床旁呼叫分诊”、手术室无菌语音控屏（PACS）与 WHO 安全核查（P155）选型全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#A7F3D0" font-size="13" font-weight="600" text-anchor="middle">HOSP-NURSE-01 · P155</text>

  <!-- Pillar 1: Inpatient Bedside Call Bell Triage (RN vs CNA vs IoT) -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#bedGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 住院床旁红灯智能分诊 (护士日省6,000步)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 为什么住院部护士每天跑 18,000 步累到崩溃？</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 62% 的床头按铃是非医疗杂事（调空调/要温水/问WiFi）</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 传统呼叫铃只亮红灯不分轻重，真输液回血/呼吸困难被耽误！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">按铃 &lt;=180ms 秒接 + 医护工三级精准派单</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 调灯光/窗帘/电视/查明日检查项 ➔ 床旁语音 IoT/HIS 自助闭环</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 换尿垫/倒水/订餐 ➔ 直接派单护工(CNA)手环，不打扰护士！</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">输液空瓶/术后剧痛/呼吸困难 0秒直通责任护士</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 患者说“吊瓶快滴完了” ➔ 护士只跑 1 趟直接带封管液进房</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 消灭“先跑去床头问啥事、再跑回治疗室拿药”的往返空跑！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">护士无效往返跑腿减少 54% · 危重响应提速 3.8倍</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">床旁呼叫 100% 秒接 · 住院患者满意度 (HCAHPS) 跃升</text>
  </g>

  <!-- Pillar 2: Sterile Operating Room (OR) PACS & WHO Timeout (P155) -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F97316" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#orGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 手术室无菌语音控屏与 WHO 核查 (P155)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⚡ 主刀医生双手无菌手套严禁触碰键鼠！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 术中需看患者 CT 血管三维重建第 42 层或调亮腔镜光源</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 靠喊巡回护士代点鼠标效率极低且易调错序列</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FDBA74" font-size="13" font-weight="700">无菌免手控制 PACS 三维影像与手术床/无影灯</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 主刀口令：“PACS 切换动脉期冠状位，放大 1.5 倍，向右旋转30度”</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 本地医疗语音容器 &lt;=150ms 操控数字化手术室 (Karl Storz/Stryker)</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">P155 WHO 手术三方安全核查与纱布清点硬锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 划皮前强制核对 (主刀+麻醉+护士) 患者腕带与左/右侧手术部位</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 关腹前语音清点纱布/缝针数目：差 1 块立即红灯蜂鸣禁关腹！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">开错左右侧部位与纱布遗留事故率锁死为 0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 满足 JCI 国际医院认证与卫健委手术安全核查制度</text>
  </g>

  <!-- Pillar 3: Bedside Nursing Charting & SBAR Shift Handoff -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#handGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 床旁免手护理文书录入与 SBAR 交接班</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">消灭护士下班后“留堂 90分钟补写护理记录单”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 护士查房戴蓝牙胸麦边测边说：“12床血压135/85，引流液淡红40毫升，</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 骶尾部皮肤完好 Braden评分16分” ➔ 实时结构化写入护理系统</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">五对核查 (5 Rights) 给药语音+扫码双保险</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 扫患者腕带 + 口述高危药名与剂量 (如胰岛素/氯化钾)</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 高危电解质/化疗药强制触发第二名护士双人语音复核签名</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">早晚班 SBAR 结构化交班语音纪要 (5秒生成)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 自动汇总全病区 45 床当班生命体征危急值与待办医嘱</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 按 Situation-Background-Assessment-Recommendation 生成交班卡</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">每名护士每班次节省 75 分钟文书录入时间</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">把护士的时间还给病人 · 护理不良事件下降 72%</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">三甲智慧医院住院与手术室院内私有化语音闭环（Inpatient Ward &amp; Sterile OR Voice Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 床旁呼叫：&lt;=180ms 接听分流 (环境控温走 IoT / 生活照料派护工 / 输液剧痛携摘要直推责任护士 PDA)</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 2. 查房录单：胸麦口述体征秒入 HIS/EMR ➔ 3. 数字化手术室：无菌免手控 PACS 影像 + P155 WHO 手术部位与纱布清点硬锁</text>
  </g>
</svg>
