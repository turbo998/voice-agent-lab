  <text x="385" y="185" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate A: Anti-Pretexting DSAR Identity &amp; Authorized-Agent Lock</text>
  <text x="385" y="208" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Never reads out or emails a Right-to-Access (DSAR) personal data archive</text>
  <text x="385" y="228" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  based on phone KBA alone (prevents stalkers/hackers weaponizing DSARs)</text>
  <text x="385" y="248" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• Requires passkey/IDV + GDPR Art. 17(3) AML/Tax/Loan retention check</text>

  <rect x="365" y="292" width="440" height="122" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="385" y="319" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate B: GDPR Art. 17(3) Statutory Retention &amp; Anti-Fraud Purge Block</text>
  <text x="385" y="342" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks hard-deleting records when a debtor or fraudster invokes &quot;Right to</text>
  <text x="385" y="362" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">  Be Forgotten&quot; to wipe an unpaid loan, chargeback history, or 5yr AML log</text>
  <text x="385" y="382" fill="#fef08a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• Suppresses marketing only while preserving statutory financial records</text>

  <rect x="365" y="430" width="440" height="128" rx="8" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="385" y="457" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate C: Cross-Border Data Residency &amp; 72-Hour Breach DPO Escalation</text>
  <text x="385" y="480" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks cross-border PII export unless SCCs/DPF or CAC Security Assessment</text>
  <text x="385" y="500" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">  is active; if caller reports a PII data breach, 0ms starts the GDPR 72h /</text>
  <text x="385" y="520" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  DORA 4h / PIPL statutory DPO notification countdown</text>

