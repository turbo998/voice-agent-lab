  <rect width="1200" height="680" fill="url(#bg519)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#cyanGrad519)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">CORP T&amp;E · #519</text>
  <text x="194" y="44" class="title">Corporate Travel &amp; Expense (SAP Concur / Navan) Voice Concierge &amp; FCPA Guardrail</text>
  <text x="194" y="65" class="subtitle">&lt;75s Policy-Compliant Flight/Hotel Rebooking + ISO 31030 Duty-of-Care Gate + Multimodal Receipt &amp; FCPA Anti-Bribery Lock (-$310k/10k Hrs)</text>

  <!-- Column 1: 24/7 Corporate Travel Rebooking & Policy Engine -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad519)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. 24/7 TMC Rebooking &amp; Travel Policy Gate</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Job-Band &amp; Flight-Duration Cabin Policy</text>
    <text x="26" y="86" class="body-text">• Evaluates employee HR band (L5 vs. VP), flight</text>
    <text x="26" y="102" class="body-text">  duration (&gt;6h Business Class rule), and negotiated</text>
    <text x="26" y="122" class="mono">corporate carrier rates in SAP Concur / Navan / GBT</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Unused Ticket Credit Auto-Redemption</text>
    <text x="26" y="186" class="body-text">• Automatically checks corporate unused e-ticket</text>
    <text x="26" y="202" class="body-text">  waiver/credit bank before charging corporate card</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Recovers 94.2% of Expiring Airline Credits</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
