    <text x="26" y="102" class="body-text">  International SOS / Crisis24 risk advisories</text>
    <text x="26" y="122" class="mono" fill="#fda4af">High-Risk Zone / Medical Emergency -> 0ms GSOC Bridge!</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Emergency Policy Cap Override on Evacuation</text>
    <text x="26" y="188" class="body-text">• When an airport or city is under active severe</text>
    <text x="26" y="204" class="body-text">  weather or security evacuation, automatically</text>
    <text x="26" y="224" class="mono">unlocks emergency fare-cap waiver to get staff home</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#34d399">Automated Hotel &amp; Ground Transport Cascade</text>
    <text x="26" y="290" class="body-text">• When an overnight flight is cancelled, books</text>
    <text x="26" y="306" class="body-text">  corporate-approved airport hotel &amp; updates next-</text>
    <text x="26" y="324" class="mono" fill="#6ee7b7">day rental car pickup in one atomic transaction</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#fda4af">100% Traveler Location Accountability</text>
    <text x="26" y="386" class="body-text">Updates corporate Duty-of-Care PNR tracker</text>
    <text x="26" y="402" class="mono" fill="#fda4af">in real time across all rebooked segments</text>
  </g>

  <!-- Column 3: Multimodal Expense Receipt & FCPA Anti-Bribery Gate -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad519)"/>
