    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">20s Voice + Receipt Photo Expense Filing</text>
    <text x="26" y="86" class="body-text">• Employee snaps receipt &amp; speaks attendee names;</text>
    <text x="26" y="102" class="body-text">  itemizes hotel folio (room vs. tax vs. minibar)</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">&amp; matches corporate Amex/Visa feed in Concur</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#fb7185">FCPA / UK Bribery Act Public-Official Gate</text>
    <text x="26" y="188" class="body-text">• If meal/gift attendees include a government</text>
    <text x="26" y="204" class="body-text">  official or SOE buyer, checks statutory per-head</text>
    <text x="26" y="222" class="mono" fill="#fda4af">limit ($25/$50) &amp; holds for Legal Compliance Sign-Off!</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Duplicate Receipt &amp; Alcohol Carve-Out Check</text>
    <text x="26" y="288" class="body-text">• Hashes receipt merchant+date+amount+last4 to</text>
    <text x="26" y="304" class="body-text">  block double-submissions &amp; separates unallowable</text>
    <text x="26" y="322" class="mono">personal/minibar items automatically</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Guardrail: CORP-TRAVEL-EXPENSE-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateCorporateTravelExpenseConcurFcpaGuard</text>
    <text x="26" y="402" class="body-text">0.0% FCPA/Policy Breaches · -$310k/10k Hrs Saved</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Corporate Travel &amp; Expense (T&amp;E) Voice AI Benchmarks (per 10,000 Operating Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">TMC After-Hours Agent Fees</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">-86.4% ($38/Call Avoided)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Unused Airline Credit Recovery</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">48.0% → 94.2% (Auto-Match)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">FCPA / Policy Leakage Rate</text>
    <text x="16" y="50" class="kpi-num" fill="#fb7185">0.00% (Hard Compliance Gate)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">T&amp;E Leakage &amp; Labor Saved</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$310,000 / 10k Hours</text>
