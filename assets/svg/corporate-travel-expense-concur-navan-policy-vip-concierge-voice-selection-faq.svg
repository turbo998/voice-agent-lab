    <text x="26" y="288" class="body-text">• If last-minute rebooking exceeds benchmark fare</text>
    <text x="26" y="304" class="body-text">  by &gt;15%, places 15-min GDS hold &amp; pings manager</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Adaptive Card for instant out-of-policy approval</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">&lt;75s Airport IRROPS Self-Service Resolution</text>
    <text x="26" y="384" class="body-text">Eliminates $38 TMC after-hours agent call fees</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">&amp; 40-minute airport hold queues</text>
  </g>

