<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg509" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad509" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad509" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad509" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="roseGrad509" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg509)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#cyanGrad509)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">GOV 311 &amp; UTIL · #509</text>
  <text x="194" y="44" class="title">Citizen 311 / 12345 Hotline, Utility Outage Storm Surge &amp; Accessible Voice AI</text>
  <text x="194" y="65" class="subtitle">&lt;120ms GIS Outage Surge Deflection (84.6% Offload) + &lt;10s Gas/Live-Wire Safety Gate + Elderly 0.85x Dialect Mode (-$355k/10k Hrs)</text>

  <!-- Column 1: 100x Utility Storm-Surge & GIS Outage Deflection -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad509)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. 100x Storm-Surge GIS Outage Deflection</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">&lt;120ms Pre-Answer OMS / GIS Grid Lookup</text>
    <text x="26" y="86" class="body-text">• Maps caller phone (ANI) to utility smart meter &amp;</text>
    <text x="26" y="102" class="body-text">  Outage Management System (OMS) feeder status</text>
    <text x="26" y="122" class="mono">Speaks Crew Dispatch Status &amp; ETR in First 10s</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Edge-Cached Audio for 100x Storm Spikes</text>
    <text x="26" y="186" class="body-text">• Pre-synthesizes feeder-level outage audio clips</text>
    <text x="26" y="202" class="body-text">  so 50,000 concurrent storm callers bypass LLM GPUs</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Deflects 84.6% of Surge Calls at $0.003/call</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Life-Support Medical Baseline Priority</text>
    <text x="26" y="288" class="body-text">• Flags households with home oxygen / dialysis</text>
    <text x="26" y="304" class="body-text">  equipment in CRM; prioritizes backup battery &amp;</text>
    <text x="26" y="322" class="mono" fill="#fde68a">welfare check dispatch during prolonged outages</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Automated SMS Restoration Subscription</text>
    <text x="26" y="384" class="body-text">Enrolls caller in proactive ETR text alerts with</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">one verbal "Yes" (eliminates repeat status calls)</text>
  </g>

  <!-- Column 2: <10s Gas Leak / Downed Wire Safety & 311 GIS Triage -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#roseGrad509)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. &lt;10s Hazard Gate &amp; 311 Landmark GIS</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#fb7185">&lt;10s Gas Odor &amp; Downed Live-Wire Gate</text>
    <text x="26" y="86" class="body-text">• Never ask for an account number on a gas leak!</text>
    <text x="26" y="102" class="body-text">• Instructs "Do not flip switches, evacuate now"</text>
    <text x="26" y="122" class="mono" fill="#fda4af">&amp; bridges Emergency Dispatch / 911 / 119 in 0ms!</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Fuzzy Landmark-to-Parcel GIS Geocoding</text>
    <text x="26" y="188" class="body-text">• Citizens say "Water main burst near East Park</text>
    <text x="26" y="204" class="body-text">  south gate"; resolves landmark to exact municipal</text>
    <text x="26" y="224" class="mono">GIS parcel &amp; routes to Water Dept (97.8% Accuracy)</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#34d399">Spatial Duplicate Ticket Deduplication</text>
    <text x="26" y="290" class="body-text">• If 40 citizens report the same fallen tree or</text>
    <text x="26" y="306" class="body-text">  traffic light outage within 100m, links caller</text>
    <text x="26" y="324" class="mono" fill="#6ee7b7">to Master Work Order instead of 40 duplicate dispatches</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#fda4af">911 / Non-Emergency 311 Boundary Lock</text>
    <text x="26" y="386" class="body-text">Instantly warm-transfers active crime, fire, or</text>
    <text x="26" y="402" class="mono" fill="#fda4af">medical emergencies from 311/12345 to 911/110/120</text>
  </g>

  <!-- Column 3: Elderly-Friendly 0.85x Dialect Mode & Section 508 -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad509)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. Elderly-Friendly &amp; Accessible Governance</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">Auto Elderly Mode (0.85x Rate + 1,100ms Pause)</text>
    <text x="26" y="86" class="body-text">• Detects senior cadence or senior-citizen profile:</text>
    <text x="26" y="102" class="body-text">  slows TTS to 0.85x, boosts consonant clarity,</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">&amp; translates bureaucratic jargon into plain speech</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#fbbf24">Regional Dialect &amp; Multilingual Equity</text>
    <text x="26" y="188" class="body-text">• Understands Cantonese, Sichuanese, Hokkien,</text>
    <text x="26" y="204" class="body-text">  Spanish, and Vietnamese without forcing callers</text>
    <text x="26" y="222" class="mono" fill="#fde68a">to navigate complex press-1 language trees</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Zero Unauthorized Benefits Eligibility Deny</text>
    <text x="26" y="288" class="body-text">• AI assists with status lookup &amp; document checklist</text>
    <text x="26" y="304" class="body-text">  but NEVER issues binding public-benefit denials</text>
    <text x="26" y="322" class="mono">Enforces Statutory Due-Process Human Caseworker Gate</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Guardrail: GOV-311-UTILITY-VOICE-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateGovernment311UtilityOutageCitizenGuard</text>
    <text x="26" y="402" class="body-text">84.6% Surge Offload · -$355k/10k Hrs Civic Value</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Citizen 311 / 12345 &amp; Utility Outage Voice AI Benchmarks (per 10,000 Operating Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Storm Outage Surge Deflection</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">84.6% (&lt;18s GIS Broadcast)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Gas Leak / Live-Wire Escalation</text>
    <text x="16" y="50" class="kpi-num" fill="#fb7185">&lt;10 sec (0ms Safety Bridge)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Elderly Citizen Self-Service</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">38% → 86.4% (0.85x Dialect)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Civic &amp; Utility Cost Savings</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$355,000 / 10k Hours</text>
  </g>
