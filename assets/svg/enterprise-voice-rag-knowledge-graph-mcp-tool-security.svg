<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Enterprise Voice-Native RAG, Spoken Query Rewrite &amp; MCP Tool Security Architecture &amp; Selection Guide">
