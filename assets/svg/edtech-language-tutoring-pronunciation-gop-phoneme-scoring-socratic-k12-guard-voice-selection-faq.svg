  <rect x="835" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="180" class="node-title">COPPA / GDPR-K 儿童声纹零留存与零训练</text>
  <text x="849" y="200" class="node-sub">• 未成年人音频流仅在内存完成 GOP 评分后即刻销毁</text>
  <text x="849" y="218" class="node-sub">• 100% 禁止提取儿童声纹向量或将录音用于大模型再训练</text>
  <text x="849" y="236" class="node-sub">• 自动拦截并打码孩子无意说出的家庭住址、学校与家长电话</text>

  <rect x="835" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="282" class="node-title">校园霸凌/自伤危机毫秒级强制守护 (Safe-Harbor)</text>
  <text x="849" y="302" class="node-sub">• 双层内容安全护栏 (Azure AI Content Safety + 教育分类器)</text>
  <text x="849" y="320" class="node-sub">• 阻断成人/暴力/越狱话题，温和拉回课程主题</text>
  <text x="849" y="338" class="node-sub">• 一旦检测到自伤或受侵害倾诉，立即切入标准关怀话术并告警</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">艾宾浩斯错音与薄弱知识点跨课记忆卡</text>
  <text x="849" y="406" class="node-sub">• 仅保存非隐私结构化学习画像 (`weak_phonemes: [/θ/, /v/]`) </text>
  <text x="849" y="424" class="node-sub">• 在第 1/3/7 天对话中自然编入含 `/θ/` 的词汇检验巩固成果</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (EDTECH-GOP-SOCRATIC-K12-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截直接给出作业答案、500ms 抢话截断初学者与儿童录音落盘</text>
  <text x="849" y="518" class="node-sub">• 强制并行注入音素级 GOP 评分与 K-12 安全过滤</text>

