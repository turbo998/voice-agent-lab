  <rect x="28" y="106" width="355" height="36" rx="12" fill="url(#accentBlue552)" />
  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① 双轨音素级发音评估 (Phoneme GOP + LLM)</text>

  <rect x="46" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">破解通用 STT“自动纠错掩盖发音错误”痛点</text>
  <text x="60" y="200" class="node-sub">• 学员把 "think (/θ/)" 读成 "sink (/s/)" 会被通用 STT 自动修正</text>
  <text x="60" y="218" class="node-sub">• 旁路并行调用 Azure Speech Pronunciation Assessment</text>
  <text x="60" y="236" class="node-sub">• &lt;140ms 输出音素级 GOP 分数、重音偏移、流利度与韵律</text>

  <rect x="46" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="282" class="node-title">非打断式微纠错注入 (Non-Intrusive Recast)</text>
  <text x="60" y="302" class="node-sub">• GOP &gt;=65 分时不打断对话流，记入课后音素热力图报告</text>
  <text x="60" y="320" class="node-sub">• GOP &lt;45 分且影响语义时，将 `{phoneme: θ-&gt;s}` 注入 LLM</text>
  <text x="60" y="338" class="node-sub">• 外教音色自然接话并示范咬舌发音 + 屏幕口腔动图演示</text>

  <rect x="46" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="386" class="node-title">雅思/托福/剑桥口语与考官级评分对齐</text>
  <text x="60" y="406" class="node-sub">• 发音、词汇、语法、流利度四维评分与真考官相关系数 r=0.94</text>
  <text x="60" y="424" class="node-sub">• 单节 25 分钟 1v1 外教成本从 $18.00 压至 $0.68 (-96.2%)</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">L1 母语负迁移专属声学词典</text>
  <text x="60" y="500" class="node-sub">• 针对中日韩/西语/阿语母语者高频混淆音素定制纠音策略</text>
  <text x="60" y="518" class="node-sub">• 音素错读检出率从纯大模型的 42% 跃升至 96.8%</text>

