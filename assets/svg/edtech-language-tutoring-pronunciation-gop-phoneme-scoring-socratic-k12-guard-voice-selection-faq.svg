  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② CEFR 动态耐性 VAD 与苏格拉底启发状态机</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">CEFR 等级自适应停顿窗口 (Adaptive Learner VAD)</text>
  <text x="435" y="200" class="node-sub">• 痛点: 客服级 500ms VAD 会频繁掐断正在想词的初学者</text>
  <text x="435" y="218" class="node-sub">• A1/A2 初学者: 句未完停顿延长至 1,800ms + 屏幕静默提示词卡</text>
  <text x="435" y="236" class="node-sub">• C1/C2 高阶商务辩论: 切换至 550ms 高强度快节奏追问</text>

  <rect x="421" y="264" width="358" height="94" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">三步苏格拉底防抄作业锁 (Anti-Spoiler Scaffolding)</text>
  <text x="435" y="306" class="node-sub">• 严禁直接报出数学/编程/阅读题最终答案 (0.00% 直接泄题)</text>
  <text x="435" y="324" class="node-sub">• Step 1: 反问已知条件 → Step 2: 拆解子步骤/给公式线索</text>
  <text x="435" y="342" class="node-sub">• Step 3: 结合共享画板 (Whiteboard Canvas) 圈出错误计算行</text>

  <rect x="421" y="372" width="358" height="82" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="394" class="node-title">多模态草稿纸与解题画板同步 (Vision Whiteboard)</text>
  <text x="435" y="414" class="node-sub">• 实时识别 iPad 手写笔迹或书本拍照，定位第 2 行移项符号错误</text>
  <text x="435" y="432" class="node-sub">• 语音温柔引导:“仔细看看第二行等号右边的负号去哪啦？”</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">学员开口时长占比 (Student Talk Time) &gt;= 68%</text>
  <text x="435" y="510" class="node-sub">• 强制限制 AI 单轮回复 &lt;=2 句话，把开口机会留给学员</text>

