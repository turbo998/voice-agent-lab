  <rect width="1200" height="675" fill="url(#bg23)" />

  <!-- Header -->
  <rect x="36" y="26" width="1128" height="84" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <rect x="54" y="42" width="286" height="26" rx="6" fill="url(#accentOrange)" />
  <text x="197" y="59" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STAGE 379 · TOPIC 19 · P751–P752</text>
  <text x="356" y="60" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">85dB 强噪远场波束成形（Drive-Thru/座舱/工厂）与工业免提 LOTO 安全互锁架构</text>
  <text x="54" y="92" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13">Far-Field MVDR Beamforming Cone (&lt;=25° Aperture, &gt;=6dB SNR Anti-Hallucination) &amp; OSHA 1910.147 LOTO Challenge-Readback Interlock (382 Dims)</text>

  <!-- Left Panel: P751 MVDR Spatial Beamforming & Low-SNR Anti-Hallucination -->
  <rect x="36" y="128" width="552" height="420" rx="14" fill="#1E293B" stroke="#F97316" stroke-width="1.5" />
  <rect x="56" y="148" width="512" height="38" rx="8" fill="#431407" />
  <text x="312" y="172" fill="#FDBA74" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. P751 多麦 MVDR 波束锥 (&lt;=25°) 与 &lt;6dB 强噪防音素脑补幻觉锁</text>

  <rect x="56" y="202" width="246" height="145" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.2" />
  <text x="179" y="226" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">单麦+盲目深度学习降噪陷阱</text>
  <text x="72" y="250" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 拾取隔壁车道/后排熊孩子越权喊话</text>
  <text x="72" y="272" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 85dB 柴油机/风机掩蔽 (SNR &lt; 5dB)</text>
  <text x="72" y="294" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 大模型把机械轰鸣脑补成“确认下单”</text>
  <text x="72" y="316" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">• 远场错单率与误控车率高达 18%</text>

  <rect x="322" y="202" width="246" height="145" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2" />
  <text x="445" y="226" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">P751 空间波束锥 + 低信噪比门禁</text>
  <text x="338" y="250" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 4/6 麦阵列 MVDR 锁定 &lt;= ±25° 锥角</text>
  <text x="338" y="272" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 锥外隔壁车道/后排噪声抑制 &gt;18 dB</text>
  <text x="338" y="294" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 瞬时 SNR &lt; 6dB 冻结自由音素脑补</text>
  <text x="338" y="316" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">• 自动触发针对性短追问，0 幻觉落单</text>

  <!-- Beamforming Pipeline Box -->
  <rect x="56" y="363" width="512" height="165" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="76" y="388" fill="#FB923C" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">远场空间滤波与低信噪比防脑补流水线 (P751 Acoustic Cone Gate):</text>
  <text x="76" y="414" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">1. DOA Angle &gt; 25° (Adjacent Lane / Rear Seat) -&gt; Null-Steer Reject</text>
  <text x="76" y="438" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">2. Instantaneous SNR &lt; 6.0 dB (Truck Pass-By) -&gt; Hold Token Commit</text>
  <text x="76" y="462" fill="#34D399" font-family="Consolas, monospace" font-size="12">3. Trigger Micro-Clarification ("Did you say 2 or 3?") -&gt; 0 Ghost Orders</text>
  <text x="76" y="492" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12">收益：在 85dB 快餐免下车通道与四音区座舱中实现 99.4% 抗串音与零机械噪音幻觉。</text>

  <!-- Right Panel: P752 Industrial Hands-Free OSHA LOTO Two-Part Safety Interlock -->
  <rect x="612" y="128" width="552" height="420" rx="14" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
  <rect x="632" y="148" width="512" height="38" rx="8" fill="#083344" />
  <text x="888" y="172" fill="#67E8F9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. P752 工业免提巡检 OSHA 1910.147 LOTO 动态挑战码双步安全互锁</text>

  <rect x="632" y="202" width="246" height="145" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="755" y="226" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">骨传导+气导双模拾音抗噪</text>
  <text x="648" y="250" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 85-95dB 变电站/化工厂安全帽巡检</text>
  <text x="648" y="272" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 骨传导振动传感器锁定佩戴者本人发声</text>
  <text x="648" y="294" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 物理免疫旁人喊话与对讲机串频</text>
  <text x="648" y="316" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">• 声学置信度门槛 &gt;= 0.92</text>

  <rect x="898" y="202" width="246" height="145" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2" />
  <text x="1021" y="226" fill="#FBBF24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">OSHA LOTO 高危操作双步挑战锁</text>
  <text x="914" y="250" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 严禁一句话直接合闸/开阀/解挂牌</text>
  <text x="914" y="272" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 第1步：AI 播报设备号 + 4位随机安全码</text>
  <text x="914" y="294" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">• 第2步：技师逐位复诵 + NFC/物理按键</text>
  <text x="914" y="316" fill="#F43F5E" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">• 缺挑战码或置信度 &lt;0.92 100% 闭锁</text>

  <!-- LOTO Interlock Box -->
  <rect x="632" y="363" width="512" height="165" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="652" y="388" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">工业 PLC/SCADA 免提语音控阀三道门禁 (P752 Safety Interlock):</text>
  <text x="652" y="414" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">1. Read-Only Telemetry ("Check pressure V-102") -&gt; Instant Execution</text>
  <text x="652" y="438" fill="#FBBF24" font-family="Consolas, monospace" font-size="12">2. High-Energy Actuation ("Energize Breaker B4") -&gt; Issue 4-Digit Pin</text>
  <text x="652" y="462" fill="#34D399" font-family="Consolas, monospace" font-size="12">3. Verify Pin Readback (conf &gt;= 0.92) + Physical Dead-Man Switch</text>
  <text x="652" y="492" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12">收益：既解放巡检工程师双手秒查百项设备状态，又将高危误合闸/误开阀风险物理清零。</text>

  <!-- Footer Provenance Banner -->
  <rect x="36" y="564" width="1128" height="84" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <rect x="54" y="582" width="164" height="24" rx="5" fill="url(#accentAmber)" />
  <text x="136" y="598" fill="#0F172A" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PROVENANCE &amp; BOUNDARY</text>
  <text x="234" y="598" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">离线策略验证：821 项单测全绿 · 761 护栏 · 770 探针（580 Live POC Trap Probes）· 382 评测维度</text>
  <text x="54" y="626" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">Timer Disclosure: 0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established (live MVDR DSP &amp; PLC fieldbus latency not_measured)</text>
</svg>
