  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% forbids software jumpering of tower brittle-bars or deropement switches</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces detachable grip-force test &amp; bullwheel anti-rollback brake verification</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Auto-triggers slow-speed unload (&gt;50 km/h gust) &amp; wet-bulb (&lt;-2.5°C) snowgun gate</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Eliminates Gudauri-style chairlift runaway rollback and tower sheave deropement</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Golden-15-Min Avalanche Burial, Tree-Well &amp; Rope-Evac Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Triangulates caller GPS/457 kHz transceiver &amp; dispatches K9/RECCO team in 0ms</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Engages bullwheel service + emergency caliper brakes on rollback or misload</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Bridges Helicopter Search &amp; Rescue (HEMS) &amp; ECMO Rewarming Trauma Center</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full ANSI B77.1 Aerial Tramways, USFS Avalanche Artillery &amp; NSAA Patrol WORM audit</text>

