  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Alpine Ski Resort, Gondola ANSI B77.1 &amp; Avalanche Gazex Patrol Voice Dispatch</text>
