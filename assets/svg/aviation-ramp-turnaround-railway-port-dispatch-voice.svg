<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acdmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg39)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Airport A-CDM Turnaround, Rail Readback Verification &amp; Port Tally Voice AI</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">民航机场过站保障（A-CDM 机坪对讲）、铁路行车指令“联锁复诵核验”与港口集装箱岸桥理货语音架构全景图</text>
  <rect x="906" y="42" width="246" height="34" rx="17" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
  <text x="1029" y="64" fill="#FCA5A5" font-size="13" font-weight="600" text-anchor="middle">TRANS-OPS-01 · &lt;=250ms</text>

  <!-- Pillar 1: Airport 45-Min Turnaround A-CDM Trunked Radio Intelligence -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#acdmGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 机场 45分钟过站 (A-CDM) 机坪对讲感知</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="82" fill="#93C5FD" font-size="13" font-weight="700">消灭“对讲机喊了半天、A-CDM 系统却不知道”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 航食/加油/行李/除冰 16个 800MHz 数字集群对讲频道</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 98dB 航空发动机呼啸滤噪 + 民航标准缩略语识别</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">过站 18个里程碑节点 &lt;=800ms 自动点亮</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 对讲机喊出：“214机位 MU5102 加油完毕撤车”</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 自动点亮 A-CDM 加油完成节点，免除工人摘手套点PDA</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">关舱门前 18分钟延误关键路径预警</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 识别出对讲频道里“某国际中转行李卡在安检未到机下”</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 提前 18分钟向 TOC 值班主任预警调配机动拖车抢点</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">航班过站准点率提升 +6.8% · 省百万延误罚金</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">机坪保障节点采集准确率从 72% 提升至 98.4%</text>
  </g>

  <!-- Pillar 2: Railway & Aviation Closed-Loop Numeric Readback Verification -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F97316" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#railGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 铁路调车与航空加油“复诵错漏 250ms 熔断”</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⚡ 致命痛点：“听错复诵未被发现 (Hearback Error)”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 调度下令：“4道推进至14道”，司机疲劳复诵成“40道”！</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 或机务加油“14.2吨”复诵成“12.4吨”，人工漏听引发大祸</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FDBA74" font-size="13" font-weight="700">发令槽位 vs 复诵槽位确定性比对器 (&lt;=250ms)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 实时提取 (车次/机位, 股道/油量, 信号灯色, 限速值)</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 只要任意 1 位数字不一致，250ms 内拉响双端红灯蜂鸣！</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">未完成标准三段式复诵严禁解锁道岔/加油阀</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 调度发令 ➔ 现场一字不差复诵 ➔ 调度确认“正确执行”</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 硬件级联锁：复诵未通过前物理锁死电子工单与阀门</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">数字复诵偏差拦截率 100% · 零错加油/错进股道</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">符合国铁《技规》联控标准与民航 ICAO 标准通话规范</text>
  </g>

  <!-- Pillar 3: Container Port Quay-Crane Tallying & IMDG Hazmat Check -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#portGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 港口集装箱岸桥理货与危化箱 (IMDG) 核验</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">ISO 6346 集装箱号模 11 校验位端侧秒验</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 岸桥OCR被海雾遮挡时，理货员语音报出箱号后4位+校验码</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 端侧自动算 ISO 6346 校验位并与 TOS 船图贝位比对</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">危化品箱 (IMDG Class 1-9) 隔离距离硬锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 语音报卸危险品箱时，自动校验堆场与船舱隔离规则</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 严防氧化剂与易燃液箱混放，残损铅封 80KB 拍照存证</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">外籍船长大副 20+ 语种靠泊引航对讲翻译</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 引航员与外籍船员 VHF 海事英语/俄语/希伯来语实时字幕</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 缆绳系解与拖轮马力指令 100% 留痕入库</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">岸桥单箱异常处理从 4分钟 缩至 15秒</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">无缝对接 Navis N4 / 智慧港口 TOS 生产作业系统</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">海陆空交通枢纽特种集群对讲与复诵安全架构（Critical Transport Radio &amp; Readback Safety Loop）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 多频段接入：RoIP 旁路采集 800MHz TETRA / VHF / 5G 公网集群 ➔ 2. 98dB 机坪/海风降噪 + 私有化 Azure Speech 行业词表</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 复诵比对：发令与复诵数字槽位 &lt;=250ms 确定性校验（错1位立即红灯锁死）➔ 4. 系统闭环：自动点亮机场 A-CDM / 港口 TOS / 铁路联控</text>
  </g>
</svg>
