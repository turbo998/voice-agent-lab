  <rect width="1280" height="760" fill="url(#bg332)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1224" height="78" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="48" y="54" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">
    Enterprise Voice AI Model Context Protocol (MCP) Gateway &amp; OAuth 2.1 OBO (VOICE-MCP-OAUTH-OBO-GATEWAY-01)
  </text>
  <text x="48" y="81" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">
    OAuth 2.1 OBO &amp; Signed MCP Manifest Lock · &lt;=150-Token Voice Response Projection · MCP Progress &amp; Barge-In Cancellation Bridge
  </text>

  <!-- Left Column: Why Chat MCP Breaks Voice AI -->
  <rect x="28" y="118" width="290" height="465" rx="12" fill="url(#card332)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="148" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    1. Voice vs. Chat MCP Gaps
  </text>

  <rect x="46" y="166" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">12k-Token JSON Bloat</text>
  <text x="60" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Chat MCP returns 200-column JSON</text>
  <text x="60" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Adds +1.8s TTFT in voice turns!</text>

  <rect x="46" y="266" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Shared Super-Key Risk</text>
  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Static API key sees all tenants</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Needs OAuth 2.1 OBO caller token</text>

  <rect x="46" y="366" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="390" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">MCP Tool Poisoning</text>
  <text x="60" y="411" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Malicious prompt in tool description</text>
  <text x="60" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Dynamic tool-list cache busting</text>

  <rect x="46" y="466" width="254" height="98" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="490" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Voice MCP Gateway Gains</text>
  <text x="60" y="511" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Post-Tool Voice Latency: -1,450ms</text>
  <text x="60" y="530" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tool Token Cost: -88.5%</text>
  <text x="60" y="549" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Cross-Tenant Leaks: 0.0%</text>

  <!-- Center Column: 3 Deterministic Voice MCP Gateway Gates -->
  <rect x="338" y="118" width="584" height="465" rx="12" fill="url(#card332)" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="148" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    2. Deterministic Voice MCP Security, Projection &amp; Cancellation Engine
  </text>

  <!-- Gate 1 -->
  <rect x="358" y="166" width="544" height="122" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="376" y="191" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate A · OAuth 2.1 On-Behalf-Of (OBO) JWT &amp; Signed Manifest Lock
  </text>
  <text x="376" y="214" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Hard Rule: Zero shared service-account keys or unsigned MCP tool lists!
  </text>
  <text x="376" y="235" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Exchanges verified caller identity for short-lived OAuth 2.1 OBO token
  </text>
  <text x="376" y="256" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Verifies SHA-256 hash of tools/list manifest (blocks rug-pull poisoning)
  </text>
  <text x="376" y="275" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Enforces Row-Level Security (RLS) at MCP server &amp; stops tool-description attacks
  </text>

  <!-- Gate 2 -->
  <rect x="358" y="302" width="544" height="122" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="376" y="327" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate B · &lt;=150-Token Voice Response Projection &amp; Cache-Pinning Gate
  </text>
  <text x="376" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Compiles JSONPath/JMESPath voice projection per MCP tool at gateway
  </text>
  <text x="376" y="371" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Trims 12,000-token ERP payloads down to &lt;=150 speakable tokens (Top-3 rows)
  </text>
  <text x="376" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Pins canonical sorted tool schemas to preserve 90% LLM prompt prefix cache
  </text>
  <text x="376" y="411" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Slashes post-tool LLM prefill latency from 1,800ms to 190ms (-89%)
  </text>

  <!-- Gate 3 -->
  <rect x="358" y="438" width="544" height="126" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="376" y="463" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate C · 0ms MCP Progress Voice Bridge &amp; Barge-In Cancellation
  </text>
  <text x="376" y="486" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Maps MCP notifications/progress (&gt;800ms) to natural spoken filler updates
  </text>
  <text x="376" y="507" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Emits JSON-RPC notifications/cancelled to MCP server on caller barge-in
  </text>
  <text x="376" y="528" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Rolls back uncommitted MCP side-effects when Turn_Epoch is invalidated
  </text>
  <text x="376" y="549" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Keeps voice loop responsive during slow backend queries &amp; aborts zombie writes
  </text>

  <!-- Right Column: Streamable HTTP MCP Ecosystem -->
  <rect x="942" y="118" width="310" height="465" rx="12" fill="url(#card332)" stroke="#10b981" stroke-width="1.5"/>
