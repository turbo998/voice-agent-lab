<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg126" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="accent126" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg126)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="8" rx="4" fill="url(#accent126)"/>

  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">STAGE 482 · TOPIC 122 · P957–P958 · HISTORIC 485-DIMENSION MILESTONE 🎉 · 967 GUARDS · 976 PROBES · 924 TESTS</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">WebRTC RFC 9605 (SFrame) &amp; RFC 9335 (Cryptex): 128-Bit AEAD &amp; KID Grace Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 WebRTC SFrame 与 Cryptex 端到端加密：禁用 32-bit 截断认证标签与 MLS 换钥期双 KID 宽限窗 (P957–P958)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="320" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (32-Bit Short Tag &amp; 0ms Key Purge)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 32-bit 截断认证标签伪造与 CTR 比特翻转</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">AES_CM_128_HMAC_SHA256_32 (4-Byte Tag = 2^-32)</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 为省 4.8kbps 选用 32-bit 短标签，易遭碰撞伪造与 CTR 比特翻转！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 跨流重用 (KID, CTR) Nonce 直接导致 AES-GCM 认证密钥流泄露！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. MLS 换钥瞬间 0ms 销毁旧 KID 引发集体断音</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">Epoch Ratchet (KID 7 -&gt; 8) -&gt; Delete KID 7 in 0ms!</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 收到新密钥立即擦除旧 KID_7，在途 100–400ms 尾包全部解密失败！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 每次有人进出高管会议室，全员都会听到半秒钟吞字与刺耳爆音！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：15 帧短标签伪造风险帧 + 22 帧换钥过渡期被丢弃语音帧</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">端到端完整性防线降级，且多人会议进出房间频繁触发断音卡顿</text>

  <!-- Right Card: Deterministic Guardrails P957-P958 -->
  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="350" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P957 + P958 · 485-Dimension Milestone 🎉)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P957 · RFC 9605 完整 128-bit AES-GCM 标签与唯一 CTR</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">AES_128_GCM_SHA256_128 (Tag = 128b) + Monotonic CTR</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 严禁 32/64-bit 截断标签，强制全流 128-bit (16B) 完整 AEAD 标签</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 锁定单调递增 CTR 与防重放滑动位图，0 帧伪造或重放注入</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P958 · RFC 9605 [1000, 5000]ms 双 KID 宽限窗 + Cryptex</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Dual-KID Grace Ring ∈ [1000, 5000]ms + RFC 9335 Cryptex</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 换钥后保留 [1000, 5000]ms 旧 KID_n-1 解密环，晚到尾包 0 丢弃</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 同步开启逐跳 Cryptex 加密 RTP 扩展头与 CSRC，云端 SFU 零明文</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 帧短标签伪造 · 0 帧换钥丢包 · 128b / 1000ms 宽限锁</text>
  <text x="652" y="500" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

