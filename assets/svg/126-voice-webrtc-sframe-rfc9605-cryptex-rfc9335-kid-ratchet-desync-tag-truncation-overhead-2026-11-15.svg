  <text x="76" y="610" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Guardrails: evaluateWebrtcRfc9605SframeFullAeadAuthTagAndCtrIvUniquenessGate (P957) &amp; evaluateWebrtcRfc9605SframeKidEpochGraceWindowAndCryptexMetadataGate (P958)</text>
