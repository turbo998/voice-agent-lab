  <text x="385" y="500" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">  Globalist members (which triggers $200 cash + 90,000 points brand fine)</text>
  <text x="385" y="520" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• Prioritizes OTA opaque bookings for relocation &amp; auto-upgrades elites</text>

