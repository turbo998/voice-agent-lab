  <rect width="1200" height="680" fill="url(#bg468)"/>
  <rect x="24" y="20" width="1152" height="640" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="44" y="38" width="1112" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="68" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Blood Bank, Plasma Donor (FDA 21 CFR 630) &amp; UNOS Organ Transplant Voice Architecture (2026)
  </text>
  <text x="68" y="94" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94a3b8">
    FDA 21 CFR 630 Teratogenic Drug &amp; 56-Day Interval Lock • ISBT 128 Rh-Negative O-Neg Surge • UNOS 60m Organ Offer &amp; Cold-Ischemia Clock
  </text>
  <rect x="920" y="52" width="216" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1028" y="75" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">
    BLOOD-FDA630-UNOS-2026-01
  </text>

  <!-- Column 1: FDA 21 CFR 630 Donor Deferral & Interval Gate -->
  <rect x="44" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="44" y="128" width="356" height="40" rx="12" fill="url(#cyan468)"/>
  <text x="222" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. FDA 21 CFR 630 Deferral &amp; 56-Day Interval
  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">FDA Medication Deferral List (AABB DHQ)</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Screens teratogenic drugs (Isotretinoin/Accutane,</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Finasteride: 30d; Acitretin: 3y; Dutasteride: 6m)</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Screens antiplatelet Plavix (14d for platelets)</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  &amp; malaria-endemic travel (90d–3y deferral)</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Statutory Donation Interval Hard Lock</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Whole Blood: &gt;=56 days; Power Red: &gt;=112 days</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Source Plasma: max 2x/7-day with &gt;=48h gap</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• Checks National Donor Deferral Registry (NDDR)</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">• Cuts on-site chair deferral waste by -64.8%</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="76" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">O-Negative Trauma Surge &amp; HLA-Matched Platelets</text>
  <text x="76" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Prioritizes CMV-negative O-Neg &amp; Apheresis</text>
  <text x="76" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">  Platelet (5-day shelf life) recall campaigns</text>
  <text x="76" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#7dd3fc">• Lifts critical O-Neg show rate by +41.2%</text>

  <!-- Column 2: UNOS / OPTN Organ Allocation & Cold Ischemia -->
  <rect x="422" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#059669" stroke-width="1.5"/>
  <rect x="422" y="128" width="356" height="40" rx="12" fill="url(#emerald468)"/>
  <text x="600" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. UNOS / OPTN Organ Offer &amp; Cold-Ischemia Clock
  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399">UNOS DonorNet 60-Min Offer Escalation</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Tracks 60-min primary organ offer response</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  and 30-min post-clamp acceptance countdown</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">• Auto-escalates to Backup Transplant Surgeon</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  if primary coordinator unacknowledged in 180s</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">ABO Blood-Type &amp; Cross-Clamp Cold Ischemia</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Dual-factor readback of UNOS Donor ID +</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  ABO Blood Type + Cross-Clamp UTC Timestamp</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• Tracks Heart (&lt;4h), Lung (&lt;6h), Liver (&lt;8h)</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  Cold Ischemia Time (CIT) across NRP/flight legs</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">2 AM Recipient Call-In &amp; NPO OR Readiness</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Contacts waitlisted recipient + backup candidate</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Screens active infection/fever &amp; commands</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#6ee7b7">  immediate NPO (zero food/water) en route to OR</text>

  <!-- Column 3: Post-Donation Syncope, Citrate & CUE Lock -->
  <rect x="800" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="800" y="128" width="356" height="40" rx="12" fill="url(#rose468)"/>
  <text x="978" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    3. 0ms Syncope/Citrate SOS &amp; Confidential CUE
  </text>

  <rect x="818" y="184" width="320" height="114" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="832" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">0ms Post-Donation Syncope &amp; Citrate Toxicity</text>
  <text x="832" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Donor reports dizziness/tunnel vision: commands</text>
  <text x="832" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  "LIE DOWN IMMEDIATELY &amp; elevate legs!" (prevents</text>
  <text x="832" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  skull fracture fall) + Apheresis lip tingling</text>
  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">  (Citrate hypocalcemia) or arterial bright-red</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Post-Donation Infection Quarantine (PDI)</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Donor calls back within 48h reporting fever,</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  COVID/flu, or Confidential Unit Exclusion (CUE)</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• 0ms ISBT 128 unit quarantine in Blood Establishment</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">Zero Reactive-Test Result Phone Disclosure</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Never reads out reactive HIV/HBV/HCV/Syphilis</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" fill="#ffe4e6">  NAT screening results via automated voice</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">• Warm-transfers strictly to Medical Director</text>

  <!-- Bottom Telemetry Bar -->
  <rect x="44" y="564" width="1112" height="76" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="592" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
    Benchmark &amp; Biologics ROI (10,000 Blood Center &amp; OPO Transplant Calls):
  </text>
  <text x="530" y="592" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#34d399">
    On-Site Chair Deferrals: -64.8% • Organ Cold-Ischemia Discard: -44.2% • PDI Quarantine: &lt;5s
  </text>
  <text x="68" y="618" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" fill="#94a3b8">
    Guardrail ID: evaluateBloodBankFda630UnosTransplantVoice2026Guard • Policy: BLOOD-BANK-FDA630-UNOS-TRANSPLANT-VOICE-2026-01
  </text>
</svg>
