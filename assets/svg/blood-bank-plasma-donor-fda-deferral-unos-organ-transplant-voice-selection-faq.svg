<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg468" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="50%" stop-color="#0e1b31"/>
      <stop offset="100%" stop-color="#071222"/>
    </linearGradient>
    <linearGradient id="cyan468" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emerald468" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amber468" x1="0" y1="0" x2="1" y2="0">
