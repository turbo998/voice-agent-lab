<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg514" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad514" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad514" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad514" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad514" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg514)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#purpleGrad514)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">VOICE MCP · #514</text>
  <text x="194" y="44" class="title">Enterprise Voice MCP (Model Context Protocol) Gateway: &lt;45ms Pool &amp; OAuth 2.1 OBO</text>
  <text x="194" y="65" class="subtitle">&lt;=6 Tools/Node Schema Pruning (68% → 98.9% Tool Accuracy) + &lt;=120-Token Response Projection (-89.2% JSON Bloat) + OAuth 2.1 OBO</text>

  <!-- Column 1: <45ms Warm Streamable-HTTP Pool & Schema Pruning -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad514)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. &lt;45ms Warm MCP Pool &amp; Schema Pruning</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Why Desktop MCP Breaks Real-Time Voice</text>
    <text x="26" y="86" class="body-text">• Cold stdio/SSE handshakes + 50 raw MCP tool</text>
    <text x="26" y="102" class="body-text">  schemas (12k tokens) add 950ms lag &amp; 32% errors!</text>
    <text x="26" y="122" class="mono">Pre-Warmed gRPC / Streamable-HTTP Pool (&lt;45ms)</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">State-Scoped &lt;=6 Tools/Turn Pruning</text>
    <text x="26" y="186" class="body-text">• Filters 60+ enterprise MCP tools down to &lt;=6</text>
    <text x="26" y="202" class="body-text">  tools relevant to the active conversation node</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Lifts Voice Tool-Call Accuracy from 68% to 98.9%</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Voice-Compact Schema Compiler</text>
    <text x="26" y="288" class="body-text">• Strips verbose IDE markdown examples, nested</text>
    <text x="26" y="304" class="body-text">  optional filters, and identity parameters</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Shrinks Tool Definition Footprint by 84.5%</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">100% Prefix-Cache-Aligned Tool Block</text>
    <text x="26" y="384" class="body-text">Orders MCP tool definitions deterministically</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">to preserve 94.6% LLM prompt prefix cache hits</text>
  </g>

  <!-- Column 2: <=120-Token Response Projection & Progress Events -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad514)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. &lt;=120-Token Projection &amp; Progress Pacing</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">&lt;=120-Token Spoken-Ready JSON Projector</text>
    <text x="26" y="86" class="body-text">• Raw MCP tools return 15KB UI blobs with UUIDs,</text>
    <text x="26" y="102" class="body-text">  HTML tags, and 50 columns! Gateway projects only</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">speakable fields (&lt;=120 tokens, -89.2% token burn)</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">MCP notifications/progress → Spoken Bridge</text>
    <text x="26" y="188" class="body-text">• Subscribes to MCP progress notifications; if tool</text>
    <text x="26" y="204" class="body-text">  runs &gt;800ms, maps progress stage into natural</text>
    <text x="26" y="224" class="mono">spoken pacing ("Checking warehouse stock now...")</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">Barge-In notifications/cancelled Propagation</text>
    <text x="26" y="290" class="body-text">• When caller interrupts mid-tool-call, gateway</text>
    <text x="26" y="306" class="body-text">  immediately sends MCP notifications/cancelled</text>
    <text x="26" y="324" class="mono" fill="#fde68a">to abort expensive downstream SQL/RAG queries</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Zero Raw UUID / ISO Timestamp Read-Outs</text>
    <text x="26" y="386" class="body-text">Formats dates/currencies into natural spoken</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">strings before returning MCP payload to LLM</text>
  </g>

  <!-- Column 3: Multi-Tenant OAuth 2.1 OBO & Tool-Scope Sandbox -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#purpleGrad514)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. OAuth 2.1 OBO &amp; Mutating-Tool Sandbox</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#c4b5fd">Zero Shared Admin API Keys (OAuth 2.1 OBO)</text>
    <text x="26" y="86" class="body-text">• Never connect MCP servers with a god-mode key!</text>
    <text x="26" y="102" class="body-text">• Exchanges caller's Session JWT into a down-scoped</text>
    <text x="26" y="122" class="mono" fill="#ddd6fe">OAuth 2.1 On-Behalf-Of token per MCP invocation</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#fb7185">MCP Tool-Poisoning &amp; Rug-Pull Defense</text>
    <text x="26" y="188" class="body-text">• Pins cryptographic SHA-256 hash of approved MCP</text>
    <text x="26" y="204" class="body-text">  tool descriptions in CI/CD; blocks runtime</text>
    <text x="26" y="222" class="mono" fill="#fda4af">tool-description prompt-injection mutations!</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#34d399">Read-Only vs. Destructive Annotation Gate</text>
    <text x="26" y="288" class="body-text">• Enforces MCP annotations (readOnlyHint /</text>
    <text x="26" y="304" class="body-text">  destructiveHint); destructive tools require</text>
    <text x="26" y="322" class="mono" fill="#6ee7b7">two-phase verbal confirmation + idempotency key</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#c4b5fd">Guardrail: VOICE-MCP-GATEWAY-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateEnterpriseVoiceMcpStreamingToolGateway</text>
    <text x="26" y="402" class="body-text">98.9% Tool Accuracy · -$305k/10k Hrs Token &amp; Risk</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Enterprise Voice MCP (Model Context Protocol) Gateway Benchmarks (per 10,000 Operating Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">MCP Tool Invocation Overhead</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">950ms → &lt;45ms (Warm Pool)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Tool-Selection Accuracy</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">68.0% → 98.9% (&lt;=6 Pruned)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Tool Output Token Bloat</text>
    <text x="16" y="50" class="kpi-num" fill="#a78bfa">-89.2% (&lt;=120-Tok Projection)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Token &amp; Security Risk Saved</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$305,000 / 10k Hours</text>
  </g>
</svg>
