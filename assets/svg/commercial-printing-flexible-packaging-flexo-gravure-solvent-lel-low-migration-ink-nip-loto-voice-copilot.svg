  <rect width="1200" height="680" fill="url(#bg260)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Commercial Printing &amp; Flexible Packaging Low-Migration Ink, Nip LOTO &amp; LEL Voice Copilot</text>
