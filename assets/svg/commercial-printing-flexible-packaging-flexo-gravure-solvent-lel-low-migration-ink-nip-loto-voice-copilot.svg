  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card260)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic Print &amp; Packaging Engine (PRINTING-PACKAGING-LOWMIGRATION-LEL-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: Low-Migration Food-Ink &amp; Pharma Artwork PDF Proof Hard Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks non-food UV/toluene inks (benzophenone/ITX) on food or infant-formula webs</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Verifies X-Rite ΔE00 ≤2.0 color standard &amp; 100% vision inspection against approved PDF</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Enforces GC-MS residual solvent (&lt;5.0 mg/m²; 0.0 mg/m² benzene) before slitting</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents chemical migration recalls and pharma dosage-label misprints</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: ANSI B65.1 Roller Nip-Point LOTO &amp; NFPA 86 &lt;25% LEL Dryer Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% forbids wiping anilox/impression cylinders at run speed; requires LOTO or Inch-Safe</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces NFPA 86 Class A oven solvent vapor ≤25% LEL &amp; active static-eliminator bars</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Verifies ink-drum grounding clamp (&lt;10 ohms) before pumping ethyl acetate / MEK</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Eliminates roller nip-point arm amputations and electrostatic ink-pan ignitions</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Dryer &gt;25% LEL / RTO Bypass, Nip-Guard &amp; CO2 Fire Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trips press drive, shuts ink pumps &amp; opens 100% dryer exhaust at &gt;25%–50% LEL</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Opens RTO thermal oxidizer fresh-air bypass damper to prevent duct flashback explosion</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Triggers local CO2 ink-unit suppression &amp; bridges EHS Rescue on nip entrapment</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full NFPA 86, ANSI B65.1, EU 10/2011 / FDA 21 CFR 175 &amp; GMP 2023/2006 WORM audit</text>

