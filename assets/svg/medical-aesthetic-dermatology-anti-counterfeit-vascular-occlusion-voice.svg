    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">解决求美者最担心的“水货假针剂、偷梁换柱与无证幽灵医生”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 行业核心信任痛点：验完正品后在配药间被调包，或实际打针人非备案执业医师</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 监管铁律：三类医疗器械（玻尿酸/童颜针）与毒麻药品（肉毒素）必须一物一码</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">拆封前“药盒 UDI 码 + 医师工牌声纹 + 求美者确认”三联锁</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 治疗室终端扫码播报：“本支乔雅登/保妥适监管码尾号 6821 为首次拆封正品”</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 医师声纹核验执业美容主诊资格，求美者口头回答“确认拆封”后才解锁耗材出库</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">光电仪器（超声炮/热玛吉）治疗探头正版发数语音播报</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 探头接触皮肤前自动播报官方认证序列号与剩余可用发数（如 600发足量）</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 验真录音与批次号自动写入电子病历并发送至求美者微信端</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">非标水货/重复回收药械流入治疗室率 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">客户当面验真信任度与高端项目复购率提升 38%</text>
  </g>

  <!-- Pillar 3: Medical Advertising Law Compliance & Contraindication Gate -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#C084FC" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#adLawGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 术前禁忌症筛查与《医疗广告法》合规锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁承诺“100%零风险/年轻十岁”或向孕期/重症肌无力打肉毒！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 肉毒素绝对禁忌：妊娠哺乳期、重症肌无力、近1周服用氨基糖苷类抗生素（庆大霉素）</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 监管重罚红线：咨询语音若出现“保证无副作用、百分百根治、最顶尖”即遭市监处罚</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#3B0764" stroke="#A855F7"/>
    <text x="30" y="174" fill="#E9D5FF" font-size="13" font-weight="700">肉毒素/光电术前 6项禁忌症硬拦截 + 未成年人监护锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 预约注射前逐项核验：孕期/备孕、阿司匹林抗凝药、蟹足肿体质、近期暴晒史</text>
    <text x="30" y="214" fill="#C084FC" font-size="12">• 检出未成年人独自预约有创医美 -> 0ms 锁定排班，强制要求法定监护人到场签字</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">极限词与外貌羞辱话术 (Body Shaming) 0ms 清洗器</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 实时拦截“保证/永久/零恢复期”等《医疗广告管理办法》违禁词</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 严禁制造外貌焦虑话术，对躯体变形障碍 (BDD) 倾向者自动转心理关怀</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#3B0764" stroke="#C084FC"/>
    <text x="178" y="356" fill="#E9D5FF" font-size="13" font-weight="700" text-anchor="middle">医疗广告违禁承诺与禁忌症漏筛率 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合卫健委医疗美容项目分级管理与药监局追溯规范</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#EF4444" font-size="14" font-weight="700">架构师核心选型法则 (AESTHETIC-MEDICINE-SAFETY-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 术后随访一旦检出玻尿酸注射后“皮肤苍白/紫斑、眉心鼻部剧痛或视物模糊”，必须 0ms 抢占常规安抚话术，立即启动黄金 90分钟玻璃酸酶溶解急救绿道；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 治疗室注射前必须完成“NMPA/FDA 药械 UDI 码 + 主诊医师执业声纹 + 客户口头确认”三联验真，且术前咨询必须 100% 过滤医疗广告功效保证违禁词。</text>
</svg>
