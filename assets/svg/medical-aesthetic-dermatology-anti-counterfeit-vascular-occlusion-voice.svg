  <rect width="1200" height="660" rx="16" fill="url(#bgAes)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Medical Aesthetics &amp; Dermatology Voice AI: 0ms Vascular Occlusion Rescue &amp; UDI Anti-Counterfeit</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">医疗美容与皮肤科语音 AI：玻尿酸血管栓塞黄金 90分钟防失明 0ms 抢占锁、三类械 UDI 扫码双录验真与广告法合规全景图</text>
  <rect x="836" y="42" width="316" height="34" rx="17" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
  <text x="994" y="64" fill="#FCA5A5" font-size="13" font-weight="600" text-anchor="middle">AESTHETIC-MEDICINE-SAFETY-01</text>

  <!-- Pillar 1: Post-Filler Vascular Occlusion Golden 90-Minute Rescue Lock -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#occGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 术后血管栓塞“黄金 90分钟防失明”0ms 抢占</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁把“打完玻尿酸鼻翼发白/眼眶剧痛”当正常术后肿胀！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 注射透明质酸后若误入面动脉/眼动脉分支，90分钟内将致视网膜永久失明或皮肤坏死</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 普通随访机器人若回复“术后前三天胀痛属正常现象请冰敷”，将酿成终身致残事故</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#4C0519" stroke="#E11D48"/>
    <text x="30" y="174" fill="#FDA4AF" font-size="13" font-weight="700">苍白网状青斑 / 剧痛 / 视物模糊 -> 0ms 溶解酶急救强呼</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 检出“皮肤发白/发紫花斑、钻心剧痛、看东西重影模糊”任一红旗词</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 0ms 物理阻断常规冰敷话术！强呼总值班整形外科主任并启动玻璃酸酶急救绿道</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">多模态手机微距拍患处 (Capillary Refill &gt; 2s) 辅助分诊</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 指导患者录制 3秒指压鼻翼/眉间视频：检测毛细血管充盈时间是否迟缓</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 自动把患处高清图与注射部位/剂量同步推送至急救医生手机</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">术后血管栓塞误判安抚率 = 0.0% · 黄金急救 100% 抢占</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">夜间急诊值班主任强呼接通时间 &lt; 8秒</text>
  </g>

  <!-- Pillar 2: NMPA/FDA Class-III Injectable UDI & Physician License Dual-Verification -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#udiGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 诊室“正品药械 UDI + 主诊医师”当面语音验真</text>

