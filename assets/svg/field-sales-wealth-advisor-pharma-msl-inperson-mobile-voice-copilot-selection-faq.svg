  <text x="58" y="203" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Two-Party Wiretap Consent &amp; 50ms RAM Wipe Lock</text>
  <text x="58" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Recording in-person meetings without consent violates</text>
  <text x="58" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  CA/FL/EU two-party wiretap &amp; hospital privacy laws!</text>
  <text x="58" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• If client says "No recording", wipes RAM in 50ms &amp; pivots</text>
  <text x="58" y="284" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  to Post-Visit 45-Second Solo Car Voice Debrief Mode</text>

  <rect x="44" y="312" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
