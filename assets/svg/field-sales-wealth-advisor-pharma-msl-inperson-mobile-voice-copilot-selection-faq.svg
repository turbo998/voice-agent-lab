  <text x="838" y="356" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Quarantines Material Non-Public Info (MNPI) from CRM</text>
  <text x="838" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks outbound quote emails below CPQ margin floor</text>
  <text x="838" y="396" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Routes exception discounts to Deal Desk in 0ms</text>

  <rect x="824" y="436" width="332" height="98" rx="8" fill="#0f172a" stroke="#8b5cf6"/>
  <text x="838" y="459" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1,000-Rep Field Force ROI (-5.5h/Wk Admin Typing)</text>
  <text x="838" y="480" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Saves each field rep 5.5 hours/week of evening CRM work</text>
  <text x="838" y="500" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Captures 3.2x more competitive &amp; clinical field insights</text>

