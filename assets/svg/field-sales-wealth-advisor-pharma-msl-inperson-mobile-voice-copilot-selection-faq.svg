  <text x="448" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  personalized follow-up email before rep leaves parking lot</text>
  <text x="448" y="396" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Cuts post-visit follow-up lag from 48 hours to 3 minutes</text>

