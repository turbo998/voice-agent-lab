  <text x="48" y="620" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Dual Capture Modes: Mode A (Consented Meeting Diarization, 50ms Wipe on Refusal) + Mode B (45s Post-Visit Car Voice Debrief)</text>
  <text x="48" y="642" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">• CRM &amp; Compliance: 96.4% Same-Day Salesforce/Veeva Fill Rate + 0ms Pharma Adverse Event (E2B) &amp; Off-Label MSL Routing</text>
