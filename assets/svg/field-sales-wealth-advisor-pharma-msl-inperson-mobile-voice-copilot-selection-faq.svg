  <text x="44" y="50" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Field Sales, Wealth Advisor &amp; Pharma MSL In-Person Visit Mobile Voice Copilot Architecture</text>
