  <rect x="44" y="128" width="332" height="36" rx="8" fill="#0f766e"/>
  <text x="60" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Two-Party Consent &amp; Offline Edge Capture</text>

