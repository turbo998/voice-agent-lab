  <text x="48" y="74" class="subtitle">Supply Chain &amp; 3PL Freight Voice + Vision AI: FMCSA/Highway Vetting · 3-Step Rate Negotiation · ELD Exception Check-Calls · 3.2s BOL/POD OCR</text>
