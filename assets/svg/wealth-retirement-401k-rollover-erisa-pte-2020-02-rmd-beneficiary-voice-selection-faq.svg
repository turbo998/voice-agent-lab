  <text x="48" y="74" class="subtitle">401(k) Recordkeeping &amp; IRA Rollover Voice + Vision AI: DOL PTE 2020-02 Education Firewall · Direct FBO Check OCR (Avoid 20% Tax) · SECURE 2.0 RMD</text>
  <rect x="945" y="36" width="205" height="36" rx="18" fill="url(#accentBlue568)" />
