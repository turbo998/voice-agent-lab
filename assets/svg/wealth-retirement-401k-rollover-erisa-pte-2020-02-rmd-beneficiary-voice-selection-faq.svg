  <!-- Plane 1: DOL PTE 2020-02 / Reg BI Rollover Education Firewall -->
  <rect x="28" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <rect x="28" y="106" width="355" height="36" rx="12" fill="url(#accentBlue568)" />
  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① DOL PTE 2020-02 受托人红线与转滚留存</text>

  <rect x="46" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">投资教育 (IB 96-1) vs 受托建议 (Fiduciary) 隔离</text>
  <text x="60" y="200" class="node-sub">• 严禁无证 AI 诱导员工将低费率雇主 401(k) 转入高费率个人 IRA</text>
  <text x="60" y="218" class="node-sub">• 仅客观播报四选项: 1.留原计划 2.转新雇主 3.直转IRA 4.提现税损</text>
  <text x="60" y="236" class="node-sub">• 触发转滚决策时 &lt;500ms 携费率对比表温转 Series 65/7 持牌顾问</text>

  <rect x="46" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="282" class="node-title">拦截离职盲目提现 (Cash-Out Leakage 止损)</text>
  <text x="60" y="302" class="node-sub">• 痛点: 38% 换工作青年因嫌转滚麻烦直接提现 $40k 养老金</text>
  <text x="60" y="320" class="node-sub">• 实时用确定性税表算出:“直接提现将当场损失 $12,800 税款+10%罚金”</text>
  <text x="60" y="338" class="node-sub">• 引导一键免税直转 (Direct Rollover)，AUM 资产留存率提升 46%</text>

  <rect x="46" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="386" class="node-title">三方联合致电原托管行 (3-Way Custodial Call)</text>
  <text x="60" y="406" class="node-sub">• 传统 401(k) 机构要求电话核身才肯放款，客户不愿自己等 40m</text>
  <text x="60" y="424" class="node-sub">• AI 替客户排队接通原机构坐席后再秒级拉入客户完成免等待转出</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">55 岁离职免罚金规则 (Rule of 55) 保护锁</text>
  <text x="60" y="500" class="node-sub">• 55–59.5 岁离职者若将 401(k) 转入 IRA 将丧失免 10% 罚金特权!</text>
  <text x="60" y="518" class="node-sub">• 状态机自动按出生年份拦截错误转滚，保住免罚提款权</text>

  <!-- Plane 2: Direct FBO Rollover Check Vision & 20% Withholding Shield -->
  <rect x="403" y="106" width="394" height="450" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="403" y="106" width="394" height="36" rx="12" fill="url(#accentPurple568)" />
  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② 避免 20% 强扣税的 FBO 支票抬头视觉核验</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">破解“支票抬头写个人名字被强扣 20% 联邦税”陷阱</text>
  <text x="435" y="200" class="node-sub">• IRC §3405(c) 铁律: 若支票抬头写给客户个人 (Indirect Rollover)</text>
  <text x="435" y="218" class="node-sub">• 原计划必须强行扣留 20% 抵税，且客户需自掏 20% 在 60 天内补齐</text>
  <text x="435" y="236" class="node-sub">• 语音全程强制引导开具 `托管行 FBO [客户姓名]` 直接转滚支票</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">1.8 秒纸质养老金支票拍照存单 (Rollover Check OCR)</text>
  <text x="435" y="306" class="node-sub">• 客户收到原雇主寄来的 $150k 纸质支票后，短信拍照正反面</text>
  <text x="435" y="324" class="node-sub">• 1.8s 识别抬头是否含 `FBO (For Benefit Of)`、区分 Pre-Tax vs Roth</text>
  <text x="435" y="342" class="node-sub">• 拦截把 Roth 税后支票错存入传统税前 IRA 的不可逆税务事故</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">60 天间接转滚死线倒计时与每 12 个月 1 次锁</text>
  <text x="435" y="412" class="node-sub">• 若客户已误拿个人抬头支票，自动计算距 60 天死线剩余天数</text>
  <text x="435" y="430" class="node-sub">• 核查过去 365 天是否已做过 IRA-to-IRA 间接转滚 (防全额超限征税)</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">支票入账周期从 14 天邮寄缩至 1.8 秒拍照即存</text>
  <text x="435" y="510" class="node-sub">• 消除大额养老金纸质支票寄丢与退票重开风险</text>

  <!-- Plane 3: SECURE 2.0 RMD Calculator & ERISA Spousal QJSA Consent -->
  <rect x="817" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
