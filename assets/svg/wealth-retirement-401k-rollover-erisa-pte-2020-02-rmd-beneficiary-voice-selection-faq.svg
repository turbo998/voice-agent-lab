  <text x="849" y="180" class="node-title">SECURE 2.0 强制最低提款 (RMD 73/75岁) 精算</text>
  <text x="849" y="200" class="node-sub">• 严禁大模型心算 RMD！按去年 12/31 余额 ÷ IRS 寿命因子表精确计算</text>
  <text x="849" y="218" class="node-sub">• 每年 Q4 主动外呼未提足 RMD 的高龄客户，免除 25% IRS 惩罚性重税</text>
  <text x="849" y="236" class="node-sub">• 支持一键将 RMD 转为免税慈善捐赠 (`QCD` 最高 $105,000)</text>

  <rect x="835" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="282" class="node-title">ERISA 配偶受益人权利与公证放弃锁 (QJSA Gate)</text>
  <text x="849" y="302" class="node-sub">• 联邦 ERISA 铁律: 已婚员工 401(k) 默认 100% 主受益人必须为配偶!</text>
  <text x="849" y="320" class="node-sub">• 若来电人要求把受益人改成子女或申请大额 401(k) 质押贷款</text>
  <text x="849" y="338" class="node-sub">• 严禁语音直接改写，强制触发配偶在线视频公证 (Remote Notary) 签字</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="849" y="386" class="node-title">401(k) 质押借款 (Loan) vs 困难提款 (Hardship) 优选</text>
  <text x="849" y="406" class="node-sub">• 引导急需用钱员工优先选免税免罚金的 401(k) 个人借款</text>
  <text x="849" y="424" class="node-sub">• 拍照核验医疗账单/首付合同秒级审结困难提款证明</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (RETIREMENT-401K-ERISA-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截无 PTE 2020-02 费率对比诱导转滚、Roth/税前混存与越过配偶改受益人</text>
  <text x="849" y="518" class="node-sub">• 全面符合 ERISA、DOL PTE 2020-02、SEC Reg BI 与 IRS SECURE 2.0</text>

