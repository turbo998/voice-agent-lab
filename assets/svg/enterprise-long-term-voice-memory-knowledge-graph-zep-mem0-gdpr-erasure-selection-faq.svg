<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg508" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad508" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad508" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad508" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad508" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg508)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#cyanGrad508)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">VOICE MEMORY · #508</text>
  <text x="194" y="44" class="title">Enterprise Long-Term Voice Memory: Bitemporal Knowledge Graph (Zep/Mem0) &amp; GDPR</text>
  <text x="194" y="65" class="subtitle">&lt;5ms Ringback Pre-Hydrated Memory Card + Bitemporal Fact Supersession (99.4% Accuracy) + Pre-Auth Privacy Gate &amp; GDPR Art. 17 Tombstone</text>

  <!-- Column 1: Two-Tier Zero-Latency Voice Memory Architecture -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad508)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. Two-Tier &lt;5ms Voice Memory Hydration</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Zero Synchronous Vector DB Wait on Turns</text>
    <text x="26" y="86" class="body-text">• Synchronous graph/vector search per turn adds</text>
    <text x="26" y="102" class="body-text">  450-900ms lag! Pre-loads a 250-token Memory</text>
    <text x="26" y="122" class="mono">Card into Redis during ringback (&lt;5ms turn overhead)</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Async Post-Turn Fact &amp; Preference Extraction</text>
    <text x="26" y="186" class="body-text">• Background worker extracts new entities, dates,</text>
    <text x="26" y="202" class="body-text">  and preferences into Zep / Mem0 / Cosmos Graph</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Zero Impact on Real-Time Audio TTFA (&lt;320ms)</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Cross-Channel Omnichannel Memory Sync</text>
    <text x="26" y="288" class="body-text">• Unifies WhatsApp / Email / Web Chat / Voice</text>
    <text x="26" y="304" class="body-text">  threads ("About the PDF quote you emailed me...")</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Eliminates 91% of Cross-Channel Context Re-Asking</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Compact 250-Token Rolling Persona Digest</text>
    <text x="26" y="384" class="body-text">Bounds memory prompt footprint to &lt;=250 tokens</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">even after 50+ historical calls over 2 years</text>
  </g>

  <!-- Column 2: Bitemporal Knowledge Graph & Fact Supersession -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#purpleGrad508)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. Bitemporal Graph &amp; Contradiction Resolver</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#c4b5fd">Bitemporal Edge Validity (valid_from / until)</text>
    <text x="26" y="86" class="body-text">• Flat vector DBs mix old &amp; new facts ("Lives in</text>
    <text x="26" y="102" class="body-text">  Seattle" + "Moved to Miami")! Graph marks old</text>
    <text x="26" y="122" class="mono" fill="#ddd6fe">edges superseded_at -> 99.4% Temporal Accuracy</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Ephemeral vs. Durable Fact TTL Classifier</text>
    <text x="26" y="188" class="body-text">• Separates 7-day transient state ("I'm traveling</text>
    <text x="26" y="204" class="body-text">  in Tokyo this week") from durable profile facts</text>
    <text x="26" y="224" class="mono">Auto-Expires Stale Episodic Facts via TTL</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#34d399">Source-of-Truth CRM Override Precedence</text>
    <text x="26" y="290" class="body-text">• If conversational memory conflicts with live</text>
    <text x="26" y="306" class="body-text">  core banking/CRM record, live system-of-record</text>
    <text x="26" y="324" class="mono" fill="#6ee7b7">ALWAYS wins over historical chat memory</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Zero Unverified Speculation Persistence</text>
    <text x="26" y="386" class="body-text">Never writes unverified caller claims ("My credit</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">score is 820") as verified account facts</text>
  </g>

  <!-- Column 3: Pre-Auth Household Isolation & GDPR Art. 17 Erasure -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad508)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. Pre-Auth Isolation &amp; GDPR Art. 17 Purge</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">Two-Tier Pre-Auth vs. Post-Auth Memory Gate</text>
    <text x="26" y="86" class="body-text">• Before identity verification, exposes ONLY safe</text>
    <text x="26" y="102" class="body-text">  public preferences (language); private portfolio</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">&amp; medical memory stays locked until auth passes!</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#fbbf24">Shared-Number Household Speaker Separation</text>
    <text x="26" y="188" class="body-text">• Partitions memory by (Account_ID + Speaker_ID)</text>
    <text x="26" y="204" class="body-text">  so a spouse or assistant calling from the same</text>
    <text x="26" y="222" class="mono" fill="#fde68a">phone never hears another person's private history</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">GDPR Art. 17 Cryptographic Cascade Purge</text>
    <text x="26" y="288" class="body-text">• Tracks lineage from raw audio -> transcript -></text>
    <text x="26" y="304" class="body-text">  graph node -> Redis card; "Forget that" purges</text>
    <text x="26" y="322" class="mono">all derived embeddings &amp; summaries in &lt;500ms</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Guardrail: VOICE-MEMORY-GDPR-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateEnterpriseLongTermVoiceMemoryGraphGuard</text>
    <text x="26" y="402" class="body-text">99.4% Fact Accuracy · -$290k/10k Hrs Retention Gain</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Enterprise Long-Term Voice Memory &amp; Bitemporal Knowledge Graph Benchmarks (per 10,000 Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">In-Turn Memory Latency Overhead</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">680ms → &lt;5ms (Ringback Card)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Temporal Fact Accuracy (Moves/Edits)</text>
    <text x="16" y="50" class="kpi-num" fill="#a78bfa">71.5% → 99.4% (Bitemporal)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Pre-Auth / Shared-Phone Leak</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">0.00% (Post-Auth Unlock)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">VIP Retention &amp; AHT Savings</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$290,000 / 10k Hours</text>
  </g>
</svg>
