<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg75" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081221"/>
      <stop offset="50%" stop-color="#11223e"/>
      <stop offset="100%" stop-color="#071324"/>
    </linearGradient>
    <linearGradient id="card75" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172b4e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b172b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg75)" rx="16"/>
  <text x="600" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Voice-Native Agentic RAG: Sub-65ms Phonetic Hybrid Search &amp; Zero-Markdown Spoken Synthesis</text>
  <text x="600" y="66" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Double-Metaphone/Pinyin Homophone Expansion · Effective-Date Policy Lock · 2-Sentence Spoken Summary + SMS Link (VOICE-NATIVE-AGENTIC-RAG-01)</text>

  <!-- Left Column -->
  <rect x="30" y="92" width="290" height="548" rx="12" fill="url(#card75)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="122" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. Why Text-RAG Fails on Voice</text>

  <rect x="48" y="142" width="254" height="105" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="175" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. STT Homophone Misses</text>
  <text x="175" y="188" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• STT Hears "Eye-Cloud" vs "iCloud"</text>
  <text x="175" y="206" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Chinese Pinyin Homophone Drift</text>
  <text x="175" y="224" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pure Vector Search Misses Exact SKU</text>

  <rect x="48" y="264" width="254" height="105" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="175" y="288" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. The 1.8s Reranker Latency Trap</text>
  <text x="175" y="310" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Multi-Hop Cross-Encoder Takes 1.8s</text>
  <text x="175" y="328" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 10 Retrieved Chunks = 8,000 Tokens</text>
  <text x="175" y="346" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pushes Voice TTFA Past 2,400ms!</text>

  <rect x="48" y="386" width="254" height="105" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="175" y="410" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Unspeakable Markdown &amp; URLs</text>
  <text x="175" y="432" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• TTS Reads "Asterisk Asterisk Pipe"</text>
  <text x="175" y="450" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Spells Out "H-T-T-P-S Slash Slash..."</text>
  <text x="175" y="468" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 60-Second Monologue Causes Barge-In</text>

  <rect x="48" y="508" width="254" height="112" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="175" y="532" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Voice-Native RAG Index</text>
  <text x="175" y="554" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pre-Computed `spoken_summary_2s` Field</text>
  <text x="175" y="572" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Phonetic Double-Metaphone / Pinyin Key</text>
  <text x="175" y="590" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• `effective_from` &amp; `effective_until` TTL</text>

  <!-- Center Column -->
  <rect x="350" y="92" width="500" height="548" rx="12" fill="url(#card75)" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Deterministic Voice-RAG Gate (VOICE-NATIVE-AGENTIC-RAG-01)</text>

  <rect x="372" y="142" width="456" height="136" rx="10" fill="#2a1215" stroke="#ef4444" stroke-width="1.8"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE A: Effective-Date TTL &amp; Jurisdiction Policy Lock</text>
  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: retrievedChunkEffectiveDateAndJurisdictionValid === true</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks citing expired 2024 promo rules or wrong-country return policies;</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  enforces hard metadata filter `effective_until &gt; NOW() AND region = caller`</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Eliminates 100% of outdated-policy hallucination liabilities</text>

  <rect x="372" y="294" width="456" height="145" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="600" y="318" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE B: Zero-Markdown, Zero-URL &amp; 2-Sentence Brevity Lock</text>
  <text x="600" y="340" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: spokenOutputStrippedOfMarkdownUrlsAndUnder45Words === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Strips `**`, `|`, `#`, code blocks, and raw URLs before TTS synthesis;</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  delivers a crisp &lt;45-word answer first and asks before reading details</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Offloads URLs, step-by-step guides &amp; PDFs to instant companion SMS</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: Low-Confidence (&lt;0.78) Abstention &amp; SMS/Human Fallback</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: hybridRetrievalConfidenceBelowThreshold === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets abstainFromGuessingAndEscalateTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Never guesses when vector + phonetic BM25 score is below 0.78;</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  explicitly states uncertainty and offers specialist lookup</text>
  <text x="600" y="582" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Retrieval Latency: 58ms P95 (Azure AI Search Hybrid + Pre-Summary)</text>

  <!-- Right Column -->
  <rect x="880" y="92" width="290" height="548" rx="12" fill="url(#card75)" stroke="#10b981" stroke-width="1.5"/>
  <text x="1025" y="122" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Voice-RAG Retrieval Stack</text>

  <rect x="898" y="142" width="254" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="1025" y="166" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Azure AI Search / Qdrant / Milvus</text>
  <text x="1025" y="188" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• HNSW Int8 Vector + BM25 + Phonetic</text>
  <text x="1025" y="206" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Top-3 Pre-Summarized Voice Chunks</text>
  <text x="1025" y="224" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Sub-60ms P95 Retrieval SLA</text>

  <rect x="898" y="268" width="254" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="1025" y="292" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Ingestion-Time Voice Compiler</text>
  <text x="1025" y="314" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pre-Compiles 10-Page PDF into:</text>
  <text x="1025" y="332" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  1) 35-Word Spoken Answer (`voice_text`)</text>
  <text x="1025" y="350" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  2) Follow-Up FAQ Tree &amp; SMS Deep-Link</text>

  <rect x="898" y="394" width="254" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="1025" y="418" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Phonetic Query Rewriter</text>
  <text x="1025" y="440" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pinyin / Double-Metaphone Index</text>
  <text x="1025" y="458" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Recovers "Kube-Control" → `kubectl`</text>
  <text x="1025" y="476" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Recovers Homophone Brand/Drug Names</text>

  <rect x="898" y="520" width="254" height="100" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
  <text x="1025" y="544" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Sealed Voice-RAG Metrics</text>
  <text x="1025" y="566" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Homophone Recall Lift: +37.4%</text>
  <text x="1025" y="584" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Expired-Policy Citations: 0.00%</text>
  <text x="1025" y="602" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• End-to-End RAG TTFA: 485ms P50</text>
</svg>
