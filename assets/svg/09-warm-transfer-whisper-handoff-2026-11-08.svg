<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="cardDark9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg9)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent9)"/>

  <!-- Header -->
  <g transform="translate(40, 26)">
    <rect x="0" y="0" width="350" height="28" rx="14" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
    <text x="175" y="19" fill="#C7D2FE" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STAGE 365 · ROUND 5 SINGLE-TOPIC FAQ · P723–P724</text>
    <text x="368" y="20" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic (&lt;1ms offline state machine, 1ms res.) | Live PBX leg setup: not_measured</text>

    <text x="0" y="58" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800">企业语音转人工选型：盲转 (SIP REFER)、CTI 弹屏 vs 双腿咨询温转 + Whisper 耳语</text>
    <text x="0" y="84" fill="#93C5FD" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600">AI-to-Human Escalation: Cold Blind Transfer vs. P723 Signed Context Screen-Pop vs. P724 Dual-Leg Whisper Briefing</text>
  </g>

  <!-- 3 Architecture Selection Columns -->
  <!-- Column 1: Cold Blind Transfer -->
  <g transform="translate(40, 128)">
    <rect width="355" height="238" rx="14" fill="url(#cardDark9)" stroke="#475569" stroke-width="1.5"/>
    <rect x="16" y="14" width="138" height="24" rx="6" fill="#334155"/>
    <text x="85" y="30" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">架构 A · 纯盲转 (SIP REFER)</text>
    <text x="16" y="60" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">只转音频电话线，上下文清零</text>
    <text x="16" y="83" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 协议：RFC 3515 SIP REFER 直甩队列后退出</text>
    <text x="16" y="105" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 痛点：坐席屏幕空白，重问姓名/单号/诉求</text>
    <text x="16" y="127" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 浪费：每通多花 ~75s 重复核身与背景复述</text>
    <rect x="16" y="146" width="323" height="76" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="28" y="168" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">✅ 仅适用场景 (Good Fit Only For):</text>
    <text x="28" y="188" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 转往自动按键 IVR、夜间语音信箱</text>
    <text x="28" y="208" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 开场 0 上下文客户直接要求“转总机”</text>
  </g>

  <!-- Column 2: Single-Leg + P723 Signed Screen-Pop -->
  <g transform="translate(422, 128)">
    <rect width="355" height="238" rx="14" fill="url(#cardDark9)" stroke="#10B981" stroke-width="1.8"/>
    <rect x="16" y="14" width="196" height="24" rx="6" fill="#064E3B"/>
    <text x="114" y="30" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">架构 B · 单腿转接 + P723 弹屏 (主力)</text>
    <text x="16" y="60" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">85% 标准桌面客服中心最优解</text>
    <text x="16" y="83" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 机制：SIP UUI 头携带 callCorrelationId</text>
    <text x="16" y="105" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="12">• P723 护栏：强制校验 KYC 签名 + 已确认槽位</text>
    <text x="16" y="127" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 收益：45词4行红绿卡片，坐席 1.5s 读完免重问</text>
    <rect x="16" y="146" width="323" height="76" rx="8" fill="#06281E" stroke="#10B981"/>
    <text x="28" y="168" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">💰 成本与排队优势 (Queue &amp; TCO Advantage):</text>
    <text x="28" y="188" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• REFER 移交 PBX 队列后 AI 媒体端口 0 驻留</text>
    <text x="28" y="208" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 2万通/日约省 63s/通 ≈ 350 坐席工时/天 (reported)</text>
  </g>

  <!-- Column 3: Dual-Leg Consultative Warm Transfer + P724 Whisper -->
  <g transform="translate(805, 128)">
    <rect width="355" height="238" rx="14" fill="url(#cardDark9)" stroke="#818CF8" stroke-width="1.8"/>
    <rect x="16" y="14" width="218" height="24" rx="6" fill="#312E81"/>
    <text x="125" y="30" fill="#C7D2FE" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">架构 C · 双腿温转 + P724 耳语播报</text>
    <text x="16" y="60" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">VIP 专属坐席与无屏幕外勤专家必选</text>
    <text x="16" y="83" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• A-Leg (客户)：保持舒适等待音 (On-Hold)</text>
    <text x="16" y="105" fill="#C7D2FE" font-family="Segoe UI, Inter, sans-serif" font-size="12">• B-Leg (专家)：AI 1.3x 倍速 6秒单向耳语交底</text>
    <text x="16" y="127" fill="#C7D2FE" font-family="Segoe UI, Inter, sans-serif" font-size="12">• P724 护栏：客户侧耳语泄漏 &lt;= -70 dBFS 强隔离</text>
    <rect x="16" y="146" width="323" height="76" rx="8" fill="#1E1B4B" stroke="#6366F1"/>
    <text x="28" y="168" fill="#A5B4FC" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">🛡️ 超时优雅回切 (Graceful Hold Fallback):</text>
    <text x="28" y="188" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• B-Leg 振铃 &gt;12s 未接时自动取消 B-Leg</text>
    <text x="28" y="208" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• AI 切回 A-Leg 安抚客户并锁高优回呼排号</text>
  </g>

  <!-- Bottom Mechanism Panel: P723 + P724 Dual-Leg Mixer & Zero-Repeat Pipeline -->
  <g transform="translate(40, 386)">
    <rect width="1120" height="248" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="24" y="32" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="800">底层核心原理：P723 零重复状态包契约 + P724 B2BUA 单向耳语混音隔离矩阵 (&lt;1ms synthetic gate)</text>

    <!-- Step 1: P723 Context Packet -->
    <g transform="translate(24, 50)">
      <rect width="335" height="176" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.3"/>
      <text x="16" y="26" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">① P723 结构化状态包契约 (Zero-Repeat Guard)</text>
      <text x="16" y="50" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11">{ callCorrelationId: "corr_8841",</text>
      <text x="16" y="69" fill="#6EE7B7" font-family="Consolas, monospace" font-size="11">  verifiedIdentity: "verified_otp (HMAC)",</text>
      <text x="16" y="88" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11">  confirmedSlots: { orderId: "#8841" },</text>
      <text x="16" y="107" fill="#FCD34D" font-family="Consolas, monospace" font-size="11">  briefingUnder45Words: "王先生已核身...",</text>
      <text x="16" y="126" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11">  repeatVerifiedSlotPrompt: false }</text>
      <rect x="16" y="138" width="303" height="26" rx="5" fill="#064E3B"/>
      <text x="167" y="155" fill="#A7F3D0" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">拦截缺失槽位或二次核身追问 (100% synthetic pass)</text>
    </g>

    <!-- Arrow 1 -->
    <text x="373" y="142" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="800">➔</text>

    <!-- Step 2: P724 One-Way Whisper Mixer Matrix -->
    <g transform="translate(402, 50)">
      <rect width="355" height="176" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.3"/>
      <text x="16" y="26" fill="#C7D2FE" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">② P724 B2BUA 单向耳语声道隔离矩阵</text>
      <rect x="16" y="40" width="323" height="40" rx="6" fill="#0F172A" stroke="#38BDF8"/>
      <text x="26" y="58" fill="#93C5FD" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">客户腿 A-Leg (Caller)：锁定 On-Hold 舒适等待音</text>
      <text x="26" y="73" fill="#34D399" font-family="Consolas, monospace" font-size="10">callerWhisperGainDb: -85 dBFS &lt;= -70 dBFS (0% 漏音)</text>

      <rect x="16" y="88" width="323" height="40" rx="6" fill="#0F172A" stroke="#818CF8"/>
      <text x="26" y="106" fill="#C7D2FE" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700">坐席腿 B-Leg (Specialist)：1.3x 单向耳语播报 (6s)</text>
      <text x="26" y="121" fill="#E2E8F0" font-family="Consolas, monospace" font-size="10">whisperRouteTarget: "agent_b_leg_only"</text>

      <rect x="16" y="138" width="323" height="26" rx="5" fill="#312E81"/>
      <text x="177" y="155" fill="#E0E7FF" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">若 A-Leg 未进 Hold 或增益 &gt; -70dB 立即熔断静音</text>
    </g>

    <!-- Arrow 2 -->
    <text x="771" y="142" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="800">➔</text>

    <!-- Step 3: Bridge or Fallback -->
    <g transform="translate(800, 50)">
      <rect width="296" height="176" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.3"/>
      <text x="16" y="26" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">③ 坐席确认桥接 &amp; 端口旁路释放</text>
      <text x="16" y="52" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 坐席按键 DTMF '1' 确认接手通话</text>
      <text x="16" y="76" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 停止等待音，导通 A-Leg ⇄ B-Leg</text>
      <text x="16" y="100" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 发送 SIP REFER(Replaces) 交还 PBX</text>
      <text x="16" y="122" fill="#93C5FD" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 若 B-Leg &gt;12s 未接：切回 AI 约回电</text>
      <rect x="16" y="138" width="264" height="26" rx="5" fill="#064E3B"/>
      <text x="148" y="155" fill="#A7F3D0" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">客户开口零重复 · 释放 AI 双腿中继费</text>
    </g>
  </g>
</svg>
