<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgAssist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E1C"/>
      <stop offset="50%" stop-color="#112238"/>
      <stop offset="100%" stop-color="#07121F"/>
    </linearGradient>
    <linearGradient id="chGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="nbaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="acwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgAssist)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Contact Center Real-Time Agent Assist Copilot: Stereo Split, &lt;300ms Cards &amp; 3s Auto-ACW</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">联络中心坐席实时辅助 Copilot 架构图解：双声道物理分轨零串音、&lt;300ms 推荐话术卡片、情绪告警与挂机 3 秒自动工单小结</text>
  <rect x="850" y="42" width="302" height="34" rx="17" fill="#1E1B4B" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="1001" y="64" fill="#C4B5FD" font-size="13" font-weight="600" text-anchor="middle">AGENT-ASSIST-COPILOT-01</text>

  <!-- Pillar 1: Stereo Dual-Channel Physical Split -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#chGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 双声道物理分轨 (Stereo Split 零串音)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 反模式：把坐席和客户混成单声道再跑 Diarization</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 聚类算法需等 1.5s 声学窗口，且两人抢话时极易把坐席话术当成客户提问</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 导致桌面频繁弹出错误的知识库卡片，坐席嫌烦直接关掉插件</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="30" y="174" fill="#7DD3FC" font-size="13" font-weight="700">✅ 黄金准则：SIPREC / WebRTC 左右声道物理硬隔离</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 左声道 (Ch0 = 客户) 与右声道 (Ch1 = 坐席) 独立进入流式 STT</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 100% 零串音角色归因，转写延迟压至 &lt;180ms，抢话重叠也毫不含糊</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">双流触发分工明確</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 客户声道 (Ch0)：触发意图识别、RAG 政策检索、情绪升级监控</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 坐席声道 (Ch1)：触发合规必读项勾选 (Checklist) 与违禁承诺告警</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">角色归因准确率 100% · 流式字幕 &lt;180ms</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">无需昂贵声纹聚类即可实现毫秒级双轨实时监控</text>
  </g>

  <!-- Pillar 2: <300ms Next-Best-Action Card & Compliance Guard -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#nbaGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. &lt;300ms 话术推荐卡片与实时合规护栏</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#2E1065" stroke="#8B5CF6"/>
    <text x="30" y="82" fill="#DDD6FE" font-size="13" font-weight="700">防信息过载：只推“3行极简要点卡”，严禁推长篇大论</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 坐席在打电话时根本无法阅读超过 60 字的 LLM 长段落</text>
    <text x="30" y="122" fill="#C4B5FD" font-size="12">• 卡片格式：① 政策结论 (加粗) + ② 推荐安抚金句 + ③ 一键动作按钮</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="174" fill="#FCA5A5" font-size="13" font-weight="700">实时合规纠偏与班长台静默耳语 (Supervisor Whisper)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 若坐席漏读免责声明或口头违规承诺，屏幕 0ms 弹出红色补救话术</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 当客户焦急/愤怒分 &gt;=85% 时，自动向班长台推送实时监听与接管预警</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">新人坐席培训周期缩短 50% (Time-to-Proficiency)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 新员工上岗第 1 周即可凭借实时话术导航独立接听复杂改签/理赔电话</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 首次呼叫解决率 (FCR) 提升 +18%，违规罚单率下降 92%</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#2E1065" stroke="#A78BFA"/>
    <text x="178" y="356" fill="#DDD6FE" font-size="13" font-weight="700" text-anchor="middle">意图触发至卡片上屏 P95 &lt;= 290ms</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">采用 Redis 热点意图预缓存 + GPT-4o-mini 流式结构化输出</text>
  </g>

  <!-- Pillar 3: 3-Second Post-Call Auto-ACW & CRM Writeback -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#acwGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 挂机 3 秒自动工单小结 (ACW 缩短 75%)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">传统痛点：每通电话挂断后坐席要花 90 秒手敲工单</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 坐席手动选择三级业务标签、填写客户诉求、承诺事项与跟进工单</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 占去全天 22% 的有效工时，且手写纪要经常漏记关键争议点</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">增量滚动摘要 (Rolling Summary)：挂机后 2.4 秒即刻成稿</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 通话进行中每 60 秒后台静默更新状态槽位，无需等挂机再从头读万字长文</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 挂机瞬间输出 JSON：业务分类码、诉求摘要、已办动作、待跟进 SLA</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">坐席“一键审核入库”门禁 (Human-in-the-Loop Sign-Off)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 自动预填 Salesforce / Dynamics 365 / ServiceNow 工单字段</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 坐席核对无误点击「确认提交」，话后处理时长从 90s 骤降至 18s！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">话后小结时长 90s -&gt; 18s (产能释放 +20%)</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">500 席呼叫中心每年仅节省工时即产生 $1.85M 净收益</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#A78BFA" font-size="14" font-weight="700">架构师核心设计铁律 (AGENT-ASSIST-COPILOT-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 实时坐席辅助严禁单声道混音聚类，必须采用 SIPREC/WebRTC 左右声道物理分轨（Ch0=客户，Ch1=坐席），杜绝把坐席话术误判为客户异议；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 桌面卡片严格限制在“3行极简要点 + 一键动作”；通话中滚动维护状态槽位，挂机后 &lt;3 秒生成结构化 CRM 工单并由坐席一键确认入库。</text>
</svg>
