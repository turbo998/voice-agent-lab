  <text x="60" y="629" fill="#94A3B8" font-family="Consolas, monospace" font-size="11.2">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established · Live SRTP AEAD cipher latency not_measured</text>
