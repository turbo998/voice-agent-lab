  <rect width="1200" height="675" fill="url(#bg62)"/>
  <rect x="24" y="20" width="1152" height="635" rx="18" fill="none" stroke="url(#accent62)" stroke-width="2" stroke-opacity="0.65"/>

  <rect x="44" y="38" width="388" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="238" y="58" text-anchor="middle" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">STAGE 418 · TOPIC 58 · P829 &amp; P830 🎉 · 421 DIMS</text>

  <rect x="850" y="38" width="306" height="30" rx="15" fill="#064E3B" stroke="#34D399" stroke-width="1.2"/>
  <text x="1003" y="58" text-anchor="middle" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">839 Guardrails · 848 Probes · 860 Tests 🎉</text>

  <text x="44" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">WebRTC RFC 7714 SRTP AES-GCM Nonce Reuse &amp; RFC 3711 SRTCP E=1 Guard</text>
  <text x="44" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">WebRTC SRTP AES-GCM 零 Nonce 重用（[64, 128] 防重放滑窗）与 SRTCP 强制 E=1 全加密及 [80, 128]b 认证标签门禁</text>

  <!-- Left Card: Vulnerable Stack -->
  <rect x="44" y="144" width="356" height="432" rx="14" fill="url(#redGrad62)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="64" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">❌ 脆弱 SRTP/SRTCP 媒体栈三大故障</text>

  <rect x="62" y="192" width="320" height="112" rx="10" fill="#0F172A" fill-opacity="0.75" stroke="#F87171" stroke-width="1"/>
  <text x="76" y="214" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">1. AES-GCM Nonce 重用两本密码本破密</text>
  <text x="76" y="236" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">IV = Salt XOR (SSRC || ROC=0 || SEQ=0)</text>
  <text x="76" y="256" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 热备切换/插播重置 SEQ=0 复用同一 IV</text>
  <text x="76" y="276" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• C1⊕C2=P1⊕P2 直接还原客户口述隐私</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• GF(2^128) 求根泄露 GHASH 密钥 H 伪造语音</text>

  <rect x="62" y="316" width="320" height="118" rx="10" fill="#0F172A" fill-opacity="0.75" stroke="#F87171" stroke-width="1"/>
  <text x="76" y="338" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">2. SRTCP E=0 明文控制包旁路泄密</text>
  <text x="76" y="360" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">SRTCP Index E-bit = 0 (UNENCRYPTED)</text>
  <text x="76" y="380" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• SDES CNAME/手机号与 BYE 原因明文裸奔</text>
  <text x="76" y="400" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• RTCP XR 能量指标泄露说话人与按键节奏</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• 31位索引达 2^31-1 回绕引发二次 IV 碰撞</text>

  <rect x="62" y="446" width="320" height="114" rx="10" fill="#0F172A" fill-opacity="0.75" stroke="#F87171" stroke-width="1"/>
  <text x="76" y="468" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">3. 16包过窄防重放滑窗误杀乱序包</text>
  <text x="76" y="490" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">Replay Window = 16 pkts (320ms only)</text>
  <text x="76" y="510" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 跨洋或 5G 切网抖动超 320ms 即掉出左界</text>
  <text x="76" y="530" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• 合法迟到语音包被当成重放丢弃 (吞字 14.2%)</text>

  <!-- Center Card: P829 -->
  <rect x="422" y="144" width="356" height="432" rx="14" fill="url(#blueGrad62)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="442" y="174" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ P829 · RFC 7714 Nonce 与滑窗门禁</text>

  <rect x="440" y="192" width="320" height="120" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1"/>
  <text x="454" y="214" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">A. (MasterKey, SSRC, ROC, SEQ) 零重用</text>
  <text x="454" y="236" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">Unique 96-bit IV per Master Key</text>
  <text x="454" y="256" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 音源切换/热备接管时强制递增 ROC 或换钥</text>
  <text x="454" y="276" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁相同 (Key, SSRC) 下重置 SEQ=0</text>
  <text x="454" y="296" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• 100% 保护 AES-GCM 密钥流与 GHASH 子密钥 H</text>

  <rect x="440" y="324" width="320" height="114" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1"/>
  <text x="454" y="346" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">B. 防重放位图窗口锁定 ([64, 128] 包)</text>
  <text x="454" y="368" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">srtpReplayWindowPackets in [64, 128]</text>
  <text x="454" y="388" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• O(1) 128-bit 寄存器位图毫秒级查重拦截</text>
  <text x="454" y="408" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 容忍高达 1.28s–2.56s 跨国乱序抖动</text>
  <text x="454" y="426" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• 弱网乱序误杀丢包率从 14.2% 降至 0%</text>

  <rect x="440" y="450" width="320" height="110" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1"/>
  <text x="454" y="472" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">P829 确定性状态机输出</text>
  <text x="454" y="494" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">action: "rekey_srtp_master_key_on_nonce_reuse</text>
  <text x="454" y="510" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">         _and_clamp_replay_window"</text>
  <text x="454" y="530" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">clampedAesGcmNonceReuseEvents: 0</text>
  <text x="454" y="548" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">clampedSrtpReplayWindowPackets: 64..128</text>

  <!-- Right Card: P830 -->
  <rect x="800" y="144" width="356" height="432" rx="14" fill="url(#greenGrad62)" stroke="#34D399" stroke-width="1.5"/>
  <text x="820" y="174" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🔒 P830 🎉 · RFC 3711 SRTCP E=1 门禁</text>

  <rect x="818" y="192" width="320" height="120" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#34D399" stroke-width="1"/>
  <text x="832" y="214" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">A. 强制 SRTCP E-Bit = 1 全加密</text>
  <text x="832" y="236" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">Reject E=0 &amp; UNENCRYPTED_SRTCP</text>
  <text x="832" y="256" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 100% 加密 SDES 身份、XR 遥测与 BYE 原因</text>
  <text x="832" y="276" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 0ms 丢弃任何 E=0 明文控制包旁路注入</text>
  <text x="832" y="296" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• 31位 SRTCP Index 逼近上限前自动换钥</text>

  <rect x="818" y="324" width="320" height="114" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#34D399" stroke-width="1"/>
  <text x="832" y="346" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">B. 认证标签长度锁定 ([80, 128] bits)</text>
  <text x="832" y="368" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">srtcpAuthTagBits in [80, 128]</text>
  <text x="832" y="388" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 禁止在 SRTCP 控制包上使用 32-bit 弱标签</text>
  <text x="832" y="408" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• AES-GCM 强制完整 128-bit (16B) 认证标签</text>
  <text x="832" y="426" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• 100% 满足金融 PCI-DSS 与医疗 HIPAA 加密标准</text>

  <rect x="818" y="450" width="320" height="110" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#34D399" stroke-width="1"/>
  <text x="832" y="472" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">P830 确定性状态机输出</text>
  <text x="832" y="494" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">action: "enforce_srtcp_encryption_and_rekey</text>
  <text x="832" y="510" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">         _before_index_overflow"</text>
  <text x="832" y="530" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">clampedUnencryptedSrtcpControlPackets: 0</text>
  <text x="832" y="548" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">clampedSrtcpAuthTagBits: 80..128</text>

