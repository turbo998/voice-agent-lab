  <text x="908" y="366" class="body">• Couriers no longer dial 180 phone numbers manually</text>
  <text x="908" y="384" class="body">  while driving vans or e-bikes; AI batches pre-calls &amp;</text>
  <text x="908" y="402" class="body">  plays 3-word badge tags ("#302: Leave at Locker")</text>
  <text x="908" y="424" class="mono">Stops_Completed_Per_Courier_Shift = +18% Lift</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
