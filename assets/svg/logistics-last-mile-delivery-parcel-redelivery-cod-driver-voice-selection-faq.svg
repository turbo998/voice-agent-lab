  <text x="64" y="462" class="body">• Reads recipient notes &amp; re-sequences stop order on the fly</text>
  <text x="64" y="480" class="body">• Dials recipients via ephemeral AXB masked virtual number</text>
  <text x="64" y="498" class="mono">AXB_Masked_Session = "+86-95013-xxxx-8821 (TTL=24h)"</text>

  <rect x="48" y="542" width="340" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
