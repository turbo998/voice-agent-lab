  <text x="472" y="224" class="body">• Blocks unconsented smart-locker drop &amp; blocks closing</text>
  <text x="472" y="242" class="body">  high-value/Rx POD without verified 6-digit recipient OTP</text>
  <text x="472" y="260" class="body">• Masks real phone numbers via ephemeral AXB relay</text>
  <text x="472" y="280" class="mono">Unconsented_Locker_Penalty_And_Fake_POD_Rate = 0.0%</text>
  <text x="472" y="298" class="mono">Waybill_Real_Phone_Number_Leakage = 0.0%</text>

  <rect x="456" y="332" width="368" height="136" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="472" y="354" class="card-title">Gate B: T-30m Route Re-Sequencing &amp; Locker Pre-Hold</text>
  <text x="472" y="374" class="body">• Skips stops where recipient requests evening redelivery</text>
  <text x="472" y="392" class="body">  before courier climbs 6 flights of stairs</text>
  <text x="472" y="410" class="body">• Atomically locks HiveBox/Amazon Locker cell for 45 mins</text>
  <text x="472" y="430" class="mono">Failed_First_Attempt_Delivery_Reduction = -61.4%</text>
  <text x="472" y="448" class="mono">Courier_Daily_Dialing_Time_Saved = -48 Minutes / Day</text>

  <rect x="456" y="482" width="368" height="150" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
