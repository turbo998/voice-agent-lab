  <text x="908" y="520" class="body">• Manual Courier Dialing + Redeliveries: $68,500 / 100k</text>
  <text x="908" y="538" class="body">• Pre-Call + OTP/AXB Guarded Voice: $21,200 / 100k (Rec)</text>
  <text x="908" y="556" class="body">• Silent SMS Only: $54,000 (ignored by 62% of recipients)</text>
  <text x="908" y="578" class="mono">Net_Last_Mile_Savings_Per_100k_Parcels = -$47,300</text>
  <text x="908" y="596" class="mono">Unconsented_Locker_Fines = $0 | High_Val_Theft = 0%</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateLogisticsLastMileParcelDeliveryVoiceGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
