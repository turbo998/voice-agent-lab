  <text x="908" y="224" class="body">• 14% of residential signature parcels fail on Attempt #1</text>
  <text x="908" y="242" class="body">  because the recipient is at work; T-30m voice pre-call</text>
  <text x="908" y="260" class="body">  reroutes to an approved locker or neighbor before arrival</text>
  <text x="908" y="282" class="mono">First_Attempt_Delivery_Success = 96.8% (vs 86.0%)</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
