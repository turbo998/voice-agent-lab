  <text x="472" y="524" class="body">• Detects courier road collision, aggressive dog/assault</text>
  <text x="472" y="542" class="body">  threat, or biologics/fresh cold-chain temp breach (&gt;8°C)</text>
  <text x="472" y="560" class="body">• Dispatches rescue courier for cold-chain handoff in 0ms</text>
  <text x="472" y="578" class="body">  &amp; bridges Hub Safety Supervisor immediately</text>
  <text x="472" y="600" class="mono">if (courierCrashColdChainExcursionOrHazard) -&gt; 0ms Hub</text>
  <text x="472" y="618" class="mono">P99_Gate_Latency = 11ms | Cold_Chain_Save = 99.3%</text>

  <!-- Right Column: Last-Mile Efficiency & Cost per Parcel ROI -->
  <rect x="872" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
