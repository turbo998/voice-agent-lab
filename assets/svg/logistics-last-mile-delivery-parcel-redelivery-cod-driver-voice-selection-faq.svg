  <!-- Left Column: Recipient Pre-Call, Driver PDA & Locker Bus -->
  <rect x="28" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="144" class="card-title">1. Pre-Arrival Call &amp; Courier PDA Core</text>
  <text x="48" y="164" class="card-sub">UPS ORION / FedEx / DHL / SF Express · HiveBox Smart Locker</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">T-30m Automated Delivery-Preference Call</text>
  <text x="64" y="224" class="body">• Calls recipient before courier enters neighborhood</text>
  <text x="64" y="242" class="body">• Captures "Deliver to Door", "Smart Locker" or "Reschedule"</text>
  <text x="64" y="260" class="mono">AWB_#SF9018 = "Door_Delivery_Confirmed | Gate = #1204"</text>

  <rect x="48" y="298" width="340" height="108" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
