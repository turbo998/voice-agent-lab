  <text x="64" y="340" class="body">• Reserves smart-locker compartment (`Cell_B14`) in advance</text>
  <text x="64" y="358" class="body">• Enforces 6-digit OTP for iPhone/Passport/Insulin handoff</text>
  <text x="64" y="376" class="mono">Declared_Value = $1,299 (Direct_OTP_Required = True)</text>

  <rect x="48" y="420" width="340" height="108" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
