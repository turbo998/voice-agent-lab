  <text x="64" y="584" class="body">• Strict ban on unconsented locker drop (2024 Express Rule)</text>
  <text x="64" y="602" class="body">• GDPR / PIPL waybill phone &amp; address privacy protection</text>
  <text x="64" y="620" class="mono">Compliance = Express_Delivery_Consent_And_PIPL_AXB</text>

