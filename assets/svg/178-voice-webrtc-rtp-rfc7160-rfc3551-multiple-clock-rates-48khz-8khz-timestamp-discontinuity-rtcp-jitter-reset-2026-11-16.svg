  <text x="642" y="183" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✅ STAGE 534 DETERMINISTIC GUARDRAILS (P1061 🎉–P1062 🎉)</text>

  <rect x="634" y="208" width="494" height="142" rx="10" fill="#0F172A" stroke="#059669"/>
  <text x="650" y="232" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">P1061 🎉 (1,070th Guard 🎉): Same-Rate DTMF &amp; [1, 1] Rate Lock</text>
  <text x="650" y="254" fill="#E2E8F0" font-family="monospace" font-size="12">action: "bind_matching_clock_rate_telephone_event_and_lock_single_ssrc_rate"</text>
  <text x="650" y="276" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Pairs Opus/48000 with telephone-event/48000 (RFC 7160 §4.3)</text>
  <text x="650" y="296" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps clockRateDiscontinuityOrDroppedAudioPackets = 0</text>
  <text x="650" y="316" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps distinctActiveClockRatesPerSsrc in [1, 1] (3 -&gt; 1)</text>
  <text x="650" y="336" fill="#38BDF8" font-family="monospace" font-size="11">Policy ID: P1061-WEBRTC-RFC7160-SAME-CLOCK-RATE-TELEPHONE-EVENT-MATCHING-AND-SWITCH-DISCONTINUITY-GUARD</text>

  <rect x="634" y="366" width="494" height="152" rx="10" fill="#0F172A" stroke="#059669"/>
  <text x="650" y="390" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">P1062 🎉 (1,080th Probe &amp; 890th POC 🎉): RTCP J Reset &amp; [20, 60]ms</text>
  <text x="650" y="412" fill="#E2E8F0" font-family="monospace" font-size="12">action: "reset_rtcp_jitter_estimator_on_rate_switch_and_clamp_resync_ms"</text>
  <text x="650" y="434" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Resets RTCP Interarrival Jitter (J=0) on lawful rate switch</text>
  <text x="650" y="454" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps corruptedMultiRateRtcpJitterReportsCount = 0</text>
  <text x="650" y="474" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps clockSwitchResyncWindowMs in [20, 60]ms (240 -&gt; 60ms)</text>
  <text x="650" y="496" fill="#38BDF8" font-family="monospace" font-size="11">Policy ID: P1062-WEBRTC-RFC7160-RTCP-SR-CLOCK-RATE-ALIGNMENT-AND-JITTER-ESTIMATOR-RESET-GUARD</text>

