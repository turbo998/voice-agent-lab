  <text x="52" y="64" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">STAGE 534 · TOPIC 174 · P1061 🎉–P1062 🎉 · 🎉 40TH ROUND, 1,070TH GUARD, 1,080TH PROBE, 890TH POC &amp; 910 TESTS!</text>
  <text x="52" y="96" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="23" font-weight="800">Enterprise WebRTC/RTP RFC 7160 Multiple Clock Rates (48kHz vs 8kHz) &amp; RTCP Jitter Reset</text>
  <text x="52" y="122" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Deterministic Same-Rate telephone-event + [1, 1] SSRC Rate Lock (P1061 🎉) &amp; RTCP Jitter Reset + [20, 60]ms Resync (P1062 🎉)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="52" y="146" width="534" height="390" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="68" y="164" width="295" height="28" rx="6" fill="#7F1D1D"/>
  <text x="80" y="183" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">❌ UNPROTECTED MULTI-RATE RTP SESSION</text>

  <rect x="72" y="208" width="494" height="94" rx="10" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="88" y="232" fill="#F87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Opus/48000 + telephone-event/8000 Timestamp Tear</text>
  <text x="88" y="254" fill="#CBD5E1" font-family="monospace" font-size="12">SSRC switches 48kHz (+960) -&gt; 8kHz DTMF (+160) mid-utterance ❌</text>
  <text x="88" y="274" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• 28 post-DTMF audio packets dropped by NetEQ timestamp jump</text>
  <text x="88" y="292" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• 3 distinct clock rates (48k/16k/8k) mixed on a single SSRC</text>

  <rect x="72" y="316" width="494" height="94" rx="10" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="88" y="340" fill="#F87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Unreset RTCP Interarrival Jitter (J) Explosion</text>
  <text x="88" y="362" fill="#CBD5E1" font-family="monospace" font-size="12">RTCP RR subtracts 8kHz TS from 48kHz TS without reset ❌</text>
  <text x="88" y="382" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• 9 corrupted RTCP RR reports trigger false congestion fallback</text>
  <text x="88" y="400" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• 240ms clock-switch resynchronization stall</text>

  <rect x="72" y="424" width="494" height="94" rx="10" fill="#450A0A" stroke="#EF4444"/>
  <text x="88" y="448" fill="#FECACA" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Production Impact Without P1061 🎉 / P1062 🎉</text>
  <text x="88" y="472" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="13">• 3-second AI ASR deafness immediately after IVR '#' keypress</text>
  <text x="88" y="494" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="13">• Bogus RTCP jitter alarms &amp; G.722 8kHz/16kHz clock drift</text>

