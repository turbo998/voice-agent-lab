  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card256)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic Cold-Chain &amp; NH3 Engine (COLD-STORAGE-REEFER-FSMA-AMMONIA-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: FDA FSMA 204 Core Pulp-Temp &amp; Anti-Refreeze Hard Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks accepting chilled food &gt;4.0°C (39.2°F) or frozen cargo &gt;-12°C core pulp temp</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% forbids "sticking Abuse Load in Blast Freezer to hide thaw" without QA release</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Enforces FSMA 204 Key Data Elements (KDE) &amp; Traceability Lot Code (TLC) capture</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents histamine scombroid poisoning, Listeria growth, and covert refreezing fraud</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: -25°C Deep-Freeze Exposure Timer &amp; Dock Pre-Cool Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces max 45-min continuous work in -25°C to -35°C rooms + 15-min warm-up break</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Requires EN 342 cryo PPE, active 5-min vocal/motion check-in &amp; zero lone-worker entry</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks opening dock doors until trailer reefer is pre-cooled &amp; wheel-locked</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Eliminates freezer frostbite/hypothermia and warm-air dock condensation icing</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Anhydrous Ammonia (NH3) Upwind Evac &amp; Freezer Door Release</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Triggers at ≥25 ppm NH3 leak (IDLH 300 ppm), O2 &lt;19.5%, or freezer panic button</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trips liquid NH3 king valves, starts emergency scrubbers &amp; reads live wind vane</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Unlocks high-speed freezer doors in 0ms &amp; directs UPWIND muster evacuation</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full OSHA 1910.119 PSM, IIAR Ammonia Standards, FDA FSMA 204 &amp; HACCP WORM audit</text>

