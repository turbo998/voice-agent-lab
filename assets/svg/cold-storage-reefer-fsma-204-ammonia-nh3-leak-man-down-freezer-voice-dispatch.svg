  <rect width="1200" height="680" fill="url(#bg256)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Cold-Storage (-25°C), Reefer FSMA 204 &amp; Ammonia (NH3) Safety Voice Dispatch</text>
  <text x="600" y="66" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">FDA FSMA 204 Core Pulp-Temp &amp; Anti-Refreeze Lock · -25°C Blast-Freezer Warm-Up Gate · 0ms NH3 Leak Upwind &amp; Man-Down Bridge (COLD-STORAGE-REEFER-FSMA-AMMONIA-01)</text>

  <!-- Left Column: Reefer Dock, Blast Freezer & Engine Room -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card256)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="166" y="122" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Cold-Storage &amp; Reefer Channels</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reefer Dock Receiving Pod</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Bluetooth core pulp-probe sync</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• FSMA 204 Traceability Lot Code</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pre-cool dock seal (&le;2°C) check</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#34d399"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">-25°C Blast-Freezer Headset</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Heated-battery bone-conduction mic</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 45-min thermal exposure timer</text>
  <text x="166" y="350" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Buddy-system &amp; dead-man check</text>

