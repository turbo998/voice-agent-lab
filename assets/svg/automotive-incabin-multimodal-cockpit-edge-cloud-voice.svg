<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#11223E"/>
      <stop offset="100%" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="zoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="npuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgCar)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Automotive In-Cabin Multimodal Voice Assistant: 6-Zone Isolation, CAN Safety Lock &amp; Tunnel NPU</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">智能汽车座舱多模态语音助手架构：四音区/六音区声源定位权限锁、行车安全 CAN 总线物理围栏与高通 8295 隧道断网端云协同</text>
  <rect x="836" y="42" width="316" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="994" y="64" fill="#7DD3FC" font-size="13" font-weight="600" text-anchor="middle">AUTOMOTIVE-INCABIN-COCKPIT-01</text>

  <!-- Pillar 1: 4/6-Zone Seat Acoustic Isolation & Child Seat Permission Lock -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#zoneGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 四/六音区声源定位与后排儿童权限硬锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 行车惊魂：后排熊孩子喊“打开后备箱/关掉大灯”，车机竟照做了！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 高速行驶中后排乘客开玩笑或小孩乱喊控制指令</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 若不分音区角色全盘执行，会导致高速误开天窗/车窗或篡改主驾导航目的地！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="30" y="174" fill="#7DD3FC" font-size="13" font-weight="700">✅ 座位独立阵列麦 + 音区 RBAC 权限矩阵 (Seat-Zone RBAC)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 谁喊“我有点冷/打开车窗”，精准只调对应座位 (如右后座) 的空调与车窗</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 主驾导航变更、驾驶模式、后备箱、全车锁等高敏指令 100% 锁定仅主驾音区可用</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">车载杜比音响 90dB 外放下的硬件参考回路 AEC</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 车内正在大声播放摇滚乐与导航播报时，DSP 直接读取功放数字参考信号抵消</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 实现“免唤醒词随时打断”且绝不把歌词台词误识别为车主指令</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">音区归属准确率 99.4% · 后排越权控车 0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">支持一句话跨音区复合指令：“把我的座椅加热打开，把后排空调关了”</text>
  </g>

  <!-- Pillar 2: Driving-State CAN Bus Safety Interlock (Speed > 0 km/h) -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#canGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 行车车速与档位 CAN 总线安全物理围栏</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 真实事故教训：夜间高速 110km/h 一句口误关掉了全车大灯！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 车主本想说“关闭车内阅读灯”，语音识别少听了两个字变成“关闭大灯”</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 若车机大模型不看车速档位直接下发 CAN 指令关近光灯，将酿成惨烈车祸！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">ISO 26262 功能安全铁律：档位 != P 档时禁闭关键车控</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 当 `VehicleSpeed &gt; 0 km/h` 或 `Gear != PARK` 时，座舱网关物理拦截：</text>
    <text x="30" y="214" fill="#EF4444" font-size="12">• 严禁语音关闭近光灯、打开后备箱/引擎盖、折叠后视镜、主驾屏播放视频</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">舱外视觉多模态指代 (“左边那栋白色大楼是什么？”)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 结合 DMS 主驾视线追踪摄像头 + 前视周视摄像头关键帧 + 高精地图 POI</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 800ms 内自然播报沿途地标、餐厅评分并支持“顺路加个途经点”</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">行车中危险车控拦截率 100% · 零安全召回</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">大模型输出必须经端侧 MCU/网关确定性车速档位状态表二次鉴权</text>
  </g>

  <!-- Pillar 3: Qualcomm 8295 / Orin Edge NPU + Cloud Hybrid & Tunnel Fallback -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#npuGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 座舱 NPU (&lt;=150ms) + 云端大模型端云协同</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">痛点：进地下车库或高速隧道没 5G 信号，连空调车窗都打不开了</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 若把所有语音指令都发往云端大模型，进隧道或地库瞬间车机变成“聋哑人”</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 且开关车窗等高频动作走云端要 800ms，显得车机反应迟钝</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">端云双轨路由：高频车控走端侧 NPU，复杂闲聊走云端</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 端侧高通 SA8295P / 8397 NPU 常驻 1.8B~3B 量化语音/车控小模型 (&lt;=150ms)</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 800+ 项车控、本地音乐与离线导航 100% 在端侧 NPU 零流量极速闭环</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">800ms 云端弱网看门狗无缝降级 (Tunnel Watchdog)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 复合百科/订餐厅/找充电桩并发调云端 Azure GPT-Realtime / 混合检索</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 一旦入隧道云端首包 &gt;800ms 超时，立即无缝回退端侧模型播报，零转圈报错</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">车控响应 &lt;=140ms · 地库/隧道可用率 100%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">单车每月节省 68% 车联网 5G 流量与云端大模型 Token 账单</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">智能汽车座舱多模态语音架构三大铁律 (AUTOMOTIVE-INCABIN-COCKPIT-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 行车安全硬互锁：当车速 &gt;0km/h 或非 P 档时，端侧网关物理阻断关闭大灯、开启后备箱、折叠后视镜与主驾屏视频播放指令；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 音区权限与端云协同：后排/儿童音区严禁越权篡改主驾导航与全车车控；高频车控走端侧 NPU (&lt;=150ms)，云端设置 800ms 隧道断网无缝兜底。</text>
</svg>
