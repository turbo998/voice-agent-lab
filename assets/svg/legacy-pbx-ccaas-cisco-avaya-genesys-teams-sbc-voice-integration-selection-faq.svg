<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg548" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#152238" />
    </linearGradient>
    <linearGradient id="accentBlue548" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGreen548" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="accentPurple548" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentAmber548" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <style>
      .title { font: 700 21.5px "Segoe UI", "PingFang SC", sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 13px "Segoe UI", "PingFang SC", sans-serif; fill: #94a3b8; }
      .sec-hdr { font: 700 14px "Segoe UI", "PingFang SC", sans-serif; fill: #e2e8f0; letter-spacing: 0.4px; }
      .node-title { font: 700 13px "Segoe UI", "PingFang SC", sans-serif; fill: #ffffff; }
      .node-sub { font: 400 11.5px "Segoe UI", "PingFang SC", sans-serif; fill: #cbd5e1; }
      .badge { font: 700 11px "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .metric-num { font: 700 20px "Segoe UI", "PingFang SC", sans-serif; fill: #38bdf8; }
      .metric-lbl { font: 500 11.5px "Segoe UI", "PingFang SC", sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg548)" rx="16" />

  <!-- Header -->
  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="48" y="51" class="title">存量呼叫中心（Cisco / Avaya / Genesys / Teams）零携号转网接入语音 AI 架构 (#548)</text>
  <text x="48" y="74" class="subtitle">Legacy PBX &amp; CCaaS Sidecar Integration: Enterprise SBC Direct Trunk (&lt;35ms) · 36-Byte UUID + CTI Out-of-Band Screen-Pop · &lt;50ms Fail-Open Bypass</text>
  <rect x="945" y="36" width="205" height="36" rx="18" fill="url(#accentBlue548)" />
  <text x="1047" y="59" text-anchor="middle" class="badge">PBX-CCAAS-SBC-2026</text>

  <!-- Plane 1: Enterprise SBC Sidecar Ingress & Fail-Open -->
  <rect x="28" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <rect x="28" y="106" width="355" height="36" rx="12" fill="url(#accentBlue548)" />
  <text x="205" y="129" text-anchor="middle" class="sec-hdr">① 企业 SBC 旁路直连与 &lt;50ms 逃生 (Zero LNP)</text>

  <rect x="46" y="158" width="319" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="180" class="node-title">零运营商携号转网 (Keep Carrier &amp; DIDs)</text>
  <text x="60" y="200" class="node-sub">• 保留现有运营商 800/400 号码与 AudioCodes/Oracle SBC</text>
  <text x="60" y="218" class="node-sub">• 按技能组/尾号从 SBC 分流至 ACS / LiveKit SIP 网关</text>
  <text x="60" y="234" class="node-sub">• 消除 PSTN 迂回双倍话费 ($0.018/min) 与 240ms 损耗</text>

  <rect x="46" y="258" width="319" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="60" y="280" class="node-title">三种主流异构对接模式按需组合</text>
  <text x="60" y="300" class="node-sub">• 模式 1: SBC Direct SIP Trunk (&lt;35ms，AI 首线接待首选)</text>
  <text x="60" y="318" class="node-sub">• 模式 2: Genesys AudioHook / Connect Kinesis (坐席辅助)</text>
  <text x="60" y="336" class="node-sub">• 模式 3: Teams Phone Direct Routing / Extensibility</text>

  <rect x="46" y="360" width="319" height="84" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="60" y="382" class="node-title">&lt;50ms SBC 硬件级故障旁路 (Fail-Open Bypass)</text>
  <text x="60" y="402" class="node-sub">• SBC 持续探测 AI 网关 SIP 心跳与首包 800ms 超时</text>
  <text x="60" y="420" class="node-sub">• 云端 AI 故障时 &lt;50ms 自动切回传统 IVR/人工队列</text>

  <rect x="46" y="458" width="319" height="82" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1" />
  <text x="60" y="480" class="node-title">单转码零级联保真 (Single-Transcode Guard)</text>
  <text x="60" y="500" class="node-sub">• 严禁 G.711→Opus→G.729→PCM 多重有损转码</text>
  <text x="60" y="518" class="node-sub">• 数字/账号 STT 词错误率 (WER) 从 11.4% 降至 3.1%</text>

  <!-- Plane 2: Out-of-Band CTI Context Bridge & Warm Transfer -->
  <rect x="403" y="106" width="394" height="450" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="403" y="106" width="394" height="36" rx="12" fill="url(#accentPurple548)" />
  <text x="600" y="129" text-anchor="middle" class="sec-hdr">② 跨 PBX 破除 128B 截断与无损弹屏桥 (CTI Bridge)</text>

  <rect x="421" y="158" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="180" class="node-title">破除传统 PBX 128 字节 UUI 截断瓶颈</text>
  <text x="435" y="200" class="node-sub">• 传统 Avaya/Cisco UUI 超过 128 Bytes 即丢弃后半截摘要</text>
  <text x="435" y="218" class="node-sub">• 信令带内仅传 36-Byte `X-Correlation-UUID` + 技能队列号</text>
  <text x="435" y="236" class="node-sub">• 完整 2KB 结构化摘要/KYC 状态走 &lt;10ms Redis CTI 总线</text>

  <rect x="421" y="264" width="358" height="92" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="286" class="node-title">零计费残留的 Trombone 媒体环路释放</text>
  <text x="435" y="306" class="node-sub">• 转人工成功后通过 SBC 重锚定媒体流 (Media Re-Anchor)</text>
  <text x="435" y="324" class="node-sub">• AI 容器立即释放 WebRTC/GPU 会话，不再挂靠陪聊计费</text>
  <text x="435" y="342" class="node-sub">• 若需坐席实时辅助，切换为单向只读 AudioHook 旁路流</text>

  <rect x="421" y="370" width="358" height="84" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
  <text x="435" y="392" class="node-title">Cisco Finesse / Genesys / Salesforce 0.5s 弹屏</text>
  <text x="435" y="412" class="node-sub">• 坐席接听前 500ms 自动弹出：已验身标签 + 诉求摘要</text>
  <text x="435" y="430" class="node-sub">• 彻底消灭“您贵姓、什么事”重复盘问，AHT 缩短 48 秒</text>

  <rect x="421" y="468" width="358" height="72" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
  <text x="435" y="490" class="node-title">双向 DTMF 与 IVR 菜单穿透兼容</text>
  <text x="435" y="510" class="node-sub">• 兼容传统银行/医保按键密码器与语音双模混合输入</text>

  <!-- Plane 3: Co-Pilot Whisper & Phased Migration Governance -->
  <rect x="817" y="106" width="355" height="450" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
  <rect x="817" y="106" width="355" height="36" rx="12" fill="url(#accentGreen548)" />
  <text x="994" y="129" text-anchor="middle" class="sec-hdr">③ 坐席实时耳语辅助与渐进演进蓝图</text>

  <rect x="835" y="158" width="319" height="88" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="180" class="node-title">双声道立体声分轨旁听 (Stereo Channel Split)</text>
  <text x="849" y="200" class="node-sub">• 左声道 (Ch0: 客户) + 右声道 (Ch1: 坐席) 原生物理隔离</text>
  <text x="849" y="218" class="node-sub">• 零说话人分离误差 (0.0% DER)，实时推送合规话术卡片</text>
  <text x="849" y="236" class="node-sub">• 坐席遗漏必读免责声明时 300ms 内桌面红框实时提醒</text>

  <rect x="835" y="260" width="319" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="282" class="node-title">三阶段零风险渐进式替换路线 (Phased Rollout)</text>
  <text x="849" y="302" class="node-sub">• 阶段 1 (周 1–2): 只读旁听 + 坐席辅助弹屏 + 自动工单</text>
  <text x="849" y="320" class="node-sub">• 阶段 2 (周 3–6): 夜间/排队溢出流量切入 AI 首线接待</text>
  <text x="849" y="338" class="node-sub">• 阶段 3 (周 7+): 全量首线 AI 分流 68% + 无损温转人工</text>

  <rect x="835" y="364" width="319" height="80" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="386" class="node-title">统一合规录音归档 (Dual-Leg SIPREC)</text>
  <text x="849" y="406" class="node-sub">• AI 接待段与人工接管段通过同一 Global Call-ID 拼接</text>
  <text x="849" y="424" class="node-sub">• 无缝注入现有 Nice / Verint 质检平台，零合规断档</text>

  <rect x="835" y="458" width="319" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="849" y="480" class="node-title">确定性护栏 (LEGACY-PBX-CCAAS-SBC-2026-01)</text>
  <text x="849" y="500" class="node-sub">• 拦截 >128B 带内信令硬塞与转后未释放的双倍计费环路</text>
  <text x="849" y="518" class="node-sub">• AI 网关超时强制触发 &lt;50ms SBC Fail-Open 降级</text>

  <!-- Bottom KPI Strip -->
  <rect x="28" y="574" width="1144" height="122" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="48" y="600" class="sec-hdr">📊 存量 PBX/CCaaS 旁路接入语音 AI 实测基准 (2,000 坐席联络中心 · 1,000 万分钟/月)</text>

  <rect x="48" y="614" width="262" height="68" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="64" y="642" class="metric-num">2 周零携号上线</text>
  <text x="64" y="666" class="metric-lbl">SBC 旁路直连 (vs 整网搬迁 14 个月)</text>

  <rect x="328" y="614" width="262" height="68" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="344" y="642" class="metric-num">0.00% 摘要截断</text>
  <text x="344" y="666" class="metric-lbl">36B UUID + Redis 带外弹屏 (省 48s/通)</text>

  <rect x="608" y="614" width="262" height="68" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="624" y="642" class="metric-num">&lt; 50ms 故障逃生</text>
  <text x="624" y="666" class="metric-lbl">SBC 硬件级 Fail-Open 直通人工 (0 掉线)</text>

  <rect x="888" y="614" width="264" height="68" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
  <text x="904" y="642" class="metric-num">省 $31.2万 / 万通</text>
  <text x="904" y="666" class="metric-lbl">消除 PSTN 双腿迂回费与转人工重复盘问</text>
</svg>
