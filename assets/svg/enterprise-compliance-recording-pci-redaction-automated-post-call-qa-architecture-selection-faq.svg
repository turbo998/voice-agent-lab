<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad440" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="headerGrad440" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardBlue440" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardTeal440" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115e59" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardIndigo440" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad440)" rx="16"/>
  <rect x="24" y="20" width="1152" height="74" rx="12" fill="url(#headerGrad440)"/>
  <text x="44" y="50" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Enterprise Compliance Recording, Pre-Storage PII/PCI Redaction &amp; 100% Automated Post-Call QA</text>
  <text x="44" y="76" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="13">Architecture Blueprint · Policy: COMPLIANCE-RECORDING-PCI-REDACTION-AUTO-QA-2026-01 · 0% Stored PAN/CVV · RTF=0.057 Stereo Fast STT · $0.008/Min QA</text>

  <!-- Column 1: Dual-Track Recording & Pre-Disk PCI/PII Scrub -->
  <rect x="28" y="112" width="364" height="440" rx="12" fill="url(#cardBlue440)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="44" y="128" width="332" height="36" rx="8" fill="#1d4ed8"/>
  <text x="60" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Pre-Storage Audio/Text PCI &amp; PII Redaction</text>

  <rect x="44" y="180" width="332" height="118" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="58" y="203" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">In-RAM Acoustic Silencing Before Disk Write</text>
  <text x="58" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• PCI-DSS v4.0 prohibits storing spoken CVV/PAN on disk</text>
  <text x="58" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Word-level timestamps zero-out / 400Hz-tone PAN, CVV,</text>
  <text x="58" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  SSN &amp; passwords in RAM buffer BEFORE writing WAV/Opus</text>
  <text x="58" y="284" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ 0.0% raw cardholder data in object storage or logs</text>

  <rect x="44" y="312" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="335" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Immutable WORM Storage &amp; SHA-256 Chain-of-Custody</text>
  <text x="58" y="356" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Seals redacted stereo WAV + JSON transcript with KMS</text>
  <text x="58" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Enforces SEC 17a-4 / MiFID II 5-to-7 year WORM retention</text>
  <text x="58" y="396" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Tamper-evident cryptographic audit trail</text>

  <rect x="44" y="436" width="332" height="98" rx="8" fill="#0f172a" stroke="#3b82f6"/>
  <text x="58" y="459" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Two-Party Recording Consent Gate</text>
  <text x="58" y="480" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Verifies statutory recording disclosure played/accepted;</text>
  <text x="58" y="500" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  if caller opts out, switches to transcript-free ephemeral mode</text>

  <!-- Column 2: Stereo Split Fast Transcription -->
  <rect x="418" y="112" width="364" height="440" rx="12" fill="url(#cardTeal440)" stroke="#14b8a6" stroke-width="1.5"/>
  <rect x="434" y="128" width="332" height="36" rx="8" fill="#0f766e"/>
  <text x="450" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. Stereo Split Fast STT (RTF = 0.057)</text>

  <rect x="434" y="180" width="332" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="448" y="203" fill="#2dd4bf" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Physical Stereo Channel Split (Ch0 Caller / Ch1 Agent)</text>
  <text x="448" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Golden Rule: Never mix stereo telephony down to mono!</text>
  <text x="448" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Azure Speech Fast Transcription processes 224.8s call</text>
  <text x="448" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  in 12.9s (RTF = 0.057) with 100% speaker attribution</text>
  <text x="448" y="284" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Eliminates overlapping-speech crosstalk errors</text>

  <rect x="434" y="312" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="448" y="335" fill="#2dd4bf" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Mono Legacy Fallback (`diarization.enabled = True`)</text>
  <text x="448" y="356" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• For legacy single-channel PBX archives, explicitly passes</text>
  <text x="448" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  `TranscriptionDiarizationOptions(enabled=True)`</text>
  <text x="448" y="396" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Fixes SDK default `None` silent speaker-drop trap</text>

  <rect x="434" y="436" width="332" height="98" rx="8" fill="#0f172a" stroke="#14b8a6"/>
  <text x="448" y="459" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Off-Peak Nighttime PTU / GPU Batch Scheduling</text>
  <text x="448" y="480" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Runs non-urgent QA scoring on idle overnight PTU capacity</text>
  <text x="448" y="500" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  (10 PM–6 AM), driving total QA cost down to $0.008/min</text>

  <!-- Column 3: 100% Automated QA & Promise Reconciliation -->
  <rect x="808" y="112" width="364" height="440" rx="12" fill="url(#cardIndigo440)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="824" y="128" width="332" height="36" rx="8" fill="#4338ca"/>
  <text x="840" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. 100% Auto-QA &amp; Promise Reconciliation</text>

  <rect x="824" y="180" width="332" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="838" y="203" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Spoken Promise vs. CRM Ticket Reconciliation</text>
  <text x="838" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Agent/AI says on call: "I've issued a $50 fee waiver"</text>
  <text x="838" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reconciler checks Salesforce/SAP within 30s of hang-up:</text>
  <text x="838" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  Did `Ticket.Waiver_Amount == $50.00` actually commit?</text>
  <text x="838" y="284" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Catches 100% of forgotten promises &amp; repeat angry calls</text>

  <rect x="824" y="312" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="838" y="335" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">100% Call Coverage (vs. 1%–2% Manual Random Sampling)</text>
  <text x="838" y="356" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Audits every single call for mandatory disclosures,</text>
  <text x="838" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  empathy, dead-air ratio, and root-cause product defects</text>
  <text x="838" y="396" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Surfaces 50x more compliance &amp; churn risks than manual QA</text>

  <rect x="824" y="436" width="332" height="98" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="838" y="459" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">0ms Remediation Alert on Broken Promise / UDAAP</text>
  <text x="838" y="480" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Auto-triggers recovery task or outbound cure call before</text>
  <text x="838" y="500" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  the customer files a CFPB / regulatory complaint</text>

  <!-- Bottom Summary Bar -->
  <rect x="28" y="568" width="1144" height="88" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="48" y="596" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Architect Blueprint Summary (Enterprise Compliance Recording, PCI Redaction &amp; Automated Post-Call QA):</text>
  <text x="48" y="620" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pre-Storage Redaction: In-RAM word-timestamp audio zeroing of PAN/CVV/SSN + WORM SHA-256 archive (100% PCI-DSS v4.0 compliant)</text>
  <text x="48" y="642" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">• 100% Auto-QA: Stereo Split Fast STT (RTF=0.057, 0% crosstalk) + Spoken-Promise vs. CRM Ticket Reconciliation at $0.008/min</text>
</svg>
