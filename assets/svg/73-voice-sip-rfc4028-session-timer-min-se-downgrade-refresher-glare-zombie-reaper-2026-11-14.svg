  <text x="688" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P852 Gate: Explicit refresher=uas + UPDATE + [15, 30]s RTP/RTCP Watchdog</text>
  <text x="688" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: reap_half_open_rtp_zombie_with_bye_reason_and_pin_refresher</text>
  <text x="672" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P852 · 🎉 870 合成探针与 680 POC 探针双里程碑）：</text>
  <text x="672" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedUnreapedHalfOpenRtpZombieCalls = 0（100% 自动收割半开死链并消除 15m 掉线）</text>
  <text x="672" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedRtpDeadAirWatchdogTimeoutSeconds ∈ [15, 30]（秒级止损 GPU 语音算力）</text>

