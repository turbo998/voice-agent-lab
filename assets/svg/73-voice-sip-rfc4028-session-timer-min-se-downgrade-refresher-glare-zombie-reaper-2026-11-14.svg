  <rect x="44" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="146" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. RFC 4028 Session-Expires &amp; 422 Loop Gate (P851)</text>
  <text x="64" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：外线发 Session-Expires: 5 迫使每 2.5s 重协商一次，信令负载暴增 360 倍</text>
  <text x="64" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 循环风险：恶意对端连续返回 422 (Min-SE: 86400) 引发重试死循环或 24h 僵尸挂起</text>
  <rect x="64" y="208" width="544" height="82" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11.5">❌ Sub-90s Thrash: Session-Expires=5s -&gt; 360x SDP Storm | Endless 422 Loop</text>
  <text x="80" y="252" fill="#86EFAC" font-family="Consolas, monospace" font-size="11.5">✅ P851 Gate: Enforce Min-SE &gt;= 90s, Interval in [90, 1800]s &amp; &lt;=2 422 Retries</text>
  <text x="80" y="274" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">Action: enforce_rfc4028_min_se_90s_and_cap_422_retries</text>
  <text x="64" y="316" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">确定性收敛指标（P851）：</text>
  <text x="64" y="338" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedSubFloorSessionTimerOr422LoopAttempts = 0（0 低频刷新风暴与 422 死循环）</text>
  <text x="64" y="360" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12">✔ clampedNegotiatedSessionExpiresSeconds ∈ [90, 1800]（严格符合 RFC 4028 标准）</text>

  <!-- Right Column: Refresher Pinning & RTP Zombie Reaper Gate (P852) -->
  <rect x="652" y="118" width="584" height="275" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
