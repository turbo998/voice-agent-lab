  <text x="672" y="170" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：手机进电梯断网发不出 BYE，GPU S2S 空转 30 分钟白烧 $2.40/通算力</text>
  <text x="672" y="192" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 掉线风险：双端在 T/2 (900s) 同时发 re-INVITE 触发 491 Glare 导致 15 分钟准时断线</text>
