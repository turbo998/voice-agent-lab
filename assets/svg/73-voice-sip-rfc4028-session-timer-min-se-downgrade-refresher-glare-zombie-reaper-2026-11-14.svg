  <text x="414" y="57" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Enterprise SIP RFC 4028 Session-Expires [90,1800]s, Refresher Glare &amp; Half-Open RTP Zombie Reaper</text>
  <text x="44" y="88" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">企业 SIP RFC 4028 会话定时器 [90,1800]s 降级防抖、refresher 角色防碰撞与 [15,30]s 半开 RTP 僵尸通话收割门禁（🎉 870 合成探针与 680 POC 探针双里程碑）</text>
