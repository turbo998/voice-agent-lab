  <text x="166" y="420" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lid Blast, Press &amp; Kiln Flags</text>
  <text x="166" y="444" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Unbolting pressurized ball mill</text>
  <text x="166" y="464" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Dry-sweeping crystalline silica</text>
  <text x="166" y="484" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Wiping 10,000t press die live</text>
  <text x="166" y="504" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 1,220°C roller-kiln slab wreck</text>
  <text x="166" y="532" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0ms Zone Gas Cut &amp; Press Dump</text>

  <!-- Center Column: CERAMICS-KILN-BALLMILL-SILICA-01 Guardrail Engine -->
  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card276)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic Ceramics &amp; Kiln Engine (CERAMICS-KILN-BALLMILL-SILICA-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: Ball-Mill 0.00 MPa Vent-Cock Bleed &amp; Silica Wet/HEPA-Only Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% blocks unbolting rotary ball-mill manway cover until internal pressure = 0.00 MPa</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Requires brake-pin engagement &amp; prevents 90°C pressurized slip/lid blowouts</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Forbids dry sweeping or air blowdown of quartz/glaze dust (OSHA 1910.1053 &lt;25 μg/m³)</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents fatal ball-mill hatch ejections and irreversible crystalline silicosis</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: 1,220°C Kiln 4-Volume Purge &amp; 10,000-Ton Hydraulic Press Block Gate</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Locks kiln burner ignition below 760°C until 4-furnace-volume air purge completes</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Requires physical mechanical ram safety block + trapped-key LOTO before wiping press die</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Verifies FDA CPG 7117.06 /07 Lead &amp; Cadmium leach limits on foodware glazes</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Eliminates kiln relight gas explosions and 10,000-ton hydraulic punch-die crushes</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Roller-Kiln Wreck Gas Cutoff, Spray-Dryer Quench &amp; Press Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Cuts kiln zone gas valves &amp; halts upstream roller drive in 0ms on slab pile-up / broken roller</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trips spray-dryer hot-air generator &amp; activates water deluge on baghouse over-temp</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Dumps hydraulic press accumulator pressure in 0ms on light-curtain breach or CO alarm</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full NFPA 86 Kilns, OSHA 1910.1053 Silica, EN 15935 Ceramic Machines &amp; ISO 10545 WORM</text>

  <!-- Right Column: SACMI HERE, Kiln PLC & Silica Monitor -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card276)" stroke="#22c55e" stroke-width="1.5"/>
