  <rect width="1200" height="680" fill="url(#bg276)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Ceramics, Porcelain Slab &amp; Sanitaryware Roller Kiln, Ball-Mill &amp; Silica Voice Copilot</text>
  <text x="600" y="66" fill="#fdba74" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Ball-Mill 0.00 MPa Bleed &amp; OSHA 1910.1053 Silica Wet-Clean Lock · 1,220°C Roller-Kiln 4-Volume Purge &amp; 10,000t Press Block · 0ms Kiln-Wreck Gas Cut (CERAMICS-KILN-BALLMILL-SILICA-01)</text>

  <!-- Left Column: Ball Mill / Spray Dryer, 10,000t Press & Roller Kiln -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card276)" stroke="#f97316" stroke-width="1.5"/>
  <text x="166" y="122" fill="#fdba74" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Mill, Press &amp; 1,220°C Kiln</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#fb923c"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">40-Ton Ball Mill &amp; Spray Dryer</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0.00 MPa vent-cock bleed check</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• OSHA 1910.1053 silica wet-only</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Spray-dryer powder moisture</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SACMI 10,000t Press &amp; Kiln</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Mechanical die safety-block pin</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• NFPA 86 4-volume air purge</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• FDA/Prop 65 Pb/Cd glaze check</text>

