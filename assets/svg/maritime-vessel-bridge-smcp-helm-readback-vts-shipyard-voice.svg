<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgMar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="50%" stop-color="#0D223C"/>
      <stop offset="100%" stop-color="#060F1E"/>
    </linearGradient>
    <linearGradient id="smcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="vtsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="dockGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgMar)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Maritime Vessel Bridge (IMO SMCP), Port VTS &amp; Shipyard Voice AI: Helm Readback &amp; Drydock Lock</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">远洋船舶驾驶台 (IMO SMCP 舵令复诵)、港口交管 (VTS) 与修造船厂语音 AI：反打满舵 0ms 报警、CPA 碰撞抢占与干船坞注水锁全景图</text>
  <rect x="844" y="42" width="308" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="998" y="64" fill="#7DD3FC" font-size="13" font-weight="600" text-anchor="middle">MARITIME-BRIDGE-VTS-01 · Marine</text>

  <!-- Pillar 1: Vessel Bridge IMO SMCP Helm & Engine Order Readback + Rudder Angle Verification -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#smcpGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 船舶驾驶台 IMO SMCP 舵令复诵与防打反舵锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严防狭水道引航时“口头复诵左舵 15、手却打成右舵 15”！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 苏伊士运河/长江口搁浅撞桥头号人为失误：外籍水手紧张下打反舵 (Wrong-Way Rudder)</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 20万吨级集装箱船一旦在航道打反满舵超过 10秒，惯性将导致不可逆撞堤搁浅</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#4C0519" stroke="#E11D48"/>
    <text x="30" y="174" fill="#FDA4AF" font-size="13" font-weight="700">引航员舵令 × 舵工复诵 × NMEA 0183 实测舵角三联比对</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 实时监听驾驶台麦克风（VDR 航行数据记录仪声轨）：校验 IMO SMCP 标准短语</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 若舵工复诵不符，或 3秒内舵角传感器 (RSA) 偏转方向与口令相反 -&gt; 0ms 声光红警！</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">大洋零地面网络“船端离线边缘盒 + 海事无线电语音日志”</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 远洋航行不依赖昂贵海事卫星流量，100% 在驾驶台工控机本地完成多国口音识别</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 自动将车钟/舵令、经纬度与 VHF 频道 16 通话转写写入电子航海日志 (e-Logbook)</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">狭水道打反舵 (Wrong-Way Rudder) 0ms 检出率 = 100%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合 IMO A.918(22) SMCP 标准海事通信短语与 SOLAS 公约</text>
  </g>

  <!-- Pillar 2: ARPA / AIS Collision CPA/TCPA 0ms Preemption & Port VTS Guidance -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#vtsGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 雷达 CPA/TCPA 碰撞 0ms 抢占与 VTS 交管</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="82" fill="#7DD3FC" font-size="13" font-weight="700">解决夜间二副/三副值班走神漏看雷达碰撞预警 (CPA/TCPA)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 浓雾或夜间航行时，雷达 ARPA 计算出目标船最近会遇距离 CPA &lt; 0.5海里且 TCPA &lt; 6分钟</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 0ms 抢占驾驶台语音播报目标船方位/航速，并给出 COLREGs 国际避碰规则建议</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">主机舱 (Engine Room 102dB) 轮机员免手持巡检与备件检索</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 轮机员戴航空级降噪骨传导耳麦巡检二冲程柴油主机与增压器</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 语音报出“3号缸排烟温度 435度偏高”-&gt; 200ms 调出高压油泵定时排查步骤与备件柜号</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">多国籍船员（中/菲/印/俄/希）重口音海事英语消歧</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 针对海事数字读法（如 "Unaone, Bissotwo, Terrathree"）专门声学建模</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 港口 VTS 甚高频 (VHF) 抛锚锚位与引航员登轮梯侧弦 (Port/Starboard) 雙核确认</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">夜间浓雾近距离会遇漏警率 = 0.0% · 航海日志省时 75%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">完美适配全球中/菲/印/东欧混派船员海事英语口音</text>
  </g>

  <!-- Pillar 3: Shipyard Drydock Flooding & Ballast Tank Enclosed-Space Lock -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#dockGrad2)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 修造船厂干船坞注水与压载舱缺氧防窒息硬锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#451A03" stroke="#D97706"/>
    <text x="30" y="82" fill="#FCD34D" font-size="13" font-weight="700">⛔ 严禁船坞底有人时开坞门注水，严禁未测氧进压载水舱！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 船厂头号群死群伤隐患：封闭生锈压载水舱因铁锈耗氧导致氧气仅 8%，进去即昏厥</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 30万吨级干船坞出坞开启注水阀前，坞底若遗留涂装/脚手架工人将被急流吞没</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">船坞 UWB 人员清零 + 压载舱四合一气体 (O2==20.9%) 硬互锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 开启干船坞注水蝶阀前：强制核验坞底 UWB 定位信标人数 == 0 + 总船坞长声纹</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 申请进入压载舱/双层底：必须蓝牙回传 O2==20.9%、CO/H2S/LEL==0 且门口监护人声纹在岗</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">船体分段双机抬吊 (Tandem Gantry Crane) 载荷均衡语音锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 800吨龙门吊双车联吊船艏总段：实时语音播报两钩偏载与水平度偏差</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 偏载 &gt;= 5% 或海风超 6级自动触发起升闭锁告警</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="178" y="356" fill="#FCD34D" font-size="13" font-weight="700" text-anchor="middle">船舱缺氧中毒窒息与船坞违章注水事故率 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合 IMO 封闭处所进入决议 A.1050(27) 与船级社 (CCS/DNV) 规范</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#EF4444" font-size="14" font-weight="700">架构师核心选型法则 (MARITIME-BRIDGE-VTS-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 远洋船舶驾驶台必须实时比对“引航员舵令 × 舵工 SMCP 复诵 × 舵角传感器 (RSA) 实际偏转方向”，一旦复诵或实际打舵方向相反必须 0ms 触发打反舵红警；</text>
  <text x="68" y="606" fill="#FCD34D" font-size="13">2. 雷达 CPA/TCPA 触发碰撞告警时必须 0ms 抢占语音通道，且修造船厂干船坞注水与压载水舱准入必须硬件联锁坞底 UWB 清零与舱内氧气浓度 (20.9%)。</text>
</svg>
