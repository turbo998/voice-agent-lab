  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Pushes resident PointClickCare allergies, blood</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">  thinners (Eliquis) &amp; POLST/DNR status to EMS</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">• Eliminates dangerous post-fall "long-lie" hours</text>

