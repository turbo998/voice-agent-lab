  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">115 WPM Slow-Cadence &amp; 1–3kHz Clarity EQ</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Boosts 1–3 kHz consonant clarity while avoiding</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  &gt;4 kHz sibilance that rings hearing aids</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• 2,200ms word-finding pause window for seniors</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Lifts 80+ senior comprehension by +44.8%</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Dementia Validation &amp; Redirection Guard</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Answers repetitive questions 50x with warm</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  first-time patience ("Never say 'I told you'")</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Sundowning exit-seeking: validates feeling &amp;</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">  redirects to family reminiscence photo album</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
