  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Frees RN/CNA staff for high-acuity bedside care</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Pill-Dispenser &amp; Double-Dose Guard</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Syncs with Hero / MedMinder smart dispenser &amp;</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  PointClickCare eMAR medication administration</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• If dementia resident asks "Did I take my 8 AM</text>
