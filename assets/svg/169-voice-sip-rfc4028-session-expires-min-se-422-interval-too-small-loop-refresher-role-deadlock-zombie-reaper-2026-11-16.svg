  <text x="52" y="64" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">STAGE 525 · TOPIC 165 · P1043–P1044 · 🎉 HISTORIC STAGE 525 &amp; TOPIC 165 DUAL MILESTONE!</text>
  <text x="52" y="96" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="23" font-weight="800">Enterprise SIP RFC 4028 Session-Expires / Min-SE 422 Loop &amp; Refresher Zombie Reaper</text>
  <text x="52" y="122" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Deterministic Min-SE &gt;= 90s Floor + [90, 1800]s Session-Expires (P1043) &amp; Explicit refresher=uac|uas + [32, 64]s Zombie Reaper (P1044)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="52" y="146" width="534" height="390" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
