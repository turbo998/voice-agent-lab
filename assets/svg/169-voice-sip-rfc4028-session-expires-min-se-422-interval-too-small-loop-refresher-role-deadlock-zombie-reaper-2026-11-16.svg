  <rect x="72" y="208" width="494" height="94" rx="10" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="88" y="232" fill="#F87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Sub-90s Storm &amp; Infinite 422 Retry Loop</text>
  <text x="88" y="254" fill="#CBD5E1" font-family="monospace" font-size="12">INVITE Session-Expires: 25 (Sub-90s signaling storm)</text>
  <text x="88" y="274" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• 14 repeated 422 retries or 12.5s re-INVITE storms crush SBC CPU</text>
  <text x="88" y="292" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• Timer B/F (32s) exceeds Session-Expires (25s), causing false drops</text>

  <rect x="72" y="316" width="494" height="94" rx="10" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="88" y="340" fill="#F87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Missing refresher= Role Deadlock &amp; Zombie Calls</text>
  <text x="88" y="362" fill="#CBD5E1" font-family="monospace" font-size="12">200 OK Session-Expires: 1800 (missing ;refresher=uac|uas)</text>
  <text x="88" y="382" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• Both sides wait for peer refresh -&gt; 30-min clockwork call drop</text>
  <text x="88" y="400" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">• Dead client leaves 8 zombie AI sessions holding GPU slots for 180s+</text>

  <rect x="72" y="424" width="494" height="94" rx="10" fill="#450A0A" stroke="#EF4444"/>
  <text x="88" y="448" fill="#FECACA" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Production Impact Without P1043 / P1044</text>
  <text x="88" y="472" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="13">• Signaling CPU exhaustion from sub-90s refresh &amp; 422 retry loops</text>
  <text x="88" y="494" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="13">• Stranded LLM/GPU voice sessions &amp; 1800s mid-sentence call drops</text>

