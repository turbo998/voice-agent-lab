  <rect x="634" y="208" width="494" height="142" rx="10" fill="#0F172A" stroke="#059669"/>
  <text x="650" y="232" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">P1043 (1,052nd Guard): Min-SE &gt;= 90s &amp; 422 Loop Breaker</text>
  <text x="650" y="254" fill="#E2E8F0" font-family="monospace" font-size="12">action: "enforce_min_se_90s_and_break_422_retry_loop"</text>
  <text x="650" y="276" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Rejects SE &lt; 90s with 422 + explicit Min-SE: 90s floor</text>
  <text x="650" y="296" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps unbounded422RetryOrSub90sTimerRequests = 0</text>
  <text x="650" y="316" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps negotiatedSessionExpiresSeconds in [90, 1800]s (25s -&gt; 90s)</text>
  <text x="650" y="336" fill="#38BDF8" font-family="monospace" font-size="11">Policy ID: P1043-SIP-RFC4028-SESSION-EXPIRES-MIN-SE-422-FLOOR-AND-LOOP-BREAKER-GUARD</text>

  <rect x="634" y="366" width="494" height="152" rx="10" fill="#0F172A" stroke="#059669"/>
  <text x="650" y="390" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">P1044 (1,053rd Guard): Explicit Refresher &amp; [32, 64]s Reaper</text>
  <text x="650" y="412" fill="#E2E8F0" font-family="monospace" font-size="12">action: "assign_explicit_refresher_and_reap_zombie_session_with_bye"</text>
  <text x="650" y="434" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Pins explicit refresher=uac|uas in 200 OK + half-interval UPDATE</text>
  <text x="650" y="454" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps ambiguousRefresherOrZombieCallsCount = 0</text>
  <text x="650" y="474" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">• Clamps zombieReaperGraceWindowSeconds in [32, 64]s (180s -&gt; 64s)</text>
  <text x="650" y="496" fill="#38BDF8" font-family="monospace" font-size="11">Policy ID: P1044-SIP-RFC4028-REFRESHER-ROLE-ASSIGNMENT-AND-HALF-INTERVAL-REAPER-GUARD</text>

