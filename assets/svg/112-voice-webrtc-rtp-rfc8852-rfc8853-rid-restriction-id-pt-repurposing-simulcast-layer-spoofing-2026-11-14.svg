  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="324" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P929 + P930 🎉 · 110th FAQ &amp; 910 Tests)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P929 · RID 协商白名单、max-br 令牌桶与 [1, 3] 层上限</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Enforce a=rid max-br Policer · SimulcastLayers ∈ [1, 3] (3)</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 数据面按每层 a=rid max-br 硬削峰，100% 保住 Opus 语音带宽</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单 m= 媒体行 Simulcast 层数钳制在 [1, 3] 层 (0 破限挤占包)</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P930 🎉 · repaired-rtp-stream-id 归属、pt= 与 [1, 16]B 锁</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Bind Active Primary RID + pt= Allowlist · Len ∈ [1, 16]B (16B)</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 强制核验 RTX repaired-rtp-stream-id 绑定同 m= 行已激活主 RID</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 严格匹配 a=rid pt= 列表并将 RID 长度钳制在 [1, 16] 字节</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 RID 破限挤占音频包 · 0 孤儿 RTX 错绑 · 3 层 / 16B 封顶</text>
