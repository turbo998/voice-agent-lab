  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">STAGE 468 · TOPIC 108 · P929–P930 🎉 · 110TH FAQ, P930 GUARDRAIL &amp; 910-TEST MILESTONE · 471 DIMS · 910 TESTS 🎉</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">WebRTC RFC 8852 / RFC 8853 RID &amp; Repaired-RTP-Stream-ID: max-br Policer &amp; RTX Binding Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 WebRTC RFC 8852/8853 联播流约束：严防 rid=l 码率破限挤死同通道 Opus 语音与孤儿 repaired-rtp-stream-id 注入 (P929–P930 🎉)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="276" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (Unpoliced RID &amp; Orphan RTX)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. rid="l" 突破 max-br 突发高码率挤死 Opus 音频</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">a=rid:l send max-br=150000 vs Actual Burst=2.5 Mbps</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 弱网订阅端切至 rid=l，但上游突发 2.5 Mbps 灌满 250k 管道！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 共通道 Opus 语音包被尾部丢包淹没 + 16 个伪造层耗尽状态表！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. 255B 孤儿 repaired-rtp-stream-id 与 PT 越权</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">RTX repaired-rtp-stream-id="orphan_255B" (Unlisted PT)</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• RTX 修复包指向不存在的主 RID，解封装 OSN 回填触发异常！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 违反 a=rid pt= 限制将错误编码载荷注入下游解码器！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：16 次 RID 破限挤占音频断音 + 9 个孤儿 RTX 修复包错绑</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">弱网切层降级失效，视频洪峰直接掐断 AI 坐席实时语音</text>

