  <text x="365" y="138" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. Deterministic Reg FD &amp; M&amp;A Engine (INVESTOR-RELATIONS-REGFD-MNPI-01)</text>

