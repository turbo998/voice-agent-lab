  <text x="385" y="362" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">  contracts or SKU pricing unless NDA + Clean-Team Agreement are executed</text>
  <text x="385" y="382" fill="#fef08a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• Prevents FTC/DOJ HSR Act gun-jumping fines ($51,744/day) between competitors</text>

  <rect x="365" y="430" width="440" height="128" rx="8" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="385" y="457" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate C: Accidental MNPI Spill 24h Form 8-K Alert &amp; PSLRA Safe Harbor</text>
  <text x="385" y="480" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Plays mandatory PSLRA Safe Harbor forward-looking disclaimer at call start</text>
  <text x="385" y="500" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Real-time co-pilot monitors live executive 1-on-1 calls: if potential</text>
  <text x="385" y="520" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  unreleased KPI is spoken, 0ms alerts Securities Counsel for 24h Form 8-K</text>

