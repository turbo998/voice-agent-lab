  <text x="385" y="208" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strictly restricts answers to already-filed SEC 10-K / 10-Q / 8-K &amp; public</text>
  <text x="385" y="228" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  earnings transcripts; 0ms blocks unannounced quarter revenue or guidance</text>
  <text x="385" y="248" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• During Quiet Period, blocks all forward-looking commentary &amp; books post-call</text>

  <rect x="365" y="292" width="440" height="122" rx="8" fill="#450a0a" stroke="#ef4444"/>
