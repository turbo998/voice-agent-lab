  <text x="600" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. Rx Refill Gate &amp; Post-Discharge RPM
  </text>

  <rect x="440" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="454" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">DEA Schedule-II &amp; Lab-Window Refill Lock</text>
  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• 100% blocks auto-refills on DEA Schedule-II</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  opioids/stimulants &amp; meds with expired renal</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  / potassium / INR lab monitoring windows</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">• Auto-orders prerequisite lab panel first!</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">ISMP Sound-Alike (LASA) Drug Readback</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Disambiguates Hydroxyzine vs Hydralazine</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  by cross-checking active Epic MedicationRequest</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  list + indication &amp; mg strength readback</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• 0% wrong-drug refill requests queued to MD</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">CHF / COPD Post-Discharge RPM (-32.4% Readmit)</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Daily morning voice check-in catches &gt;2 lb/day</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">  weight gain early for outpatient diuretic adjustment</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">• Cuts 30-day hospital readmissions by 32.4%</text>

  <!-- Column 3: Ambient Clinical Scribe (SOAP & Zero Fabrication) -->
  <rect x="800" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#059669" stroke-width="1.5"/>
  <rect x="800" y="128" width="356" height="40" rx="12" fill="url(#emerald495h)"/>
  <text x="978" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
