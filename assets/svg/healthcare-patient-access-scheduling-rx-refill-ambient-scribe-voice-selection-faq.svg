  </text>

  <rect x="818" y="184" width="320" height="114" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399">Zero Unspoken Physical-Exam Fabrication Lock</text>
  <text x="832" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Generic LLMs auto-fill normal physical exam</text>
  <text x="832" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  findings ("lungs clear, abdomen soft") even</text>
  <text x="832" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  when never verbalized (False Claims Act risk!)</text>
  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Includes ONLY findings explicitly spoken in room</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Enrolled Physician Voiceprint (1.6% DER)</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• Separates Doctor, Patient &amp; Family Member</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  voices in exam room; never records family</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  speculation as physician clinical assessment</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Reclaims 2.1 Hours/Day of Physician "Pajama Time"</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Drafts structured HPI, ROS, PE &amp; ICD-10/CPT</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">  orders into Epic NoteReader for MD sign-off</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#6ee7b7">• Saves $372,000 per 10,000 clinical encounters</text>

