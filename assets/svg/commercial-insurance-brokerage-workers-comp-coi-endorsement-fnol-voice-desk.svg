  <text x="385" y="382" fill="#fef08a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• Requires mandatory Statement of No Known Loss before mid-term bind</text>

  <rect x="365" y="430" width="440" height="128" rx="8" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="385" y="457" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate C: OSHA 8h/24h Severe Injury Reporting &amp; WC Triage Lock</text>
  <text x="385" y="480" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Workers&apos; Comp FNOL: if injury involves inpatient hospitalization, amputation,</text>
