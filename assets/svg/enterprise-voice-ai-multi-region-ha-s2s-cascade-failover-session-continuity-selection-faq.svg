<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg505" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad505" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad505" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad505" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad505" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg505)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#emeraldGrad505)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">99.99% HA · #505</text>
  <text x="194" y="44" class="title">Enterprise Multi-Region Voice HA: &lt;650ms S2S-to-Cascade Failover &amp; Zero-Drop State</text>
  <text x="194" y="65" class="subtitle">Decoupled Edge Media Anchor + Per-Turn Redis Checkpoint + 650ms Watchdog Regional Failover + 3-Tier Graceful Degradation (99.99% SLA)</text>

  <!-- Column 1: Decoupled Media Anchor & Per-Turn Checkpoint -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad505)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. Decoupled Media Anchor &amp; State Snapshot</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Media Plane vs. AI Worker Decoupling</text>
    <text x="26" y="86" class="body-text">• Caller SIP/WebRTC audio terminates on Anycast</text>
    <text x="26" y="102" class="body-text">  Edge SFU (LiveKit / ACS), NOT inside the AI pod</text>
    <text x="26" y="122" class="mono">AI Worker Crash NEVER Drops the Phone Line!</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Per-Turn Redis / Cosmos State Checkpoint</text>
    <text x="26" y="186" class="body-text">• Snapshots verified slots, auth JWT, and 3-turn</text>
    <text x="26" y="202" class="body-text">  compacted transcript after every completed turn</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">&lt;12ms State Hydration into Secondary Region Pod</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Idempotent In-Flight Tool Outbox</text>
    <text x="26" y="288" class="body-text">• If failover occurs mid-tool-call, secondary pod</text>
    <text x="26" y="304" class="body-text">  reads shared idempotency key from Redis Outbox</text>
    <text x="26" y="322" class="mono" fill="#fde68a">0.0% Duplicate Payment or Booking on Failover</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Zero "Please Repeat Who You Are" Reset</text>
    <text x="26" y="384" class="body-text">Standby worker resumes exact sentence &amp; persona</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">with full customer authentication intact</text>
  </g>

  <!-- Column 2: 650ms Watchdog & Multi-Region Active-Active Failover -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad505)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. 650ms Watchdog &amp; Cross-Region Failover</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">650ms First-Packet Watchdog (Not 30s SDK!)</text>
    <text x="26" y="86" class="body-text">• Standard HTTP 30s timeout = 100% caller hang-up</text>
    <text x="26" y="102" class="body-text">• If primary East US 2 S2S emits no token in 650ms,</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">fires parallel hedged request to West US 3 / Sweden</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Acoustic Comfort-Bridge During Failover</text>
    <text x="26" y="188" class="body-text">• At 650ms mark, Edge SFU plays pre-cached</text>
    <text x="26" y="204" class="body-text">  same-voice micro-filler ("Let me check that...")</text>
    <text x="26" y="224" class="mono">Masks Regional Re-Route Behind Natural Speech</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">Data-Residency Sovereign Failover Pair</text>
    <text x="26" y="290" class="body-text">• Enforces geopolitical compliance boundaries:</text>
    <text x="26" y="306" class="body-text">  EU calls fail over strictly within EU (Sweden ↔</text>
    <text x="26" y="324" class="mono" fill="#fde68a">Germany West Central); US stays within US</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Automated Regional Circuit Breaker</text>
    <text x="26" y="386" class="body-text">Trips regional pool for 60s when 5xx/timeout rate</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">exceeds 3% over a 10-second sliding window</text>
  </g>

  <!-- Column 3: 3-Tier Modality Degradation Ladder -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#purpleGrad505)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. 3-Tier Modality Degradation Ladder</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#c4b5fd">Tier 1 → Tier 2: S2S to Cascaded Hot-Swap</text>
    <text x="26" y="86" class="body-text">• If Native S2S (GPT-Realtime) WebSocket drops,</text>
    <text x="26" y="102" class="body-text">  hot-swaps mid-call to Cascaded Pipeline (Azure</text>
    <text x="26" y="122" class="mono" fill="#ddd6fe">STT + Multi-Cloud LLM + Same Brand Neural TTS)</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#34d399">Consistent Brand Voice Across Tiers</text>
    <text x="26" y="188" class="body-text">• Uses identical Custom Neural Voice profile across</text>
    <text x="26" y="204" class="body-text">  Tier-1 S2S and Tier-2 TTS so caller hears zero</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">jarring voice change during mid-call degradation</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Tier 2 → Tier 3: Deterministic Edge Fallback</text>
    <text x="26" y="288" class="body-text">• If all cloud LLMs fail, Edge SFU executes cached</text>
    <text x="26" y="304" class="body-text">  deterministic workflow or warm CTI queue handoff</text>
    <text x="26" y="322" class="mono">with captured Redis context card attached</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#c4b5fd">Guardrail: VOICE-HA-FAILOVER-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateVoiceAiMultiRegionHaGracefulDegradation</text>
    <text x="26" y="402" class="body-text">99.994% Call Completion · -$370k/10k Hrs Downtime</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Enterprise Multi-Region Voice AI High Availability &amp; Failover Benchmarks (per 10,000 Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Mid-Call Outage Drop Rate</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">100% → 0.06% (99.994% SLA)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Regional Failover Switch Time</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">30,000ms → 650ms Watchdog</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Context Loss on Pod Eviction</text>
    <text x="16" y="50" class="kpi-num" fill="#a78bfa">0.0% (&lt;12ms Redis Snapshot)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Outage SLA Penalty Avoided</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$370,000 / 10k Hours</text>
  </g>
</svg>
