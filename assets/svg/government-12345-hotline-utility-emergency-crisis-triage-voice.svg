<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Government 12345/311 Citizen Hotline, Utility Emergency Dispatch &amp; Crisis Triage Voice AI Architecture &amp; Selection Guide">
  <defs>
    <linearGradient id="bgGov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b16"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>
    <linearGradient id="barGov" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGov" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112240" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadowGov" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGov)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#barGov)"/>

  <!-- Header -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="560" height="28" rx="14" fill="#0c2d48" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="18" fill="#7dd3fc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">
      GOVERNMENT 12345 / 311 HOTLINE · UTILITY EMERGENCY · CRISIS TRIAGE
    </text>
    <text x="0" y="56" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="23.5" font-weight="800">
      政务 12345/311 热线与水电气公用事业应急：语音架构设计与选型指南
    </text>
    <text x="0" y="80" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">
      GOV-GAS-01 燃气泄漏 0ms 抢占禁开灯 · 140+语种/方言与无障碍口吃展宽 · P77 呼吸机用户防拉闸 · 政务云本地容器
    </text>
  </g>

  <!-- Top KPI Pills -->
  <g transform="translate(838, 22)" filter="url(#shadowGov)">
    <rect x="0" y="0" width="162" height="64" rx="10" fill="#3b0a1e" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="81" y="24" text-anchor="middle" fill="#fda4af" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">燃气/危化险情抢占</text>
    <text x="81" y="49" text-anchor="middle" fill="#fb7185" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800">0ms (禁明火指导)</text>

    <rect x="172" y="0" width="158" height="64" rx="10" fill="#0b2e27" stroke="#10b981" stroke-width="1.2"/>
    <text x="251" y="24" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">接诉即办工单分派准确率</text>
    <text x="251" y="49" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800">97.8% (48委办局)</text>
  </g>

  <!-- Row 1: 3 Core Public Sector & Utility Voice Scenarios -->
  <g transform="translate(32, 114)" filter="url(#shadowGov)">
    <!-- Scenario 1: Gas / Grid Utility Emergency -->
    <rect x="0" y="0" width="366" height="242" rx="12" fill="url(#cardGov)" stroke="#f43f5e" stroke-width="2"/>
    <rect x="14" y="14" width="212" height="22" rx="6" fill="#4c0519"/>
    <text x="24" y="29" fill="#fda4af" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">场景 A · 燃气泄漏/停电抢修应急 🏆</text>
    <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="16.5" font-weight="800">GOV-GAS-01 / GRID-STORM-01</text>
    <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">痛点：闻到煤气味还在查户号、寒潮误停呼吸机家庭电</text>
    <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="107" fill="#fb7185" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心架构设计：</text>
    <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 臭鸡蛋味/燃气报警器响：0ms 跳过核身，首句大声警告</text>
    <text x="14" y="145" fill="#fda4af" font-family="Segoe UI, sans-serif" font-size="11.2">  “千万别碰电灯开关！立即离开房间到室外再说话！”</text>
    <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 寒潮与维生设备锁 (P77)：家有呼吸机/透析机 100% 禁远程欠费拉闸</text>
    <rect x="14" y="186" width="338" height="40" rx="8" fill="#2a0815" stroke="#e11d48" stroke-width="1"/>
    <text x="22" y="210" fill="#fda4af" font-family="Consolas, monospace" font-size="11" font-weight="700">推荐底座: P46 PIDF-LO 定位 + 0ms 抢占桥</text>

    <!-- Scenario 2: 12345 / 311 Citizen Hotline -->
    <g transform="translate(385, 0)">
      <rect x="0" y="0" width="366" height="242" rx="12" fill="url(#cardGov)" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="14" y="14" width="206" height="22" rx="6" fill="#0c4a6e"/>
      <text x="24" y="29" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">场景 B · 政务 12345 / 311 接诉即办</text>
      <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="16.5" font-weight="800">方言/老年自适应 + 48委办局派单</text>
      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">痛点：老人说方言长篇倒苦水、跨部门踢皮球派错单</text>
      <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="107" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心架构设计：</text>
      <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 粤/川/闽/沪等方言识别 + 无障碍口吃自适应 (2,200ms)</text>
      <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 权责知识图谱：根据“事发地点+事项”精准派单街道/城管</text>
      <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 政策依据锁定：医保/公积金比例 100% 引用红头文件原文</text>
      <rect x="14" y="186" width="338" height="40" rx="8" fill="#091526" stroke="#0284c7" stroke-width="1"/>
      <text x="22" y="210" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11" font-weight="700">推荐底座: 政务云 Speech 容器 + 混合语义VAD</text>
    </g>

    <!-- Scenario 3: 988 Crisis & Vulnerable Caller Care -->
    <g transform="translate(770, 0)">
      <rect x="0" y="0" width="366" height="242" rx="12" fill="url(#cardGov)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="14" y="14" width="206" height="22" rx="6" fill="#064e3b"/>
      <text x="24" y="29" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">场景 C · 心理危机与弱势群体关怀</text>
      <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="16.5" font-weight="800">P26 / P101 哭泣静默锁与零幻觉转接</text>
      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">痛点：市民哭泣哽咽被当成“没人说话”挂机酿成悲剧</text>
      <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="107" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心架构设计：</text>
      <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 哭泣/抽泣声学检测 (P746)：自动将静音挂机阈值展宽 5倍</text>
      <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 严禁 AI 自由扮演心理医生乱给建议，保持温和陪伴</text>
      <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 保持主叫不断线，后台静默拉入 988/危机干预专家三方接管</text>
      <rect x="14" y="186" width="338" height="40" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1"/>
      <text x="22" y="210" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11" font-weight="700">推荐底座: P26/P101 危机守护锁 + 双腿热转接</text>
    </g>
  </g>

  <!-- Row 2: Life-Safety Preemption & Accessibility / Sovereign Deployment -->
  <g transform="translate(32, 372)" filter="url(#shadowGov)">
    <!-- Left Box: Why Gas Leak Calls Must Never Ask for Account Number First -->
    <rect x="0" y="0" width="575" height="275" rx="12" fill="url(#cardGov)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">
      🔥 燃气与公共安全第一铁律 (`GOV-GAS-01`)：为什么闻到煤气味严禁先查户号？
    </text>
    <text x="20" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">
      市民在家闻到浓烈煤气味拨打燃气热线，如果按常规客服流程“请先输入 10 位燃气户号”，多待 30 秒就可能引爆！
    </text>

    <rect x="20" y="64" width="535" height="86" rx="8" fill="#1f121b" stroke="#ef4444" stroke-width="1"/>
    <text x="32" y="84" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">
      ❌ 致命反面设计：把燃气报修当普通账单查询，让市民在泄漏厨房里翻找账单开灯看户号！
    </text>
    <text x="32" y="105" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      • 市民为看清纸质账单顺手按了一下厨房电灯开关 ➔ 电火花瞬间引燃高浓度天然气！
    </text>
    <text x="32" y="124" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11.2">
      • 任何将“身份核验/户号查询”置于“生命撤离指令”之前的语音流程图，均属严重安全事故隐患。
    </text>

    <rect x="20" y="162" width="535" height="94" rx="8" fill="#07261f" stroke="#10b981" stroke-width="1.2"/>
    <text x="32" y="182" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">
      ✅ 架构师标准解法 (`GOV-GAS-01` + `P46 PIDF-LO`)：0ms 零鉴权抢占 + 撤离指令 + 基站定位
    </text>
    <text x="32" y="203" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      • 流式 ASR 首秒捕获“煤气味/漏气/报警器响/头晕” ➔ `0ms` 熔断一切常规菜单，以最清晰语速播报保命三句话：
    </text>
    <text x="32" y="222" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11.2">
        “第一千万不要开关任何电灯电器！第二不要点明火！第三请立即拿着手机走到室外安全地带再跟我说话！”
    </text>
    <text x="32" y="242" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">
      💡 后台同步提取运营商基站/手机 `PIDF-LO` 经纬度坐标，0秒直通燃气抢修调度台与属地 119！
    </text>

    <!-- Right Box: EAA/ADA Accessibility & Government Cloud Sovereignty -->
    <g transform="translate(595, 0)">
      <rect x="0" y="0" width="541" height="275" rx="12" fill="url(#cardGov)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="30" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15.5" font-weight="800">
        ♿ 无障碍包容性 (`EAA / ADA P14`) 与政务云本地容器架构
      </text>
      <text x="20" y="50" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">
        公共服务热线必须服务好老年人、言语障碍（口吃/脑卒中后构音障碍）与听障市民：
      </text>

      <rect x="20" y="64" width="501" height="112" rx="8" fill="#091526" stroke="#38bdf8" stroke-width="1"/>
      <text x="32" y="85" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">
        三大公共服务无障碍与合规护栏 (Public Service Inclusivity)：
      </text>
      <text x="32" y="106" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
        1. **口吃与构音障碍自适应 (`P14/P755`)**：检测到音节重复或声门阻塞，自动将 VAD 等待窗从 `600ms` 展宽至 `2,200ms`，严禁因市民说话慢而连续报错挂机！
      </text>
      <text x="32" y="144" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
        2. **实时文本电话回退 (`RFC 4103 RTT`)**：听障/重度言语障碍市民可随时无缝切换为手机实时字幕打字与语音双向互转。
      </text>
      <text x="32" y="164" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">
        3. **政务云完全离线容器 (`P53`)**：支持部署在政务外网/专网机房，市民录音与诉求工单 100% 本地闭环！
      </text>

      <rect x="20" y="186" width="501" height="72" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="207" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
        💰 特大城市 12345 热线（日均 8 万通呼入 + 寒潮停电洪峰）TCO 与效能：
      </text>
      <text x="32" y="227" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">
        • 常规政策咨询（公积金/医保/落户/停水通知）首线自动解答率达 `74%`；
      </text>
      <text x="32" y="245" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">
        • 复杂投诉 3秒自动提取【事发地+诉求+紧急度】精准派发 48 个委办局，退单重派率下降 82%！
      </text>
    </g>
  </g>
</svg>
