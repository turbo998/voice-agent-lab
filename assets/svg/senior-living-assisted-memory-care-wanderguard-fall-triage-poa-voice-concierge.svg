  <text x="75" y="540" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="12">100% HIPAA &amp; Elder-Safety Lock</text>

  <!-- Middle Column: Deterministic Senior Care Guardrails -->
  <rect x="340" y="105" width="490" height="475" rx="12" fill="url(#card)" stroke="#10b981" stroke-width="2"/>
  <text x="365" y="138" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. Deterministic Fall, Elopement &amp; POA Engine (SENIOR-LIVING-MEMORY-CARE-FALL-01)</text>

  <rect x="365" y="158" width="440" height="118" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="385" y="185" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate A: Unwitnessed Fall / Head Impact / Anticoagulant Zero-Lift Lock</text>
  <text x="385" y="208" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• If fall is unwitnessed, involves head impact/hip pain, OR resident is on</text>
  <text x="385" y="228" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  blood thinners (Eliquis/Xarelto/Warfarin) without DNR/Comfort-Only override:</text>
  <text x="385" y="248" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 0ms blocks caregiver lifting resident off floor; requires RN + EMS 911</text>

  <rect x="365" y="292" width="440" height="122" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="385" y="319" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate B: Healthcare Power of Attorney (POA) &amp; Family Dispute Shield</text>
  <text x="385" y="342" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks disclosing clinical chart updates, medication changes, or DNR/POLST</text>
  <text x="385" y="362" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">  status to non-authorized relatives unless listed on verified Healthcare POA</text>
  <text x="385" y="382" fill="#fef08a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• Protects communities during estranged sibling inheritance/care disputes</text>

  <rect x="365" y="430" width="440" height="128" rx="8" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="385" y="457" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate C: Memory Care WanderGuard Elopement 0ms Perimeter Lock</text>
  <text x="385" y="480" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• When a dementia resident triggers an exit-door WanderGuard ankle/wrist</text>
  <text x="385" y="500" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">  tag or requests a gate code over intercom: 0ms locks magnetic perimeter</text>
  <text x="385" y="520" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  doors, alerts Care Team radios, and plays calm validation voice therapy</text>

