  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Dials Primary + Secondary Responsible Party</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  numbers in parallel within 3 seconds of trigger</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Texts 10-second alarm clip link for 1-tap</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  "Dog / Cleaner False Alarm" vs "Send Police"</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TMA AVS-01 Alarm Validation Scoring (0–4)</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Level 0: No call/data • Level 1: Call attempt</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Level 2: Multi-zone/glass-break + video motion</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Level 3/4: Confirmed human intruder / life threat</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">• Transmits via TMA ASAP-to-PSAP to 911 CAD in 2s</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
