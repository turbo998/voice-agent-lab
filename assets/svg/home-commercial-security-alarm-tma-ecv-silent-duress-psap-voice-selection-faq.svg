  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Avoids $150–$500 municipal false-alarm fines</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Satisfies Verified-Response city ordinances</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#7dd3fc">• Saves $246,000 per 10,000 alarm activations</text>

