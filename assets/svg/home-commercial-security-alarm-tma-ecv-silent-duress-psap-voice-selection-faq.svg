  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">Stealth "Fake Cancel + Silent Police" Mode</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Homeowner held at gunpoint speaks Duress</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  Passcode (e.g., "Redwood" vs normal "Oakwood")</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• AI replies calmly: "Thank you, alarm cancelled,</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">  have a good evening" while 0ms dispatching Police!</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Zero Tip-Off to Armed Intruder</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Never asks "Are you under duress?" or emits</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  alarm tones on panel speaker after duress word</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Keeps silent 1-way listen-in audio channel open</text>
