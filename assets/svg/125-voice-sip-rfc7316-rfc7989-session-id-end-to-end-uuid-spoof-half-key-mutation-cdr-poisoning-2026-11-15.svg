  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">STAGE 481 · TOPIC 121 · P955–P956 🎉 · HISTORIC 125TH SVG &amp; 965-GUARDRAIL MILESTONE · 484 DIMS · 923 TESTS</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">SIP RFC 7989 / RFC 7316 Session-ID: 32-Hex Ingress Rewrite &amp; Half-Key Preservation</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业与运营商 SIP RFC 7989 端到端 Session-ID：防外网伪造 local-uuid 污染双录与 B2BUA 转人工丢失半键断链 (P955–P956 🎉)</text>

