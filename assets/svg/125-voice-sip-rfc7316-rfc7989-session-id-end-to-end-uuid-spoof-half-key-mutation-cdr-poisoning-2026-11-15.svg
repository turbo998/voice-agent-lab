  <rect x="636" y="172" width="350" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P955 + P956 🎉 · 125th SVG &amp; 965 Guards)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P955 · RFC 7989 外网入口重签与精确 32-Hex 格式锁</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Ingress CSPRNG Rewrite + ^[0-9a-f]{32}$ (Exact 32 Chars)</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 非授信入口 100% 重签 CSPRNG local-uuid，杜绝外部碰撞嫁接</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 严格锁定无连字符 32 位小写十六进制格式并拒绝全 0 local-uuid</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P956 🎉 · RFC 7989 B2BUA 留存端半键守恒与 [1, 2] 半键锁</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">{U_caller, U_ai} -&gt; {U_caller, U_human} · Halves ∈ [1, 2]</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 转人工/并会时 100% 保留留存端半键 U_caller，仅原子替换对端半键</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 锁定有效非零半键数在 [1, 2] 个，确保 AI 与人工双录 100% 贯通</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 双录污染记录 · 0 转接断链腿 · 32-Hex / [1, 2] 半键守恒</text>
