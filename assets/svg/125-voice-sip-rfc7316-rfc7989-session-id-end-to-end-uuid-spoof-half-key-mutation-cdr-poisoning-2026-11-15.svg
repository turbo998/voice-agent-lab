  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (External UUID Spoof &amp; Audit Break)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 外网伪造 Session-ID 污染 SIPREC 双录与话单</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">Session-ID: victim-uuid-with-hyphens (36 chars / Nil)</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 信任公网传入 local-uuid，攻击者可将恶意录音混入 VIP 合规档案！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 带连字符 36 字符或全 0 Nil local-uuid 导致解析器与索引库报错！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. B2BUA 转人工时覆盖双半键导致审计断链</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">{U_caller, U_ai} --(Transfer)--&gt; {U_new1, U_new2} (Broken!)</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• AI 转接人工坐席时 B2BUA 重置整个 Session-ID，丢失 U_caller！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 监管抽查时无法关联前半段 AI 风险揭示与后半段人工成单录音！</text>

