  <rect width="1280" height="760" fill="url(#bgGrad426)"/>
  <rect x="28" y="22" width="1224" height="74" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="22" width="8" height="74" rx="4" fill="url(#accentGrad426)"/>
  <text x="52" y="52" class="title">Enterprise Voice AI FinOps: PTU vs. PAYGO Break-Even, 3-Turn Audio Compaction &amp; SLM Tiered Routing</text>
  <text x="52" y="76" class="subtitle">O(N) 3-Turn Audio-to-Text Pruning (-61.5% S2S Token Burn) · 70% PTU Base + 30% PAYGO Spillover · 72% SLM Turn Offload (-64.2% TCO)</text>
  <rect x="984" y="38" width="248" height="32" rx="16" fill="#10B981"/>
  <text x="1002" y="59" class="badge">VOICE-FINOPS-PTU-TCO-2026-01</text>

  <!-- Left Column: The 3 Hidden Voice Cost Multipliers -->
  <rect x="28" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="144" class="card-title">1. The 3 Voice AI Cost Traps &amp; FinOps Levers</text>
  <text x="48" y="164" class="card-sub">Azure OpenAI PTU · Prompt Caching · SLM Router · VAD Silence</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">Trap 1: Quadratic O(N²) Multi-Turn Audio Bloat</text>
  <text x="64" y="224" class="body">• Unpruned S2S resends all prior audio turns on Turn 12</text>
  <text x="64" y="242" class="body">• Drives cost from $0.06/m (Turn 1) to $0.42/m (Turn 12)</text>
  <text x="64" y="260" class="mono">Fix = 3_Turn_Sliding_Audio_To_Text_Compaction</text>

  <rect x="48" y="298" width="340" height="108" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="64" y="320" class="card-title">Lever 2: 90% Prompt-Prefix &amp; Semantic Audio Cache</text>
  <text x="64" y="340" class="body">• Freeze static system prompt + tools at prefix position 0</text>
  <text x="64" y="358" class="body">• Cache top 200 FAQ spoken responses in Redis (0 TTS cost)</text>
  <text x="64" y="376" class="mono">Cached_Input_Token_Discount = -75% to -90% Off</text>

  <rect x="48" y="420" width="340" height="108" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="442" class="card-title">Lever 3: PTU Base-Load + PAYGO Burst Spillover</text>
  <text x="64" y="462" class="body">• Size PTU for P65 daytime steady load (&gt;68% utilization)</text>
  <text x="64" y="480" class="body">• Overflow 2-hour morning peaks to PAYGO on HTTP 429</text>
  <text x="64" y="498" class="mono">PTU_Break_Even_Threshold = 62% Sustained Utilization</text>

  <rect x="48" y="542" width="340" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="64" y="564" class="card-title">Lever 4: 72% SLM Turn Routing (`gpt-4.1-mini`)</text>
  <text x="64" y="584" class="body">• Use SLM for greeting, date/address capture &amp; WISMO</text>
  <text x="64" y="602" class="body">• Escalate to frontier model only on complex multi-tool</text>
  <text x="64" y="620" class="mono">Blended_LLM_Turn_Cost = $0.004/min (vs $0.028 Frontier)</text>

  <!-- Center Column: 3-Layer Deterministic Voice FinOps Guardrail -->
  <rect x="436" y="114" width="408" height="536" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <text x="456" y="144" class="card-title">2. Deterministic Compaction, Spillover &amp; Budget Gate</text>
  <text x="456" y="164" class="card-sub">-64.2% All-In $/Min · Zero 429 Drops · 0ms Zombie-Call Cut</text>

  <rect x="456" y="182" width="368" height="136" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="472" y="204" class="card-title">Gate A: 3-Turn Audio Pruning &amp; Prefix-Cache Lock</text>
  <text x="472" y="224" class="body">• Replaces raw audio buffers older than Turn N-3 with</text>
  <text x="472" y="242" class="body">  compact text transcripts (`15x` fewer tokens)</text>
  <text x="472" y="260" class="body">• Prohibits dynamic timestamps inside system-prompt head</text>
  <text x="472" y="280" class="mono">Long_Call_15Min_Token_Inflation = 0.0% (Linear O(1)/Turn)</text>
  <text x="472" y="298" class="mono">Prompt_Prefix_Cache_Hit_Ratio = 94.6%</text>

  <rect x="456" y="332" width="368" height="136" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="472" y="354" class="card-title">Gate B: Tiered SLM Router &amp; PTU/PAYGO Spillover</text>
  <text x="472" y="374" class="body">• Routes routine turns to SLM (`$0.003/min`) &amp; monitors</text>
  <text x="472" y="392" class="body">  PTU token bucket saturation at `&gt;= 92%`</text>
  <text x="472" y="410" class="body">• Seamlessly spills excess calls to regional PAYGO</text>
  <text x="472" y="430" class="mono">All_In_Enterprise_Voice_Cost = $0.039 / Minute</text>
  <text x="472" y="448" class="mono">Peak_Hour_HTTP_429_Call_Drops = 0.0%</text>

  <rect x="456" y="482" width="368" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="472" y="504" class="card-title">Gate C: 0ms Zombie-Call / Bot-Loop Circuit Breaker</text>
  <text x="472" y="524" class="body">• Detects unhung pocket-dials (&gt;18s dead silence),</text>
  <text x="472" y="542" class="body">  voicemail radio music, or bot-talking-to-bot loops</text>
  <text x="472" y="560" class="body">  burning $20+ on a single stuck line</text>
  <text x="472" y="578" class="body">• Terminates zombie stream or bridges agent in 0ms</text>
  <text x="472" y="600" class="mono">if (zombieSilenceBotLoopOrBudgetCapBreach) -&gt; 0ms Cut</text>
  <text x="472" y="618" class="mono">P99_Gate_Latency = 9ms | Runaway_Call_Burn = $0.00</text>

  <!-- Right Column: $/Min Unit Economics Breakdown -->
  <rect x="872" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="892" y="144" class="card-title">3. Unit Economics ($/Min) &amp; 10M-Min ROI</text>
  <text x="892" y="164" class="card-sub">10,000,000 Minutes/Month Enterprise Production Model</text>

  <rect x="892" y="182" width="340" height="126" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="908" y="204" class="card-title">Optimized $0.039 / Minute All-In Stack Breakdown</text>
  <text x="908" y="224" class="body">• BYOC SIP Trunk + Media Relay: $0.005 / min</text>
  <text x="908" y="242" class="body">• Streaming STT + Tiered TTS (with cache): $0.016 / min</text>
  <text x="908" y="260" class="body">• Blended SLM/Frontier + PTU + 3-Turn Prune: $0.018 / min</text>
  <text x="908" y="282" class="mono">Optimized_All_In_TCO = $0.039 / Min ($390k / 10M Min)</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="908" y="346" class="card-title">Why Unoptimized Voice AI Costs $0.145 / Minute</text>
  <text x="908" y="366" class="body">• Unpruned S2S audio history + 0% prompt caching +</text>
  <text x="908" y="384" class="body">  commercial wrapper markup ($0.05/m) + zombie calls</text>
  <text x="908" y="402" class="body">• Burns $1,450,000 / 10M minutes (+3.7x overpayment!)</text>
  <text x="908" y="424" class="mono">Annual_Enterprise_FinOps_Savings = -$12.72M / Year</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="908" y="498" class="card-title">Benchmark &amp; TCO Summary (10M Minutes/Mo)</text>
  <text x="908" y="520" class="body">• Unpruned S2S + Wrapper SaaS: $1,450,000 / 10M min</text>
  <text x="908" y="538" class="body">• Naive Frontier Cascade (PAYGO): $1,090,000 / 10M min</text>
  <text x="908" y="556" class="body">• FinOps Guarded PTU + SLM + Prune: $390,000 (Rec)</text>
  <text x="908" y="578" class="mono">Net_TCO_Reduction_vs_Naive_Stack = -64.2% Savings</text>
  <text x="908" y="596" class="mono">PTU_Utilization = 84% | Zombie_Call_Waste = $0</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateEnterpriseVoiceFinopsPtuTcoGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="696" class="card-title">Cloud &amp; AI Solution Architect Takeaway — Enterprise Voice AI FinOps &amp; PTU Sizing</text>
  <text x="52" y="718" class="body">Prune audio history beyond 3 turns into text, freeze prompt prefixes for 90% cache hits, size PTU to P65 load, and cut zombie calls at 18s.</text>
</svg>
