  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Enforces EPA FIFRA site-of-application &amp; Restricted-Use Pesticide (RUP) license match</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Blocks spraying outdoor pyrethroids/organophosphates inside food-prep or NICU zones</text>

