  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  galley/cabin appliances &amp; run bilge blower</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  for 4 minutes + sniff-check before cranking</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Prevents fuel-dock vapor explosions</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
