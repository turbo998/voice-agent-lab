<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg500" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad500" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad500" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad500" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad500" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg500)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#purpleGrad500)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">EVALOPS · #500</text>
  <text x="194" y="44" class="title">Enterprise Voice AI EvalOps: 500-Call CI/CD Simulator, 7-Hop OTel &amp; 100% Post-Call QA</text>
  <text x="194" y="65" class="subtitle">500 Acoustic Persona Calls in &lt;4m CI Gate + 7-Hop W3C TTFA Trace + 100% Automated Post-Call Rubric &amp; Golden Dataset Flywheel (-$310k/10k Hrs)</text>

  <!-- Column 1: Pre-Release 500-Call Acoustic CI/CD Simulator -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad500)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. Pre-Release 500-Call CI/CD Voice Gate</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">12-Persona Acoustic Stress Simulator</text>
    <text x="26" y="86" class="body-text">• Text unit tests miss barge-in &amp; noise regressions!</text>
    <text x="26" y="102" class="body-text">• Runs 500 parallel WebRTC audio calls in &lt;4 mins</text>
    <text x="26" y="122" class="mono">65dB Cafe Noise · Elderly Pause · Fast Barge-In</text>

    <rect x="14" y="148" width="340" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">Deterministic Tool &amp; State Assertions</text>
    <text x="26" y="186" class="body-text">• Verifies exact tool call DAG sequence, argument</text>
    <text x="26" y="202" class="body-text">  schema types, and zero double-mutation on barge-in</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Blocks Prompt / Model PR if Pass Rate &lt; 99.0%</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Audio-Native Paralinguistic &amp; Prosody Gate</text>
    <text x="26" y="288" class="body-text">• Evaluates spoken pacing, numeric/date formatting,</text>
    <text x="26" y="304" class="body-text">  and zero markdown/JSON symbol read-outs</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Catches 96.8% of Pre-Production Regressions</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Coval / Roark / LiveKit Pytest Harness</text>
    <text x="26" y="384" class="body-text">Automated GitHub Actions gate on every prompt,</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">RAG index, or model checkpoint upgrade</text>
  </g>

  <!-- Column 2: 7-Hop W3C OpenTelemetry Real-Time Voice Observability -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad500)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. 7-Hop W3C OpenTelemetry Voice Tracing</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">Per-Turn 7-Hop TTFA Latency Breakdown</text>
    <text x="26" y="86" class="body-text">• Tracks W3C traceparent across every audio hop:</text>
    <text x="26" y="102" class="body-text">  1.VAD EoU → 2.ASR → 3.RAG → 4.LLM TTFT →</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">5.Tool API → 6.TTS First Byte → 7.WebRTC Jitter</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Real-Time Acoustic &amp; Conversational Signals</text>
    <text x="26" y="188" class="body-text">• Measures User-Bot Overlap Ratio, Barge-In Cancel</text>
    <text x="26" y="204" class="body-text">  Latency (&lt;150ms), and Dead-Air Silence Gaps (&gt;1.2s)</text>
    <text x="26" y="224" class="mono">Pinpoints Exact Bottleneck in &lt;10 Seconds</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">Caller Frustration &amp; Loop Detection</text>
    <text x="26" y="290" class="body-text">• Detects repeated caller self-correction ("No, I</text>
    <text x="26" y="306" class="body-text">  said B as in Boy!") and rising pitch/loudness</text>
    <text x="26" y="324" class="mono" fill="#fde68a">Auto-Triggers Warm Human Handoff on 2nd Loop</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Azure Monitor / Grafana / Langfuse Sink</text>
    <text x="26" y="386" class="body-text">Correlates MOS audio quality with token &amp; tool</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">spans in a single unified flamegraph</text>
  </g>

  <!-- Column 3: 100% Automated Post-Call QA & Golden Flywheel -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#purpleGrad500)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. 100% Post-Call QA &amp; Golden Flywheel</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#c4b5fd">100% Automated Post-Call Rubric ($0.004/call)</text>
    <text x="26" y="86" class="body-text">• Replaces 1.5% manual QA sampling with 100%</text>
    <text x="26" y="102" class="body-text">  off-peak batch scoring (GPT-4o-mini / Phi-4)</text>
    <text x="26" y="122" class="mono" fill="#ddd6fe">Scores Resolution, Groundedness &amp; Script Compliance</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#34d399">Hallucination &amp; Groundedness Verifier</text>
    <text x="26" y="188" class="body-text">• Diffs every spoken policy/number against the exact</text>
    <text x="26" y="204" class="body-text">  RAG card &amp; CRM tool JSON returned during the call</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">Flags Any Un-Grounded Promise Within 60 Seconds</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Auto-Curated Golden Regression Flywheel</text>
    <text x="26" y="288" class="body-text">• PII-redacts failed/transferred production turns</text>
    <text x="26" y="304" class="body-text">  and converts them into new CI/CD test cases</text>
    <text x="26" y="322" class="mono">Every Production Edge Case Becomes a Permanent Gate</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#c4b5fd">Guardrail: VOICE-AI-EVALOPS-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateVoiceAiEvalopsAutomatedRegressionGuard</text>
    <text x="26" y="402" class="body-text">96.8% Regression Catch · -$310k/10k Hrs QA Cost</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Enterprise Voice AI EvalOps, 7-Hop Observability &amp; 100% Post-Call QA Benchmarks (per 10,000 Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Pre-Release Regression Catch</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">18% → 96.8% (500-Call CI)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Post-Call QA Coverage</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">1.5% → 100% ($0.004/call)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Latency Root-Cause MTTR</text>
    <text x="16" y="50" class="kpi-num" fill="#fbbf24">4.5 hrs → &lt;10 sec (7-Hop OTel)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Net QA &amp; Incident Savings</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$310,000 / 10k Hours</text>
  </g>
</svg>
