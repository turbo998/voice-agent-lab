  <text x="454" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Queries Trapeze PASS / Via / Spare AVL GPS</text>
  <text x="454" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Post-dialysis / chemo "Will-Call" activation</text>
  <text x="454" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  dispatches nearest accessible van in &lt;25 min</text>
  <text x="454" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Deflects 84.6% of ETA &amp; booking calls</text>

  <rect x="440" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="454" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Subway ADA Elevator Outage Step-Free Reroute</text>
  <text x="454" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Checks live station SCADA elevator telemetry</text>
  <text x="454" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• If destination elevator is out of service,</text>
  <text x="454" y="386" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  routes wheelchair rider to adjacent step-free</text>
  <text x="454" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#38bdf8">  station + low-floor accessible shuttle bus</text>

  <rect x="440" y="432" width="320" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="454" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">No-Show Dispute Door-GPS &amp; 5-Min Dwell Audit</text>
  <text x="454" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#e0f2fe">• Protects riders from unfair ADA suspension if</text>
  <text x="454" y="493" font-family="Segoe UI, Inter, sans-serif" fill="#e0f2fe">  driver waited at wrong entrance or &lt;5 minutes</text>
  <text x="454" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#7dd3fc">• Automatically waives agency-error No-Shows</text>

