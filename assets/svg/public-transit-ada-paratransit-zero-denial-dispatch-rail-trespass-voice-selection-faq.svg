  <text x="222" y="153" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. FTA 49 CFR § 37.131 ADA Zero-Denial Lock
  </text>

  <rect x="62" y="184" width="320" height="108" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="76" y="206" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fb7185">Zero Next-Day Capacity Denial &amp; ±60m Window</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Hard-blocks rejecting eligible ADA riders due</text>
  <text x="76" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  to van shortage; negotiates within ±60 min of</text>
  <text x="76" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  requested time or overflows to WAV TNC fleet</text>
  <text x="76" y="281" font-family="Segoe UI, Inter, sans-serif" fill="#fb7185">• Zero FTA Triennial Review capacity findings</text>

  <rect x="62" y="306" width="320" height="112" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="328" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">PCA, Service Animal &amp; Bariatric Lift Fit</text>
  <text x="76" y="348" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Personal Care Attendant (PCA) rides $0.00</text>
  <text x="76" y="367" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  free by law; service dog space auto-reserved</text>
  <text x="76" y="386" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• Matches extra-wide power scooter to 1,000-lb</text>
  <text x="76" y="405" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  BraunAbility lift + 4-point Q'Straint bay</text>

  <rect x="62" y="432" width="320" height="100" rx="8" fill="#4c0519" stroke="#f43f5e"/>
  <text x="76" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fda4af">Zero Trip-Purpose Screening (49 CFR § 37.131(d))</text>
  <text x="76" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">• Never prioritizes or denies ADA trips based</text>
  <text x="76" y="493" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#ffe4e6">  on whether rider is going to work vs social</text>
  <text x="76" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#fda4af">• 100% Federal Transit Administration compliant</text>

