  </text>

  <!-- Column 1: FTA 49 CFR § 37.131 ADA Paratransit Zero-Denial Gate -->
  <rect x="44" y="128" width="356" height="420" rx="12" fill="#111827" stroke="#e11d48" stroke-width="1.5"/>
