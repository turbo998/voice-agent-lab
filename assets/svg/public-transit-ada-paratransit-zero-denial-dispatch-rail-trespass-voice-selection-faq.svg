  <text x="832" y="226" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Person/wheelchair on subway tracks or vehicle</text>
  <text x="832" y="245" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">  stalled on commuter rail grade crossing (ENS)</text>
  <text x="832" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">• 0ms alerts Rail Operations Control (OCC) to</text>
  <text x="832" y="283" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">  halt trains &amp; cut 750V DC third-rail power</text>

  <rect x="818" y="312" width="320" height="106" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="832" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">0ms Stranded ADA / Post-Dialysis Rescue</text>
  <text x="832" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Vulnerable rider stranded &gt;30m in extreme</text>
  <text x="832" y="373" font-family="Segoe UI, Inter, sans-serif" fill="#cbd5e1">  cold/heat or after last bus of the night</text>
  <text x="832" y="392" font-family="Segoe UI, Inter, sans-serif" fill="#34d399">• Preempts queue &amp; dispatches supervisor WAV</text>

  <rect x="818" y="432" width="320" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="832" y="454" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Forgotten Insulin / Guide-Dog Gear Bus Hold</text>
  <text x="832" y="474" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#d1fae5">• Rider left life-critical medication or assistive</text>
  <text x="832" y="493" font-family="Segoe UI, Inter, sans-serif" fill="#d1fae5">  device on active bus: pings Clever Devices</text>
  <text x="832" y="512" font-family="Segoe UI, Inter, sans-serif" fill="#6ee7b7">  MDT to operator before terminal layover</text>

