<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bgGrad407" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="accentGrad407" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <style>
      .title { font: 700 22px "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 500 13px "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .card-title { font: 700 14px "Segoe UI", Roboto, sans-serif; fill: #E2E8F0; }
      .card-sub { font: 600 11.5px "Segoe UI", Roboto, sans-serif; fill: #34D399; }
      .body { font: 400 11.5px "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
      .mono { font: 600 11px "Cascadia Code", Consolas, monospace; fill: #FCD34D; }
      .badge { font: 700 11px "Segoe UI", Roboto, sans-serif; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bgGrad407)"/>
  <rect x="28" y="22" width="1224" height="74" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="22" width="8" height="74" rx="4" fill="url(#accentGrad407)"/>
  <text x="52" y="52" class="title">Healthcare Outpatient Triage, Chronic-Care RPM &amp; Epic FHIR Rx Refill Voice Architecture</text>
  <text x="52" y="76" class="subtitle">HIPAA 2FA &amp; DEA Schedule-II / Lab-Window Refill Lock · Schmitt-Thompson Triage &amp; FHIR Slot Gate · 0ms Chest-Pain / CHF RN Bridge</text>
  <rect x="984" y="38" width="248" height="32" rx="16" fill="#10B981"/>
  <text x="1002" y="59" class="badge">HEALTHCARE-OUTPATIENT-RX-FHIR-01</text>

  <!-- Left Column: Patient Access Line, RPM IoT & Epic FHIR Bus -->
  <rect x="28" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="144" class="card-title">1. Patient Access, RPM &amp; HL7 FHIR R4 Bus</text>
  <text x="48" y="164" class="card-sub">Epic Cadence / Ambulatory · Oracle Health · Surescripts</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">Multilingual Patient Access &amp; RPM Voice</text>
  <text x="64" y="224" class="body">• Inbound outpatient scheduling &amp; Rx refill hotline</text>
  <text x="64" y="242" class="body">• Outbound post-discharge 48h &amp; CHF/COPD RPM check</text>
  <text x="64" y="260" class="mono">Medical_Drug_Name_WER = 0.6% (RxNorm Boosted)</text>

  <rect x="48" y="298" width="340" height="108" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="64" y="320" class="card-title">Epic / Cerner HL7 FHIR R4 Clinical APIs</text>
  <text x="64" y="340" class="body">• `Patient`, `Appointment.$find`, `MedicationRequest`</text>
  <text x="64" y="358" class="body">• `Observation` (recent BMP/INR labs &amp; RPM BP/Weight)</text>
  <text x="64" y="376" class="mono">Lab_Check = "Potassium_bmp_within_180d == Verified"</text>

  <rect x="48" y="420" width="340" height="108" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="64" y="442" class="card-title">Schmitt-Thompson Clinical Triage Decision Tree</text>
  <text x="64" y="462" class="body">• Gold-standard telephone triage protocols (Adult/Peds)</text>
  <text x="64" y="480" class="body">• Maps acuity to ED Now vs 24h Urgent vs Routine Clinic</text>
  <text x="64" y="498" class="mono">Protocol_Engine = Deterministic_Clinical_Pathway</text>

  <rect x="48" y="542" width="340" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="64" y="564" class="card-title">CMS CPT 99457 / 99458 RPM Billing Logger</text>
  <text x="64" y="584" class="body">• Cellular blood-pressure cuff, glucometer &amp; weight scale</text>
  <text x="64" y="602" class="body">• Tracks interactive communication minutes for CMS claim</text>
  <text x="64" y="620" class="mono">RPM_Adherence_Rate = 89.4% (+34% vs App-Only)</text>

  <!-- Center Column: 3-Layer Deterministic Clinical & FHIR Gate -->
  <rect x="436" y="114" width="408" height="536" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <text x="456" y="144" class="card-title">2. Deterministic HIPAA, Rx &amp; Triage Gate</text>
  <text x="456" y="164" class="card-sub">Zero Unverified PHI · DEA Schedule-II Lock · 0ms Red-Flag</text>

  <rect x="456" y="182" width="368" height="136" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="472" y="204" class="card-title">Gate A: HIPAA 2FA &amp; Rx Refill Protocol Hard Lock</text>
  <text x="472" y="224" class="body">• Blocks any PHI readout before DOB + ZIP/OTP match</text>
  <text x="472" y="242" class="body">• Blocks autonomous refills on DEA Schedule II drugs</text>
  <text x="472" y="260" class="body">  or maintenance meds with overdue prerequisite labs</text>
  <text x="472" y="280" class="mono">Unverified_PHI_Or_ScheduleII_AutoRefill = 0.0%</text>
  <text x="472" y="298" class="mono">Prerequisite_Lab_Safety_Check = 100.0%</text>

  <rect x="456" y="332" width="368" height="136" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="472" y="354" class="card-title">Gate B: Schmitt-Thompson &amp; Sub-Specialty Slot Gate</text>
  <text x="472" y="374" class="body">• Prohibits freeform LLM diagnosis; steps through</text>
  <text x="472" y="392" class="body">  deterministic Schmitt-Thompson symptom ruleouts</text>
  <text x="472" y="410" class="body">• Verifies provider visit-type rules &amp; payer network</text>
  <text x="472" y="430" class="mono">Wrong_SubSpecialty_Appointment_Booking = 0.4% (vs 14%)</text>
  <text x="472" y="448" class="mono">Outpatient_No_Show_Reduction = -38%</text>

  <rect x="456" y="482" width="368" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="472" y="504" class="card-title">Gate C: 0ms Red-Flag Symptom &amp; CHF Decomp Bridge</text>
  <text x="472" y="524" class="body">• Detects crushing chest pain, FAST stroke slurred</text>
  <text x="472" y="542" class="body">  speech, post-op sepsis fever, or CHF weight +3 lbs/24h</text>
  <text x="472" y="560" class="body">• Preempts scheduling in 0ms; bridges Triage RN &amp; 911</text>
  <text x="472" y="578" class="body">  with Epic FHIR summary &amp; active medication list</text>
  <text x="472" y="600" class="mono">if (redFlagChestPainStrokeOrChfSpike) -&gt; 0ms Triage_RN</text>
  <text x="472" y="618" class="mono">P99_Gate_Latency = 20ms | RN_Handoff_Delay = 0ms</text>

  <!-- Right Column: Epic Writeback & Health-System ROI -->
  <rect x="872" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="892" y="144" class="card-title">3. Epic In-Basket, Waitlist &amp; Health ROI</text>
  <text x="892" y="164" class="card-sub">Fast-Pass Waitlist · Surescripts e-Rx · Readmission Drop</text>

  <rect x="892" y="182" width="340" height="126" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="908" y="204" class="card-title">Automated Waitlist Backfill &amp; Prep Coaching</text>
  <text x="908" y="224" class="body">• When a patient cancels, calls waitlisted patients in</text>
  <text x="908" y="242" class="body">  &lt;30s to backfill tomorrow's MRI/colonoscopy slot</text>
  <text x="908" y="260" class="body">• Coaches bowel-prep / fasting rules to prevent day-of cancel</text>
  <text x="908" y="282" class="mono">Canceled_Slot_Backfill_Rate = 86.5%</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="908" y="346" class="card-title">30-Day Heart Failure / COPD Readmission Shield</text>
  <text x="908" y="366" class="body">• Daily voice check on edema, dyspnea &amp; morning weight</text>
  <text x="908" y="384" class="body">• Sends structured Epic In-Basket alert for early diuretic</text>
  <text x="908" y="402" class="body">  adjustment before patient crashes into ED</text>
  <text x="908" y="424" class="mono">30_Day_CHF_Hospital_Readmission_Drop = -31%</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="908" y="498" class="card-title">Benchmark &amp; TCO Summary (10k Patient Calls)</text>
  <text x="908" y="520" class="body">• Manual Patient Access Center: $95,000 / 10k calls</text>
  <text x="908" y="538" class="body">• Hybrid FHIR+Triage Voice: $1,180 / 10k calls (Rec)</text>
  <text x="908" y="556" class="body">• Unguarded Medical Voice LLM: $2,100 + HIPAA/Rx risk</text>
  <text x="908" y="578" class="mono">Patient_Hold_Time = 0s (vs 14m Call Center Queue)</text>
  <text x="908" y="596" class="mono">HIPAA_Leaks = 0 | Rx_Lab_Gate_Compliance = 100%</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateHealthcareOutpatientTriageRxFhirVoiceGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="696" class="card-title">Cloud &amp; AI Solution Architect Takeaway — Healthcare Outpatient Triage, RPM &amp; Epic FHIR Voice Copilot</text>
  <text x="52" y="718" class="body">Never allow an LLM to improvise clinical triage or refill Schedule-II/lab-expired meds; enforce Schmitt-Thompson trees and HL7 FHIR R4 protocols.</text>
</svg>
