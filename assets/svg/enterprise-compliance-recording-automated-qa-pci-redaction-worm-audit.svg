  <rect width="1200" height="680" fill="url(#bg67)" rx="16"/>
  <text x="600" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Enterprise Compliance Recording, PCI-DSS v4.0 Audio Redaction &amp; 100% Automated QA Architecture</text>
