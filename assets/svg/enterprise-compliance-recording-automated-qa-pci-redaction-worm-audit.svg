  <text x="175" y="572" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Azure Immutable Blob / AWS S3 Lock</text>
  <text x="175" y="590" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• SHA-256 Merkle Audio-Transcript Seal</text>

  <!-- Center Column -->
  <rect x="350" y="92" width="500" height="548" rx="12" fill="url(#card67)" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Deterministic Recording &amp; QA Gate (COMPLIANCE-RECORDING-AUTO-QA-01)</text>

  <rect x="372" y="142" width="456" height="136" rx="10" fill="#2a1215" stroke="#ef4444" stroke-width="1.8"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE A: PCI-DSS v4.0 SAD Audio Zero-Zero Scrubbing Lock</text>
  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: pciSadScrubbedFromAudioAndTranscript === true</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Pauses recording during payment entry OR overwrites spoken PAN/CVV</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  audio timestamps in the memory buffer BEFORE flushing WAV to disk</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Keeps LLM &amp; storage buckets 100% out of PCI-DSS CDE audit scope</text>

  <rect x="372" y="294" width="456" height="145" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="600" y="318" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE B: Two-Party Jurisdiction Consent &amp; Dual-Track WORM Lock</text>
  <text x="600" y="340" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: recordingConsentAndDualTrackHashVerified === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks activating call recording in two-party consent jurisdictions</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  (e.g., California CIPA, Germany GDPR) until explicit disclosure completes</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Archives separate Ch0/Ch1 stereo tracks with cryptographic hash seal</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: 60-Second Post-Call QA &amp; Auto-Remediation Trigger</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: postCallQaDetectsPolicyDriftOrMissedDisclosure === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets complianceRemediationTicketAndCallbackTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Audits 100% of completed calls within 60s; if a caller hung up before</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  hearing a mandatory disclosure, auto-sends SMS cure &amp; compliance ticket</text>
  <text x="600" y="582" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 100% QA Coverage at $0.004/call vs $8.50/call for 1.5% Human QA</text>

