  <text x="175" y="188" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Zero CVV2 / PAN in WAV or STT Logs</text>
  <text x="175" y="206" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Secure DTMF Keypad Masking Mode</text>
  <text x="175" y="224" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 1kHz Sine-Tone Bleep Over Spoken PAN</text>

  <rect x="48" y="264" width="254" height="105" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="175" y="288" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SEC 17a-4 / MiFID II / HIPAA</text>
  <text x="175" y="310" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Stereo Dual-Channel (Ch0 User / Ch1 AI)</text>
  <text x="175" y="328" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 7-Year Immutable WORM Object Lock</text>
  <text x="175" y="346" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Two-Party Recording Consent Gate</text>

