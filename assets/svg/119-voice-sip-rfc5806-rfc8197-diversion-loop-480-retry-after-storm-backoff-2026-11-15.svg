  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P943 · RFC 5806 Diversion 防环脱敏与 [1, 5] 跳上限</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Acyclic Diversion URI + DID Scrub · Hops ∈ [1, 5] (5)</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 校验 Diversion 历史链无环路并将累计 counter 钳制在 [1, 5] 跳</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 出局自动将内网分机 URI 匿名化为企业总机 DID (0 拓扑外泄)</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P944 · RFC 3261 Retry-After [5, 120]s 双向退避钳制</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Mandatory Jittered Backoff · Retry-After ∈ [5, 120]s (120s)</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 480/486/500/503 缺失退避时强制注入 &gt;=5s 抖动退避阻断 0ms 雪崩</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 将超长 Retry-After 削顶钳制在 [5, 120]s 内严防 24h 恶意冻结</text>

