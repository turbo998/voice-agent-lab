  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">STAGE 475 🎉 · TOPIC 115 🎉 · P943–P944 · HISTORIC STAGE 475 &amp; TOPIC 115 DUAL MILESTONE · 478 DIMS · 917 TESTS</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">SIP RFC 5806 Diversion &amp; RFC 3261 Retry-After: [1,5]-Hop Loop &amp; [5,120]s Backoff Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 SIP RFC 5806/3261 呼转与退避：严防跨 B2BUA Diversion 呼转死循环/内网分机泄密与 Retry-After 重拨风暴/24h 锁死 (P943–P944)</text>

