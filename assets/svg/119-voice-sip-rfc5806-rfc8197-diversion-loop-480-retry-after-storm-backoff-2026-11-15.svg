  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (20-Hop Diversion Loop &amp; 86400s Freeze)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. B2BUA 重置 Max-Forwards 致 20 跳呼转死循环</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">Diversion: &lt;sip:ext-8802@10.16.4.99&gt;;counter=20</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 每次前转新建 INVITE 重置 Max-Forwards=70，引发无限乒乓呼转！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 出局未脱敏直接向公网暴露内部高管分机号与 10.x 核心网 IP！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. 480/503 缺失 Retry-After 雪崩与 86,400s 恶意锁死</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">503 (No Retry-After -&gt; 0ms Storm) / Retry-After: 86400</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 缺失 Retry-After 致 AI 外呼 Worker 0ms 狂暴重拨放大 20 倍流量！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 伪造 Retry-After: 86400 令整条 SIP 干线被拉黑冻结整整 24 小时！</text>

