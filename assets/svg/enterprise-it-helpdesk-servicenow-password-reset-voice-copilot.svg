<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgIt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#11223E"/>
      <stop offset="100%" stop-color="#07111E"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ssprGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgIt)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Enterprise IT Helpdesk Voice Copilot: ServiceNow P1 Storm Deflection, Entra SSPR &amp; Intune Self-Heal</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">企业 IT 服务台语音 Copilot 架构：P1 级全局故障 0秒广播防爆单、Entra ID / Okta 防钓鱼数字匹配解锁与 Intune 终端自动修复</text>
  <rect x="850" y="42" width="302" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="1001" y="64" fill="#7DD3FC" font-size="13" font-weight="600" text-anchor="middle">IT-HELPDESK-SERVICENOW-01</text>

  <!-- Pillar 1: P1 Major Incident Storm Deflection -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#p1Grad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. P1 级全局故障风暴 0秒动态广播拦截</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#451A03" stroke="#D97706"/>
    <text x="30" y="82" fill="#FCD34D" font-size="13" font-weight="700">痛点：全公司 VPN 挂了，周一早 9 点 800 人同时打爆 IT 热线</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• L1 人工坐席被一模一样的“连不上 VPN”电话彻底淹没，排队超 40 分钟</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• ServiceNow 里瞬间多出 800 张重复工单，真正急需修电脑的高管打不进来</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">ServiceNow Major Incident 实时迎宾注入</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 接通第 1 秒根据员工所属办公区 (如上海研发中心) 匹配活跃 P1 主故障单</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 首句主动播报：“目前亚太区 VPN 网关正在抢修，预计 10:15 恢复...”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">一键挂靠主故障单 (Parent-Child Link) + 恢复短信订阅</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 询问：“若您也是咨询 VPN 问题，我直接把您加入恢复通知名单好吗？”</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 25 秒内自动关联至主故障单 #INC00912，阻断 94% 的故障风暴进线！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="178" y="356" fill="#FCD34D" font-size="13" font-weight="700" text-anchor="middle">P1 故障风暴分流率 94.2% · 零重复废单</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">故障修复瞬间自动向所有关联员工发送 Teams / 短信恢复通知</text>
  </g>

  <!-- Pillar 2: Entra ID / Okta SSPR & Anti-Vishing Lock -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#ssprGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. Entra ID / Okta 账号解锁与防钓鱼数字匹配</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="82" fill="#7DD3FC" font-size="13" font-weight="700">高频痛点：35% 的 IT 服务台电话只是“忘密码 / 域账号被锁”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 员工出差换密码后电脑锁死，连不上内网也打不开网页自助重置页面</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 人工 IT 坐席处理一次重置密码平均耗时 8 分钟，单张工单成本高达 $22</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="174" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严防黑客语音社工钓鱼 (Scattered Spider Vishing)！</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 绝对禁止仅凭报出工号/生日就在电话里口头播报临时密码或换绑 MFA 设备</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 强制触发 Authenticator 数字匹配 (Number Matching) 或直属主管审批链</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">60秒安全自助解锁闭环 (Zero Verbal Password)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• AI 在电话中播报随机 2 位数字（如“请在手机 Authenticator 输入 74”）</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 验证通过后毫秒级调用 Microsoft Graph API 解锁 AD 账号并推送临时访问码 TAP</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">账号解锁耗时 8分钟 -&gt; 52秒 · 单单省 $21.8</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 免疫语音钓鱼攻击，全程不通过语音明文播报任何密码</text>
  </g>

  <!-- Pillar 3: Intune / Nexthink Automated Endpoint Self-Healing -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#snowGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. Intune 终端远程自愈与 ServiceNow 闭环</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">从“只记工单的传话筒”进化为“自动修电脑的行动派”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 员工说：“我的 Outlook 一直卡在正在连接，或者打印机驱动连不上”</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• AI 自动通过工号反查员工名下 Intune / Jamf 托管笔记本电脑实时健康指标</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">通话中一键下发远程自愈脚本 (Remote Remediation)</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• “查到您电脑的 GlobalProtect 虚拟网卡服务卡死，我直接远程帮您重启一下好吗？”</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 员工确认后，调用 Intune / Nexthink 远程脚本 15 秒内清缓存重连成功</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">软件 License 自动按 RBAC 授权与 L2 精准派单</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 申请 Visio / Copilot / Jira 权限自动校验部门成本中心并秒级加入 AD 组</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 硬件损坏需换机则自动在 ServiceNow 生成带设备序列号与错误日志的 L2 工单</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">L1 工单自动解决率 68.5% · 员工等待归零</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">5万人跨国企业每年节省 IT 服务台外包人力费用超 $2.1M</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">企业 IT 服务台语音 Copilot 三大核心法则 (IT-HELPDESK-SERVICENOW-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. P1 故障风暴 0秒拦截：来电振铃即匹配员工所在站点活跃 Major Incident，首句播报恢复预计时间并一键挂靠子单，消灭 94% 重复排障；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 零口头密码与终端自愈：账号解锁强制走 Authenticator 数字匹配 (防钓鱼)；常规软件/VPN 卡死直接联动 Intune/Nexthink 远程脚本通话中修复。</text>
</svg>
