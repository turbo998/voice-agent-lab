<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgAero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B16"/>
      <stop offset="50%" stop-color="#0E1E38"/>
      <stop offset="100%" stop-color="#060D1A"/>
    </linearGradient>
    <linearGradient id="pollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="ttcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hpaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgAero)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Aerospace Launch Range, LEO Satellite TT&amp;C &amp; Ground Station Voice AI: Go/No-Go &amp; HPA Lock</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">商业航天发射场、低轨卫星测控 (TT&amp;C) 与地面站语音 AI：发射倒计时 Hold 0ms 抢占、星上高危遥控指令双签与高功放净空锁全景图</text>
  <rect x="836" y="42" width="316" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="994" y="64" fill="#7DD3FC" font-size="13" font-weight="600" text-anchor="middle">AEROSPACE-SATELLITE-VOICE-01</text>

  <!-- Pillar 1: Launch Countdown Voice Net "HOLD / ABORT" 0ms Preemption & Go/No-Go Poll -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#pollGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 发射指显语音网“HOLD / 叫停”0ms 抢占锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁倒计时最后 60秒漏听任何一个分系统的“Hold”！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 商业运载火箭发射台涵盖动力、姿控、遥测、航区安全等 24个语音回路 (Voice Loops)</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 只要任意一个分系统主任喊出“Hold, Hold, Hold / 叫停”，必须 0ms 冻结点火序列！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#4C0519" stroke="#E11D48"/>
    <text x="30" y="174" fill="#FDA4AF" font-size="13" font-weight="700">24路语音网全时声纹监听 + 100% 全员“Go”点名互锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• T-10分钟自动辅助 01指挥员执行全分系统 Go/No-Go 状态点名与声纹核身</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 任何一席未明确回复“Go”或喊出“Hold” -&gt; 0ms 联锁地面发控台 (GLS) 挂起倒计时</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">航区落区与空域净空 (NOTAM / 海事禁航区) 实时核验</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 联锁海事 AIS 雷达与空管 ADS-B：若助推器落区闯入不明渔船</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 0ms 在航区安全回路发出红色禁发语音告警并自动无线电驱离</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">24路指显语音网“Hold”漏检率 = 0.0% · 响应 &lt; 80ms</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合发射场指控规程与 FAA Part 450 航区安全标准</text>
  </g>

  <!-- Pillar 2: LEO Satellite Constellation TT&C Critical Telecommand Dual-Sign Lock -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#ttcGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 低轨卫星星座 (LEO TT&amp;C) 高危遥控指令双签锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁单人语音直接上注轨控点火或星上复位指令！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 低轨卫星过境地面站可见窗口仅 8-10分钟，测控工程师争分夺秒上注遥控帧</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 若把卫星代号 SAT-042 听成 SAT-024 误发变轨推力器点火，卫星将失联坠毁</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="174" fill="#7DD3FC" font-size="13" font-weight="700">卫星 NORAD ID + 十六进制指令码 + 双人声纹三联锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 涉及轨控点火 (Delta-V)、太帆展开、载荷断电或星务切机等 A类高危指令 (Critical TC)</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 强制主操作员+总师双声纹 + 逐字复诵卫星号与指令校验和 (CRC-16) 才允许上注</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">太空碎片碰撞预警 (Conjunction / CDM) 自动变轨语音会商</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 收到碰撞概率 Pc &gt; 1e-4 红色预警时：自动语音播报最近距离时间 (TCA)</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 语音辅助快速比选顺轨/逆轨规避脉冲方案并生成待签发上注序列</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">千星星座误上注高危遥控指令率 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">单次 8分钟过境弧段异常遥测处置效率提升 3.2倍</text>
  </g>

  <!-- Pillar 3: Ground Station High-Power Amplifier (HPA) RF Radiation & Radome Interlock -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#hpaGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 地面站大口径天线高功放 (HPA) 射频防辐射硬锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#451A03" stroke="#D97706"/>
    <text x="30" y="82" fill="#FCD34D" font-size="13" font-weight="700">⛔ 严禁在天线罩内有人检修或仰角 &lt;5° 时开启千瓦级高功放！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• S/X/Ka 波段测控地面站高功放 (HPA) 发射功率高达数百瓦至数千瓦</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 若天线罩 (Radome) 内有工程师维护馈源时误开高压发射，强微波辐射将致严重灼伤失明</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">天线罩人员 UWB 清零 + 仰角 &gt;=5° 射频发射安全互锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 语音请求开启 HPA 高压发射前：强制校验天线罩门禁/UWB 人员计数 == 0</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 校验天线俯仰角 &gt;= 5°（防低仰角照射地面建筑与人员），不达标 0ms 锁死射频开关</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">12米天线伺服转动“插拔机械锁定销 (Stow Pin)”互锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 台风天收藏锁销 (Stow Pin) 未拔出时严禁启动方位/俯仰伺服电机（防烧毁减速机）</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 极地/戈壁无人值守地面站 100% 本地边缘语音诊断闭环</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="178" y="356" fill="#FCD34D" font-size="13" font-weight="700" text-anchor="middle">天线罩内人员微波辐射伤害与带销转天线事故 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合 CCSDS 空间数据系统委员会与 IEEE C95.1 射频安全标准</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">架构师核心选型法则 (AEROSPACE-SATELLITE-VOICE-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 运载火箭发射指显语音网必须在全部 24个分系统回路部署 &lt;80ms “Hold / 叫停”0ms 抢占监听器，任一席喊停立即联锁地面发控台 (GLS) 挂起倒计时；</text>
  <text x="68" y="606" fill="#FCD34D" font-size="13">2. 卫星轨控/复位等高危遥控指令 (Critical TC) 必须经双人声纹与卫星代号逐字复诵，且地面站开启高功放 (HPA) 前必须校验天线罩人员清零与仰角 &gt;=5°。</text>
</svg>
