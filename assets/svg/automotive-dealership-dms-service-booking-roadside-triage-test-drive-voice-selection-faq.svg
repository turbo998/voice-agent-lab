    <text x="26" y="288" class="body-text">• Handles "Is my car ready yet?" by reading DMS</text>
    <text x="26" y="304" class="body-text">  Repair Order (RO) stage &amp; technician video link</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Deflects 81% of Service Advisor Status Calls</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Captures 100% of Monday 8 AM Call Surges</text>
    <text x="26" y="384" class="body-text">Eliminates the 32% missed-call drop rate in dealer</text>
    <text x="26" y="400" class="mono" fill="#a7f3d0">service BDCs without adding headcount</text>
  </g>

