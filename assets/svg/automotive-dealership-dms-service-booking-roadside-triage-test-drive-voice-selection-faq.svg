    <text x="26" y="102" class="body-text">  within 30 seconds of form submission (TCPA opt-in)</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">3.4x Higher Lead-to-Appointment Conversion</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#fbbf24">Demo Fleet Trim Lock &amp; License Pre-Check</text>
    <text x="26" y="188" class="body-text">• Reserves exact demo VIN trim/color on dealer lot</text>
    <text x="26" y="204" class="body-text">• Texts 1-tap driver's license scan &amp; Wallet Pass</text>
    <text x="26" y="222" class="mono" fill="#fde68a">Lifts Showroom Show-Up Rate from 42% to 79.5%</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Non-Binding Trade-In Range Guardrail</text>
    <text x="26" y="288" class="body-text">• Quotes Black Book / KBB trade-in range strictly</text>
    <text x="26" y="304" class="body-text">  as "subject to in-store physical inspection"</text>
    <text x="26" y="322" class="mono">Zero Binding Verbal Financing / APR Commitments</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Guardrail: AUTO-DMS-VOICE-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateAutomotiveDealershipDmsRoadsideVoiceGuard</text>
    <text x="26" y="402" class="body-text">-58.4% Flatbed Tows · +$385k/10k Hrs Dealer Value</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Automotive Dealership DMS, Roadside Triage &amp; Test-Drive Voice Benchmarks (per 10,000 Hours)</text>

  <g transform="translate(44, 582)">
