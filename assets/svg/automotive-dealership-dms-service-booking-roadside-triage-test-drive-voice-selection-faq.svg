  <rect width="1200" height="680" fill="url(#bg504)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#cyanGrad504)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">AUTO DMS · #504</text>
  <text x="194" y="44" class="title">Automotive Dealership DMS Service Booking, Roadside Triage &amp; Test-Drive Voice AI</text>
  <text x="194" y="65" class="subtitle">4-Constraint DMS Bay/Part/Tech/Loaner Lock (CDK/Tekion) + Connected-VIN Roadside Triage (-58.4% Flatbed Tows) + &lt;30s Test-Drive Concierge</text>

  <!-- Column 1: 4-Constraint DMS Service Bay & Recall Booking -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad504)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. 4-Constraint DMS Service &amp; Recall Booking</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Auto VIN Recall &amp; Maintenance Lookup</text>
    <text x="26" y="86" class="body-text">• Maps caller ANI to VIN in CDK Global / Tekion /</text>
    <text x="26" y="102" class="body-text">  Reynolds DMS; checks open OEM safety recalls</text>
    <text x="26" y="122" class="mono">Proactively Bundles Open Recall Into Visit (+28% RO)</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#34d399">4-Constraint Atomic Slot Reservation</text>
    <text x="26" y="186" class="body-text">• Never books a blind calendar slot! Intersects:</text>
    <text x="26" y="202" class="body-text">  1.Lift Bay + 2.HV-EV Tech Cert + 3.Part Stock +</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">4.Loaner Car / Shuttle -> 0% Missing-Part Visits</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
