    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#fb7185">&lt;15s Highway Lane Hazard Safety Gate</text>
    <text x="26" y="86" class="body-text">• First question is ALWAYS caller physical safety:</text>
    <text x="26" y="102" class="body-text">  if stranded in active highway lane or airbag</text>
    <text x="26" y="122" class="mono" fill="#fda4af">deployed -> 0ms Priority Police/eCall Conference!</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#38bdf8">Connected-Vehicle Telematics Pre-Fetch (8s)</text>
