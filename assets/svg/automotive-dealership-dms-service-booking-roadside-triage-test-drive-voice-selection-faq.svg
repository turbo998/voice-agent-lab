    <text x="16" y="24" class="body-text">Missing-Part / Tech Bay Mismatch</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">19.4% → 0.0% (4-Way Lock)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Unnecessary $220 Flatbed Tows</text>
    <text x="16" y="50" class="kpi-num" fill="#fb7185">-58.4% (VIN Telematics)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Test-Drive Showroom Show-Up</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">42.0% → 79.5% (&lt;30s Call)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Net Savings &amp; RO Revenue Gain</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$385,000 / 10k Hours</text>
