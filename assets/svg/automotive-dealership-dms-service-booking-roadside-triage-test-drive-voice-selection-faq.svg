    <text x="26" y="204" class="body-text">  voltage, tire pressure, and OBD-II DTC fault codes</text>
    <text x="26" y="224" class="mono">Cuts Location &amp; Fault Intake from 95s to 8s</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#34d399">$65 Mobile Van vs. $220 Flatbed Tow Triage</text>
    <text x="26" y="290" class="body-text">• Distinguishes 12V auxiliary battery drain / OTA</text>
    <text x="26" y="306" class="body-text">  charge-port lock release from HV drivetrain fault</text>
    <text x="26" y="324" class="mono" fill="#6ee7b7">Cuts Unnecessary $220 Flatbed Tows by 58.4%</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#fda4af">AWD / EV Flatbed-Only Dispatch Lock</text>
    <text x="26" y="386" class="body-text">Forbids wheel-lift dolly tows on dual-motor EVs</text>
    <text x="26" y="402" class="mono" fill="#fda4af">(100% Prevents $12,000 Rear-Motor Tow Damage)</text>
  </g>

  <!-- Column 3: <30s Speed-to-Lead Test-Drive & Trade-In Concierge -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
