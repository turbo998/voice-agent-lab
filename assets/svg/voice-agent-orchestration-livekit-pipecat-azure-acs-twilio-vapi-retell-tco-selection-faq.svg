<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad431" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="headerGrad431" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardBlue431" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardPurple431" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardEmerald431" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad431)" rx="16"/>
  <rect x="24" y="20" width="1152" height="74" rx="12" fill="url(#headerGrad431)"/>
  <text x="44" y="50" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Voice Orchestration Frameworks: LiveKit Agents vs. Pipecat vs. Azure ACS vs. Twilio / Vapi / Retell AI</text>
  <text x="44" y="76" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="13">Architecture Blueprint · Policy: VOICE-ORCHESTRATION-LIVEKIT-PIPECAT-ACS-VAPI-2026-01 · 120k Min/Mo Break-Even · -58.6% Self-Hosted TCO · 100% VPC Sovereignty</text>

  <!-- Column 1: Open-Source Self-Hosted Orchestration -->
  <rect x="28" y="112" width="364" height="440" rx="12" fill="url(#cardBlue431)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="44" y="128" width="332" height="36" rx="8" fill="#1d4ed8"/>
  <text x="60" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Open-Source Orchestration (LiveKit / Pipecat)</text>

  <rect x="44" y="180" width="332" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="203" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">LiveKit Agents (WebRTC SFU + Stateful Workers)</text>
  <text x="58" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Native WebRTC SFU edge + SIP bridge + Python/Node SDK</text>
  <text x="58" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Best for: Multimodal App/Browser + Avatar + Multi-party</text>
  <text x="58" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Private AKS/EKS VPC deployment with zero wrapper tax</text>
  <text x="58" y="284" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Infrastructure overhead: ~$0.004/min on K8s</text>

  <rect x="44" y="312" width="332" height="114" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="335" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Pipecat (Daily.co Open-Source Frame Pipeline)</text>
  <text x="58" y="356" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Ultra-flexible Python frame DAG (AudioIn → VAD → STT</text>
  <text x="58" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  → LLM → Guardrail Filter → TTS → AudioOut)</text>
  <text x="58" y="396" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 50+ plug-and-play model connectors &amp; custom processors</text>
  <text x="58" y="414" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Best for custom frame-level DSP &amp; hybrid dual-track</text>

  <rect x="44" y="440" width="332" height="94" rx="8" fill="#0f172a" stroke="#3b82f6"/>
  <text x="58" y="463" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Stateful K8s Pod Draining Requirement</text>
  <text x="58" y="484" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Requires preStop hook + terminationGracePeriod=1800s</text>
  <text x="58" y="504" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  so rolling deploys never sever active 15-min phone calls</text>

  <!-- Column 2: Cloud Telephony & Call Automation -->
  <rect x="418" y="112" width="364" height="440" rx="12" fill="url(#cardPurple431)" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="434" y="128" width="332" height="36" rx="8" fill="#6d28d9"/>
  <text x="450" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. Cloud Telephony (Azure ACS / Twilio Voice)</text>

  <rect x="434" y="180" width="332" height="122" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="448" y="203" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Azure Communication Services (ACS Call Automation)</text>
  <text x="448" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• First-party Azure backbone to Voice Live &amp; AI Speech</text>
  <text x="448" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Native PSTN / Direct Routing BYOC SBC / Teams Phone</text>
  <text x="448" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Bidirectional WebSocket audio streaming + SIP REFER</text>
  <text x="448" y="286" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Best for Banking/Healthcare/Gov on Azure Private Link</text>

  <rect x="434" y="316" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="448" y="339" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Twilio Programmable Voice (Media Streams / Relay)</text>
  <text x="448" y="360" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Global PSTN reach in 100+ countries + STIR/SHAKEN</text>
  <text x="448" y="380" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• ConversationRelay or raw Media Streams to Pipecat/LiveKit</text>
  <text x="448" y="402" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• Pairs seamlessly as PSTN ingress for LiveKit / Pipecat</text>

  <rect x="434" y="440" width="332" height="94" rx="8" fill="#0f172a" stroke="#8b5cf6"/>
  <text x="448" y="463" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Telephony Layer Cost Structure</text>
  <text x="448" y="484" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• BYOC SIP Trunking: $0.004 – $0.007 / min</text>
  <text x="448" y="504" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Managed PSTN Carrier DID: $0.010 – $0.015 / min</text>

  <!-- Column 3: Commercial Wrapper Platforms -->
  <rect x="808" y="112" width="364" height="440" rx="12" fill="url(#cardEmerald431)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="824" y="128" width="332" height="36" rx="8" fill="#047857"/>
  <text x="840" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Managed SaaS (Vapi / Retell AI) &amp; TCO Rule</text>

  <rect x="824" y="180" width="332" height="114" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="838" y="203" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Vapi / Retell AI (Hosted Developer Platforms)</text>
  <text x="838" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Launch a working voice bot in 1 afternoon via REST/UI</text>
  <text x="838" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Built-in dashboard, call recordings, and basic turn tuning</text>
  <text x="838" y="264" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">⚠ Charges $0.05–$0.07/min platform wrapper fee on top!</text>

  <rect x="824" y="308" width="332" height="112" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="838" y="331" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Enterprise Redlines (When NOT to Use Wrappers)</text>
  <text x="838" y="352" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Regulated BFSI/Healthcare: PII cannot transit external SaaS</text>
  <text x="838" y="372" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Extra Internet webhook hop adds +120ms–260ms tool latency</text>
  <text x="838" y="394" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✕ At 5M min/mo, wrapper tax alone costs $250k–$350k/mo!</text>

  <rect x="824" y="434" width="332" height="100" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="838" y="457" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">The 120,000-Minute/Month TCO Break-Even Law</text>
  <text x="838" y="478" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• &lt; 120k min/mo: Use Retell / Vapi for fast PoC validation</text>
  <text x="838" y="498" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• &gt;= 120k min/mo: Self-host LiveKit/Pipecat + ACS (-58.6% TCO)</text>

  <!-- Bottom Summary Bar -->
  <rect x="28" y="568" width="1144" height="88" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="48" y="596" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Architect Framework Selection Formula:</text>
  <text x="48" y="620" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Day-1 MVP (&lt;120k min/mo, non-regulated): Retell AI / Vapi · Enterprise PSTN + Teams Phone + Azure Private Link: Azure ACS Call Automation</text>
  <text x="48" y="642" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">• Full-Scale Production (&gt;=120k min/mo): ACS / Twilio SIP Ingress + Self-Hosted LiveKit Agents / Pipecat in Private VPC ($0.041/min vs. $0.115/min)</text>
</svg>
