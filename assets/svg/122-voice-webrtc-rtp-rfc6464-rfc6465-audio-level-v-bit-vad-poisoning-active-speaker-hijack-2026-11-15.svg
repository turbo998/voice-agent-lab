  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">STAGE 478 · TOPIC 118 · P949–P950 🎉 · 45TH ROUND, P950 GUARD, 120TH FAQ 🎉 &amp; 920-TEST MILESTONE · 481 DIMS · 920 TESTS 🎉</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">WebRTC RFC 6464 &amp; RFC 6465 Audio-Level: [3,127] -dBov Anti-Hijack &amp; CC [1,15] Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 WebRTC RFC 6464/6465 音量扩展头：严防静音包伪造 0 dBov 霸麦误打断与 CSRC 音量字节越界读取 (P949–P950 🎉)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="302" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (0 dBov Floor Hijack &amp; CSRC Overread)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 3B 静音帧伪造 V=1, level=0 (-0 dBov) 永久霸麦</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">3B Opus DTX + ssrc-audio-level (V=1, level=0 dBov)</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• SFU 盲信 level=0 将主讲人永久锁死在静音客户端上！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• AI 坐席被虚假 V=1 持续触发 Barge-In 自断，无法开口说话！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. RFC 6465 扩展头长度 != RTP CC 越界与 MSB 污染</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">csrc-audio-level (32 Entries != CC=15, MSB=1)</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 音量字节数超过 RTP 头 CC 计数，触发混音分轨器越界崩溃！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 违反 RFC 6465 Section 3 将保留最高位 MSB 置 1 污染解析！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：23 个伪造 0 dBov 霸麦包 + 14 个畸形 CSRC 音量越界包</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">多方会议主讲人切麦瘫痪、AI 坐席无限误打断且下游分轨崩溃</text>

  <!-- Right Card: Deterministic Guardrails P949-P950 -->
  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="340" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P949 + P950 🎉 · 120th FAQ &amp; 920 Tests 🎉)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P949 · RFC 6464 包长能量交叉核验与 [3, 127] -dBov</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Payload Energy Cross-Check · Attenuation ∈ [3, 127] -dBov</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 拦截静音短包伪造 0 dBov，在 vad=off 时强制清零 V-bit</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 将可信衰减值钳制在 [3, 127] -dBov (0 虚假霸麦抢话)</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P950 🎉 · RFC 6465 CC 计数对齐、MSB=0 与 [1, 15] 锁</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Exact RTP CC Parity + MSB=0 · Entries ∈ [1, 15] (15)</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 强制 csrc-audio-level 字节数严格等于 RTP CC (1..15)</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 对每字节执行 &amp;= 0x7F 清零保留最高位 (0 越界读取)</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 伪造霸麦误打断 · 0 CSRC 音量越界 · 3 dBov / 15 封顶</text>
  <text x="652" y="500" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

