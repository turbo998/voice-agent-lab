  <rect width="1200" height="675" fill="url(#bg50)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="56" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">STAGE 406 · TOPIC 46 · WEBRTC RFC 8829 JSEP SDP GLARE ROLLBACK &amp; DTLS SHA-256 FINGERPRINT FAQ (P805–P806 · 🎉 50TH SVG)</text>
  <text x="56" y="84" fill="#F8FAFC" font-family="Segoe UI, system-ui, sans-serif" font-size="20.5" font-weight="700">WebRTC RFC 8829 JSEP Glare Auto-Rollback + m=/mid Slot Order &amp; RFC 8842 SHA-256 Fingerprint Guard</text>
  <rect x="968" y="38" width="176" height="32" rx="16" fill="#065F46" stroke="#10B981" stroke-width="1.2"/>
  <text x="1056" y="59" text-anchor="middle" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Stage 406 · 409 Dims</text>

  <!-- Left Column: P805 WebRTC RFC 8829 JSEP SDP Glare Auto-Rollback & Immutable m=/a=mid Slot Order -->
  <rect x="36" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="36" y="124" width="552" height="44" rx="12" fill="url(#blueGrad50)"/>
  <text x="56" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P805 · WebRTC RFC 8829 JSEP Glare Rollback &amp; m=/mid Order Gate</text>

  <!-- Anti-pattern Box Left -->
  <rect x="56" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="72" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: have-local-offer InvalidStateError &amp; m= Line Deletion</text>
  <text x="72" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Simultaneous Renegotiation (Client Screen-Share + Server Avatar Track)</text>
  <text x="72" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  throws DOMException InvalidStateError in have-local-offer</text>
  <text x="72" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Deleting or reordering m=audio/m=video lines breaks Unified Plan mid</text>
  <text x="72" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: Unrecoverable Signaling Freeze · Transceiver Index Corruption</text>

  <!-- Best Practice Box Left -->
  <rect x="56" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="72" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ Polite Peer `{type:"rollback"}` &amp; Append-Only [1, 16] m=/mid Slots</text>
  <text x="72" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. Perfect Negotiation Pattern: Polite peer executes setLocalDescription</text>
  <text x="72" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   ({type:"rollback"}) to return to stable before applying remote Offer</text>
  <text x="72" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. Append-Only m= Slots: Never delete/reorder m= lines (0 mutations);</text>
  <text x="72" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   deactivate stopped tracks via port 0 + a=inactive in [1, 16] slots</text>
  <text x="72" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P805: mLineReorderOrDeletions = 0 · transceiverSlots = [1, 16]</text>
  <text x="72" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: 0 Glare Exceptions · 100% Unified Plan Transceiver Continuity</text>

  <!-- Bottom KPI Pill Left -->
  <rect x="56" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="72" y="530" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateWebrtcRfc8829JsepSdpGlareRollbackAndMlineOrderGate`)</text>
  <text x="72" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedMLineReorderOrDeletions = 0 | clampedActiveTransceiverSlots = [1, 16]</text>
  <text x="72" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: rollback_jsep_glare_and_preserve_append_only_mline_order (0ms @ 1ms grid)</text>

  <!-- Right Column: P806 WebRTC RFC 8842 DTLS SHA-256 Fingerprint & a=msid Cross-Track Splice Guard -->
  <rect x="612" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="612" y="124" width="552" height="44" rx="12" fill="url(#emeraldGrad50)"/>
  <text x="632" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P806 · RFC 8842 DTLS SHA-256 Fingerprint &amp; a=msid Track Guard</text>

  <!-- Anti-pattern Box Right -->
  <rect x="632" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="648" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: Weak/Unchecked DTLS Fingerprint &amp; Cross-Call msid Splice</text>
  <text x="648" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Accepting a=fingerprint:md5/sha-1 or mid-call cert swap without new</text>
  <text x="648" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  ICE ufrag/pwd enables MITM media wiretapping on SFU bridges</text>
  <text x="648" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Spoofed a=msid:&lt;streamId&gt; &lt;trackId&gt; splices foreign audio into tenant</text>
  <text x="648" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: DTLS MITM Wiretap · Cross-Tenant Audio Track Injection</text>

  <!-- Best Practice Box Right -->
  <rect x="632" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="648" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ [256, 512]-Bit Constant-Time Fingerprint &amp; Tenant-Scoped msid Lock</text>
  <text x="648" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. SHA-256/512 Pinning: Require [256, 512]-bit a=fingerprint digest</text>
  <text x="648" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   verified in constant time against the live DTLS X.509 leaf certificate</text>
  <text x="648" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. Tenant-Scoped a=msid: Namespace all MediaStream / track UUIDs</text>
  <text x="648" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   per session and require ICE ufrag/pwd restart on any cert change</text>
  <text x="648" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P806: unverifiedFingerprints = 0 · hashBits = [256, 512]</text>
  <text x="648" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: 0 DTLS MITM Splice Attacks · 100% Tenant Track Isolation</text>

  <!-- Bottom KPI Pill Right -->
  <rect x="632" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="648" y="530" fill="#34D399" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateWebrtcRfc8842DtlsSha256FingerprintAndMsidCrossTrackGate`)</text>
  <text x="648" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedUnverifiedFingerprintOffers = 0 | clampedFingerprintHashBits = [256, 512]</text>
  <text x="648" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: reject_unverified_dtls_fingerprint_and_msid_splice (0ms @ 1ms grid)</text>

