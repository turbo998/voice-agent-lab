<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgSov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#11233E"/>
      <stop offset="100%" stop-color="#07101E"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="piplGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="zdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgSov)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Sovereign Cloud &amp; Cross-Border Data Residency Voice AI: GDPR / PIPL Pinning &amp; Zero Retention</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">跨国企业主权云与数据驻留语音 AI：境内媒体锚定 (Media Pinning)、跨境工单脱敏出境锁与零数据留存 (ZDR) 全景图</text>
  <rect x="844" y="42" width="308" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="998" y="64" fill="#7DD3FC" font-size="13" font-weight="600" text-anchor="middle">SOVEREIGN-CLOUD-VOICE-01 · Sovereign</text>

  <!-- Pillar 1: In-Country Media & Inference Pinning (China PIPL / EU Data Boundary / KSA) -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#pinGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 主权云境内媒体锚定与模型区域硬锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁将境内原始语音流/声纹特征路由至境外 Global 节点！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 跨国车企/银行/奢品大坑：使用 Global 多区域负载均衡，遇到拥塞自动漂移出境</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 原始人声属于生物识别敏感信息，未经安全评估出境直触 PIPL/GDPR 顶格重罚</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="30" y="174" fill="#7DD3FC" font-size="13" font-weight="700">单向法域锁 (Regional DataZone Lock) 严禁跨国故障转移</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 中国大陆：100% 锁定世纪互联 Azure China / 阿里云境内节点（严禁 Failover 到香港/新加坡）</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 欧盟：锁定 EU Data Boundary (法兰克福/瑞典)；沙特：锁定 KSA 主权区 (PDPL)</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">WebRTC TURN / SBC 媒体流本地终结 (Local Media Termination)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 不仅省去跨洋 180ms 海缆往返延迟，更确保 PCM 音频包 100% 不出主权边界</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 同法域内双可用区（如北京+上海 / 法兰克福+巴黎）实现合规高可用</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">原始语音与声纹生物特征违规跨境泄漏率 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">本地媒体终结使端到端语音往返延迟降低 140ms-210ms</text>
  </g>

  <!-- Pillar 2: Follow-the-Sun Cross-Border Escalation via Tokenized De-Identified Text -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#piplGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 跨国“日不落”协同：原始录音留境与脱敏工单出境</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">解决“全球二线专家在海外，但国内/欧盟客户数据不能出境”死结</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 跨国药企/工业软件/奢品全球共享服务中心设在马尼拉、都柏林或吉隆坡</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 若海外坐席直接点开听取境内客户带姓名/身份证/卡号的原始录音即违法</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#4C0519" stroke="#E11D48"/>
    <text x="30" y="174" fill="#FDA4AF" font-size="13" font-weight="700">“原始音频留存境内 WORM + 伪名化 (Pseudonymized) 摘要出境”</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 境内边缘网关自动将姓名/手机号/住址替换为不可逆 Token (如 `CUST_CN_8821`)</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 仅将彻底剥离 PII 与声纹的纯技术故障/订单状态 JSON 发送至海外二线专家台</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">跨境实时语音转接“合成中性音色代播 (Voice Re-Synthesis)”锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 确需海外专家实时通话时：境内网关将客户语音转写脱敏后用标准 TTS 传出</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 彻底消除原始生物声纹出境风险，同时实现多语种无障碍沟通</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="178" y="356" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">跨境工单 PII 与生物声纹出境剥离率 = 100%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合《个人信息保护法》PIPL 第38条与 GDPR 第44条跨境传输规范</text>
  </g>

  <!-- Pillar 3: Enterprise Zero-Data-Retention (ZDR) & BYOK Customer-Managed Keys -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#zdrGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 零数据留存 (ZDR) 推理与客户自管密钥 (CMK)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">杜绝大模型厂商“后台落盘缓存 30天用于滥用监测或模型训练”</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 公有云默认 API 往往默认保留 30天 Abuse Monitoring 日志并允许安全审核员查看</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 金融/医疗/政务要求：模型推理仅在 GPU 显存瞬态完成，响应后 0ms 清零</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">强制校验 ZDR 豁免标头与 BYOK / HSM 硬件密钥信封加密</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 未开启 Enterprise Zero-Data-Retention 协议的模型端点 -> 0ms 拒绝注入客户语音</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 合规双录存档由企业自有 HSM 密钥 (CMK) 加密，支持 GDPR 被遗忘权一键碎钥擦除</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">车联网 (ICV) 地理围栏与座舱位置音频本地闭环</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 跨国智能汽车在中国/欧盟境内行驶时，车机语音助手自动绑定本国合规云租户</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 跨境自驾（如深圳开往香港 / 瑞士开往德国）过关瞬间自动切换对应主权端点</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">模型厂商侧客户音频留存 = 0 Byte · 100% 满足金融主权监管</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">一套全球架构底座同时通过中国网信办、欧盟 GDPR 与沙特 PDPL 审计</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">架构师核心选型法则 (SOVEREIGN-CLOUD-VOICE-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 跨国企业部署实时语音 AI 必须按主叫法域执行“主权边界内媒体与模型硬锁定（严禁跨国境自动容灾漂移）”，确保原始人声与声纹 100% 不出主权区；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 跨国共享服务中心协同必须采用“原始录音留存境内 + 伪名化脱敏文本出境”，且云端大模型推理必须强制校验零数据留存 (ZDR) 与客户自管密钥 (CMK)。</text>
</svg>
