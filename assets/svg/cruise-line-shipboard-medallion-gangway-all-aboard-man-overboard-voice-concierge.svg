  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks booking buffet/pool/excursion reservations during GI symptom triage</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Triggers complimentary in-cabin medical visit &amp; CDC VSP 24–48h isolation log</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Dispatches biohazard housekeeping with chlorine-based virucidal disinfection</text>

