  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects "someone fell overboard", balcony smoke, or General Emergency Alarm</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Marks exact ship GPS/time datum &amp; bridges Officer of the Watch (OOW) in 0ms</text>
