  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Explicitly pairs Ship Master Clock Time with Local Port TimeZone offset</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Warns guests when cellular auto-timezone differs from Ship Time by ±1 hr</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks booking independent shore returns after Gangway All-Aboard cutoff</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Verifies mandatory Safety Muster Drill completion before activating folio privileges</text>

