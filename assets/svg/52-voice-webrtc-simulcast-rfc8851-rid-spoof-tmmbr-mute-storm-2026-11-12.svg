<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg52" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="blueGrad52" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad52" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg52)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="56" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">STAGE 408 · TOPIC 48 · WEBRTC SIMULCAST RFC 8851 RID &amp; RFC 5104 TMMBR GUARD FAQ (P809–P810 · 🎉 50TH FAQ MILESTONE)</text>
  <text x="56" y="84" fill="#F8FAFC" font-family="Segoe UI, system-ui, sans-serif" font-size="20.5" font-weight="700">WebRTC RFC 8851/8852 Simulcast RID + Repaired-RID Gate &amp; RFC 5104 TMMBR Floor Guard</text>
  <rect x="960" y="38" width="184" height="32" rx="16" fill="#065F46" stroke="#10B981" stroke-width="1.2"/>
  <text x="1052" y="59" text-anchor="middle" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Stage 408 · 411 Dims · 50th FAQ</text>

  <!-- Left Column: P809 WebRTC RFC 8851/8852 Simulcast RID & Repaired-RID Cross-Layer Hijack Gate -->
  <rect x="36" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="36" y="124" width="552" height="44" rx="12" fill="url(#blueGrad52)"/>
  <text x="56" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P809 · WebRTC RFC 8851/8852 Simulcast RID &amp; Repaired-RID Gate</text>

  <!-- Anti-pattern Box Left -->
  <rect x="56" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="72" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: Cross-Layer RID Rebind &amp; Repaired-RID SSRC Hijack</text>
  <text x="72" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Packet with forged rtp-stream-id (rid=f) rebinds low-res SSRC to</text>
  <text x="72" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  high-res avatar/co-browsing layer or audio SSRC (decoder freeze)</text>
  <text x="72" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• RTX repaired-rtp-stream-id points across layers or &gt;3 layers flood</text>
  <text x="72" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: SFU Layer Table Corruption · Avatar Freeze · Audio SSRC Steal</text>

  <!-- Best Practice Box Left -->
  <rect x="56" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="72" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ Immutable `(SSRC, a=mid, a=rid)` Pinning &amp; [1, 3] Simulcast Layers</text>
  <text x="72" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. First-Packet Immutable Pin: Once SSRC binds to negotiated a=rid</text>
  <text x="72" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   (q/h/f), reject mid-stream RID mutation (0 cross-layer mutations)</text>
  <text x="72" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. Same-Layer RTX &amp; [1, 3] Layer Cap: Require repaired-rtp-stream-id</text>
  <text x="72" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   to match the target RID within the same m= section ([1, 3] layers)</text>
  <text x="72" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P809: crossLayerRidMutations = 0 · simulcastLayers = [1, 3]</text>
  <text x="72" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: 0 SFU Layer Hijacks · Deterministic Simulcast Forwarding</text>

  <!-- Bottom KPI Pill Left -->
  <rect x="56" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="72" y="530" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateWebrtcRfc8851Rfc8852SimulcastRidAndRepairedRidGate`)</text>
  <text x="72" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedCrossLayerRidMutations = 0 | clampedActiveSimulcastLayers = [1, 3]</text>
  <text x="72" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: drop_spoofed_simulcast_rid_and_clamp_layers (0ms @ 1ms grid)</text>

  <!-- Right Column: P810 WebRTC RFC 5104 TMMBR Zero-Bitrate Mute Storm & Pause/Resume Flood Guard -->
  <rect x="612" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="612" y="124" width="552" height="44" rx="12" fill="url(#emeraldGrad52)"/>
  <text x="632" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P810 · WebRTC RFC 5104 TMMBR Floor &amp; Pause/Resume Guard</text>

  <!-- Anti-pattern Box Right -->
  <rect x="632" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="648" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: RTCP TMMBR `0 bps` Audio Mute &amp; Pause/Resume Thrash</text>
  <text x="648" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Spoofed or buggy RTCP TMMBR (Mantissa=0) drives Opus audio encoder</text>
  <text x="648" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  to 0 bps, muting the Voice AI agent mid-sentence (total dead air)</text>
  <text x="648" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Rapid RFC 7728 PAUSE/RESUME (&gt;30/s) thrashes keyframe encoders</text>
  <text x="648" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: Silent Voice AI Agent · Simulcast Layer Flap CPU Exhaustion</text>

  <!-- Best Practice Box Right -->
  <rect x="632" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="648" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ [24, 64] kbps Audio Bitrate Floor &amp; [1, 4]/s Pause/Resume Rate Cap</text>
  <text x="648" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. Protected Audio Floor: Exempt primary Opus audio SSRC from zero-</text>
  <text x="648" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   bitrate TMMBR, enforcing a hard [24, 64] kbps floor for speech</text>
  <text x="648" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. Pause/Resume Hysteresis: Clamp RFC 5104 TMMBR / RFC 7728 PAUSE-</text>
  <text x="648" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   RESUME transitions to [1, 4]/s with mandatory TMMBN confirmation</text>
  <text x="648" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P810: audioFloorKbps = [24, 64] · pauseResumeRate = [1, 4]/s</text>
  <text x="648" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: 0 TMMBR Audio Mutes · Stable Simulcast Layer Switching</text>

  <!-- Bottom KPI Pill Right -->
  <rect x="632" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="648" y="530" fill="#34D399" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateWebrtcRfc5104TmmbrZeroBitrateMuteStormAndPauseResumeGate`)</text>
  <text x="648" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedMinGuaranteedAudioBitrateKbps = [24, 64] | clampedPauseResume = [1, 4]/s</text>
  <text x="648" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: enforce_audio_tmmbr_floor_and_throttle_pause_resume (0ms @ 1ms grid)</text>

  <!-- Footer Provenance -->
  <rect x="36" y="614" width="1128" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="56" y="640" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">Provenance: synthetic deterministic evaluation | 0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>
</svg>
