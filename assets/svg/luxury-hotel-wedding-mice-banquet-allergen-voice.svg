    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 婚庆公司要求提前 6小时进场搭桁架：自动核对前一场会议撤场翻台时间</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 翻台间隙 &lt;3小时自动拦截并推荐包夜搭建方案</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">开席现场临时开启备用桌 (Backup Tables) 语音签批</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 婚礼当晚宾客超员需立即开 3桌备桌：新郎母亲对宴会经理耳麦口头确认</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 声纹+短信双签留痕，厨房 3分钟内启动备桌热菜出餐</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <text x="178" y="356" fill="#FCD34D" font-size="13" font-weight="700" text-anchor="middle">BEO 保底人数违约减桌导致的食材报废亏损 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">宴会销售经理每周核对菜单与桌位变更电话耗时减少 74%</text>
  </g>

  <!-- Pillar 3: Automated Guest Voice RSVP & Live Event Floor Command -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#rsvpGrad)"/>
