    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#059669"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">500位婚宴/峰会宾客 48小时温情语音 RSVP 收集</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 自动致电未回复请柬的长辈与贵宾：确认出席人数、儿童椅需求与车牌号</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 同步采集食物过敏与素食偏好，自动排定无冲突座位表</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">主舞台司仪致辞/敬酒环节 <-> 后厨热菜起菜毫秒联锁</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 新人致辞延长了 12分钟：宴会厅主管耳麦说“热菜推迟 10分钟起蒸”</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 防止清蒸石斑鱼蒸老或热汤变凉，保障 80桌同时滚烫上桌</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">散席代驾预约与贵重自带茅台/红酒空瓶清点锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 宴席每开 1瓶客户自带名酒：服务员语音报编码并在散席时与主家双核空瓶数</text>
    <text x="30" y="308" fill="#A7F3D0" font-size="12">• 彻底杜绝婚宴散场时“自带名酒少算或被掉包”纠纷</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">宾客到场率预测准确度从 78% 跃升至 98.2%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">自带名酒账实纠纷与上菜冷菜率降至 0%</text>
