  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#F43F5E" font-size="14" font-weight="700">架构师核心选型法则 (BANQUET-ALLERGEN-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 宴会语音 RSVP 检出花生/坚果/海鲜重度过敏时，必须 0ms 穿透核查整套宴会菜单隐性辅料（如花生油、虾酱）并向总厨下发独立紫标专餐工单；</text>
  <text x="68" y="606" fill="#FCD34D" font-size="13">2. 过了 BEO 法定保底人数截止期 (如开席前 72小时)，语音助手必须 100% 物理锁定“只增不减”原则，严禁口头豁免保底桌数。</text>
