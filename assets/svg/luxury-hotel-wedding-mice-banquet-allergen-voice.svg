  <rect width="1200" height="660" rx="16" fill="url(#bgBanq)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="22" font-weight="700">Luxury Hotel Wedding &amp; MICE Banquet Voice AI: BEO Cutoff Lock &amp; Anaphylaxis Allergen Guard</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">五星级酒店婚宴与万人会展宴会：BEO 72小时保底桌数硬锁、宾客致死性食物过敏紫标专厨锁与宗教饮食合规全景图</text>
  <rect x="896" y="42" width="256" height="34" rx="17" fill="#4C0519" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="1024" y="64" fill="#FDA4AF" font-size="13" font-weight="600" text-anchor="middle">BANQUET-ALLERGEN-01</text>

  <!-- Pillar 1: Severe Food Allergen (Anaphylaxis) & Halal/Kosher Kitchen Lock -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F43F5E" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#algGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 致死性过敏原 (花生/海鲜) 与宗教饮食锁</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁把“重度花生过敏休克”当普通“不吃香菜”备注！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 80桌婚宴同时出菜：含花生油高汤或虾籽酱汁极易发生隐性交叉污染</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 检出重度过敏：0ms 拆解整套菜单隐性配料并派发总厨【紫色专锅单】！</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#4C0519" stroke="#E11D48"/>
    <text x="30" y="174" fill="#FDA4AF" font-size="13" font-weight="700">桌号-座位号 (Table-Seat) 紫牌绑定与传菜员耳麦复核</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 宾客语音 RSVP 确认坐 12号桌 3号位：自动生成防误端专人密封罩餐盘</text>
    <text x="30" y="214" fill="#FBBF24" font-size="12">• 传菜员上菜前耳麦强制语音双核：“12桌3号位无坚果过敏专餐”</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">清真 (Halal) / 犹太洁食 (Kosher) 独立餐具与零酒精锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 国际外交/跨国峰会晚宴：自动剔除料酒、猪油起酥与明胶甜品</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 强制关联认证独立厨房或整盒密封加热餐具</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#450A0A" stroke="#F43F5E"/>
    <text x="178" y="356" fill="#FDA4AF" font-size="13" font-weight="700" text-anchor="middle">千人宴会隐性过敏原误食与禁忌出错率 = 0.0%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">100% 符合欧盟 14大法定致敏原披露与五星酒店食安标准</text>
  </g>

  <!-- Pillar 2: BEO 72-Hour Guaranteed Headcount Cutoff & Margin Lock -->
