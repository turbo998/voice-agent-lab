  <rect width="1200" height="680" fill="url(#bg82)" rx="16"/>
  <text x="600" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Water Utility, Treatment SCADA &amp; Stormwater Flood Control (Veolia / EPA SDWA) 24×7 Voice Dispatch</text>
