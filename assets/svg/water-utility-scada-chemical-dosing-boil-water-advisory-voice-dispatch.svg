  <text x="600" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Deterministic Water Utility Gate (WATER-UTILITY-SCADA-DOSING-01)</text>

  <rect x="372" y="142" width="456" height="136" rx="10" fill="#2a1215" stroke="#ef4444" stroke-width="1.8"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE A: Anti-Oldsmar Chemical Dosing Envelope &amp; Dual-Op Lock</text>
  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: chemicalDosingWithinSafePpmEnvelopeAndDualSigned === true</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Permanently blocks voice SCADA from setting NaOH, Chlorine, or Fluoride</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  dosing outside hard PLC mechanical/chemical limits (e.g. Cl2 &lt;= 4.0 mg/L)</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Requires local Chief Operator console confirmation for any dosing change</text>

  <rect x="372" y="294" width="456" height="145" rx="10" fill="#172554" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="600" y="318" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE B: &lt;20 PSI Backflow &amp; AWWA C651 Lab Clearance Gate</text>
  <text x="600" y="340" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: linePressureAbove20PsiAndColiformLabNegativeVerified === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks lifting a Boil-Water Advisory or reopening repaired potable mains</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  until line pressure &gt;= 20 PSI and two consecutive 24h coliform tests pass</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Priority-notifies renal dialysis centers &amp; hospitals on pressure drops</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: 0ms Transmission Main Rupture &amp; Flash-Flood Bridge</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: transmissionMainRuptureOrChlorineGasLeakOrDropBelow20Psi === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets emergencyValveCrewAndBoilWaterAlertTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Dispatches valve-isolation crews with slow-close anti-surge cadence</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  and triggers automated DMA Boil-Water Advisory outbound alerts</text>
  <text x="600" y="582" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cost: $0.050/min · Storm/Main-Break Call Containment: 95.8%</text>

