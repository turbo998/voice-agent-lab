  <text x="385" y="342" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks submitting tax filing extensions until client explicitly acknowledges</text>
  <text x="385" y="362" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">  that any unpaid tax balance still accrues IRS 0.5%/mo failure-to-pay penalty</text>
  <text x="385" y="382" fill="#fef08a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  and ~8% annual interest after April 15 unless estimated payment is remitted</text>

  <rect x="365" y="430" width="440" height="128" rx="8" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="385" y="457" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Gate C: IRS Notice CP2000 / Levy &amp; Aggressive Tax Shelter Block</text>
  <text x="385" y="480" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Never gives binding tax-evasion / unverified write-off advice (Circular 230)</text>
  <text x="385" y="500" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">• If caller receives IRS Final Notice of Intent to Levy (LT11 / CP504),</text>
  <text x="385" y="520" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  0ms escalates to Enrolled Agent / CPA controversy desk</text>

