  <text x="56" y="68" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">STAGE 472 · TOPIC 112 · P937–P938 · HISTORIC 475-DIMENSION MILESTONE 🎉 · 947 GUARDS · 475 DIMS 🎉 · 914 TESTS</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">WebRTC RFC 8834 RTCP MTU [576,1200]B Splitting &amp; RFC 5506 a=rtcp-rsize Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 WebRTC RFC 8834/5506 反馈防黑洞：严防 1,680B 复合 RTCP 突破 MTU 触发 IP 分片丢包与 rtcp-rsize 失步 (P937–P938)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="286" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (1,680B RTCP Fragmentation Blackhole)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 弱网复合 RTCP 膨胀至 1,680B 触发分片黑洞</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">SR + 15×RR + SDES + TWCC + NACK = 1,680B (&gt;1,280B IPv6)</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 越是弱网急需发 NACK/TWCC，复合 RTCP 包越长！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 突破路径 MTU 触发 UDP IP 分片，被企业防火墙 100% 静默吞没！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. 未协商 rtcp-rsize 被拒收 + 15s 停发复合心跳</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">Bare NACK (PT=205 != 200/201) or 15,000ms No SR+SDES</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 对端未声明 a=rtcp-rsize 时因首包非 SR/RR 全量丢弃反馈！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 长期只发单块 rsize 不发 SR+SDES 导致音画时钟彻底失锁！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：13 个复合 RTCP 分片黑洞丢包 + 8 条 rtcp-rsize 拒收/失步流</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">弱网下重传请求与拥塞反馈 100% 消失，语音会话陷入死锁</text>

  <!-- Right Card: Deterministic Guardrails P937-P938 -->
  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="324" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P937 + P938 · 475 Dims Milestone 🎉)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P937 · 复合 RTCP [576, 1200]B 自动切分防 IP 分片</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Auto-Split Compound SRTCP · MaxBytes ∈ [576, 1200]B (1200B)</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 严格将单包 SRTCP 大小钳制在 &lt;=1,200B (适配 IPv6 1,280B MTU)</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 超长报告自动拆分为多个独立合法 SRTCP 包 (0 IP 分片黑洞)</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P938 · a=rtcp-rsize 协商核验与 [500, 5000]ms 复合心跳</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Verify a=rtcp-rsize + SRTCP · Heartbeat ∈ [500, 5000]ms</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 紧急 NACK/TWCC 走 ~32B 缩减型通道，体积直降 70%+</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 强制维持 [500, 5000]ms 周期完整复合 (SR/RR+SDES) 心跳</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 RTCP 分片黑洞 · 0 rsize 失步流 · 1,200B / 5,000ms 封顶</text>
  <text x="652" y="500" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

