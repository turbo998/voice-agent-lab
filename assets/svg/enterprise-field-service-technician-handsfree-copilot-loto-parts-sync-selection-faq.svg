<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg515" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad515" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad515" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad515" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="roseGrad515" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f1f5f9; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10.5px; fill: #38bdf8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg515)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#amberGrad515)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">FIELD SERVICE · #515</text>
  <text x="194" y="44" class="title">Enterprise Field Service (FSM) Hands-Free Voice Copilot: LOTO Safety &amp; Parts Sync</text>
  <text x="194" y="65" class="subtitle">Mandatory OSHA LOTO Zero-Energy Gate + D365/ServiceMax Van Part Lock (74% → 92.8% First-Time Fix) + Basement Offline Sync (-$345k/10k Hrs)</text>

  <!-- Column 1: Hands-Free Manual Retrieval & LOTO Zero-Energy Gate -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#roseGrad515)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. OSHA LOTO Safety Gate &amp; Manual Guidance</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#fb7185">Mandatory Lockout/Tagout (LOTO) Hard Gate</text>
    <text x="26" y="86" class="body-text">• Never reads internal repair steps until technician</text>
    <text x="26" y="102" class="body-text">  verbally confirms breaker lockout &amp; 0V meter test</text>
    <text x="26" y="122" class="mono" fill="#fda4af">100% Compliance with OSHA 1910.147 Zero-Energy</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="168" class="card-title" fill="#38bdf8">Step-by-Step Voice Pacing ("Next Step")</text>
    <text x="26" y="186" class="body-text">• Techs wearing insulated gloves cannot touch iPads!</text>
    <text x="26" y="202" class="body-text">• Reads 1 OEM manual step at a time, advancing</text>
    <text x="26" y="222" class="mono">strictly on spoken "Check / Next" confirmation</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#34d399">Exact Serial / Revision Manual Pinning</text>
    <text x="26" y="288" class="body-text">• Scopes RAG strictly to scanned asset serial &amp;</text>
    <text x="26" y="304" class="body-text">  board revision (blocks cross-model spec mix-ups)</text>
    <text x="26" y="322" class="mono" fill="#6ee7b7">0.0% Wrong-Model Wiring or Torque Hallucinations</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="26" y="366" class="card-title" fill="#fda4af">Multimodal Nameplate &amp; Fault-LED Vision</text>
    <text x="26" y="384" class="body-text">Reads corroded asset serial plates &amp; PCB fault</text>
    <text x="26" y="400" class="mono" fill="#fda4af">blink patterns via phone/glasses camera in 3s</text>
  </g>

  <!-- Column 2: Van Trunk-Stock Part Lock & Peer Van Transfer -->
  <g transform="translate(416, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad515)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">2. Van Trunk-Stock &amp; Peer-Van Part Transfer</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Real-Time Van Trunk-Stock &amp; BOM Lookup</text>
    <text x="26" y="86" class="body-text">• Checks technician's own van bin inventory in</text>
    <text x="26" y="102" class="body-text">  D365 Field Service / ServiceMax / SAP FSM</text>
    <text x="26" y="122" class="mono">"Bin B-4 in your van has 2 compatible contactors"</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#34d399">Nearby Peer-Van Geo-Search (&lt;15 Min Radius)</text>
    <text x="26" y="188" class="body-text">• If part is missing from van, locates nearest peer</text>
    <text x="26" y="204" class="body-text">  technician van or local depot within 5 miles &amp;</text>
    <text x="26" y="224" class="mono" fill="#6ee7b7">locks part transfer (74.0% → 92.8% First-Time Fix)</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#fbbf24">Instant SLA Contract &amp; Warranty Entitlement</text>
    <text x="26" y="290" class="body-text">• Verifies whether replacement compressor/board is</text>
    <text x="26" y="306" class="body-text">  covered under customer's active Gold SLA or</text>
    <text x="26" y="324" class="mono" fill="#fde68a">requires customer PO approval before installation</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="368" class="card-title" fill="#6ee7b7">Auto-Decrements Van Inventory on Closeout</text>
    <text x="26" y="386" class="body-text">Eliminates "phantom van stock" where ERPs think</text>
    <text x="26" y="402" class="mono" fill="#a7f3d0">a part is in the truck when it was used last week</text>
  </g>

  <!-- Column 3: Basement Offline Voice Queue & 30s Work-Order Closeout -->
  <g transform="translate(808, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#emeraldGrad515)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">3. Basement Offline Mode &amp; 30s Closeout</text>

    <rect x="14" y="48" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#34d399">0-Bar Basement / Vault Offline Voice Mode</text>
    <text x="26" y="86" class="body-text">• Mechanical rooms &amp; basements have 0 cell bars!</text>
    <text x="26" y="102" class="body-text">• Pre-caches asset manual + runs on-device Whisper</text>
    <text x="26" y="122" class="mono" fill="#6ee7b7">+ local SQLite outbox sync when signal returns</text>

    <rect x="14" y="150" width="340" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="170" class="card-title" fill="#fbbf24">30-Second Spoken Work-Order Closeout</text>
    <text x="26" y="188" class="body-text">• Tech speaks a 25s summary walking to the van;</text>
    <text x="26" y="204" class="body-text">  extracts Root Cause, Action Code, Parts Used &amp;</text>
    <text x="26" y="222" class="mono" fill="#fde68a">Labor Hours (-84.2% Post-Job Truck-Cab Admin Time)</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Customer Sign-Off &amp; Follow-Up Quote Draft</text>
    <text x="26" y="288" class="body-text">• Generates clean customer-facing service report</text>
    <text x="26" y="304" class="body-text">  on tablet for 1-tap site manager signature</text>
    <text x="26" y="322" class="mono">Saves 42 Minutes of Typing per Tech per Day</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Guardrail: FSM-TECH-VOICE-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateEnterpriseFieldServiceTechnicianVoiceGuard</text>
    <text x="26" y="402" class="body-text">92.8% First-Time Fix · -$345k/10k Hrs Field Value</text>
  </g>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="542" width="1152" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="568" class="card-title" fill="#38bdf8">Enterprise Field Service (FSM) Hands-Free Voice Copilot Benchmarks (per 10,000 Field Hours)</text>

  <g transform="translate(44, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">First-Time Fix Rate (FTFR)</text>
    <text x="16" y="50" class="kpi-num" fill="#34d399">74.0% → 92.8% (Peer Van Sync)</text>
  </g>
  <g transform="translate(324, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Post-Job Admin Typing Time</text>
    <text x="16" y="50" class="kpi-num" fill="#38bdf8">42m → 6.5m/day (-84.2%)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Unverified LOTO Safety Skips</text>
    <text x="16" y="50" class="kpi-num" fill="#fb7185">0.00% (OSHA Hard Gate)</text>
  </g>
  <g transform="translate(884, 582)">
    <rect width="272" height="62" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="16" y="24" class="body-text">Net Field Productivity Gain</text>
    <text x="16" y="50" class="kpi-num" fill="#6ee7b7">-$345,000 / 10k Hours</text>
  </g>
</svg>
