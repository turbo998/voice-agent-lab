<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg309" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card309" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg309)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1224" height="78" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="48" y="54" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">
    Legacy PBX &amp; CCaaS (Genesys / Avaya / Cisco / Teams) AI Voice Migration (LEGACY-PBX-CCAAS-AI-VOICE-MIGRATION-01)
  </text>
  <text x="48" y="81" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">
    Front-Door SIP BYOC Deflection vs. Media Forking vs. Native Connector · Pre-Transfer Presence Lock · 0ms SBC Fail-Open Bypass
  </text>

  <!-- Left Column: Three Migration Patterns -->
  <rect x="28" y="118" width="290" height="465" rx="12" fill="url(#card309)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="46" y="148" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    1. Three Integration Patterns
  </text>

  <rect x="46" y="166" width="254" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="60" y="190" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Pattern 1: Front-Door SIP BYOC</text>
  <text x="60" y="211" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• AI intercepts before legacy ACD port</text>
  <text x="60" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Saves 65% CCaaS IVR/AudioHook tax</text>

  <rect x="46" y="266" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Pattern 2: Passive Media Tap</text>
  <text x="60" y="311" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Fork audio during human agent call</text>
  <text x="60" y="330" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• For Real-Time Agent Assist &amp; QA</text>

  <rect x="46" y="366" width="254" height="86" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="390" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Pattern 3: Native Bot Connector</text>
  <text x="60" y="411" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Genesys AudioHook / Cisco WebSocket</text>
  <text x="60" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Easy flow blocks, higher per-min tax</text>

  <rect x="46" y="466" width="254" height="98" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="490" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Migration FinOps Impact</text>
  <text x="60" y="511" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Legacy Port Reduction: -62% ports</text>
  <text x="60" y="530" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Desktop Replacement Risk: 0%</text>
  <text x="60" y="549" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Front-Door TCO: $620 / 10k min</text>

  <!-- Center Column: 3 Deterministic Migration & Failover Gates -->
  <rect x="338" y="118" width="584" height="465" rx="12" fill="url(#card309)" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="148" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    2. Deterministic Brownfield PBX/CCaaS Integration Engine
  </text>

  <!-- Gate 1 -->
  <rect x="358" y="166" width="544" height="122" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="376" y="191" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate A · Front-Door SIP BYOC Deflection &amp; Zero Double-Metering Lock
  </text>
  <text x="376" y="214" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Hard Rule: Never hair-pin 100% of calls through legacy IVR ports just to reach AI!
  </text>
  <text x="376" y="235" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Routes carrier SIP trunks to Edge SBC / Azure ACS / LiveKit first (65% self-served)
  </text>
  <text x="376" y="256" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Forwards only the 35% human-escalated calls into Genesys/Avaya/Cisco ACD queues
  </text>
  <text x="376" y="275" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Eliminates 180ms hair-pin audio lag &amp; saves $350–$500/10k min in CCaaS port fees
  </text>

  <!-- Gate 2 -->
  <rect x="358" y="302" width="544" height="122" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="376" y="327" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate B · Pre-Transfer ACD Queue / Graph Presence &amp; CTI Sync Gate
  </text>
  <text x="376" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Queries Genesys Queue / Teams Graph Presence (`Available_Agents &ge; 1`) before transfer
  </text>
  <text x="376" y="371" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • If target specialist is offline/busy: Offers instant automated callback or alternate queue
  </text>
  <text x="376" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Synchronizes context card to existing agent desktop (Workspace / Finesse / Salesforce)
  </text>
  <text x="376" y="411" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Zero transfers into dead voicemail boxes &amp; zero retraining for 5,000 existing agents
  </text>

  <!-- Gate 3 -->
  <rect x="358" y="438" width="544" height="126" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="376" y="463" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    Gate C · 0ms SBC Fail-Open Bypass &amp; Percentage Canary Dial-Plan
  </text>
  <text x="376" y="486" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">
    • Triggers if AI Voice Gateway health probe fails, latency &gt; 900ms, or error rate &gt; 1.5%
  </text>
  <text x="376" y="507" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • 0ms Enterprise SBC route switch: Fail-open 100% of calls directly to legacy ACD/IVR
  </text>
  <text x="376" y="528" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Supports 5% -&gt; 25% -&gt; 100% dial-plan canary rollout by DNIS number or business unit
  </text>
  <text x="376" y="549" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    -&gt; Guarantees 99.999% enterprise hotline uptime during phased brownfield migration
  </text>

  <!-- Right Column: Brownfield Telephony & Desktop Stack -->
  <rect x="942" y="118" width="310" height="465" rx="12" fill="url(#card309)" stroke="#10b981" stroke-width="1.5"/>
  <text x="962" y="148" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700">
    3. Brownfield Enterprise Stack
  </text>

  <rect x="962" y="168" width="270" height="92" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="978" y="193" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Enterprise SBC (AudioCodes / Oracle)</text>
  <text x="978" y="214" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Canary traffic splitting (5%–100%)</text>
  <text x="978" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 0ms fail-open backup trunk routing</text>

  <rect x="962" y="276" width="270" height="92" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="978" y="301" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Genesys / Avaya / Cisco Finesse</text>
  <text x="978" y="322" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Keeps existing agent desktop &amp; WFM</text>
  <text x="978" y="342" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Embedded AI Context Gadget widget</text>

  <rect x="962" y="384" width="270" height="92" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="978" y="409" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Microsoft Teams Phone Ext</text>
  <text x="978" y="430" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Direct Routing + Graph Presence API</text>
  <text x="978" y="450" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Back-office SME warm consultation</text>

  <rect x="962" y="492" width="270" height="72" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="978" y="517" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Unified Recording &amp; Verint/Nice</text>
  <text x="978" y="538" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Stitches AI leg + Human leg recording</text>

  <!-- Bottom Sequence Strip -->
  <rect x="28" y="600" width="1224" height="136" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="628" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700">
    End-to-End Brownfield Migration Sequence (65% Front-Door Deflection / 0ms SBC Fail-Open Escape)
  </text>

  <rect x="48" y="644" width="275" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="62" y="666" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">1. Front-Door SIP Intercept</text>
  <text x="62" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">SBC routes inbound trunk to AI first</text>
  <text x="62" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">65% resolved without touching legacy PBX</text>

  <rect x="343" y="644" width="285" height="74" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="357" y="666" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">2. Presence-Checked Handoff</text>
  <text x="357" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Verifies queue/SME online before transfer</text>
  <text x="357" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Pops context widget inside Finesse/Genesys</text>

  <rect x="648" y="644" width="285" height="74" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
  <text x="662" y="666" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">3. 0ms SBC Fail-Open Bypass</text>
  <text x="662" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">If AI gateway probe fails or lags</text>
  <text x="662" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">SBC routes directly to legacy IVR in 0ms</text>

  <rect x="953" y="644" width="279" height="74" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="967" y="666" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">4. Brownfield TCO Savings</text>
  <text x="967" y="686" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">390ms P95 · $620 vs $1,390 / 10k min</text>
  <text x="967" y="704" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Saves 55.4% while keeping existing desktops</text>
</svg>
