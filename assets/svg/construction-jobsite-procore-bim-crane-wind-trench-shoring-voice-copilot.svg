  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card236)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic PE-RFI &amp; OSHA 1926 Engine (CONSTRUCTION-BIM-OSHA-CRANE-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: PE-Stamped Structural RFI &amp; Latest IFC Revision Hard Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Reads only latest "Issued for Construction (IFC)" sheet in Procore/ACC</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% blocks voice approval to cut rebar, core shear walls, or alter mix</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Requires digital seal of Structural Engineer of Record (SEOR / PE) on RFIs</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents building off superseded drawing revisions or ad-hoc field modifications</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: Tower Crane Wind (&lt;20 mph) &amp; OSHA 1926 Trench Shoring Lock</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Cross-checks boom-tip anemometer &amp; Load Moment Indicator (LMI &lt;95%)</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces OSHA 1926.652 trench box/shoring + Competent Person sign-off (&gt;5 ft)</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Verifies 811 underground utility locate ticket before excavation starts</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Blocks critical lifts during high wind gusts or within 20 ft of energized HV power lines</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms Stop-Work Siren, Trench Collapse &amp; EMS Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Detects trench wall sloughing, formwork movement, fall-arrest trigger, or gas strike</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Broadcasts 0ms zone Stop-Work evacuation alarm across all crew headsets</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Bridges 911 Technical Rescue &amp; Site Safety Director with exact grid/gate ID</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full OSHA 29 CFR 1926, ASME B30.3 Tower Crane &amp; Procore WORM audit trail</text>

  <!-- Right Column: Procore/ACC BIM, Crane IoT & Safety Command -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card236)" stroke="#22c55e" stroke-width="1.5"/>
