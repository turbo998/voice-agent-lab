  <rect width="1200" height="680" fill="url(#bg236)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Construction Jobsite BIM/Procore, Tower Crane Wind &amp; OSHA Trench Safety Voice Copilot</text>
  <text x="600" y="66" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">PE-Stamped Structural RFI Lock · Crane Wind (&lt;20 mph) &amp; OSHA &gt;5ft Trench Shoring Gate · 0ms Collapse &amp; Arc-Flash Bridge (CONSTRUCTION-BIM-OSHA-CRANE-01)</text>

  <!-- Left Column: Jobsite Superintendent, Crane Cab & Field Crew -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card236)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="166" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Jobsite Voice Channels</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#fbbf24"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hard-Hat Bone-Conduction</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 90 dB jackhammer / saw noise NS</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hands-free Procore Daily Log &amp; Punch</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Multilingual OSHA toolbox briefing</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">BIM Drawing &amp; Concrete Pour</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Autodesk ACC / Revit sheet lookup</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ACI 318 slump, temp &amp; rebar check</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Post-tension tendon elongation log</text>

