<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg274" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d131a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card274" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg274)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Ready-Mix Concrete Batching, ACI 318 w/c Ratio, Drum LOTO &amp; Boom-Pump Voice AI</text>
  <text x="600" y="66" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">ACI 318 Max Water-Cement (w/c) Ratio &amp; 90-Min ASTM C94 Lock · Mixer Drum Chipping LOTO Gate · 0ms 20-Ft Powerline &amp; 85-Bar Reverse-Pump Bridge (READY-MIX-CONCRETE-DRUM-WATER-BOOM-01)</text>

  <!-- Left Column: Batch Plant, Mixer Truck & Boom Pump -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card274)" stroke="#eab308" stroke-width="1.5"/>
  <text x="166" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Batch Plant, Truck &amp; Pump</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#facc15"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Command Alkon &amp; In-Cab Pod</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Verifi hydraulic slump telemetry</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ACI 318 w/c water-meter lock</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ASTM C94 90-min / 300-rev timer</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Mixer Drum &amp; 62m Boom Pump</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Twin-shaft &amp; drum chipping LOTO</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 20-ft (6m) HV powerline radar</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Outrigger cribbing &amp; soil load</text>

  <rect x="56" y="394" width="220" height="222" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="166" y="420" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Water-Ratio, Boom &amp; Pipe Flags</text>
  <text x="166" y="444" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Unauthorized jobsite water add</text>
  <text x="166" y="464" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Opening 85-bar plugged pipe clamp</text>
  <text x="166" y="484" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Boom within 20 ft of powerline</text>
  <text x="166" y="504" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Compressed-air line blowout</text>
  <text x="166" y="532" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0ms Reverse-Pump &amp; Boom Lock</text>

  <!-- Center Column: READY-MIX-CONCRETE-DRUM-WATER-BOOM-01 Guardrail Engine -->
  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card274)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic Ready-Mix &amp; Pump Engine (READY-MIX-CONCRETE-DRUM-WATER-BOOM-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: ACI 318 Water-Cement (w/c) Ratio &amp; ASTM C94 90-Min/300-Rev Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Physically locks truck water valve once batch design max w/c water allowance is reached</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Routes slump increases solely to polycarboxylate superplasticizer dosing</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks structural pour if load exceeds ASTM C94 90 minutes or 300 drum revolutions</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents 28-day compressive strength collapse (f'c failure) in structural columns/decks</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: Mixer Drum Chipping LOTO &amp; Boom-Pump 20-Ft Powerline / Outrigger Gate</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Requires ignition/battery LOTO, hydraulic disconnect &amp; mechanical drum-lock pin for chipping</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Blocks unfolding boom pump within 20 ft (6m) of live powerlines (OSHA 1926.1408)</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Verifies 100% outrigger extension, dunnage pads &amp; safe trench setback (1:1 slope)</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Eliminates drum-rotation amputations, boom electrocutions, and outrigger tip-overs</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms 85-Bar Plugged-Line Reverse-Pump, Zero Air-Blow &amp; Alkali Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• On pump-line plug: commands 0ms REVERSE PUMPING to 0 bar before touching clamps!</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% forbids blowing plugged delivery pipes with compressed air (lethal hose whip)</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Directs vinegar/buffer irrigation on pH 13 wet-concrete burn &amp; bridges EMS</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full ACI 318 / ASTM C94, ACPA Boom Pump Safety, NRMCA &amp; OSHA 1910.146 WORM audit</text>

  <!-- Right Column: Command Alkon, Putzmeister/SANY PLC & QC Lab -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card274)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1034" y="122" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. Batch ERP &amp; Boom PLC</text>

  <rect x="924" y="142" width="220" height="145" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="1034" y="166" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Command Alkon / Verifi IoT</text>
  <text x="1034" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Batch ticket max held-water lock</text>
  <text x="1034" y="210" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Automated admixture dosing</text>
  <text x="1034" y="230" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Drum rev counter &amp; concrete temp</text>
  <text x="1034" y="250" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• e-Ticket DOT/PE structural sign</text>

  <rect x="924" y="302" width="220" height="150" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="1034" y="326" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Putzmeister / Schwing / SANY</text>
  <text x="1034" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• OSS / EAC outrigger stability</text>
  <text x="1034" y="370" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• High-voltage E-field boom sensor</text>
  <text x="1034" y="390" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Concrete pressure gauge (0–85 bar)</text>
  <text x="1034" y="410" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hopper grate interlock switch</text>

  <rect x="924" y="468" width="220" height="148" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="1034" y="492" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Structural QC &amp; Utility EMS</text>
  <text x="1034" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Chief Mix-Design PE escalation</text>
  <text x="1034" y="536" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Utility HV line de-energize</text>
  <text x="1034" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• pH 13 hexavalent-chrome wash</text>
  <text x="1034" y="576" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">• 100% ACI 318 &amp; ACPA Compliant</text>
</svg>
