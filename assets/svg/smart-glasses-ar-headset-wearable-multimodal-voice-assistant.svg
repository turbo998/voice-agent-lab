<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#10213D"/>
      <stop offset="100%" stop-color="#071222"/>
    </linearGradient>
    <linearGradient id="povGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="privGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="indGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgGlass)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">AI Smart Glasses &amp; AR Wearable Multimodal Voice Assistant Architecture</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">AI 智能眼镜与穿戴多模态语音助手架构：指代触发 &lt;50KB 第一视角抽帧省电、开放式防漏音隐私锁与工业远程协作</text>
  <rect x="836" y="42" width="316" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="994" y="64" fill="#7DD3FC" font-size="13" font-weight="600" text-anchor="middle">SMART-GLASSES-POV-MULTIMODAL-01</text>

  <!-- Pillar 1: Deictic-Triggered <50KB POV Single-Frame Gating (Battery Survival) -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#povGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 指代触发 &lt;50KB 抽帧省电与 650ms 视觉问答</text>

    <rect x="18" y="60" width="320" height="82" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 硬件死穴：40克智能眼镜只有 150mAh 电池，常开摄像头 30分钟关机！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 若将眼镜摄像头 1080p 视频流持续发往云端大模型，镜腿发热烫耳且半小时没电</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 且走路晃动产生运动模糊，上传 5MB 大图走手机蓝牙/Wi-Fi 要卡顿 3 秒以上！</text>

    <rect x="18" y="156" width="320" height="82" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="30" y="178" fill="#7DD3FC" font-size="13" font-weight="700">✅ 语义指代触发瞬时抓拍 (Deictic Single-Frame Gate)</text>
    <text x="30" y="198" fill="#E2E8F0" font-size="12">• 平时摄像头 0 功耗休眠；仅当语音命中视觉指代（“帮我翻译这张菜单/看这排故障灯”）</text>
    <text x="30" y="218" fill="#38BDF8" font-size="12">• 端侧 ISP 选取陀螺仪最稳一帧裁剪压缩至 &lt;50KB WebP，650ms 内云端语音播报！</text>

    <rect x="18" y="252" width="320" height="68" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="274" fill="#F8FAFC" font-size="13" font-weight="700">物理隐私指示灯硬互锁 (LED Privacy Interlock)</text>
    <text x="30" y="294" fill="#94A3B8" font-size="12">• 符合欧美 GDPR 与公共场所防偷拍合规：抓拍前强制校验镜框正面白色隐私灯点亮</text>
    <text x="30" y="310" fill="#34D399" font-size="12">• 若光敏传感器检测到隐私灯被贴纸遮挡，0ms 物理阻断摄像头调用！</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#0C4A6E" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">整机续航从 35 分钟提升至 6.5 小时 (+10倍)</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">单次“看一眼翻译/识物”全链路首字语音延迟 P50 640ms</text>
  </g>

  <!-- Pillar 2: Open-Ear Acoustic Privacy & Bystander Voice Isolation -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#privGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 电梯/地铁开放式镜腿防漏音隐私门禁</text>

    <rect x="18" y="60" width="320" height="82" rx="8" fill="#2E1065" stroke="#A78BFA"/>
    <text x="30" y="82" fill="#DDD6FE" font-size="13" font-weight="700">😳 社死现场：在安静的电梯里，智能眼镜大声念出你的银行卡余额和老板微信！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 智能眼镜采用开放式气传导/骨传导扬声器，在 &lt;45dB 安静电梯或会议室极易漏音</text>
    <text x="30" y="122" fill="#C4B5FD" font-size="12">• 且街头嘈杂时，眼镜经常把旁边路人说话声当成佩戴者的语音指令！</text>

    <rect x="18" y="156" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="178" fill="#F8FAFC" font-size="13" font-weight="700">环境底噪自适应隐私降级 (Whisper Privacy Mode)</text>
    <text x="30" y="198" fill="#94A3B8" font-size="12">• 当检测到环境噪音 &lt;45dB (电梯/图书馆) 或周边有人贴近且播报含敏感信息 (财务/私信)</text>
    <text x="30" y="218" fill="#38BDF8" font-size="12">• 自动压低 12dB 开启反相声波防漏音私密耳语，或仅在 HUD 镜片显示文字不发声！</text>

    <rect x="18" y="252" width="320" height="68" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="274" fill="#F8FAFC" font-size="13" font-weight="700">鼻托骨传导震动 + 5麦近场波束锁定佩戴者</text>
    <text x="30" y="294" fill="#94A3B8" font-size="12">• 仅当鼻托加速度计检测到佩戴者自身声带骨骼震动时，才放行语音指令</text>
    <text x="30" y="310" fill="#34D399" font-size="12">• 距离 &gt;25cm 的旁人插话与电视背景声 100% 物理剥离，仅在同传模式下放开远场拾音</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#2E1065" stroke="#A78BFA"/>
    <text x="178" y="356" fill="#DDD6FE" font-size="13" font-weight="700" text-anchor="middle">旁人误触发率：0.0% · 电梯隐私外泄 0 起</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">完美兼顾全天候免掏手机随身交互与高管商业机密保护</text>
  </g>

  <!-- Pillar 3: Cross-Border Menu/Sign Translation & Field Service AR Expert -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#indGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 跨国街头同传点餐与工业免提远程协作</text>

    <rect x="18" y="60" width="320" height="82" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">两大杀手级落地场景：消费级出国随身同传 + 工业级双手解放巡检</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 场景 A：看着法文/日文手写菜单问：“我有花生过敏，这页哪道招牌菜我能吃？”</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 场景 B：机修工双手拿扳手看着配电柜问：“黄绿线接第几号端子？帮我连线总工”</text>

    <rect x="18" y="156" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="178" fill="#F8FAFC" font-size="13" font-weight="700">超短口语化输出约束 (&lt;=25 字/句，严禁长篇大论)</text>
    <text x="30" y="198" fill="#94A3B8" font-size="12">• 穿戴设备没有大屏幕可翻页，语音回复强制遵循“先给结论、不超过两句话”原则</text>
    <text x="30" y="218" fill="#38BDF8" font-size="12">• “第 2 道香煎海鲈鱼不含坚果（€28），需要我现在教您用法语跟服务员点这道菜吗？”</text>

    <rect x="18" y="252" width="320" height="68" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="274" fill="#F8FAFC" font-size="13" font-weight="700">高通 AR1 端侧芯片 + 手机中继 + Azure 多模态云协同</text>
    <text x="30" y="294" fill="#94A3B8" font-size="12">• 眼镜端跑唤醒词、骨传导 VAD 与防抖抓拍；手机 BLE/Wi-Fi Direct 汇聚上云</text>
    <text x="30" y="310" fill="#34D399" font-size="12">• 工业 AR 头显遇复杂故障一键开启 WebRTC 第一视角激光笔标注专家会诊</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">日均佩戴交互频次 32 次 · 工业维修提效 +55%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">成为智能手机与汽车座舱之外增长最快的第三大实时多模态语音入口</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">AI 智能眼镜与随身穿戴多模态语音架构三大铁律 (SMART-GLASSES-POV-MULTIMODAL-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 按需单帧抓拍与防偷拍锁：平时严禁常开视频流耗电，仅在语义指代时抓拍 &lt;50KB 关键帧，且正面隐私 LED 灯被遮挡时 100% 锁死相机；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 骨传导锁声与电梯防漏音：依靠鼻托震动隔离路人噪音；在安静环境 (&lt;45dB) 播报敏感内容时自动切入私密耳语或仅镜片 HUD 显示。</text>
</svg>
