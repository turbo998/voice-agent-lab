<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg114" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent114" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg114)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="8" rx="4" fill="url(#accent114)"/>

  <text x="56" y="68" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">STAGE 470 🎉 · TOPIC 110 🎉 · P933–P934 · HISTORIC STAGE 470 &amp; 110TH TOPIC MILESTONE · 943 GUARDS · 473 DIMS · 912 TESTS</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24.5" font-weight="800">WebRTC RFC 6051 Rapid NTP Sync &amp; RFC 5450 toffset: [1,25]ms PLL &amp; [48,2400]-Tick Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 WebRTC RFC 6051/5450 时间扩展头：严防 64-bit NTP 阶跃吞字与 24-bit toffset 符号溢出撑爆 NetEq 缓冲 (P933–P934)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="284" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (Raw NTP Step &amp; Unsigned toffset)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. RFC 6051 64-bit NTP 突跳 350ms 触发吞字冻结</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">CLOCK_REALTIME step=+350ms -&gt; Playout Pointer Reset</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 容器 ntpd 阶跃或伪造扩展头使 NTP 墙钟瞬间突跳 350ms！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 播放线程硬重置时间基线，瞬间丢弃 17 帧语音或静音冻结！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. RFC 5450 24-bit toffset 符号溢出撑爆 NetEq</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">toffset=-48 (0xFFFFD0) unsigned -&gt; +16,777,168 ticks!</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 漏做 24-bit 补码符号扩展或注入 480,000 ticks (10s) 偏移！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• RFC 3550 抖动 J_i 暴涨万倍，NetEq 延迟从 20ms 锁死至 1,200ms！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：11 次 NTP 阶跃吞字断音 + 14 次 toffset 撑爆 NetEq 缓冲</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">单包异常偏移即可摧毁全双工实时性，将 20ms 低延迟拉爆至 1.2 秒</text>

  <!-- Right Card: Deterministic Guardrails P933-P934 -->
  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="324" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P933 + P934 · Stage 470 🎉 / Topic 110 🎉)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P933 · RFC 6051 NTP 单调核验与 [1, 25]ms PLL 锁相步长</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">Monotonic NTP + RTCP SR Cross-Check · Slew ∈ [1, 25]ms</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 剥离回退或与 RTCP SR 背离的瞬时 NTP 阶跃扩展头</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 启用 PLL 渐进锁相微调，单步修正钳制在 [1, 25]ms (0 吞字)</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P934 · RFC 5450 24-bit 符号扩展与 [48, 2400] ticks 钳制</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">(raw24 &lt;&lt; 8) &gt;&gt; 8 Sign-Extend · |toffset| ∈ [48, 2400] ticks</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 强制执行 24-bit 有符号补码扩展，杜绝负数反转巨型正数</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 将最大允许偏移钳制在 [48, 2400] ticks (1..50ms @ 48kHz)</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 NTP 阶跃断音 · 0 toffset 抖动膨胀 · 25ms / 2,400 ticks 封顶</text>
  <text x="652" y="500" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

  <!-- Footer Provenance -->
  <rect x="56" y="560" width="1088" height="68" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="76" y="586" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Benchmark &amp; Provenance (Stage 470 🎉 · Topic 110 🎉 · 943 Guardrails · 952 Probes · 762 Live POC Probes · 473 Dims · 912 Tests)</text>
  <text x="76" y="610" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Guardrails: evaluateWebrtcRtpRfc6051RapidSyncNtpHeaderExtensionStepAndMonotonicityGate (P933) &amp; evaluateWebrtcRtpRfc5450TransmissionTimeOffsetBoundsAndJitterInflationGate (P934)</text>
