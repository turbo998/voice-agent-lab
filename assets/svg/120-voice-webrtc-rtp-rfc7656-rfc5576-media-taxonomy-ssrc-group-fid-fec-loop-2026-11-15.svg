  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 主流与 RTX 修复流指向自身，触发解包器无限递归栈溢出崩溃！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 同一修复 SSRC 被跨流复用导致多音轨重传包交叉污染！</text>

