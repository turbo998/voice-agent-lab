  <rect x="434" y="180" width="332" height="118" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="448" y="203" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Zero Guest-Room Disclosure &amp; Keycard Security Lock</text>
  <text x="448" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Outside caller asks: "Connect me to Mr. Smith's room /</text>
  <text x="448" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  what room is Ms. Lin in?" → Hard-blocks room number leak!</text>
  <text x="448" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Room-phone charges require Caller_Room_Extension ==</text>
  <text x="448" y="284" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  Opera_CheckedIn_Room &amp; Surname match (0% stalker/fraud)</text>

  <rect x="434" y="312" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="448" y="335" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Direct Oracle Opera Cloud PMS &amp; Housekeeping Sync</text>
  <text x="448" y="356" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Late checkout (checks Elite tier + next-day room turnover)</text>
  <text x="448" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Dispatches extra pillows/towels to Amadeus HotSOS in 8s</text>
  <text x="448" y="396" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ Deflects 74.6% of front-desk phone calls in 28 languages</text>

  <rect x="434" y="436" width="332" height="98" rx="8" fill="#0f172a" stroke="#6366f1"/>
  <text x="448" y="459" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">In-Room Dining &amp; Spa Upsell (+24% Ancillary Rev)</text>
  <text x="448" y="480" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Takes multilingual room-service orders with dietary/allergen</text>
  <text x="448" y="500" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  readback and posts folio charges directly to Simphony POS</text>

  <!-- Column 3: Special Assistance & Surge Elasticity -->
  <rect x="808" y="112" width="364" height="440" rx="12" fill="url(#cardEmerald439)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="824" y="128" width="332" height="36" rx="8" fill="#047857"/>
