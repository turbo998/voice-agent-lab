  <text x="44" y="50" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Airline Mass IRROPS Rebooking &amp; Hotel Opera PMS Multilingual Voice Concierge Architecture</text>
  <text x="44" y="76" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="13">Architecture Blueprint · Policy: TRAVEL-AIRLINE-IRROPS-HOTEL-PMS-CONCIERGE-2026-01 · 65s Rebooking vs. 140m Hold · 99.5% Seat Lock · 0% Guest Room Leak</text>

  <!-- Column 1: Airline Mass IRROPS Rebooking -->
  <rect x="28" y="112" width="364" height="440" rx="12" fill="url(#cardSky439)" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="44" y="128" width="332" height="36" rx="8" fill="#0369a1"/>
  <text x="60" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Airline Mass IRROPS Rebooking (65s)</text>

  <rect x="44" y="180" width="332" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="203" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Pre-Speech 120s Atomic Seat Soft-Lock (Amadeus/Sabre)</text>
  <text x="58" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• During snowstorms, 5,000 callers fight for last 8 seats</text>
  <text x="58" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Places 120s GDS soft-lock BEFORE offering flight option</text>
  <text x="58" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Eliminates "Seat just got taken while you spoke" failure</text>
  <text x="58" y="284" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ 99.5% ticket reissue commit success in 65 seconds</text>

  <rect x="44" y="312" width="332" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="335" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Airport Minimum Connect Time (MCT) &amp; Visa/Bag Gate</text>
  <text x="58" y="356" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Verifies terminal transfer MCT + checked-baggage tag</text>
  <text x="58" y="376" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks transit rebookings requiring unheld transit visas</text>
  <text x="58" y="396" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ 0.0% illegal connection or stranded-baggage rebookings</text>

  <rect x="44" y="436" width="332" height="98" rx="8" fill="#0f172a" stroke="#0ea5e9"/>
  <text x="58" y="459" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">EU261 / DOT Delay-Code Voucher &amp; Hotel Shield</text>
  <text x="58" y="480" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Checks IOC code (MX mechanical vs. WX weather); auto-</text>
  <text x="58" y="500" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  sends hotel/meal QR &amp; notifies destination hotel of late arrival</text>

  <!-- Column 2: Hotel Opera PMS Multilingual Concierge -->
  <rect x="418" y="112" width="364" height="440" rx="12" fill="url(#cardIndigo439)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="434" y="128" width="332" height="36" rx="8" fill="#4338ca"/>
