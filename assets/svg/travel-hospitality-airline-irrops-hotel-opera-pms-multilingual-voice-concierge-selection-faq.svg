  <rect x="824" y="180" width="332" height="114" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="838" y="203" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">0ms Unaccompanied Minor (UMNR) &amp; Medical Bridge</text>
  <text x="838" y="224" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Never auto-rebooks an Unaccompanied Minor (`UMNR`),</text>
  <text x="838" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  wheelchair (`WCHC`), or oxygen (`MEDA`) passenger onto</text>
  <text x="838" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  an unescorted overnight layover!</text>
  <text x="838" y="284" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">⚡ 0ms Priority Route to Special-Assistance Desk</text>

  <rect x="824" y="308" width="332" height="114" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="838" y="331" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">20x Typhoon / Blizzard Concurrency Elasticity</text>
  <text x="838" y="352" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Scales from 200 to 4,000+ concurrent voice lines in 15s</text>
  <text x="838" y="372" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Proactively outbound-calls affected passengers before</text>
  <text x="838" y="392" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">  they even line up at the airport gate desk</text>

  <rect x="824" y="436" width="332" height="98" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="838" y="459" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Travel &amp; Hospitality TCO ($0.24 vs. $14.50/Call)</text>
  <text x="838" y="480" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Resolves IRROPS rebooking at $0.24/call (-98.3% vs. agent)</text>
  <text x="838" y="500" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Protects high-LTV Diamond/Platinum member retention</text>

  <!-- Bottom Summary Bar -->
  <rect x="28" y="568" width="1144" height="88" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="48" y="596" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Architect Blueprint Summary (Airline Mass IRROPS Rebooking &amp; Hotel Opera PMS Concierge):</text>
  <text x="48" y="620" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Airline IRROPS: Pre-Speech 120s GDS Seat Soft-Lock + MCT/Visa Gate (65s Rebooking vs. 140m Hold) + 0ms UMNR/WCHC Specialist Bridge</text>
  <text x="48" y="642" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">• Hotel Opera PMS: Zero Room-Number Disclosure Lock + Extension==Room Auth + 28-Lang HotSOS/Late-Checkout Automation (74.6% Deflection)</text>
