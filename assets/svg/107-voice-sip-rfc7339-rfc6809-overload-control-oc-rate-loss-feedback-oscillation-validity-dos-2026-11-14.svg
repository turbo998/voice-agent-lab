  <rect width="1200" height="675" fill="url(#bg107)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="8" rx="4" fill="url(#accent107)"/>

  <text x="56" y="68" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">STAGE 463 · TOPIC 103 · P919–P920 🎉 · 105TH FAQ &amp; P920 GUARDRAIL MILESTONE · 466 DIMS · 905 TESTS 🎉</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">SIP RFC 7339 / RFC 6809 Overload Control: oc [5,80]% Cap, SOS/BYE Exemption &amp; oc-validity Guard</text>
  <text x="56" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业 SIP RFC 7339/6809 过载控制：严防未授信 oc=100 伪造黑洞、对话内 BYE/ACK 误杀与 oc-validity=120s 僵尸限流死锁 (P919–P920 🎉)</text>

  <!-- Left Card: Vulnerable Pattern -->
  <rect x="56" y="152" width="528" height="390" rx="14" fill="#1E1B2E" stroke="#EF4444" stroke-width="2"/>
  <rect x="76" y="172" width="236" height="28" rx="6" fill="#7F1D1D"/>
  <text x="90" y="191" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">❌ 脆弱基线 (Unguarded RFC 7339)</text>

  <text x="76" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 外网注入 oc=100 死锁 + BYE/ACK 对话内误杀</text>
  <text x="76" y="250" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">Via: SIP/2.0/TLS ...;oc=100;oc-algo="loss"</text>
  <text x="76" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• oc=100 阻断 100% 请求 -&gt; 下游无法捎带响应回写 oc=0 死锁！</text>
  <text x="76" y="294" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 连坐丢弃已接通通话的 BYE/ACK -&gt; 19 通幽灵计费无法挂断！</text>

  <line x1="76" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="76" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. oc-validity=120,000ms 僵尸限流与锯齿震荡</text>
  <text x="76" y="376" fill="#CBD5E1" font-family="Consolas, monospace" font-size="13">Via: ...;oc=75;oc-validity=120000 (1秒毛刺锁死2分钟)</text>
  <text x="76" y="398" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 洪峰过后流量稀疏，长达 120s 无新响应刷新，持续拒呼 75%！</text>
  <text x="76" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 无 EWMA 阻尼，上下游吞吐在 0% 与 90% 间剧烈锯齿震荡！</text>

  <rect x="76" y="450" width="488" height="72" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
  <text x="92" y="476" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">事故后果：19 次伪造黑洞/BYE 误杀 + 11 条中继僵尸锁死 120s</text>
  <text x="92" y="500" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">瞬时 1 秒洪峰演变为长达 2 分钟的全网大面积拒呼与幽灵计费</text>

  <!-- Right Card: Deterministic Guardrails P919-P920 -->
  <rect x="616" y="152" width="528" height="390" rx="14" fill="#0F292A" stroke="#10B981" stroke-width="2"/>
  <rect x="636" y="172" width="286" height="28" rx="6" fill="#064E3B"/>
  <text x="650" y="191" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 企业级护栏 (P919 + P920 🎉 Guardrails)</text>

  <text x="636" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P919 · 直连 mTLS 授信 + oc [5, 80]% 封顶与 BYE/sos 豁免</text>
  <text x="636" y="250" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">maxAllowedOverloadLossPercent ∈ [5, 80]% (Clamped: 80%)</text>
  <text x="636" y="272" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 剥离非授信外网 oc 参数；强制保留 &gt;=20% 流量维持响应捎带闭环</text>
  <text x="636" y="294" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 对含 To-tag 的 ACK/BYE/re-INVITE 及 sos 呼叫 100% 豁免 (0 误杀)</text>

  <line x1="636" y1="320" x2="1120" y2="320" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="636" y="352" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">P920 🎉 · oc-validity [500, 10000]ms 钳制与到期自动归零</text>
  <text x="636" y="376" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13">ocValidityDurationMs ∈ [500, 10000]ms (Clamped: 10000ms)</text>
  <text x="636" y="398" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 超时无新响应立即自动归零 (oc=0%)，校验 oc-seq 单调递增</text>
  <text x="636" y="420" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 启用 EWMA 阻尼平滑 + 禁止本地限流包跨同池备机盲目 Failover</text>

  <rect x="636" y="450" width="488" height="72" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="652" y="476" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">验证结果：0 伪造黑洞/对话内误杀 · 0 僵尸限流中继 · 80% / 10,000ms 封顶</text>
  <text x="652" y="500" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>

  <!-- Footer Provenance -->
  <rect x="56" y="560" width="1088" height="68" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="76" y="586" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Benchmark &amp; Provenance (Stage 463 · Topic 103 · 929 Guardrails · 938 Probes · 748 Live POC Probes · 466 Dims · 905 Tests 🎉)</text>
  <text x="76" y="610" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Guardrails: evaluateSipRfc7339OverloadControlAuthenticatedLossCeilingAndRateAdaptiveGuard (P919) &amp; evaluateSipRfc7339OcValidityExpiryAndFeedbackDampingWindowGuard (P920 🎉)</text>
