<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg30" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#111F38"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="elevGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="propGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="vrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bg30)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="24" font-weight="700">Smart Property Concierge, Elevator SOS Rescue &amp; Real Estate VR Voice AI</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">商业地产、智慧物业管家（电梯困人 SOS 应急 / 无人岗亭抬杆 / 报修派单）与房产 VR 语音导购架构选型全景图</text>
  <rect x="916" y="42" width="236" height="34" rx="17" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
  <text x="1034" y="64" fill="#FCA5A5" font-size="13" font-weight="600" text-anchor="middle">ELEV-SOS-01 · &lt;=180ms</text>

  <!-- Pillar 1: Elevator SOS Five-Party Intercom & Trapped Passenger Rescue -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#F97316" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#elevGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 电梯五方对讲 SOS 困人秒级应急救援</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⚡ 电网晃电 100 部电梯同时困人呼叫</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 消控室 2 名保安根本接不过来，被困老人儿童极度恐慌</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 平峰期 84% 警铃又是儿童误触，人工逐一核实耗时费力</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#FDBA74" font-size="13" font-weight="700">IoT 平层传感器 + 轿厢视觉 + 语音三合一秒判</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• &lt;=180ms 接通对讲，同步读取非平层状态 (如卡在14-15楼)</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 自动过滤 84% 空轿厢误触；真困人 3秒派单维保救援</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">幽闭恐慌持续陪伴与严禁扒门安全锁 (P101)</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 严禁挂断电话！全程温和播报救援师傅实时距离</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 强力劝阻乘客切勿自行扒门，二次坠井事故率降至 0%</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">困人呼救接通率 100% · 救援派单提速 8.5 倍</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">符合 GB/T 24475 / EN 81-28 / ASME A17.1 电梯规范</text>
  </g>

  <!-- Pillar 2: 24x7 Unmanned Parking Gate, Intercom & Facility Repair -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#propGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 无人车库道闸、门禁对讲与工程报修</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="82" fill="#93C5FD" font-size="13" font-weight="700">地库道闸车牌污损/临牌 12秒语音秒抬杆</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 车主按道闸对讲 ➔ AI 结合抓拍图核对业主门牌/免密白名单</text>
    <text x="30" y="122" fill="#38BDF8" font-size="12">• 特种车辆（120救护车/119消防车）声光识别 0秒无条件抬杆</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">凌晨外卖/访客楼宇可视门禁双向桥接</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 访客说出“送 3栋1202 外卖”，AI 自动校验当日有效邀约码</text>
    <text x="30" y="214" fill="#34D399" font-size="12">• 或静默外呼业主说“开锁”即刻远程开启单元门与呼梯</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">爆管漏水 Emergency vs 日常报修智能分级</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 业主喊“客厅水管爆了漫水” ➔ 0秒联动关闭管井电磁水阀</text>
    <text x="30" y="308" fill="#38BDF8" font-size="12">• 走廊灯坏/空调不制冷 ➔ 自动推送拍照卡并派发物业工单</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">1个云端坐席可集中托管 80 个社区/写字楼岗亭</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">夜间门岗与物业客服人力成本直降 76%</text>
  </g>

  <!-- Pillar 3: Real Estate 3D VR Voice Tour & Broker Lead Qualification -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#vrGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 房产 3D VR 语音带看与跨境置业顾问</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#A7F3D0" font-size="13" font-weight="700">语音控制 3D 样板间镜头漫游 (Voice-Driven VR)</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 买家说：“带我看看主卧衣帽间，下午3点采光怎么样？”</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• WebRTC 同步旋转 3D 视角并实时渲染冬季日照光影动画</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#6EE7B7" font-size="13" font-weight="700">学区/税费/房贷月供确定性计算工具</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 严禁大模型口算房贷与契税！强制调本地房贷计算器 API</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 实时解答对口学区落户年限、物业费与得房率明细</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">夜间留资 60s 极速回呼与线下看房锁号</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 购房者深夜 11点刷房源留资，AI 顾问立即语音回访摸底</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 摸清首付预算与户型偏好后，当场锁定周末金牌经纪人带看</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle">线上 VR 看房转线下实地到访率提升 2.3 倍</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">支持中/英/日/阿语 24×7 接待海外高净值置业买家</text>
  </g>

  <!-- Bottom Lifecycle Bar -->
  <g transform="translate(44, 530)">
    <rect width="1112" height="92" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="14" font-weight="700">智慧空间与不动产全生命周期实时语音架构（Smart Property &amp; Real Estate Voice Lifecycle）</text>
    <text x="24" y="54" fill="#E2E8F0" font-size="13">1. 案场营销：3D VR 语音漫游带看 + 房贷/学区精算 + 实地看房预约 ➔ 2. 社区通行：无人道闸语音/视觉 12s 抬杆 + 特种车 0s 放行</text>
    <text x="24" y="76" fill="#34D399" font-size="13" font-weight="600">➔ 3. 物业管家：爆管 0s 关阀联动 + 工单派发 ➔ 4. 电梯安全：五方对讲 &lt;=180ms 接听 + IoT 平层感知 + 幽闭恐慌不断线安抚救援</text>
  </g>
</svg>
