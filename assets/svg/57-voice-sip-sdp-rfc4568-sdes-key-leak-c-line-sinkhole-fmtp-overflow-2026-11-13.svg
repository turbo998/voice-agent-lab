<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg57" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="blueGrad57" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad57" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg57)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="56" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">STAGE 413 · TOPIC 53 · SIP/SDP RFC 4568 SDES KEY LEAK + C= SINKHOLE &amp; RFC 8866 FMTP OVERFLOW FAQ (P819–P820)</text>
  <text x="56" y="84" fill="#F8FAFC" font-family="Segoe UI, system-ui, sans-serif" font-size="20.5" font-weight="700">SIP/SDP RFC 4568 SDES Key-Leak + c= Sinkhole Gate &amp; RFC 8866 a=fmtp Overflow Guard</text>
  <rect x="960" y="38" width="184" height="32" rx="16" fill="#065F46" stroke="#10B981" stroke-width="1.2"/>
  <text x="1052" y="59" text-anchor="middle" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Stage 413 · Topic 53 · 416D</text>

  <!-- Left Column: P819 SIP/SDP RFC 4568 SDES Inline Key Leak & Connection Sinkhole Gate -->
  <rect x="36" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="36" y="124" width="552" height="44" rx="12" fill="url(#blueGrad57)"/>
  <text x="56" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P819 · SIP/SDP RFC 4568 SDES Key &amp; c= Sinkhole Gate</text>

  <!-- Anti-pattern Box Left -->
  <rect x="56" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="72" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: Plaintext SDES inline Keys &amp; 166x RTP Reflection</text>
  <text x="72" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Unencrypted SIP or ELK logs store a=crypto inline: Base64 master</text>
  <text x="72" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  keys, allowing offline Wireshark decryption of all SRTP calls</text>
  <text x="72" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Spoofed c=IN IP4 victim IP turns TTS greeting into 166x UDP DDoS</text>
  <text x="72" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: Full SRTP Call Decryption · 166x Third-Party RTP Amplification</text>

  <!-- Best Practice Box Left -->
  <rect x="56" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="72" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ DTLS-SRTP / SDES Redaction &amp; `c=IN IP4/IP6` Origin Lock</text>
  <text x="72" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. Zero Plaintext SDES Keys: Reject unencrypted a=crypto inline</text>
  <text x="72" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   keys and scrub inline: secrets prior to SIEM logging (0 leaks)</text>
  <text x="72" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. c= Connection Verification: Block loopback, link-local, multicast,</text>
  <text x="72" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   and unverified third-party c= reflection targets (0 targets)</text>
  <text x="72" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P819: plaintextSdesKeys = 0 · untrustedConnectionTargets = 0</text>
  <text x="72" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: Forward-Secret Media · 0 RTP Amplification Sinkholes</text>

  <!-- Bottom KPI Pill Left -->
  <rect x="56" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="72" y="530" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateSipSdpRfc4568SdesInlineKeyLeakAndConnectionSinkholeGate`)</text>
  <text x="72" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedPlaintextSdesInlineKeys = 0 | clampedUntrustedConnectionTargets = 0</text>
  <text x="72" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: reject_plaintext_sdes_and_block_c_line_sinkhole (0ms @ 1ms grid)</text>

  <!-- Right Column: P820 SIP/SDP RFC 8866 a=fmtp Parameter Overflow & Line-Length Guard -->
  <rect x="612" y="124" width="552" height="476" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="612" y="124" width="552" height="44" rx="12" fill="url(#emeraldGrad57)"/>
  <text x="632" y="152" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">P820 · SIP/SDP RFC 8866 a=fmtp Parameter Overflow Guard</text>

  <!-- Anti-pattern Box Right -->
  <rect x="632" y="184" width="512" height="128" rx="8" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.2"/>
  <text x="648" y="208" fill="#FCA5A5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">⛔ Anti-Pattern: 64KB `a=fmtp` Stack Overflow &amp; Tokenizer DoS</text>
  <text x="648" y="230" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Attacker sends 16KB–64KB a=fmtp line with 500+ semicolon pairs,</text>
  <text x="648" y="250" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">  overflowing fixed char[256] stack buffers in C/C++ SDP parsers</text>
  <text x="648" y="270" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Recursive semicolon regex splitting pegs signaling CPU cores</text>
  <text x="648" y="292" fill="#F87171" font-family="Consolas, monospace" font-size="11">Impact: SDP Parser Stack Corruption (RCE) · Signaling Thread Starvation</text>

  <!-- Best Practice Box Right -->
  <rect x="632" y="326" width="512" height="164" rx="8" fill="#062E26" stroke="#10B981" stroke-width="1.2"/>
  <text x="648" y="350" fill="#6EE7B7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">✅ `[32, 256]` Byte Line Cap &amp; `[1, 16]` Attribute-Pair Ceiling</text>
  <text x="648" y="372" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">1. Strict Line-Length Ceiling: Clamp each SDP a=fmtp line to</text>
  <text x="648" y="392" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   [32, 256] bytes prior to codec parameter tokenization</text>
  <text x="648" y="412" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">2. Bounded Key-Value Pairs: Clamp semicolon-delimited fmtp</text>
  <text x="648" y="432" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">   attribute pairs to [1, 16] per payload type</text>
  <text x="648" y="454" fill="#34D399" font-family="Consolas, monospace" font-size="11">Policy P820: maxFmtpLineBytes = [32, 256]B · maxPairs = [1, 16]</text>
  <text x="648" y="476" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Result: 99.6% Lower Buffer Footprint · 0 SDP Parser Overflows</text>

  <!-- Bottom KPI Pill Right -->
  <rect x="632" y="506" width="512" height="76" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="648" y="530" fill="#34D399" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Deterministic Gate (`evaluateSipSdpRfc8866FmtpParameterOverflowAndLineLengthGate`)</text>
  <text x="648" y="550" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">clampedMaxFmtpLineBytes = [32, 256]B | clampedMaxFmtpAttributePairs = [1, 16]</text>
  <text x="648" y="568" fill="#94A3B8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Action: cap_fmtp_line_bytes_and_attribute_pairs (0ms @ 1ms grid)</text>

  <!-- Footer Provenance -->
  <rect x="36" y="614" width="1128" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="56" y="640" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">Provenance: synthetic deterministic evaluation | 0ms reported at nominal 1ms display resolution; actual duration unresolved/not_measured; no sub-1ms upper bound established</text>
</svg>
