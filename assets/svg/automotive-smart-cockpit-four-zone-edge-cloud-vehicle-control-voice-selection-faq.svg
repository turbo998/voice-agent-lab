<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bgGrad410" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accentGrad410" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <style>
      .title { font: 700 22px "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 500 13px "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .card-title { font: 700 14px "Segoe UI", Roboto, sans-serif; fill: #E2E8F0; }
      .card-sub { font: 600 11.5px "Segoe UI", Roboto, sans-serif; fill: #38BDF8; }
      .body { font: 400 11.5px "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
      .mono { font: 600 11px "Cascadia Code", Consolas, monospace; fill: #FCD34D; }
      .badge { font: 700 11px "Segoe UI", Roboto, sans-serif; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bgGrad410)"/>
  <rect x="28" y="22" width="1224" height="74" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="22" width="8" height="74" rx="4" fill="url(#accentGrad410)"/>
  <text x="52" y="52" class="title">Automotive Smart Cockpit 4-Zone Voice Assistant, Edge-Cloud Routing &amp; Vehicle-Control Safety</text>
  <text x="52" y="76" class="subtitle">ISO 26262 In-Motion &amp; Rear-Seat Child Lock · Snapdragon 8295/Thor Edge NPU (&lt;180ms Offline) + Cloud LLM · 0ms eCall Crash Bridge</text>
  <rect x="984" y="38" width="248" height="32" rx="16" fill="#06B6D4"/>
  <text x="1002" y="59" class="badge">AUTOMOTIVE-SMART-COCKPIT-VOICE-01</text>

  <!-- Left Column: 4-Zone Cabin Mic Array, DMS & CAN Bus -->
  <rect x="28" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="144" class="card-title">1. 4/6-Zone Cabin Acoustics, Gaze &amp; CAN Bus</text>
  <text x="48" y="164" class="card-sub">Qualcomm SA8295P / NVIDIA Thor · QNX / Android Auto</text>

  <rect x="48" y="182" width="340" height="102" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="64" y="204" class="card-title">4-Zone Seat Beamforming &amp; Headrest Reference</text>
  <text x="64" y="224" class="body">• Driver (Zone 1), Front Pax (Zone 2), Rear L/R (Zone 3/4)</text>
  <text x="64" y="242" class="body">• Hardware reference AEC strips 78dB Dolby Atmos music</text>
  <text x="64" y="260" class="mono">Zone_Attribution_Accuracy = 99.6% @ 120 km/h Highway</text>

  <rect x="48" y="298" width="340" height="108" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="64" y="320" class="card-title">Multimodal Gaze (DMS) + Exterior ADAS Camera</text>
  <text x="64" y="340" class="body">• Wake-word-free "Look &amp; Speak" + finger point gesture</text>
  <text x="64" y="358" class="body">• Exterior VLM ("What is that building on my right?")</text>
  <text x="64" y="376" class="mono">Visual_Point_Fusion = DMS_Gaze_Vector + Exterior_Cam</text>

  <rect x="48" y="420" width="340" height="108" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="442" class="card-title">Vehicle Speed, Gear &amp; Occupant Child Sensor</text>
  <text x="64" y="462" class="body">• Live CAN/SOME-IP speed (`km/h`), gear (`P/D/R`) &amp; ADAS</text>
  <text x="64" y="480" class="body">• Rear-seat child-presence detection (`CPD` / Acoustic Pitch)</text>
  <text x="64" y="498" class="mono">Vehicle_State = Gear_D_110kmh | Zone3_Occupant = Child</text>

  <rect x="48" y="542" width="340" height="90" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="64" y="564" class="card-title">Edge NPU (3B/7B) vs. Cloud 5G V2X Router</text>
  <text x="64" y="584" class="body">• On-chip NPU runs deterministic car control in &lt;180ms</text>
  <text x="64" y="602" class="body">• Cloud LLM handles POI discovery, travel &amp; Manual RAG</text>
  <text x="64" y="620" class="mono">Tunnel_Dead_Zone_Continuity = 100% (On-Device NPU)</text>

  <!-- Center Column: 3-Layer Deterministic Cockpit Safety Gate -->
  <rect x="436" y="114" width="408" height="536" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
  <text x="456" y="144" class="card-title">2. Deterministic ISO 26262 &amp; Zone Gate</text>
  <text x="456" y="164" class="card-sub">Zero In-Motion Trunk/Gear Open · Child Lock · 0ms eCall</text>

  <rect x="456" y="182" width="368" height="136" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="472" y="204" class="card-title">Gate A: ISO 26262 Speed/Gear &amp; Zone RBAC Lock</text>
  <text x="472" y="224" class="body">• Blocks trunk/frunk/charge-port/sunroof open or ADAS</text>
  <text x="472" y="242" class="body">  mode changes when `Gear != P` or `Speed &gt; 0 km/h`</text>
  <text x="472" y="260" class="body">• Blocks Rear-Seat/Child (Zone 3/4) from driver nav/window</text>
  <text x="472" y="280" class="mono">Unsafe_In_Motion_Actuation_Rate = 0.0% (Hard Locked)</text>
  <text x="472" y="298" class="mono">Rear_Child_Unauthorized_Command_Block = 100.0%</text>

  <rect x="456" y="332" width="368" height="136" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="472" y="354" class="card-title">Gate B: Sub-180ms Edge NPU vs. Cloud Split Gate</text>
  <text x="472" y="374" class="body">• Routes HVAC, seat massage, window &amp; wiper commands</text>
  <text x="472" y="392" class="body">  strictly to local NPU (works 100% offline in tunnels)</text>
  <text x="472" y="410" class="body">• Grounds warning-light queries in Owner's Manual RAG</text>
  <text x="472" y="430" class="mono">Edge_Car_Control_Latency_P50 = 165ms (Offline Capable)</text>
  <text x="472" y="448" class="mono">Multi_Intent_Single_Breath_Accuracy = 98.9%</text>

  <rect x="456" y="482" width="368" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="472" y="504" class="card-title">Gate C: 0ms Airbag eCall &amp; DMS Microsleep Alert</text>
  <text x="472" y="524" class="body">• Detects airbag deployment (`NG-eCall`), brake-pressure</text>
  <text x="472" y="542" class="body">  fault, or DMS driver microsleep / medical incapacitation</text>
  <text x="472" y="560" class="body">• Mutes entertainment in 0ms; triggers seat-belt</text>
  <text x="472" y="578" class="body">  haptic pulse &amp; bridges Emergency eCall PSAP with MSD</text>
  <text x="472" y="600" class="mono">if (airbagEcallOrDriverMicrosleep) -&gt; 0ms eCall_PSAP</text>
  <text x="472" y="618" class="mono">P99_Gate_Latency = 12ms | eCall_MSD_Push = 0ms</text>

  <!-- Right Column: Cabin Experience & OEM TCO -->
  <rect x="872" y="114" width="380" height="536" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="892" y="144" class="card-title">3. Multi-Intent Execution &amp; OEM Cloud TCO</text>
  <text x="892" y="164" class="card-sub">5-Command Chaining · Headrest Audio · 78% Cloud Save</text>

  <rect x="892" y="182" width="340" height="126" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="908" y="204" class="card-title">5-Intent Single-Utterance &amp; Private Headrest Audio</text>
  <text x="908" y="224" class="body">• Parses "Set AC to 22, turn on seat heat, close rear</text>
  <text x="908" y="242" class="body">  left window, and navigate to Starbucks with EV charger"</text>
  <text x="908" y="260" class="body">• Routes private phone/nav audio only to driver headrest</text>
  <text x="908" y="282" class="mono">Driver_Eyes_On_Road_Retention = +94% vs Touchscreen</text>

  <rect x="892" y="324" width="340" height="136" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="908" y="346" class="card-title">Visual Fault-Light &amp; Roadside Service Booking</text>
  <text x="908" y="366" class="body">• Explains dashboard TPMS / MIL fault codes accurately</text>
  <text x="908" y="384" class="body">• Books nearest OEM service bay &amp; pre-orders parts</text>
  <text x="908" y="402" class="body">• Integrates EV route planner with live supercharger occupancy</text>
  <text x="908" y="424" class="mono">Manual_Lookup_Deflection = 92.5%</text>

  <rect x="892" y="476" width="340" height="156" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="908" y="498" class="card-title">Benchmark &amp; TCO Summary (1M Active Vehicles)</text>
  <text x="908" y="520" class="body">• 100% Cloud Voice LLM: $14.4M / yr cellular + API cost</text>
  <text x="908" y="538" class="body">• Edge-NPU + Cloud Split (Rec): $3.1M / yr (-78% TCO)</text>
  <text x="908" y="556" class="body">• Legacy Command-Only ASR: High frustration &amp; 0 VLM</text>
  <text x="908" y="578" class="mono">On_Device_NPU_Offload_Ratio = 78% of Total Utterances</text>
  <text x="908" y="596" class="mono">In_Motion_Safety_Breaches = 0 | Offline_Availability = 100%</text>
  <text x="908" y="614" class="mono">Guardrail: evaluateAutomotiveSmartCockpitFourZoneVoiceGuard</text>

  <!-- Bottom Footer -->
  <rect x="28" y="668" width="1224" height="68" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="696" class="card-title">Cloud &amp; AI Solution Architect Takeaway — Automotive Smart Cockpit Multimodal Voice Assistant</text>
  <text x="52" y="718" class="body">Offload 78% of cabin controls to the on-vehicle Snapdragon/Thor NPU for &lt;180ms offline execution, and enforce ISO 26262 speed/zone locks.</text>
</svg>
