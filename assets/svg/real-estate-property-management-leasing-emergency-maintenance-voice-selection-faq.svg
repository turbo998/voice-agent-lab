    <text x="26" y="204" class="body-text">  or thermostat error code (E74 / tripped breaker)</text>
    <text x="26" y="224" class="mono">Cuts Unnecessary $240 Overtime Callouts by 61.5%</text>

    <rect x="14" y="252" width="340" height="86" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="272" class="card-title" fill="#34d399">Statutory Habitability SLA Escalation</text>
    <text x="26" y="290" class="body-text">• If outdoor temp &lt;35°F (no heat) or &gt;95°F (no AC),</text>
    <text x="26" y="306" class="body-text">  auto-upgrades ticket to P1 Emergency &amp; pages</text>
    <text x="26" y="324" class="mono" fill="#6ee7b7">on-call HVAC vendor with 15-min ack watchdog</text>

    <rect x="14" y="348" width="340" height="66" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
