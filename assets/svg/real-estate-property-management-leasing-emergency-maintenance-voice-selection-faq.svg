  <rect width="1200" height="680" fill="url(#bg512)" rx="14"/>

  <!-- Header -->
  <rect x="24" y="18" width="1152" height="64" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="38" y="30" width="142" height="24" rx="6" fill="url(#cyanGrad512)"/>
  <text x="109" y="46" text-anchor="middle" class="badge">PROPTECH · #512</text>
  <text x="194" y="44" class="title">Real Estate &amp; Property Management Voice AI: Yardi Leasing, 2AM Flood Triage &amp; FHA</text>
  <text x="194" y="65" class="subtitle">24/7 Yardi/AppFolio Tour Lock (39% → 82.6% Conversion) + Multimodal 2AM Leak Triage (-61.5% Overtime Callouts) + Fair Housing Act Lock</text>

  <!-- Column 1: 24/7 PMS Leasing Concierge & Fair Housing Guardrail -->
  <g transform="translate(24, 96)">
    <rect width="368" height="430" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="368" height="36" rx="10" fill="url(#cyanGrad512)"/>
    <text x="184" y="23" text-anchor="middle" class="card-title">1. 24/7 PMS Leasing &amp; Fair Housing Lock</text>

    <rect x="14" y="48" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="68" class="card-title" fill="#38bdf8">Live Yardi / RealPage / AppFolio Unit Sync</text>
    <text x="26" y="86" class="body-text">• 54% of prospective renters call after 6 PM</text>
    <text x="26" y="102" class="body-text">• Matches move-in date, floorplan, pet rules &amp;</text>
    <text x="26" y="122" class="mono">books tour slot in &lt;350ms (39% → 82.6% Tour Rate)</text>

    <rect x="14" y="148" width="340" height="92" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
