    <text x="26" y="222" class="mono" fill="#fde68a">one-time 10-minute smart-lock recovery code</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#38bdf8">Permission-to-Enter (PTE) &amp; Pet Safety Tag</text>
