    <rect x="14" y="346" width="340" height="68" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="366" class="card-title" fill="#6ee7b7">Guardrail: PROPTECH-VOICE-AI-2026-01</text>
    <text x="26" y="384" class="mono" fill="#f8fafc">evaluateRealEstatePropertyLeasingMaintenanceGuard</text>
    <text x="26" y="402" class="body-text">0 FHA Violations · -$330k/10k Hrs Vacancy &amp; Repair</text>
  </g>

