    <text x="26" y="122" class="mono" fill="#fda4af">(e.g. "Turn clockwise under hall closet panel B")</text>

    <rect x="14" y="150" width="340" height="92" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
