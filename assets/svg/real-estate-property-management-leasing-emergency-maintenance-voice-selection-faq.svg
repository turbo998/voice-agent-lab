    <text x="16" y="50" class="kpi-num" fill="#34d399">-61.5% (Video Leak Triage)</text>
  </g>
  <g transform="translate(604, 582)">
    <rect width="260" height="62" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="body-text">Fair Housing / Unauthorized Entry</text>
    <text x="16" y="50" class="kpi-num" fill="#fb7185">0.00% (FHA + ID Lock)</text>
  </g>
  <g transform="translate(884, 582)">
