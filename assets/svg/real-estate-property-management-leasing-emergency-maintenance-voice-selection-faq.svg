    <text x="26" y="186" class="body-text">• Never issues smart-lock PINs to unverified callers!</text>
    <text x="26" y="202" class="body-text">• Requires gov-ID selfie + credit card hold before</text>
    <text x="26" y="222" class="mono" fill="#6ee7b7">issuing 45-min window SmartRent / Latch tour code</text>

    <rect x="14" y="250" width="340" height="86" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="270" class="card-title" fill="#fbbf24">Fair Housing Act (FHA) Anti-Steering Lock</text>
    <text x="26" y="288" class="body-text">• Blocks subjective demographic/crime/school-rating</text>
    <text x="26" y="304" class="body-text">  commentary ("Is this building good for families?")</text>
    <text x="26" y="322" class="mono" fill="#fde68a">Provides Objective Amenities &amp; Official Gov Links</text>

    <rect x="14" y="346" width="340" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
