  <text x="76" y="236" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">UPDATE Contact: &lt;sip:evil@198.51.100.9&gt;</text>
  <text x="76" y="256" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 应答前篡改对话 Remote-Target URI</text>
  <text x="76" y="276" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 后续 200 OK / ACK / BYE 全被路由至黑洞</text>
