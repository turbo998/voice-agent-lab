<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg271" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07131a"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card271" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg271)" rx="16"/>
  <text x="600" y="40" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Electroplating, Anodizing &amp; Galvanizing Anti-HCN, Rectifier-Arc &amp; Tank-Fire Voice Copilot</text>
  <text x="600" y="66" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">Cyanide (pH ≥11.5) + Acid Anti-HCN Lock &amp; Galvanizing Vent-Hole Gate · 0-Amp Rectifier H2-Arc &amp; Heater Low-Level Lock · 0ms Cyanokit Bridge (ELECTROPLATING-ANODIZING-CYANIDE-HCN-01)</text>

  <!-- Left Column: Plating Line, Galvanizing Kettle & Waste Treatment -->
  <rect x="36" y="92" width="260" height="545" rx="12" fill="url(#card271)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="166" y="122" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Plating &amp; Galvanizing Deck</text>

  <rect x="56" y="142" width="220" height="110" rx="8" fill="#0f172a" stroke="#2dd4bf"/>
  <text x="166" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Chemical Dosing &amp; Sump Pod</text>
  <text x="166" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Acid-resistant bone-conduction</text>
  <text x="166" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cyanide vs Acid RFID tank lock</text>
  <text x="166" y="224" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cyanide bath pH ≥11.5 guard</text>

  <rect x="56" y="268" width="220" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="166" y="292" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hoist, Rectifier &amp; 450°C Zinc</text>
  <text x="166" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 10,000A DC zero-current lift</text>
  <text x="166" y="332" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• PP tank heater float interlock</text>
  <text x="166" y="350" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hollow-pipe vent/drain verify</text>

  <rect x="56" y="394" width="220" height="222" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="166" y="420" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HCN Gas, H2 Arc &amp; Tank Fires</text>
  <text x="166" y="444" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• HCN Hydrogen Cyanide ≥4.7 ppm</text>
  <text x="166" y="464" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Live-current lift H2 foam blast</text>
  <text x="166" y="484" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Dry-fired PP plastic tank fire</text>
  <text x="166" y="504" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Sealed pipe in 450°C zinc kettle</text>
  <text x="166" y="532" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0ms Cyanokit 5g IV &amp; Heater Cut</text>

  <!-- Center Column: ELECTROPLATING-ANODIZING-CYANIDE-HCN-01 Guardrail Engine -->
  <rect x="326" y="92" width="548" height="545" rx="12" fill="url(#card271)" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="122" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Deterministic Surface-Finishing Engine (ELECTROPLATING-ANODIZING-CYANIDE-HCN-01)</text>

  <!-- Gate 1 -->
  <rect x="350" y="142" width="500" height="145" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate A: Anti-HCN Cyanide/Acid Segregation &amp; 450°C Zinc Vent-Hole Lock</text>
  <text x="600" y="190" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• 100% blocks dosing acid or routing acid rinse into Cyanide baths/trenches (lethal HCN)</text>
  <text x="600" y="210" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Enforces NaCN/KCN bath pH ≥11.5 &amp; dual-stage alkaline hypochlorite CN destruction</text>
  <text x="600" y="230" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Blocks dipping hollow steel tubes into 450°C molten zinc without vent/drain holes &amp; dry check</text>
  <text x="600" y="252" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Prevents Hydrogen Cyanide gas-chamber events and molten-zinc steam explosions</text>

  <!-- Gate 2 -->
  <rect x="350" y="302" width="500" height="150" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="326" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate B: 0-Amp Rectifier Hoist Lift, PP Heater Float &amp; Cr(VI) Scrubber Gate</text>
  <text x="600" y="350" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Locks overhead hoist lift until 10,000A DC rectifier ramps to 0 Amps (prevents H2 foam arc)</text>
  <text x="600" y="370" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Hard-interlocks electric immersion heaters to dual liquid-level floats &amp; over-temp fuse</text>
  <text x="600" y="390" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Verifies push-pull lip exhaust &amp; Cr(VI) / NOx scrubber ΔP before energizing hard-chrome</text>
  <text x="600" y="412" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Eliminates #1 cause of electroplating plant fires (dry-fired polypropylene tanks)</text>

  <!-- Gate 3 -->
  <rect x="350" y="468" width="500" height="148" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="492" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gate C: 0ms HCN ≥4.7 ppm Cyanokit Protocol, Tank Fire &amp; HF/Cr(VI) Bridge</text>
  <text x="600" y="516" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trips all rectifiers &amp; immersion heaters in 0ms on HCN ≥4.7 ppm or PP tank smoke</text>
  <text x="600" y="536" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="12" text-anchor="middle">• Speaks Hydroxocobalamin (Cyanokit 5g IV) &amp; 100% O2 BVM (zero mouth-to-mouth!) in 0ms</text>
  <text x="600" y="556" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">• Directs Calcium Gluconate / Diphoterine wash on HF-nitric titanium pickling splash</text>
  <text x="600" y="580" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Full OSHA 1910.1026 Cr(VI), NADCAP AC7108, EPA 40 CFR 433 &amp; NFPA 70E WORM audit</text>

  <!-- Right Column: Atotech/PAL PLC, HCN Sensors & Cyanokit EMS -->
  <rect x="904" y="92" width="260" height="545" rx="12" fill="url(#card271)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1034" y="122" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. PAL Hoist PLC &amp; Antidote</text>

  <rect x="924" y="142" width="220" height="145" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="1034" y="166" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Atotech / PAL / KraftPowercon</text>
  <text x="1034" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hoist-to-rectifier 0A handshake</text>
  <text x="1034" y="210" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Dual-float heater contactor</text>
  <text x="1034" y="230" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Amp-hour chemical feeder</text>
  <text x="1034" y="250" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• NADCAP pyrometry &amp; bath log</text>

  <rect x="924" y="302" width="220" height="150" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="1034" y="326" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HCN Sensor &amp; CN Destruction</text>
  <text x="1034" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Electrochemical HCN (0–50 ppm)</text>
  <text x="1034" y="370" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Segregated CN vs Cr(VI) sumps</text>
  <text x="1034" y="390" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• ORP/pH 2-stage NaOCl oxidize</text>
  <text x="1034" y="410" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Mesh-pad Cr(VI) mist eliminator</text>

  <rect x="924" y="468" width="220" height="148" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="1034" y="492" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Cyanokit &amp; HazMat Rescue</text>
  <text x="1034" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Cyanokit (Hydroxocobalamin 5g)</text>
  <text x="1034" y="536" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Hexafluorine / Calcium Gluconate</text>
  <text x="1034" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Class C/D dry-chemical tank fire</text>
  <text x="1034" y="576" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">• 100% NADCAP &amp; OSHA 1910.1026</text>
</svg>
