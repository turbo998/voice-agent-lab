<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgFr26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#071120"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="npuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="visGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgFr26)"/>
  <rect x="20" y="20" width="1160" height="620" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="48" y="62" fill="#F8FAFC" font-size="21" font-weight="700">2026 Voice &amp; Multimodal Frontier: System-1/2 Dual-Brain, On-Device NPU &amp; Live Vision Gating</text>
  <text x="48" y="90" fill="#94A3B8" font-size="14">2026 实时语音与多模态前沿突破：快慢双脑语音推理架构、端侧 NPU 小模型协同与 WebRTC 视频流关键帧门控全景图</text>
  <rect x="864" y="42" width="288" height="34" rx="17" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
  <text x="1008" y="64" fill="#C7D2FE" font-size="13" font-weight="600" text-anchor="middle">VOICE-FRONTIER-2026-01 · Radar</text>

  <!-- Pillar 1: System-1 Fast S2S + System-2 Reasoning Verifier -->
  <g transform="translate(44, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#brainGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1. 快慢双脑语音架构 (System-1 + System-2)</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 原生 S2S 模型“张嘴就来”的算术与多约束幻觉痛点</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 端到端语音模型为了 &lt;300ms 首包出声，跳过深度思维链 (CoT)</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 复杂阶梯费率/理赔扣除/多航段改签直接由 S2S 口算出错率高达 28%</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#172554" stroke="#3B82F6"/>
    <text x="30" y="174" fill="#93C5FD" font-size="13" font-weight="700">System-1 (300ms 快反射) + System-2 (异步推理核验)</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• System-1 (GPT-Realtime/Nova Sonic)：负责全双工倾听、情绪共情与 280ms 接话</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• System-2 (o3-mini/DeepSeek-R1 + 确定性计算器)：后台 1.2s 完成严密推演</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">高危数值“未经 System-2 签名严禁播报”栅栏</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 检出多约束计算时：System-1 先播“我帮您精确核对下这三笔明细”</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 待 System-2 返回带签名 JSON 结构后，再注入语音流精准播报</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#172554" stroke="#38BDF8"/>
    <text x="178" y="356" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">复杂多步逻辑与金额精算准确率提升至 99.8%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">兼顾 &lt;300ms 拟人交互自然度与推理级严谨性</text>
  </g>

  <!-- Pillar 2: On-Device NPU (<3B INT4) + Cloud Frontier S2S Hybrid -->
  <g transform="translate(422, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#npuGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2. 端侧 NPU 小模型 (&lt;=3B) 与云端大小协同</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="30" y="82" fill="#6EE7B7" font-size="13" font-weight="700">2026 端侧 45+ TOPS NPU 原生语音小模型崛起</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 车载座舱 (高通 8295/Thor)、AI PC 与穿戴设备可本地常驻 2B-3B INT4 模型</text>
    <text x="30" y="122" fill="#34D399" font-size="12">• 端侧 TTFA 仅 85ms-140ms，且离线/地下车库/电梯间 100% 可用</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="174" fill="#F8FAFC" font-size="13" font-weight="700">端云意图分流器 (70% 端侧零成本 + 30% 云端深推理)</text>
    <text x="30" y="194" fill="#94A3B8" font-size="12">• 端侧 NPU 承接：设备控车/控屏、唤醒词、打断判停、高频 FAQ 与隐私脱敏</text>
    <text x="30" y="214" fill="#38BDF8" font-size="12">• 云端大模型承接：跨系统 ERP/CRM 编排、开放域知识检索与多轮谈判</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">RTT &gt; 450ms 弱网毫秒级无感降级逃生锁</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 实时监测 WebRTC 往返时延与丢包率：一旦云端 RTT &gt; 450ms</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 0ms 切换端侧 NPU 语音模型接管对话，杜绝隧道/弱网长静音死锁</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#064E3B" stroke="#10B981"/>
    <text x="178" y="356" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">云端语音 Token 与带宽成本直降 62%</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">敏感环境（诊室/高管车内）原始音频零出端</text>
  </g>

  <!-- Pillar 3: Live Video + Voice Keyframe Gating -->
  <g transform="translate(800, 114)">
    <rect width="356" height="400" rx="12" fill="#0F172A" stroke="#C084FC" stroke-width="1.8"/>
    <rect width="356" height="44" rx="12" fill="url(#visGrad)"/>
    <text x="178" y="28" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3. 实时视频+语音流 (Live Vision) 关键帧门控</text>

    <rect x="18" y="60" width="320" height="78" rx="8" fill="#450A0A" stroke="#EF4444"/>
    <text x="30" y="82" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 严禁将 30fps 视频流无脑全量灌入多模态大模型！</text>
    <text x="30" y="102" fill="#E2E8F0" font-size="12">• 售后远程排障/看图导购开启摄像头后，若每秒发送 5-30 张高清图</text>
    <text x="30" y="122" fill="#FBBF24" font-size="12">• 单通 5分钟视频通话将烧掉 40万+ 视觉 Token（成本高达 $0.85/min！）</text>

    <rect x="18" y="152" width="320" height="82" rx="8" fill="#3B0764" stroke="#A855F7"/>
    <text x="30" y="174" fill="#E9D5FF" font-size="13" font-weight="700">语义+画面变化率 (&gt;=15%) 双触发关键帧门控</text>
    <text x="30" y="194" fill="#E2E8F0" font-size="12">• 仅当：① 用户说出指示代词 (“你看这个红灯/这行报错”)；或</text>
    <text x="30" y="214" fill="#C084FC" font-size="12">• ② 画面结构变化 SSIM Delta &gt;= 15% 且镜头防抖稳定时，才抽取 1 帧高清图</text>

    <rect x="18" y="248" width="320" height="72" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="30" y="270" fill="#F8FAFC" font-size="13" font-weight="700">端侧 ROI 局部裁剪 + 敏感背景 (身份证/银行卡) 遮罩</text>
    <text x="30" y="290" fill="#94A3B8" font-size="12">• 自动框选故障仪表盘/商品标签 ROI 区域（压缩至 &lt;=80KB WebP）</text>
    <text x="30" y="308" fill="#34D399" font-size="12">• 端侧实时模糊镜头里散落的银行卡、病历单与人脸隐私</text>

    <rect x="18" y="334" width="320" height="50" rx="8" fill="#3B0764" stroke="#C084FC"/>
    <text x="178" y="356" fill="#E9D5FF" font-size="13" font-weight="700" text-anchor="middle">实时视频+语音多模态单分钟成本压降至 $0.09/min</text>
    <text x="178" y="374" fill="#E2E8F0" font-size="11" text-anchor="middle">视觉 Token 消耗减少 84%，首包响应加快 410ms</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="44" y="532" width="1112" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="560" fill="#38BDF8" font-size="14" font-weight="700">架构师核心选型法则 (VOICE-FRONTIER-2026-01)：</text>
  <text x="68" y="584" fill="#E2E8F0" font-size="13">1. 面对复杂多步计算与多政策约束提问，严禁让原生 S2S 模型直接口算最终结果，必须采用“System-1 快语音共情接话 + System-2 异步推理验证”双脑架构；</text>
  <text x="68" y="606" fill="#6EE7B7" font-size="13">2. 实时视频+语音流必须启用“指示词 + 画面变化率 (&gt;=15%)”关键帧门控（严禁持续灌入 30fps 视频流），并在云端 RTT &gt; 450ms 时自动切换端侧 NPU 小模型兜底。</text>
</svg>
