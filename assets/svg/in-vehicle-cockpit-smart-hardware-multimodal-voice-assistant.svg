      <rect x="14" y="14" width="196" height="22" rx="6" fill="#78350f"/>
      <text x="24" y="29" fill="#fcd34d" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">第 3 层 · 车规与硬件安全互锁</text>
