    <!-- Card 1: On-Device Edge NPU Layer -->
    <rect x="0" y="0" width="366" height="242" rx="12" fill="url(#cardCar)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="196" height="22" rx="6" fill="#0c4a6e"/>
    <text x="24" y="29" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">第 1 层 · 端侧 NPU 极速确定层</text>
    <text x="14" y="56" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="16.5" font-weight="800">高通 8295 / 端侧 Phi-4-mini</text>
    <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">场景：地库/隧道断网车控、免唤醒高频指令</text>
    <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="107" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心职责（占总指令量 65%）：</text>
    <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 空调/车窗/座椅/音量/切歌等 200+ 本地 CAN 指令</text>
    <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 四音区独立波束 (主驾/副驾/左后/右后) 声源定位</text>
    <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 400ms 云端弱网超时瞬间自动接管，100% 永不失联</text>
