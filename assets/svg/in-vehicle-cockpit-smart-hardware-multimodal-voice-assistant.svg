      <rect x="14" y="14" width="212" height="22" rx="6" fill="#064e3b"/>
      <text x="24" y="29" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">第 2 层 · 云端视觉+语音全双工 🏆</text>
