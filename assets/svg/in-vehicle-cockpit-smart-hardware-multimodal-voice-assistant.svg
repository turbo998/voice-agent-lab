<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="In-Vehicle Cockpit &amp; Smart Hardware Multimodal Voice + Vision Assistant Architecture &amp; Selection Guide">
  <defs>
