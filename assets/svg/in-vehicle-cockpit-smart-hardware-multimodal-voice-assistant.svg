      <text x="14" y="107" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心职责（占总指令量 35%）：</text>
      <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 指着窗外建筑/AI眼镜看外文菜单：“这能停车吗？”</text>
      <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 复杂条件推理：“顺路找一家有快充桩且评分&gt;4.7的粤菜”</text>
      <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 长途夜驾犯困时高情商陪聊与提神音乐主动推荐</text>
      <rect x="14" y="186" width="338" height="40" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1"/>
      <text x="22" y="210" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11.2" font-weight="700">首字延迟: 310~480ms | 混合TCO: ~$190/万分钟</text>
    </g>

    <!-- Card 3: Automotive & Hardware Safety Interlocks -->
    <g transform="translate(770, 0)">
