      <text x="14" y="75" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">标准：ISO 26262 / UNECE R155 / EN 15722 eCall</text>
      <line x1="14" y1="86" x2="352" y2="86" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="107" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">✅ 核心安全红线：</text>
      <text x="14" y="126" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 行驶中 (&gt;5km/h) 100% 物理阻断后排打开后备箱/主驾窗</text>
      <text x="14" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 车载音乐/导航回声参考绑定，杜绝自己把自己唤醒</text>
      <text x="14" y="164" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">• 气囊弹出 (eCall) 0ms 抢占一切娱乐对话直连救援中心</text>
