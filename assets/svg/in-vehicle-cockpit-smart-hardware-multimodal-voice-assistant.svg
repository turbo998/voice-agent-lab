    </text>
  </g>

  <!-- Top KPI Pills -->
  <g transform="translate(838, 22)" filter="url(#shadowCar)">
    <rect x="0" y="0" width="162" height="64" rx="10" fill="#0d2847" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="81" y="24" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">端侧车控 / 云端多模态</text>
    <text x="81" y="49" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="19.5" font-weight="800">75ms / 340ms</text>

    <rect x="172" y="0" width="158" height="64" rx="10" fill="#0b2e27" stroke="#10b981" stroke-width="1.2"/>
    <text x="251" y="24" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">视觉按需抽帧省成本</text>
    <text x="251" y="49" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="19.5" font-weight="800">-92% 流量&amp;Token</text>
