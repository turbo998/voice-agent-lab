      ❌ 错误做法：持续推流 1080p 30fps 视频进入多模态大模型
    </text>
    <text x="32" y="105" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
      • 95% 的时间用户只是在纯语音聊天或听歌，上传的数万张视频帧全是无用马路画面；
    </text>
    <text x="32" y="124" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="11.2">
      • 导致智能眼镜芯片严重发热降频、蜂窝流量暴增，且每万分钟多模态算力账单高达 `$2,400+`！
    </text>

    <rect x="20" y="162" width="535" height="94" rx="8" fill="#07261f" stroke="#10b981" stroke-width="1.2"/>
    <text x="32" y="182" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">
