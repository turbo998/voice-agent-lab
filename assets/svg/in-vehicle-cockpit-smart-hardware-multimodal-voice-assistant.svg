      </text>
      <text x="32" y="125" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
        • `Zone 2 (副驾 Front-Right)`：允许副驾娱乐屏、空调与添加导航途经点；禁改驾驶模式；
      </text>
      <text x="32" y="144" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.2">
        • `Zone 3/4 (后排儿童锁开启时)`：仅允许点播儿歌/故事与本侧阅读灯；**严禁控制车窗、天窗、后备箱与支付**！
      </text>
      <text x="32" y="164" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">
