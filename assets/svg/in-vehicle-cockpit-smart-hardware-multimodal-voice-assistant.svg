      </text>

      <rect x="20" y="188" width="501" height="70" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="209" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
