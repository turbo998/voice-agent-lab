  <text x="600" y="122" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Deterministic Speech Stack Gate (STT-TTS-VOICE-CLONING-MATRIX-01)</text>

  <rect x="372" y="142" width="456" height="136" rx="10" fill="#2a1215" stroke="#ef4444" stroke-width="1.8"/>
  <text x="600" y="166" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE A: Voice-Talent Cryptographic Consent &amp; Anti-Spoof Lock</text>
  <text x="600" y="188" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: voiceTalentVerbalConsentAndLicenseActive === true</text>
  <text x="600" y="208" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Blocks deploying any cloned brand voice (CNV / Zero-Shot Clone) without</text>
  <text x="600" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  matching challenge-phrase cryptographic voiceprint &amp; active talent license</text>
  <text x="600" y="246" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Embeds imperceptible acoustic watermark for anti-deepfake provenance</text>

  <rect x="372" y="294" width="456" height="145" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="600" y="318" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE B: Domain Custom Lexicon &amp; Polyphone / IPA Phoneme Lock</text>
  <text x="600" y="340" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Checks: customPhraseListAndPhonemeLexiconLoaded === true</text>
  <text x="600" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Prevents embarrassing brand-name/drug-name mispronunciations and</text>
  <text x="600" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">  Chinese polyphone errors ("银行 Yínháng vs Xíng", "重庆 Chóngqìng")</text>
  <text x="600" y="398" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Enforces W3C PLS / SSML `&lt;phoneme&gt;` &amp; `&lt;say-as&gt;` dictionary injection</text>

  <rect x="372" y="455" width="456" height="165" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.8"/>
  <text x="600" y="479" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GATE C: &gt;350ms TTS TTFB Circuit Breaker &amp; Secondary Hot-Swap</text>
  <text x="600" y="501" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">• Trigger: primaryTtsTtfbAbove350msOrHttp5xx === true</text>
  <text x="600" y="521" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• 0ms sets hotSwapBackupTtsEngineTriggered = true</text>
  <text x="600" y="541" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Automatically fails over mid-call from primary cloud TTS to local/secondary</text>
  <text x="600" y="559" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">  TTS engine with matched voice timbre when regional cloud jitter spikes</text>
  <text x="600" y="582" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">• Guarantees P99 end-to-end voice turn latency &lt; 650ms 24×7</text>

